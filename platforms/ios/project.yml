name: AYIN
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  AYIN:
    type: application
    platform: iOS
    sources:
      - path: AYIN
        excludes:
          - Info.plist
          - AYIN.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AYIN_BUNDLE_ID)"
        PRODUCT_NAME: AYIN
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: AYIN/AYIN.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AYIN/Info.plist
    scheme:
      gatherCoverageData: true
      testTargets:
        - AYINTests
  AYINTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AYINTests
    dependencies:
      - target: AYIN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ayin.app.ios.tests
