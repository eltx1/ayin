name: AYIN
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.11.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 13.0.0
targets:
  AYIN:
    type: application
    platform: iOS
    sources:
      - path: AYIN
        excludes:
          - Info.plist
          - AYIN.entitlements
      - path: Shared
    dependencies:
      - target: AYINShare
        embed: true
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AYIN_BUNDLE_ID)"
        PRODUCT_NAME: AYIN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_ENTITLEMENTS: AYIN/AYIN.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AYIN/Info.plist
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(AYIN_IOS_PROFILE_UUID)"
    scheme:
      gatherCoverageData: true
      testTargets:
        - AYINTests
  AYINShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes:
          - Info.plist
          - ShareExtension.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ayin.app.ios.share
        PRODUCT_NAME: AYINShare
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: "$(AYIN_IOS_SHARE_PROFILE_UUID)"
  AYINTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AYINTests
    dependencies:
      - target: AYIN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ayin.app.ios.tests
