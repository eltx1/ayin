name: AYINTV
options:
  createIntermediateGroups: true
  deploymentTarget:
    tvOS: "18.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TVOS_DEPLOYMENT_TARGET: "18.0"
targets:
  AYINTV:
    type: application
    platform: tvOS
    sources:
      - path: AYINTV
        excludes:
          - Info.plist
          - AYINTV.entitlements
      - path: ../ios/AYIN/AppEnvironment.swift
      - path: ../ios/AYIN/Networking/APIClient.swift
      - path: ../ios/AYIN/Auth/AuthModels.swift
      - path: ../ios/AYIN/Auth/AuthService.swift
      - path: ../ios/AYIN/Auth/KeychainSessionStore.swift
      - path: ../ios/AYIN/Auth/SessionController.swift
      - path: ../ios/AYIN/DeepLinks/DeepLink.swift
      - path: ../ios/AYIN/Player/PlaybackAccounting.swift
      - path: ../ios/AYIN/Player/PlaybackModels.swift
      - path: ../ios/AYIN/Player/PlaybackService.swift
      - path: ../ios/AYIN/Player/WatchProgressService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AYIN_TV_BUNDLE_ID)"
        PRODUCT_NAME: AYIN
        PRODUCT_MODULE_NAME: AYINTV
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: AYINTV/AYINTV.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AYINTV/Info.plist
    scheme:
      gatherCoverageData: true
      testTargets:
        - AYINTVTests
  AYINTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - AYINTVTests
    dependencies:
      - target: AYINTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.ayin.app.tvos.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AYIN.app/AYIN"
        BUNDLE_LOADER: "$(TEST_HOST)"
