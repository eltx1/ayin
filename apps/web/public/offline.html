<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>AYIN · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1018;
        color: #f4f6fa;
        font:
          1rem system-ui,
          sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
        text-align: center;
      }
      p {
        line-height: 1.6;
        color: #c6ceda;
      }
      a {
        display: inline-block;
        padding: 0.8rem 1.2rem;
        border: 1px solid #92b9ff;
        border-radius: 0.6rem;
        color: #b8d1ff;
        margin: 0.5rem;
      }
      a:focus-visible {
        outline: 3px solid white;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AYIN</h1>
      <p>You’re offline. Connect to the internet to load AYIN.</p>
      <p lang="ar" dir="rtl">أنت غير متصل. اتصل بالإنترنت لتحميل AYIN.</p>
      <a href="">Try again · إعادة المحاولة</a>
    </main>
  </body>
</html>
