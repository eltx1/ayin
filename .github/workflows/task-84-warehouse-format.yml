name: Task 84 warehouse format

on:
  push:
    branches:
      - task-84-warehouse-boundary
    paths:
      - ".github/workflows/task-84-warehouse-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-84-warehouse-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format task 84 files
        run: |
          pnpm exec prettier --write             apps/api/src/warehouse/warehouse-export.adapter.ts             apps/api/src/warehouse/warehouse-export.fixtures.test.ts             apps/api/src/warehouse/warehouse-export.schemas.ts             apps/api/src/warehouse/warehouse-export.service.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/warehouse
          git commit -m "style(task-84): format warehouse boundary"
          git push origin HEAD:task-84-warehouse-boundary
