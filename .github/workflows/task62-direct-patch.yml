name: Task 62 direct patch
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch task-62-regional-discovery "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/discovery/discovery.service.ts')
          s = p.read_text()
          replacements = []
          replacements.append((
          'import { VideoPolicyService } from "../video-policy/video-policy.service.js";\n',
          'import { VideoPolicyService } from "../video-policy/video-policy.service.js";\nimport { RegionalDiscoveryService, type RegionalDiscoverySignal } from "./regional-discovery.service.js";\n'
          ))
          replacements.append(('''  async listEnabled(authenticated: boolean) {
    return this.database.client.homeRowConfig.findMany({
      where: {
        enabled: true,
        audience: { in: authenticated ? ["ALL", "AUTHENTICATED"] : ["ALL", "ANONYMOUS"] },
      },
      orderBy: [{ position: "asc" }, { key: "asc" }],
    });
  }

  async getEnabled(key: string, authenticated: boolean) {
    return this.database.client.homeRowConfig.findFirst({
      where: {
        key,
        enabled: true,
        audience: { in: authenticated ? ["ALL", "AUTHENTICATED"] : ["ALL", "ANONYMOUS"] },
      },
    });
  }

  async listAll() {
    return this.database.client.homeRowConfig.findMany({
      orderBy: [{ position: "asc" }, { key: "asc" }],
      include: { manualItems: { orderBy: { position: "asc" } } },
    });
  }
''','''  async listEnabled(authenticated: boolean, regionCode?: string) {
    return this.database.client.homeRowConfig.findMany({
      where: {
        enabled: true,
        audience: { in: authenticated ? ["ALL", "AUTHENTICATED"] : ["ALL", "ANONYMOUS"] },
        ...regionTargetWhere(regionCode),
      },
      orderBy: [{ position: "asc" }, { key: "asc" }],
    });
  }

  async getEnabled(key: string, authenticated: boolean, regionCode?: string) {
    return this.database.client.homeRowConfig.findFirst({
      where: {
        key,
        enabled: true,
        audience: { in: authenticated ? ["ALL", "AUTHENTICATED"] : ["ALL", "ANONYMOUS"] },
        ...regionTargetWhere(regionCode),
      },
    });
  }

  async listAll() {
    return this.database.client.homeRowConfig.findMany({
      orderBy: [{ position: "asc" }, { key: "asc" }],
      include: {
        manualItems: { orderBy: { position: "asc" } },
        regionTargets: { orderBy: { regionCode: "asc" } },
      },
    });
  }
'''))
          replacements.append(('''    @Inject(SeriesCatalogService) private readonly seriesCatalog: SeriesCatalogService,
    @Inject(VideoPolicyService) private readonly videoPolicy: VideoPolicyService,
  ) {}
''','''    @Inject(SeriesCatalogService) private readonly seriesCatalog: SeriesCatalogService,
    @Inject(VideoPolicyService) private readonly videoPolicy: VideoPolicyService,
    @Inject(RegionalDiscoveryService) private readonly regionalDiscovery: RegionalDiscoveryService,
  ) {}
'''))
          replacements.append(('''    const normalized = await this.normalizeContext(context);
    const rows = await this.rows.listEnabled(Boolean(normalized.profileId));
''','''    const normalized = await this.normalizeContext(context);
    const rows = await this.rows.listEnabled(
      Boolean(normalized.profileId),
      regionalMerchandisingCode(normalized),
    );
'''))
          replacements.append(('''          ...(await this.enforcePage(
            await this.loadRowPage(row, normalized, 0, Math.min(firstPageSize, row.maxItems)),
            normalized,
          )),
''','''          ...(await this.enforcePage(
            await this.rankRegionalPage(
              row.source,
              await this.loadRowPage(row, normalized, 0, Math.min(firstPageSize, row.maxItems)),
              normalized,
            ),
            normalized,
          )),
'''))
          replacements.append(('    const row = await this.rows.getEnabled(key, Boolean(normalized.profileId));\n','''    const row = await this.rows.getEnabled(
      key,
      Boolean(normalized.profileId),
      regionalMerchandisingCode(normalized),
    );
'''))
          replacements.append(('''      ...(await this.enforcePage(
        await this.loadRowPage(row, normalized, offset, limit),
        normalized,
      )),
''','''      ...(await this.enforcePage(
        await this.rankRegionalPage(
          row.source,
          await this.loadRowPage(row, normalized, offset, limit),
          normalized,
        ),
        normalized,
      )),
'''))
          replacements.append(('''      case "POPULAR_REGION":
        return emptyPage(
          context.regionPersonalizationAllowed && context.regionCode
            ? "A privacy-approved region signal is present, but AYIN does not yet store regional watch aggregates, so no regional ranking is invented."
            : "Regional discovery requires an approved location signal and personalization permission.",
          "UNAVAILABLE",
        );
''','''      case "POPULAR_REGION":
        return this.loadRankedVideos(hoursAgo(24), offset, limit, "Popular in your region");
'''))
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('missing replacement anchor: ' + old[:80])
              s = s.replace(old,new,1)
          marker='  private async loadRowPage(\n'
          insert='''  private async rankRegionalPage(
    source: string,
    page: DiscoveryPage,
    context: DiscoveryContext,
  ): Promise<DiscoveryPage> {
    if (!context.regionPersonalizationAllowed || !context.regionCode || page.items.length < 2) {
      return page;
    }
    const signal = regionalSignalForSource(source);
    if (!signal) return page;
    return {
      ...page,
      items: await this.regionalDiscovery.rankItems(context.regionCode, signal, page.items),
    };
  }

'''
          if marker not in s: raise SystemExit('missing loadRowPage marker')
          s=s.replace(marker,insert+marker,1)
          marker='function normalizeRegionCode(region?: string): string | undefined {\n'
          helpers='''function regionalMerchandisingCode(context: DiscoveryContext): string | undefined {
  return context.regionPersonalizationAllowed ? context.regionCode : undefined;
}

function regionalSignalForSource(
  source: string,
): Exclude<RegionalDiscoverySignal, "CATEGORY_AFFINITY"> | null {
  if (["TRENDING_WORLDWIDE", "POPULAR_NOW", "POPULAR_REGION"].includes(source)) {
    return "POPULAR_CONTENT";
  }
  if (["MOVIES", "SERIES"].includes(source)) return "CATALOG";
  if (source === "CREATOR_TV") return "CREATOR_TV";
  return null;
}

function regionTargetWhere(regionCode?: string): Prisma.HomeRowConfigWhereInput {
  if (!regionCode) return { regionTargets: { none: {} } };
  return {
    OR: [{ regionTargets: { none: {} } }, { regionTargets: { some: { regionCode } } }],
  };
}

'''
          if marker not in s: raise SystemExit('missing helper marker')
          s=s.replace(marker,helpers+marker,1)
          p.write_text(s)
          Path('.github/workflows/task62-direct-patch.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/discovery/discovery.service.ts .github/workflows/task62-direct-patch.yml
          git commit -m "Wire regional signals into discovery ranking"
          git push origin HEAD:task-62-regional-discovery
