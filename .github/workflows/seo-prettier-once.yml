name: SEO one-shot formatter

on:
  push:
    branches:
      - feat/comprehensive-seo-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/comprehensive-seo-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed source and remove formatter
        run: |
          git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' '*.css' | xargs -r pnpm exec prettier --write
          git rm .github/workflows/seo-prettier-once.yml
      - name: Commit formatted result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format SEO implementation with Prettier"
          git push origin HEAD:feat/comprehensive-seo-foundation
