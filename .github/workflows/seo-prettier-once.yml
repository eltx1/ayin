name: SEO one-shot formatter

on:
  push:
    branches:
      - feat/comprehensive-seo-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/comprehensive-seo-foundation
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format SEO service and remove formatter
        run: |
          pnpm exec prettier --write apps/api/src/seo/seo.service.ts
          git rm .github/workflows/seo-prettier-once.yml
      - name: Commit formatted result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/seo/seo.service.ts
          git commit -m "Format SEO service with Prettier"
          git push origin HEAD:feat/comprehensive-seo-foundation
