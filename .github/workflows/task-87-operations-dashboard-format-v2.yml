name: Task 87 operations dashboard formatter v2

on:
  push:
    branches:
      - task-87-operations-dashboard
    paths:
      - ".github/workflows/task-87-operations-dashboard-format-v2.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-87-operations-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 87 files
        run: |
          pnpm exec prettier --write             apps/api/src/admin/admin-governance.controller.ts             apps/api/src/admin/admin-operations-dashboard.service.ts             apps/api/src/admin/admin.module.ts             apps/api/src/admin/operations-cost.adapter.test.ts             apps/api/src/admin/operations-cost.adapter.ts             apps/api/src/admin/operations-dashboard.metrics.test.ts             apps/api/src/admin/operations-dashboard.metrics.ts             apps/api/src/platform-config/platform-settings.catalog.ts             apps/api/src/platform-config/platform-settings.service.ts             apps/api/test/operations-dashboard.integration.test.ts             apps/web/src/components/admin/admin-dashboard.tsx             apps/web/src/components/admin/admin-operations-dashboard.tsx             apps/web/src/components/admin/admin-operations.tsx             apps/web/src/lib/admin-control.ts             deploy/README.md             docs/PRODUCTION_OPERATING_MODEL_TASKS_39_87.md             docs/TASK87_OPERATIONS_DASHBOARD.md             tests/e2e/admin-mfa.acceptance.spec.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web deploy/README.md docs tests/e2e
          git commit -m "style(task-87): format operations dashboard"
          git push origin HEAD:task-87-operations-dashboard
