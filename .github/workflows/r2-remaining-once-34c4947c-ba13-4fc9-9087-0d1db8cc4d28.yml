name: Remaining R2 fixtures once 34c4947c-ba13-4fc9-9087-0d1db8cc4d28

# LOCAL REVIEW ONLY. Tooling pins verified by source review and remote readback.
# Never rerun this job or reset its retained continuation reservation.
# Publish exactly this workflow, its SSH helper and helper tests as one child of
# TOOLING_SHA on the fixed branch precreated at TOOLING_SHA. Publish with one
# nonforce expected-head update. Retained host journals are the replay barrier.
on:
  push:
    branches: [ops/r2-remaining-once-34c4947c-ba13-4fc9-9087-0d1db8cc4d28]
    paths:
      - .github/workflows/r2-remaining-once-34c4947c-ba13-4fc9-9087-0d1db8cc4d28.yml

permissions:
  contents: read
  actions: read
concurrency:
  group: ayin-production-deploy
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      ${{ github.repository == 'eltx1/ayin' && github.event_name == 'push' &&
          github.ref == 'refs/heads/ops/r2-remaining-once-34c4947c-ba13-4fc9-9087-0d1db8cc4d28' &&
          github.event.created == false && github.event.deleted == false &&
          github.event.forced == false && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      RELEASE_SHA: a6c15842bd2cf6990715f18d58a550a5929d8d41
      TOOLING_SHA: b75b1ec4e9f4b7493879b2555ef786a9fe2ad761
      PROVIDER_SHA256: 9e5ada8ecaf0d255e0f37a7eb7d75d88f41ab5f50c5a19076dc5ae4d51f6c5d5
      CONTINUATION_SHA256: 9af65e1b139cebb29554dc2f2ccd7f9dafee3b247b980c8662111532e9b8ba16
      INVOCATION_BRANCH: ops/r2-remaining-once-34c4947c-ba13-4fc9-9087-0d1db8cc4d28
      INVOCATION_PATH: .github/workflows/r2-remaining-once-34c4947c-ba13-4fc9-9087-0d1db8cc4d28.yml
      INVOCATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      DEPLOY_HOST: 13.52.116.200
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    defaults:
      run:
        shell: bash
        working-directory: tooling
    steps:
      - name: Require exact first branch invocation and proven unchanged deployment
        uses: actions/github-script@v8
        with:
          script: |
            const repo = {owner: 'eltx1', repo: 'ayin'};
            const sha = process.env.RELEASE_SHA;
            const tooling = process.env.TOOLING_SHA;
            const branch = process.env.INVOCATION_BRANCH;
            const path = process.env.INVOCATION_PATH;
            const ensure = (ok, message) => { if (!ok) throw new Error(message); };
            ensure(/^[0-9a-f]{40}$/.test(tooling) && tooling !== sha, 'Reviewed separate tooling SHA required.');
            ensure(process.env.GITHUB_RUN_ATTEMPT === '1' && process.env.INVOCATION_WORKFLOW_SHA === context.sha &&
              process.env.GITHUB_WORKFLOW_REF === `eltx1/ayin/${path}@refs/heads/${branch}` &&
              context.payload.created === false && context.payload.deleted === false && context.payload.forced === false &&
              context.payload.repository?.fork === false && context.payload.repository?.default_branch === 'main' &&
              context.payload.before === tooling && context.payload.after === context.sha && context.payload.head_commit?.id === context.sha,
              'Only the fixed first update from the precreated tooling branch is eligible.');
            const {data: current} = await github.rest.actions.getWorkflowRun({...repo, run_id: context.runId});
            ensure(current.run_attempt === 1 && current.run_number === 1 && current.event === 'push' &&
              current.head_sha === context.sha && current.head_branch === branch && current.path === path,
              'No rerun or later workflow invocation is eligible.');
            const {data: history} = await github.rest.actions.listWorkflowRuns({...repo, workflow_id: current.workflow_id, per_page: 100});
            ensure(history.total_count === 1 && history.workflow_runs.length === 1 &&
              history.workflow_runs[0].id === context.runId && history.workflow_runs[0].head_sha === context.sha &&
              history.workflow_runs[0].run_attempt === 1 && history.workflow_runs[0].run_number === 1,
              'Only this single first-attempt workflow run may exist.');
            const {data: invocation} = await github.rest.repos.getBranch({...repo, branch});
            ensure(invocation.commit.sha === context.sha, 'Invocation branch changed.');
            const {data: commit} = await github.rest.repos.getCommit({...repo, ref: context.sha});
            const allowed = [path, '.github/scripts/r2-continuation-once-ssh.py', '.github/scripts/r2-continuation-once-ssh.test.py'].sort();
            ensure(commit.parents.length === 1 && commit.parents[0].sha === tooling && commit.files?.length === 3 &&
              JSON.stringify(commit.files.map(f => f.filename).sort()) === JSON.stringify(allowed) &&
              commit.files.every(f => f.status === 'added' && !f.previous_filename),
              'Invocation must add only the three reviewed invocation files directly to tooling.');
            const {data: main} = await github.rest.repos.getBranch({...repo, branch: 'main'});
            ensure(main.commit.sha === sha, 'Production main changed.');
            for (const [id, workflow, name] of [[37857712659, '.github/workflows/deploy.yml', 'Production deployment'], [37855980608, '.github/workflows/database.yml', 'Task quality gates']]) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: id});
              ensure(run.id === id && run.path === workflow && run.name === name && run.head_sha === sha &&
                run.head_branch === 'main' && run.run_attempt === 1 && run.status === 'completed' && run.conclusion === 'success',
                'Exact deployment or quality evidence no longer matches.');
            }
            const {data: artifact} = await github.rest.actions.getArtifact({...repo, artifact_id: 11584737511});
            ensure(!artifact.expired && artifact.workflow_run?.id === 37857712659 &&
              artifact.name === `ayin-production-deploy-proof-${sha}`, 'Immutable deployment proof unavailable.');
            const download = await github.rest.actions.downloadArtifact({...repo, artifact_id: 11584737511, archive_format: 'zip'});
            const bytes = Buffer.from(download.data);
            const crypto = await import('node:crypto');
            ensure(bytes.length < 65536 && crypto.createHash('sha256').update(bytes).digest('hex') ===
              'eb8086ce89ab2bee1d45a4d86ebdb8787d6cc531fc684ca9080e832a3aa1c5ff', 'Deployment proof digest mismatch.');
            const fs = await import('node:fs');
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/r2-pinned-deploy-proof.zip`, bytes, {flag: 'wx', mode: 0o600});

      - name: Checkout the exact reviewed invocation helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: invocation
          persist-credentials: false
      - name: Checkout the exact separate tooling commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TOOLING_SHA }}
          path: tooling
          persist-credentials: false
      - name: Set up locked Node without implicit pnpm cache
        uses: actions/setup-node@v5
        with:
          node-version-file: tooling/.nvmrc
          package-manager-cache: false

      - name: Verify source identities and all 65 offline fixture guards
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TOOLING_SHA" ]]
          [[ "$(git -C ../invocation rev-parse HEAD)" == "$INVOCATION_WORKFLOW_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]
          [[ -z "$(git -C ../invocation status --porcelain --untracked-files=no)" ]]
          [[ "$(cat .nvmrc)" == '24.19.0' ]]
          [[ "$(node --version)" == 'v24.19.0' ]]
          printf '%s  %s\n' "$PROVIDER_SHA256" deploy/media/r2-owned-fixture-provider.mjs "$CONTINUATION_SHA256" deploy/media/r2-owned-continuation-provider.mjs | sha256sum --check --status
          python3 ../invocation/.github/scripts/r2-continuation-once-ssh.test.py
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile(os.environ['RUNNER_TEMP'] + '/r2-pinned-deploy-proof.zip') as archive:
              assert archive.namelist() == ['deploy-proof.env']
              assert archive.getinfo('deploy-proof.env').file_size < 4096
              proof = dict(line.split('=', 1) for line in archive.read('deploy-proof.env').decode().splitlines() if line)
              assert proof['release_sha'] == os.environ['RELEASE_SHA']
              assert proof['validation_run_id'] == '37855980608'
              assert proof['deploy_run_id'] == '37857712659'
              assert proof['deploy_run_attempt'] == '1' and proof['deployed_as'] == 'ayin'
          PY
          corepack enable
          [[ "$(corepack pnpm --version)" == '11.24.0' ]]
          corepack pnpm install --frozen-lockfile
          node --test --test-reporter=tap deploy/media/r2-owned-fixture-provider.test.mjs deploy/media/r2-owned-fixture-browser.test.mjs deploy/media/r2-owned-continuation-browser.test.mjs > "$RUNNER_TEMP/r2-continuation-offline.tap"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const report = readFileSync(`${process.env.RUNNER_TEMP}/r2-continuation-offline.tap`, 'utf8').split('\n');
          for (const line of ['# tests 65', '# pass 65', '# fail 0', '# cancelled 0', '# skipped 0', '# todo 0']) assert.equal(report.filter(v => v === line).length, 1);
          NODE
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/r2-driver-ssh-argv.json"
          import {parseContinuationArguments} from './deploy/media/r2-owned-continuation-provider.mjs';
          import {sshArguments} from './deploy/media/r2-owned-continuation-browser.mjs';
          const options = parseContinuationArguments(['--execute-approved', '--execute-continuation-approved', '--release-sha', process.env.RELEASE_SHA, '--tooling-sha', process.env.TOOLING_SHA, '--run-id', '34c4947c-ba13-4fc9-9087-0d1db8cc4d28', '--confirm-prefix', 'ayin-recovery-acceptance/34c4947c-ba13-4fc9-9087-0d1db8cc4d28/', '--ack-cleanup', 'DELETE_ONLY_CREATED_FIXTURES']);
          console.log(JSON.stringify(sshArguments(options)));
          NODE
          python3 - <<'PY'
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location('guard', '../invocation/.github/scripts/r2-continuation-once-ssh.py')
          guard = importlib.util.module_from_spec(spec); spec.loader.exec_module(guard)
          with open(os.environ['RUNNER_TEMP'] + '/r2-driver-ssh-argv.json') as f:
              assert json.load(f) == guard.ssh_prefix() + [guard.driver_command(guard.config())]
          PY
          corepack pnpm exec playwright install --with-deps chromium

      - name: Configure existing pinned AYIN SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519")
          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          [[ "$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')" == "$PINNED_SSH_HOST_FINGERPRINT" ]]
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage only the two pinned sources and deterministic manifest
        id: stage
        run: python3 ../invocation/.github/scripts/r2-continuation-once-ssh.py stage

      - name: Recheck unchanged production and invocation immediately before execution
        uses: actions/github-script@v8
        with:
          script: |
            const repo = {owner: 'eltx1', repo: 'ayin'};
            for (const [branch, sha] of [['main', process.env.RELEASE_SHA], [process.env.INVOCATION_BRANCH, context.sha]]) {
              const {data} = await github.rest.repos.getBranch({...repo, branch});
              if (data.commit.sha !== sha) throw new Error('Required branch changed; refusing provider execution.');
            }
            const {data: deploy} = await github.rest.actions.getWorkflowRun({...repo, run_id: 37857712659});
            if (deploy.head_sha !== process.env.RELEASE_SHA || deploy.conclusion !== 'success' || deploy.run_attempt !== 1) throw new Error('Deployment evidence changed.');

      - name: Execute the fixed remaining-fixtures driver once
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/r2-continuation-ssh:$PATH"
          [[ "$(command -v ssh)" == "$RUNNER_TEMP/r2-continuation-ssh/ssh" ]]
          node deploy/media/r2-owned-continuation-browser.mjs \
            --execute-approved --execute-continuation-approved \
            --release-sha "$RELEASE_SHA" --tooling-sha "$TOOLING_SHA" \
            --run-id 34c4947c-ba13-4fc9-9087-0d1db8cc4d28 \
            --confirm-prefix ayin-recovery-acceptance/34c4947c-ba13-4fc9-9087-0d1db8cc4d28/ \
            --ack-cleanup DELETE_ONLY_CREATED_FIXTURES

      - name: Remove only unchanged recorded staging files and the exact child directory
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/r2-continuation-owned-staging.json" ]]; then
            python3 ../invocation/.github/scripts/r2-continuation-once-ssh.py cleanup
          fi

      - name: Validate only the reconstructed allowlisted proof
        if: ${{ always() }}
        id: proof
        run: |
          set -euo pipefail
          if [[ -f owned-r2-continuation-proof.json ]]; then
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, lstatSync} from 'node:fs';
          import {validateContinuationProof} from './deploy/media/r2-owned-continuation-provider.mjs';
          const path = 'owned-r2-continuation-proof.json';
          const s = lstatSync(path);
          assert(s.isFile() && !s.isSymbolicLink() && s.nlink === 1 && s.size <= 16384);
          const proof = JSON.parse(readFileSync(path, 'utf8'));
          assert.deepEqual(proof, validateContinuationProof(proof, process.env.RELEASE_SHA, process.env.TOOLING_SHA, {providerSha256: process.env.PROVIDER_SHA256, continuationSha256: process.env.CONTINUATION_SHA256}));
          NODE
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload only the validated continuation observations
        if: ${{ always() && steps.proof.outputs.valid == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: r2-remaining-fixtures-proof-34c4947c-ba13-4fc9-9087-0d1db8cc4d28
          path: tooling/owned-r2-continuation-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral runner SSH material
        if: ${{ always() }}
        working-directory: ${{ runner.temp }}
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/known_hosts.candidate"
