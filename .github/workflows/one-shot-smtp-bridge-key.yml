name: One-shot verify installed SMTP runtime

on:
  push:
    branches:
      - smtp-password-recovery-20260904
    paths:
      - .github/workflows/one-shot-smtp-bridge-key.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Configure pinned AYIN SSH trust
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          ssh-keyscan -T 7 -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate" 2>/dev/null
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR==1{print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SMTP settings without exposing credentials
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(whoami)" == "ayin" ]]
          [[ "$HOME" == "/home/ayin" ]]
          [[ "$(hostname)" == "ip-172-31-4-110" ]]
          [[ "$(stat -c '%a' /home/ayin/env/api.env)" == "600" ]]

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const values = new Map();
          for (const rawLine of readFileSync('/home/ayin/env/api.env', 'utf8').split(/\r?\n/u)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const separator = line.indexOf('=');
            if (separator > 0) values.set(line.slice(0, separator), line.slice(separator + 1));
          }

          const required = [
            'MAIL_SCHEME',
            'MAIL_HOST',
            'MAIL_PORT',
            'MAIL_USERNAME',
            'MAIL_PASSWORD',
            'MAIL_EHLO_DOMAIN',
            'MAIL_FROM_ADDRESS',
            'MAIL_FROM_NAME',
            'MAIL_TIMEOUT_MS',
          ];
          for (const key of required) {
            if (!values.get(key)) throw new Error(`Missing ${key}`);
          }
          const host = values.get('MAIL_HOST');
          const port = values.get('MAIL_PORT');
          const scheme = values.get('MAIL_SCHEME');
          if (host !== 'smtp.gmail.com') throw new Error('SMTP host is not Gmail');
          if (!['465', '587'].includes(port)) throw new Error('Unsupported Gmail SMTP port');
          if (!['smtps', 'starttls'].includes(scheme)) throw new Error('Unsupported SMTP scheme');

          console.log(`AYIN_SMTP_HOST=${host}`);
          console.log(`AYIN_SMTP_PORT=${port}`);
          console.log(`AYIN_SMTP_SCHEME=${scheme}`);
          console.log('AYIN_SMTP_USERNAME_PRESENT=YES');
          console.log('AYIN_SMTP_PASSWORD_PRESENT=YES');
          console.log('AYIN_SMTP_FROM_PRESENT=YES');
          NODE

          rm -f /tmp/ayin-smtp-bridge-private.pem /tmp/ayin-smtp-bridge-public.pem || true
          echo "AYIN_SMTP_RUNTIME_READY=YES"
          REMOTE
