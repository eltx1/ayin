name: One-shot install encrypted SMTP bridge

on:
  push:
    branches:
      - smtp-password-recovery-20260904
    paths:
      - .github/workflows/one-shot-smtp-bridge-key.yml

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Configure pinned AYIN SSH trust
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          ssh-keyscan -T 7 -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate" 2>/dev/null
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR==1{print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Decrypt and atomically install SMTP runtime configuration
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(whoami)" == "ayin" ]]
          [[ "$HOME" == "/home/ayin" ]]
          [[ "$(hostname)" == "ip-172-31-4-110" ]]

          private=/tmp/ayin-smtp-bridge-private.pem
          public=/tmp/ayin-smtp-bridge-public.pem
          encrypted_key=/tmp/ayin-smtp-bridge.key.enc
          encrypted_payload=/tmp/ayin-smtp-bridge.payload.enc
          passfile="$(mktemp)"
          plain="$(mktemp)"
          chmod 600 "$passfile" "$plain"
          trap 'rm -f "$passfile" "$plain" "$private" "$public" "$encrypted_key" "$encrypted_payload"' EXIT

          test -r "$private"
          test -r "$encrypted_key"
          test -r "$encrypted_payload"

          openssl pkeyutl -decrypt -inkey "$private" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in "$encrypted_key" -out "$passfile"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted_payload" -out "$plain" -pass file:"$passfile"
          test -s "$plain"

          SMTP_PAYLOAD_FILE="$plain" node --input-type=module <<'NODE'
          import { chmodSync, readFileSync, renameSync, writeFileSync } from 'node:fs';

          const envPath = '/home/ayin/env/api.env';
          const payloadPath = process.env.SMTP_PAYLOAD_FILE;
          if (!payloadPath) throw new Error('SMTP bridge payload path is missing');

          const allowed = new Set([
            'MAIL_HOST',
            'MAIL_PORT',
            'MAIL_USERNAME',
            'MAIL_PASSWORD',
            'MAIL_FROM_ADDRESS',
          ]);
          const values = new Map();
          for (const rawLine of readFileSync(payloadPath, 'utf8').split(/\r?\n/u)) {
            if (!rawLine) continue;
            const separator = rawLine.indexOf('=');
            if (separator <= 0) throw new Error('Malformed encrypted SMTP payload');
            const key = rawLine.slice(0, separator);
            const value = rawLine.slice(separator + 1);
            if (!allowed.has(key) || values.has(key) || !value || /[\r\n]/u.test(value)) {
              throw new Error('Invalid encrypted SMTP payload');
            }
            values.set(key, value);
          }
          if (values.size !== allowed.size) throw new Error('Incomplete encrypted SMTP payload');

          const port = Number(values.get('MAIL_PORT'));
          if (!Number.isInteger(port) || (port !== 465 && port !== 587)) {
            throw new Error('Unsupported SMTP port in encrypted payload');
          }
          const host = values.get('MAIL_HOST');
          if (!host || host.length > 255) throw new Error('Invalid SMTP host in encrypted payload');

          const managed = new Set([
            ...allowed,
            'MAIL_SCHEME',
            'MAIL_EHLO_DOMAIN',
            'MAIL_FROM_NAME',
            'MAIL_TIMEOUT_MS',
          ]);
          const current = readFileSync(envPath, 'utf8');
          const preserved = current
            .split(/\r?\n/u)
            .filter((line) => {
              const separator = line.indexOf('=');
              return separator <= 0 || !managed.has(line.slice(0, separator));
            })
            .join('\n')
            .replace(/\n+$/u, '');

          const additions = [
            `MAIL_SCHEME=${port === 465 ? 'smtps' : 'starttls'}`,
            `MAIL_HOST=${values.get('MAIL_HOST')}`,
            `MAIL_PORT=${values.get('MAIL_PORT')}`,
            `MAIL_USERNAME=${values.get('MAIL_USERNAME')}`,
            `MAIL_PASSWORD=${values.get('MAIL_PASSWORD')}`,
            'MAIL_EHLO_DOMAIN=ayin.stream',
            `MAIL_FROM_ADDRESS=${values.get('MAIL_FROM_ADDRESS')}`,
            'MAIL_FROM_NAME=AYIN',
            'MAIL_TIMEOUT_MS=15000',
          ];

          const tempPath = `${envPath}.smtp-${process.pid}.tmp`;
          writeFileSync(tempPath, `${preserved}\n${additions.join('\n')}\n`, { mode: 0o600 });
          chmodSync(tempPath, 0o600);
          renameSync(tempPath, envPath);
          NODE

          test "$(stat -c '%a' /home/ayin/env/api.env)" = "600"
          for key in MAIL_SCHEME MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_EHLO_DOMAIN MAIL_FROM_ADDRESS MAIL_FROM_NAME MAIL_TIMEOUT_MS; do
            grep -q "^${key}=" /home/ayin/env/api.env
          done

          rm -f "$passfile" "$plain" "$private" "$public" "$encrypted_key" "$encrypted_payload"
          trap - EXIT
          echo "AYIN_SMTP_ENV_INSTALLED=YES"
          REMOTE
