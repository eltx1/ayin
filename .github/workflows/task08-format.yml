name: Task 08 formatter

on:
  push:
    branches:
      - task-08-public-channel-editing

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-08-public-channel-editing
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 08 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/creator/channel.controller.ts
          apps/api/src/creator/channel.service.ts
          'apps/web/src/app/(viewer)/c/[handle]/page.tsx'
          apps/web/src/components/channel/channel-editor.tsx
          apps/web/src/components/channel/public-channel.module.css
          apps/web/src/lib/channel.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/creator/channel.controller.ts apps/api/src/creator/channel.service.ts 'apps/web/src/app/(viewer)/c/[handle]/page.tsx' apps/web/src/components/channel/channel-editor.tsx apps/web/src/components/channel/public-channel.module.css apps/web/src/lib/channel.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Task 08 implementation"
            git push origin HEAD:task-08-public-channel-editing
          fi
