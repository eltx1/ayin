# Temporary Task 58 validation/application workflow; remove before PR.
name: Task 58 temporary backend apply

on:
  push:
    branches:
      - task-58-catalog-admin
    paths:
      - .github/workflows/task58-apply-backend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_task58
          POSTGRES_USER: ayin
          POSTGRES_PASSWORD: ayin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_task58"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_task58?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_task58?schema=public
      AUTH_TOKEN_SECRET: task-58-validation-secret-with-more-than-32-characters
      UPLOAD_SESSION_SECRET: task-58-upload-secret-with-more-than-32-characters
      PAYOUT_DATA_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      WEB_ORIGIN: http://127.0.0.1:3000
      CORS_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_MEDIA_BASE_URL: http://media.invalid
      AYIN_E2E_STORAGE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-58-catalog-admin
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Task 58 backend service hardening
        run: |
          python3 scripts/task58-movie-service-patch.py
          python3 scripts/task58-series-service-patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/api/test/catalog-admin.integration.test.ts")
          text = path.read_text()
          old = "    expect(auditCount).toBeGreaterThanOrEqual(8);"
          new = "    // Seven successful catalog mutations above are audited; rejected safety checks do not create mutation audit entries.\n    expect(auditCount).toBeGreaterThanOrEqual(7);"
          if old not in text:
              raise SystemExit("Task 58 audit expectation anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format Task 58 sources
        run: >-
          pnpm exec prettier --write
          apps/api/src/admin/admin-audit-log.service.ts
          apps/api/src/admin/admin-scoped-directory.controller.ts
          apps/api/src/admin/catalog-admin-media.service.ts
          apps/api/src/admin/admin.module.ts
          apps/api/src/movie-catalog/admin-movie-catalog.controller.ts
          apps/api/src/movie-catalog/movie-catalog.service.ts
          apps/api/src/series-catalog/admin-series-catalog.controller.ts
          apps/api/src/series-catalog/series-catalog.service.ts
          apps/api/test/catalog-admin.integration.test.ts
          apps/web/src/components/admin/admin-movie-catalog.tsx
          apps/web/src/components/admin/admin-series-catalog.tsx
          apps/web/src/components/admin/catalog-resource-picker.tsx
          tests/e2e/catalog-admin.acceptance.spec.ts
          tests/e2e/catalog-seed.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and schema tests
        run: pnpm test
      - name: Generate Prisma client and migrate
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
      - name: Task 58 integration test
        run: pnpm --filter @ayin/api exec vitest run --testTimeout=30000 --fileParallelism=false test/catalog-admin.integration.test.ts
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Seed baseline and build release candidate
        run: |
          pnpm db:seed
          pnpm build
      - name: Task 58 browser acceptance
        run: pnpm exec playwright test tests/e2e/catalog-admin.acceptance.spec.ts
      - name: Persist validated Task 58 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src \
            apps/api/test/catalog-admin.integration.test.ts \
            apps/web/src/components/admin/admin-movie-catalog.tsx \
            apps/web/src/components/admin/admin-series-catalog.tsx \
            apps/web/src/components/admin/catalog-resource-picker.tsx \
            packages/db/prisma/series-catalog.prisma \
            packages/db/prisma/migrations/20260915165000_catalog_admin_hardening/migration.sql \
            tests/e2e/catalog-admin.acceptance.spec.ts \
            tests/e2e/catalog-seed.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat(task58): complete guarded catalog administration"
          git push origin HEAD:task-58-catalog-admin
