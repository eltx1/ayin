name: Task 51 finalizer

on:
  push:
    branches:
      - task-51-video-metadata-v2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-51-video-metadata-v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Apply final Task 51 wiring
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing anchor in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, count))

          # Quick Upload: advanced creator metadata stays collapsed and optional.
          path = 'apps/web/src/components/upload/quick-upload.tsx'
          replace(path,
            '} from "@/lib/video-inspection";\n\nimport styles from "./quick-upload.module.css";',
            '} from "@/lib/video-inspection";\n\nimport {\n  buildMetadataPayload,\n  EMPTY_METADATA_DRAFT,\n  VideoMetadataFields,\n} from "./video-metadata-fields";\nimport styles from "./quick-upload.module.css";')
          replace(path,
            '  const [scheduledPublishAt, setScheduledPublishAt] = useState("");\n  const [progress, setProgress] = useState(0);',
            '  const [scheduledPublishAt, setScheduledPublishAt] = useState("");\n  const [metadataDraft, setMetadataDraft] = useState(() => ({ ...EMPTY_METADATA_DRAFT }));\n  const [progress, setProgress] = useState(0);')
          replace(path,
            '    setPublished(false);\n    setMessage(null);\n    if (!selected || !identity) return;',
            '    setPublished(false);\n    setMetadataDraft({ ...EMPTY_METADATA_DRAFT });\n    setMessage(null);\n    if (!selected || !identity) return;')
          replace(path,
            '      scheduledPublishAt: scheduledPublishAt ? new Date(scheduledPublishAt).toISOString() : null,\n      videoForm,\n    };',
            '      scheduledPublishAt: scheduledPublishAt ? new Date(scheduledPublishAt).toISOString() : null,\n      videoForm,\n      ...buildMetadataPayload(metadataDraft),\n    };')
          replace(path,
            '<strong>Publishing settings</strong>\n                  <small>Description, visibility, schedule, comments and thumbnail</small>',
            '<strong>Advanced settings</strong>\n                  <small>Optional metadata, publishing controls and thumbnail · SEO stays automatic</small>')
          replace(path,
            '''                </label>\n\n                <label>\n                  <span>Visibility</span>''',
            '''                </label>\n\n                <VideoMetadataFields\n                  fullWidthClassName={styles.fullWidth}\n                  value={metadataDraft}\n                  onChange={setMetadataDraft}\n                />\n\n                <label>\n                  <span>Visibility</span>''')
          replace(path,
            '                    rows={5}\n                    value={description}',
            '                    rows={5}\n                    maxLength={20_000}\n                    value={description}')

          # Search: consume exact normalized tags and valid category names only.
          path = 'apps/api/src/search/search.service.ts'
          replace(path,
            'import { DatabaseService } from "../database/database.service.js";\n',
            'import { DatabaseService } from "../database/database.service.js";\nimport { VIDEO_CATEGORIES } from "../creator/video-metadata.validation.js";\n')
          replace(path,
            '    const takePerType = Math.min(offset + limit + 1, maxPageSize * 3);\n\n    const [videos, channels, playlists, televisions] = await Promise.all([',
            '''    const takePerType = Math.min(offset + limit + 1, maxPageSize * 3);\n    const normalizedTag = normalized.toLocaleLowerCase();\n    const categoryToken = normalized\n      .trim()\n      .toUpperCase()\n      .replace(/[\\s&-]+/g, "_");\n    const category = VIDEO_CATEGORIES.find((value) => value === categoryToken);\n    const metadataMatches = await this.database.client.videoCreatorMetadata.findMany({\n      where: {\n        OR: [\n          { tags: { has: normalizedTag } },\n          ...(category ? [{ category }] : []),\n        ],\n      },\n      take: takePerType,\n      select: { videoId: true },\n    });\n    const metadataVideoIds = metadataMatches.map((item) => item.videoId);\n\n    const [videos, channels, playlists, televisions] = await Promise.all([''')
          replace(path,
            '                { channel: { handle: { contains: normalized, mode: "insensitive" } } },\n',
            '                { channel: { handle: { contains: normalized, mode: "insensitive" } } },\n                { id: { in: metadataVideoIds } },\n')

          # Discovery: use the already-authoritative Video.contentType for Movies only.
          path = 'apps/api/src/discovery/discovery.service.ts'
          replace(path,
            '''      case "MOVIES":\n        return emptyPage(\n          "No movie catalog classification exists in the current data model yet, so AYIN will not label ordinary creator videos as movies.",\n          "UNAVAILABLE",\n        );\n      case "SERIES":\n        return emptyPage(\n          "No series/episode catalog classification exists in the current data model yet, so AYIN will not invent series entries.",\n          "UNAVAILABLE",\n        );''',
            '''      case "MOVIES":\n        return this.loadRecentVideos(offset, limit, undefined, "Movies", "MOVIE");\n      case "SERIES":\n        return emptyPage(\n          "AYIN stores optional creator series/episode placeholders, but no first-class catalog relationship exists yet, so discovery will not promote those placeholders as catalog truth.",\n          "UNAVAILABLE",\n        );''')
          replace(path,
            '''  private async loadRecentVideos(\n    offset: number,\n    limit: number,\n    publishedAfter: Date | undefined,\n    kicker: string,\n  ): Promise<DiscoveryPage> {''',
            '''  private async loadRecentVideos(\n    offset: number,\n    limit: number,\n    publishedAfter: Date | undefined,\n    kicker: string,\n    contentType?: "MOVIE",\n  ): Promise<DiscoveryPage> {''')
          replace(path,
            '        ...(publishedAfter ? { publishedAt: { gte: publishedAfter } } : {}),\n',
            '        ...(publishedAfter ? { publishedAt: { gte: publishedAfter } } : {}),\n        ...(contentType ? { contentType } : {}),\n', 1)

          # Creator TV: pass creator preferences to the existing ad provider hook.
          path = 'apps/api/src/creator/creator-tv.service.ts'
          replace(path,
            '''  private async resolveAdBreaks(\n    tvChannelId: string,\n    channelId: string,\n    generatedAt: Date,\n    programs: TvProgram[],\n  ) {\n    return this.adBreakHook.getBreaks({\n      tvChannelId,\n      channelId,\n      generatedAt,\n      programs: programs.map((program) => ({\n        occurrenceKey: program.occurrenceKey,\n        videoId: program.video.id,\n        startsAt: new Date(program.startsAtMs),\n        endsAt: new Date(program.endsAtMs),\n      })),\n    });\n  }''',
            '''  private async resolveAdBreaks(\n    tvChannelId: string,\n    channelId: string,\n    generatedAt: Date,\n    programs: TvProgram[],\n  ) {\n    if (!programs.length) return [];\n    const preferences = await this.database.client.videoCreatorMetadata.findMany({\n      where: { videoId: { in: [...new Set(programs.map((program) => program.video.id))] } },\n      select: { videoId: true, adBreakPreference: true, adBreakOffsetsSeconds: true },\n    });\n    const preferenceByVideo = new Map(preferences.map((preference) => [preference.videoId, preference]));\n    const disabledOccurrences = new Set<string>();\n    const hookPrograms = programs.map((program) => {\n      const preference = preferenceByVideo.get(program.video.id);\n      if (preference?.adBreakPreference === "DISABLED") {\n        disabledOccurrences.add(program.occurrenceKey);\n      }\n      return {\n        occurrenceKey: program.occurrenceKey,\n        videoId: program.video.id,\n        startsAt: new Date(program.startsAtMs),\n        endsAt: new Date(program.endsAtMs),\n        creatorPreference: preference?.adBreakPreference\n          ? {\n              mode: preference.adBreakPreference,\n              offsetsSeconds: preference.adBreakOffsetsSeconds,\n            }\n          : null,\n      };\n    });\n    const breaks = await this.adBreakHook.getBreaks({\n      tvChannelId,\n      channelId,\n      generatedAt,\n      programs: hookPrograms,\n    });\n    return breaks.filter((marker) => !disabledOccurrences.has(marker.occurrenceKey));\n  }''')

          # Tighten custom-offset validation: offsets have meaning only in CUSTOM mode.
          path = 'apps/api/src/creator/video-metadata.validation.ts'
          replace(path,
            '''    if (\n      value.adBreakPreference !== undefined &&\n      value.adBreakPreference !== null &&\n      value.adBreakPreference !== "CUSTOM" &&\n      (value.adBreakOffsetsSeconds?.length ?? 0) > 0\n    ) {''',
            '''    if (\n      value.adBreakPreference !== "CUSTOM" &&\n      (value.adBreakOffsetsSeconds?.length ?? 0) > 0\n    ) {''')

          # Rights tests must verify the legal attestation survives alongside the note.
          path = 'apps/api/test/video-metadata-v2.integration.test.ts'
          replace(path,
            '    expect(rights.statement).toBe("Licensed for AYIN distribution.");',
            '    expect(rights.statement).toContain("I confirm that I own or have the rights");\n    expect(rights.statement).toContain("Creator note: Licensed for AYIN distribution.");')
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and generate
        run: |
          pnpm --filter @ayin/db exec prisma format --schema prisma
          pnpm exec prettier --write \
            packages/db/prisma/video-metadata-v2.prisma \
            packages/db/prisma/migrations/20260910010000_video_metadata_v2/migration.sql \
            apps/api/src/creator/video-metadata.validation.ts \
            apps/api/src/creator/video-metadata.validation.test.ts \
            apps/api/src/creator/video-metadata.service.ts \
            apps/api/src/creator/quick-upload.controller.ts \
            apps/api/src/creator/creator.module.ts \
            apps/api/src/creator/studio.controller.ts \
            apps/api/src/creator/creator-tv-ad-break.hook.ts \
            apps/api/src/creator/creator-tv.service.ts \
            apps/api/src/search/search.service.ts \
            apps/api/src/discovery/discovery.service.ts \
            apps/api/src/admin/admin-video-metadata.controller.ts \
            apps/api/src/admin/admin.module.ts \
            apps/api/test/video-metadata-v2.integration.test.ts \
            apps/web/src/lib/quick-upload.ts \
            apps/web/src/lib/studio.ts \
            apps/web/src/components/upload/video-metadata-fields.tsx \
            apps/web/src/components/upload/quick-upload.tsx \
            apps/web/src/components/studio/studio-content-manager.tsx \
            docs/TASK51_VIDEO_METADATA_V2.md
          pnpm --filter @ayin/db prisma:generate
      - name: Focused checks
        run: |
          pnpm --filter @ayin/api typecheck
          pnpm --filter @ayin/web typecheck
          pnpm --filter @ayin/api test -- video-metadata.validation.test.ts
      - name: Commit finalized implementation and remove runner
        run: |
          rm .github/workflows/task51-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(task-51): finalize creator video metadata v2"
          git push origin HEAD:task-51-video-metadata-v2
