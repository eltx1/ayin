name: Verify automatic local media cleanup
on:
  push:
    branches: [codex/ayin-large-upload-proof-20261028]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Verify deployed worker automatically removes sealed synthetic scratch
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 13.63.216.89
          SSH_PORT: "22"
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          bash deploy/acquire-ssh-host-key.sh "$HOME/.ssh/candidate"
          test "$(ssh-keygen -lf "$HOME/.ssh/candidate" -E sha256 | awk 'NR == 1 {print $2}')" = 'SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y'
          mv "$HOME/.ssh/candidate" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ayin@"$DEPLOY_HOST" 'cd /home/ayin/htdocs/current && git rev-parse HEAD && node deploy/run-with-env.cjs /home/ayin/env/api.env node --input-type=module' <<'JS'
          import { spawnSync } from 'node:child_process';
          import { lstat, readFile, readdir } from 'node:fs/promises';
          import { resolve, dirname } from 'node:path';
          const expectedRelease='633a0dd4a2b9ab08eb7dc1a8ce91a3b9fe3b15f2';
          const release=spawnSync('git',['rev-parse','HEAD'],{encoding:'utf8'});
          if(release.status!==0||release.stdout.trim()!==expectedRelease)throw new Error('UnexpectedProductionRelease');
          const heartbeatPath=process.env.MEDIA_WORKER_HEARTBEAT_PATH||'/tmp/ayin-media-worker-heartbeat.json';
          const heartbeat=JSON.parse(await readFile(heartbeatPath,'utf8'));
          if(heartbeat.releaseSha!==expectedRelease||heartbeat.status!=='running'||Date.now()-Date.parse(heartbeat.heartbeatAt)>90000)throw new Error('ExpectedWorkerNotRunning');
          const helper=spawnSync(process.execPath,['--input-type=module','-e',"import { createPrismaClient } from './packages/db/dist/index.js';\nimport { MediaScratchService } from './apps/api/dist/media/media-scratch.service.js';\nimport { randomUUID } from 'node:crypto';\nimport { writeFile } from 'node:fs/promises';\nimport { join } from 'node:path';\nconst db=createPrismaClient();\ntry {\n const job=await db.$transaction(async tx=>{\n  await tx.$executeRawUnsafe('SET TRANSACTION READ ONLY');\n  return tx.mediaProcessingJob.findFirst({where:{status:'READY',sourceSizeBytes:3736813160n,video:{title:'AYIN 3.48 GiB reopen verification — private test',visibility:'PRIVATE'}},select:{id:true}});\n });\n if(!job)throw new Error('PrivateReadyFixtureMissing');\n const scratch=new MediaScratchService();\n const directory=await scratch.create(job.id,randomUUID());\n const payload=Buffer.from('AYIN synthetic automatic cleanup acceptance only\\n');\n await writeFile(join(directory,'synthetic-cleanup-proof.tmp'),payload,{flag:'wx',mode:0o600});\n await scratch.seal(directory);\n process.stdout.write(JSON.stringify({directory,payloadBytes:payload.length}));\n} catch(error){process.stderr.write(error?.name??'UnknownError');process.exitCode=1;}\nfinally{await db.$disconnect();}\n"],{encoding:'utf8',timeout:30000,maxBuffer:100000});
          if(helper.status!==0)throw new Error('SyntheticFixtureCreationFailed');
          const fixture=JSON.parse(helper.stdout);
          const root=resolve(process.env.MEDIA_PROCESSING_WORKDIR?.trim()||'/tmp/ayin-media-processing');
          if(dirname(fixture.directory)!==root)throw new Error('FixtureRootMismatch');
          const initial=await lstat(fixture.directory);
          if(!initial.isDirectory()||initial.isSymbolicLink())throw new Error('FixtureNotDirectory');
          console.log('SAFE_AUTOMATIC_CLEANUP_ACCEPTANCE',JSON.stringify({created:true,payloadBytes:fixture.payloadBytes,helperExited:true,manualDeletion:false}));
          const started=Date.now();
          let removed=false;
          for(let n=0;n<42;n++){
           await new Promise(resolve=>setTimeout(resolve,10000));
           try{await lstat(fixture.directory);}catch(error){if(error.code==='ENOENT'){removed=true;break;}throw error;}
           if(n%3===2)console.log('SAFE_AUTOMATIC_CLEANUP_WAIT',JSON.stringify({elapsedSeconds:Math.round((Date.now()-started)/1000)}));
          }
          const finalHeartbeat=JSON.parse(await readFile(heartbeatPath,'utf8'));
          const workerLogs=spawnSync('pm2',['logs','ayin-media-worker','--lines','80','--nostream','--raw'],{encoding:'utf8',timeout:15000,maxBuffer:1000000});
          const workerSweepLogged=/media_scratch[.]sweep: inspected=[0-9]+ removed=[1-9][0-9]* retained=[0-9]+/.test(workerLogs.stdout??'');
          console.log('SAFE_AUTOMATIC_CLEANUP_ACCEPTANCE',JSON.stringify({removedByWorker:removed,workerSweepLogged,manualDeletion:false,elapsedSeconds:Math.round((Date.now()-started)/1000),workerReleaseMatches:finalHeartbeat.releaseSha===expectedRelease,remainingScratchEntries:(await readdir(root)).length}));
          if(!removed||!workerSweepLogged||finalHeartbeat.releaseSha!==expectedRelease||finalHeartbeat.status!=='running'||Date.now()-Date.parse(finalHeartbeat.heartbeatAt)>90000)process.exitCode=1;
          JS
