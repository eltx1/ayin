name: Verify active scratch ownership (read only)
on:
  push:
    branches: [codex/ayin-large-upload-proof-20261028]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact deployed release, worker heartbeat and local scratch inventory
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 13.63.216.89
          SSH_PORT: "22"
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          bash deploy/acquire-ssh-host-key.sh "$HOME/.ssh/candidate"
          test "$(ssh-keygen -lf "$HOME/.ssh/candidate" -E sha256 | awk 'NR == 1 {print $2}')" = 'SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y'
          mv "$HOME/.ssh/candidate" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ayin@"$DEPLOY_HOST" 'cd /home/ayin/htdocs/current && git rev-parse HEAD && node deploy/run-with-env.cjs /home/ayin/env/api.env node --input-type=module' <<'JS'
          import { createPrismaClient } from './packages/db/dist/index.js';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          import { readFile,readdir,lstat } from 'node:fs/promises';
          import { join } from 'node:path';
          const expected='a4eaf5ac4cfd12d8a30854b72f70c82cab5e1df8';
          if(spawnSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).stdout.trim()!==expected)throw Error('ReleaseMismatch');
          const root=process.env.MEDIA_PROCESSING_WORKDIR||'/tmp/ayin-media-processing';
          const db=createPrismaClient();
          try{
           const entries=await readdir(root,{withFileTypes:true});
           const owners=[];
           for(const entry of entries){
            if(!entry.isDirectory()||!/^([a-f0-9-]{36})-([a-f0-9]{16})$/.test(entry.name))throw Error('UnrecognizedScratchEntry');
            const marker=join(root,entry.name,'.ayin-scratch-owner.json');
            const stat=await lstat(marker);if(!stat.isFile()||stat.isSymbolicLink())throw Error('UnrecognizedScratchMarker');
            const owner=JSON.parse(await readFile(marker,'utf8'));
            if(entry.name!==owner.jobId+'-'+owner.claimHash)throw Error('MarkerIdentityMismatch');
            owners.push(owner);
           }
           const states=await db.$transaction(async tx=>{
            await tx.$executeRawUnsafe('SET TRANSACTION READ ONLY');
            const results=[];
            for(const owner of owners){
             const job=await tx.mediaProcessingJob.findUnique({where:{id:owner.jobId},select:{status:true,stage:true,leaseOwner:true,leaseExpiresAt:true,video:{select:{status:true}}}});
             const leaseMatches=!!job?.leaseOwner&&createHash('sha256').update(job.leaseOwner).digest('hex').slice(0,16)===owner.claimHash;
             results.push({jobPresent:!!job,status:job?.status??null,stage:job?.stage??null,videoStatus:job?.video.status??null,localWorkSettled:owner.localWorkSettled===true,leaseMatches,leaseActive:!!job?.leaseExpiresAt&&job.leaseExpiresAt.getTime()>Date.now()});
            }
            return results;
           },{timeout:15000});
           console.log('SAFE_SCRATCH_OWNERSHIP',JSON.stringify({readOnly:true,releaseMatches:true,directories:owners.length,states}));
          }finally{await db.$disconnect();}
          JS
