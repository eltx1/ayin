name: Verify release and automatic local cleanup (read only)
on:
  push:
    branches: [codex/ayin-large-upload-proof-20261028]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact deployed release, worker heartbeat and local scratch inventory
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 13.63.216.89
          SSH_PORT: "22"
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          bash deploy/acquire-ssh-host-key.sh "$HOME/.ssh/candidate"
          test "$(ssh-keygen -lf "$HOME/.ssh/candidate" -E sha256 | awk 'NR == 1 {print $2}')" = 'SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y'
          mv "$HOME/.ssh/candidate" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ayin@"$DEPLOY_HOST" 'cd /home/ayin/htdocs/current && git rev-parse HEAD && node deploy/run-with-env.cjs /home/ayin/env/api.env node --input-type=module' <<'JS'
          import { spawnSync } from 'node:child_process';
          import { readFile,readdir,lstat } from 'node:fs/promises';
          import { join } from 'node:path';
          const expected='a4eaf5ac4cfd12d8a30854b72f70c82cab5e1df8';
          const actual=spawnSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).stdout.trim();
          if(actual!==expected)throw Error('ReleaseMismatch');
          const heartbeat=JSON.parse(await readFile(process.env.MEDIA_WORKER_HEARTBEAT_PATH||'/tmp/ayin-media-worker-heartbeat.json','utf8'));
          const root=process.env.MEDIA_PROCESSING_WORKDIR||'/tmp/ayin-media-processing';
          let entries;
          try{entries=await readdir(root,{withFileTypes:true});}catch(e){if(e.code!=='ENOENT')throw e;entries=[];}
          let files=0,bytes=0,directories=0;
          const queue=[...entries.map(e=>join(root,e.name))];
          for(let i=0;i<queue.length;i++){
           if(i>=1000)throw Error('ScratchInventoryBoundExceeded');
           const stat=await lstat(queue[i]);
           if(stat.isSymbolicLink())throw Error('UnexpectedScratchSymlink');
           if(stat.isDirectory()){directories++;queue.push(...(await readdir(queue[i])).map(n=>join(queue[i],n)));}
           else if(stat.isFile()){files++;bytes+=stat.size;}
          }
          const worker={releaseMatches:heartbeat.releaseSha===expected,status:heartbeat.status,fresh:Date.now()-Date.parse(heartbeat.heartbeatAt)<90000};
          console.log('SAFE_RELEASE_CLEANUP_VERIFY',JSON.stringify({readOnly:true,releaseMatches:true,worker,scratch:{entries:entries.length,directories,files,bytes}}));
          if(!worker.releaseMatches||!worker.fresh)process.exitCode=1;
          JS
