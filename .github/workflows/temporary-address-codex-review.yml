name: Temporary address Codex review

on:
  push:
    branches:
      - feature/brand-monetization-admin-control-center

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brand-monetization-admin-control-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: python scripts/temporary_address_codex_review.py
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm --filter @ayin/db exec prisma validate
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address final Codex review findings"
          git push origin HEAD:feature/brand-monetization-admin-control-center
