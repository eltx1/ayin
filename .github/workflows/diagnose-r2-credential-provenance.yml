name: Verify AYIN R2 credential rotation provenance

on:
  push:
    paths:
      - .github/workflows/diagnose-r2-credential-provenance.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
      AYIN_CLOUDFLARE_API_TOKEN: ${{ secrets.AYIN_CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: fa824163dbb3aa26f9cfae2a799a809a

    steps:
      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read only non-secret credential provenance markers from AYIN server
        id: server
        shell: bash
        run: |
          set -euo pipefail
          data="$(ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          file=/home/ayin/env/api.env
          [[ -f "$file" ]]
          [[ "$(stat -c '%U:%G' "$file")" == "ayin:ayin" ]]
          [[ "$(stat -c '%a' "$file")" == "600" ]]
          set -a
          source "$file"
          set +a
          [[ -n "${R2_ACCESS_KEY_ID:-}" ]]
          [[ -n "${R2_SECRET_ACCESS_KEY:-}" ]]
          [[ "$R2_ACCESS_KEY_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          printf 'env_mtime_epoch=%s\n' "$(stat -c '%Y' "$file")"
          printf 'env_mtime_iso=%s\n' "$(date -u -d @$(stat -c '%Y' "$file") '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'access_key_sha256=%s\n' "$(printf '%s' "$R2_ACCESS_KEY_ID" | sha256sum | awk '{print $1}')"
          REMOTE
          )"
          echo "$data"
          while IFS='=' read -r key value; do
            case "$key" in
              env_mtime_epoch|env_mtime_iso|access_key_sha256)
                echo "$key=$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <<<"$data"

      - name: Attempt Cloudflare token metadata lookup without revealing token id
        shell: bash
        env:
          ACCESS_KEY_HASH: ${{ steps.server.outputs.access_key_sha256 }}
        run: |
          set -euo pipefail
          test -n "$AYIN_CLOUDFLARE_API_TOKEN"
          test -n "$ACCESS_KEY_HASH"

          # Retrieve the access-key id only inside this step, never echo it.
          access_id="$(ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "set -a; source /home/ayin/env/api.env; set +a; printf '%s' \"\$R2_ACCESS_KEY_ID\"")"
          [[ "$access_id" =~ ^[0-9a-fA-F]{32}$ ]]
          [[ "$(printf '%s' "$access_id" | sha256sum | awk '{print $1}')" == "$ACCESS_KEY_HASH" ]]

          api='https://api.cloudflare.com/client/v4'
          auth="Authorization: Bearer $AYIN_CLOUDFLARE_API_TOKEN"
          found=0

          inspect_endpoint() {
            local label="$1" url="$2" out status
            out="$(mktemp)"
            status="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' --header "$auth" "$url" || true)"
            if [[ "$status" == "200" ]] && jq -e '.success == true and .result != null' "$out" >/dev/null 2>&1; then
              found=1
              name="$(jq -r '.result.name // "unknown"' "$out")"
              token_status="$(jq -r '.result.status // "unknown"' "$out")"
              issued="$(jq -r '.result.issued_on // "unknown"' "$out")"
              modified="$(jq -r '.result.modified_on // "unknown"' "$out")"
              echo "Cloudflare metadata source: $label"
              echo "R2 parent token name: $name"
              echo "R2 parent token status: $token_status"
              echo "R2 parent token issued_on: $issued"
              echo "R2 parent token modified_on: $modified"
              jq -r '.result.policies[]?.permission_groups[]?.name // empty' "$out" | sort -u | sed 's/^/permission: /'
              if jq -e '.result.policies[]?.resources | keys[]? | contains("com.cloudflare.edge.r2.bucket")' "$out" >/dev/null 2>&1; then
                echo "R2-scoped resource policy detected: yes"
              fi
            else
              echo "Cloudflare metadata lookup at $label unavailable (HTTP $status); no secret or token id printed."
            fi
            rm -f "$out"
          }

          inspect_endpoint user "$api/user/tokens/$access_id"
          if [[ "$found" != "1" ]]; then
            inspect_endpoint account "$api/accounts/$ACCOUNT_ID/tokens/$access_id"
          fi

          if [[ "$found" == "1" ]]; then
            echo "PASS: active server R2 Access Key maps to retrievable Cloudflare token metadata"
          else
            echo "INFO: management token lacks token-metadata read access; server mtime and live S3 authentication remain the available provenance signals"
          fi
