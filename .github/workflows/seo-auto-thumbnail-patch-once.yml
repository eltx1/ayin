name: SEO automatic thumbnail patch

on:
  push:
    branches:
      - feat/seo-auto-thumbnails-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/seo-auto-thumbnails-hardening
      - name: Patch media executor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/media/media-processing-executor.service.ts")
          text = path.read_text()

          old_import = 'import { MediaProcessingLifecycleService } from "./media-processing-lifecycle.service.js";\n'
          new_import = (
              'import { MediaAutoThumbnailService } from "./media-auto-thumbnail.service.js";\n'
              + old_import
          )
          if old_import not in text:
              raise SystemExit("executor lifecycle import anchor not found")
          text = text.replace(old_import, new_import, 1)

          old_constructor = '''    @Inject(MediaProcessingStorageService) private readonly storage: MediaProcessingStorageService,\n    @Inject(PlatformSettingsService) private readonly settings: PlatformSettingsService,\n'''
          new_constructor = '''    @Inject(MediaProcessingStorageService) private readonly storage: MediaProcessingStorageService,\n    @Inject(MediaAutoThumbnailService) private readonly thumbnails: MediaAutoThumbnailService,\n    @Inject(PlatformSettingsService) private readonly settings: PlatformSettingsService,\n'''
          if old_constructor not in text:
              raise SystemExit("executor constructor anchor not found")
          text = text.replace(old_constructor, new_constructor, 1)

          old_stage = '''      if (!isVerifiedCanonical(verified)) {\n        throw new Error("The canonical R2 object failed size or content-type verification.");\n      }\n\n      if (\n'''
          new_stage = '''      if (!isVerifiedCanonical(verified)) {\n        throw new Error("The canonical R2 object failed size or content-type verification.");\n      }\n\n      await this.requireOwnedStage(\n        job.id,\n        workerId,\n        "VERIFYING",\n        "GENERATING_AUTO_THUMBNAIL",\n        94,\n      );\n      try {\n        const thumbnail = await this.thumbnails.ensureForCanonical({\n          videoId: job.videoId,\n          canonicalPath: outputPath,\n          durationMs: canonicalMetadata.durationMs,\n        });\n        if (thumbnail.created) {\n          this.logger.log(`Generated automatic thumbnail for video ${job.videoId}.`);\n        }\n      } catch (error) {\n        this.logger.warn(\n          `Automatic thumbnail generation skipped for video ${job.videoId}: ${errorMessage(error)}`,\n        );\n      }\n\n      if (\n'''
          if old_stage not in text:
              raise SystemExit("executor verification anchor not found")
          text = text.replace(old_stage, new_stage, 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/seo-auto-thumbnail-patch-once.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/media/media-processing-executor.service.ts .github/workflows/seo-auto-thumbnail-patch-once.yml
          git commit -m "Connect automatic thumbnails to media processing"
          git push origin HEAD:feat/seo-auto-thumbnails-hardening
