name: Task 07 formatter

on:
  push:
    branches:
      - task-07-quick-upload-publishing

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-07-quick-upload-publishing
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 07 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/app.module.ts
          apps/api/src/creator
          apps/api/test/quick-upload.integration.test.ts
          apps/web/src/lib/direct-video-upload.ts
          apps/web/src/lib/quick-upload.ts
          apps/web/src/lib/title-from-filename.ts
          apps/web/src/lib/title-from-filename.test.ts
          apps/web/src/lib/local-thumbnail.ts
          apps/web/src/components/upload/quick-upload.tsx
          apps/web/src/components/upload/quick-upload.module.css
          'apps/web/src/app/(viewer)/upload/page.tsx'
          apps/web/src/components/viewer/viewer-shell.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.module.ts apps/api/src/creator apps/api/test/quick-upload.integration.test.ts apps/web/src/lib/direct-video-upload.ts apps/web/src/lib/quick-upload.ts apps/web/src/lib/title-from-filename.ts apps/web/src/lib/title-from-filename.test.ts apps/web/src/lib/local-thumbnail.ts apps/web/src/components/upload/quick-upload.tsx apps/web/src/components/upload/quick-upload.module.css 'apps/web/src/app/(viewer)/upload/page.tsx' apps/web/src/components/viewer/viewer-shell.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format Task 07 implementation"
            git push origin HEAD:task-07-quick-upload-publishing
          fi
