name: Task 64 format probe

on:
  push:
    branches:
      - task-64-search-v2
    paths:
      - .github/workflows/task64-format-probe.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-64-search-v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 64 files and remove probe
        run: |
          pnpm exec prettier --write \
            apps/api/src/search/search-postgres.service.ts \
            apps/api/src/search/search.controller.ts \
            apps/api/src/search/search.service.test.ts \
            apps/api/src/search/search.service.ts
          rm .github/workflows/task64-format-probe.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/search/search-postgres.service.ts apps/api/src/search/search.controller.ts apps/api/src/search/search.service.test.ts apps/api/src/search/search.service.ts .github/workflows/task64-format-probe.yml
          git commit -m "Format Task 64 search files"
          git push origin HEAD:task-64-search-v2
