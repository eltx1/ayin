name: Fast URI remediation evidence

on:
  push:
    branches:
      - web-pwa-phase-3-information-architecture
    paths:
      - .github/workflows/fast-uri-remediation-evidence.yml
      - apps/api/src/runtime-uri-security.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable the repository-pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Prepare only the reviewed fast-uri patch versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fast-uri-review"
          git rev-parse HEAD > "$RUNNER_TEMP/fast-uri-review/source-sha.txt"
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'pnpm-workspace.yaml';
          const source = fs.readFileSync(path, 'utf8');
          const anchor = '  mysql2: 3.22.0\n';
          if (source.split(anchor).length !== 2) throw new Error('Review changed override baseline');
          if (source.includes('fast-uri')) throw new Error('Review existing fast-uri configuration');
          fs.writeFileSync(path, source.replace(anchor, anchor +
            '  "fast-uri@>=3.0.0 <3.1.8": 3.1.8\n' +
            '  "fast-uri@>=4.0.0 <4.1.5": 4.1.5\n'));
          NODE
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm view fast-uri@3.1.8 dist --json > "$RUNNER_TEMP/fast-uri-review/registry-3.1.8.json"
          pnpm view fast-uri@4.1.5 dist --json > "$RUNNER_TEMP/fast-uri-review/registry-4.1.5.json"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit:prod
          pnpm --filter @ayin/api exec vitest run src/runtime-uri-security.test.ts | tee "$RUNNER_TEMP/fast-uri-review/regression-results.txt"
          pnpm why fast-uri --recursive > "$RUNNER_TEMP/fast-uri-review/dependency-paths.txt"
          git diff --check
          git diff -- pnpm-workspace.yaml pnpm-lock.yaml > "$RUNNER_TEMP/fast-uri-review/remediation.patch"
          cp pnpm-workspace.yaml pnpm-lock.yaml "$RUNNER_TEMP/fast-uri-review/"
          cd "$RUNNER_TEMP/fast-uri-review"
          sha256sum pnpm-workspace.yaml pnpm-lock.yaml remediation.patch > SHA256SUMS
      - name: Preserve review inputs without committing or deploying
        uses: actions/upload-artifact@v4
        with:
          name: fast-uri-remediation-evidence
          path: ${{ runner.temp }}/fast-uri-review
          if-no-files-found: error
          retention-days: 7
