name: Task32 apply Community

on:
  push:
    branches: [task-32-community-posts]
    paths: [.github/workflows/task32-apply.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-32-community-posts
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/db/prisma/schema.prisma')
          s = p.read_text()
          s = s.replace('enum CommentStatus {\n  PUBLISHED\n  HIDDEN\n  REMOVED\n}\n', '''enum CommentStatus {\n  PUBLISHED\n  HIDDEN\n  REMOVED\n}\n\nenum CommunityPostType {\n  TEXT\n  IMAGE\n  POLL\n  VIDEO_SHARE\n}\n\nenum CommunityPostStatus {\n  DRAFT\n  SCHEDULED\n  PUBLISHED\n  HIDDEN\n  REMOVED\n}\n''')
          s = s.replace('  CREATIVE\n}', '  CREATIVE\n  COMMUNITY_IMAGE\n}')
          s = s.replace('  contentSeedBatches      ContentSeedBatch[]\n', '  contentSeedBatches      ContentSeedBatch[]\n  communityPosts          CommunityPost[]\n')
          s = s.replace('  adEvents        AdEvent[]\n', '  adEvents        AdEvent[]\n  communityReactions CommunityPostReaction[]\n  communityComments CommunityPostComment[]\n  communityPollVotes CommunityPollVote[]\n  communityReports CommunityPostReport[]\n')
          s = s.replace('  contentSeedBatches ContentSeedBatch[]\n', '  contentSeedBatches ContentSeedBatch[]\n  communityPosts     CommunityPost[]\n')
          s = s.replace('  contentSeedItem    ContentSeedItem?\n', '  contentSeedItem    ContentSeedItem?\n  communityShares    CommunityPost[] @relation("CommunitySharedVideo")\n')
          s = s.replace('  creatives Creative[]\n', '  creatives     Creative[]\n  communityPost CommunityPost? @relation("CommunityImageAsset")\n')
          if 'model CommunityPost {' not in s:
              s += '''\n\nmodel CommunityPost {\n  id                 String              @id @default(uuid()) @db.Uuid\n  channelId          String              @db.Uuid\n  authorAccountId    String              @db.Uuid\n  type               CommunityPostType\n  status             CommunityPostStatus @default(DRAFT)\n  body               String?             @db.Text\n  imageAssetId       String?             @unique @db.Uuid\n  sharedVideoId      String?             @db.Uuid\n  scheduledPublishAt DateTime?\n  publishedAt        DateTime?\n  notifiedAt         DateTime?\n  createdAt          DateTime            @default(now())\n  updatedAt          DateTime            @updatedAt\n  removedAt          DateTime?\n\n  channel       Channel                @relation(fields: [channelId], references: [id], onDelete: Cascade)\n  author        Account                @relation(fields: [authorAccountId], references: [id], onDelete: Restrict)\n  imageAsset    MediaAsset?            @relation("CommunityImageAsset", fields: [imageAssetId], references: [id], onDelete: SetNull)\n  sharedVideo   Video?                 @relation("CommunitySharedVideo", fields: [sharedVideoId], references: [id], onDelete: SetNull)\n  pollOptions   CommunityPollOption[]\n  pollVotes     CommunityPollVote[]\n  reactions     CommunityPostReaction[]\n  comments      CommunityPostComment[]\n  reports       CommunityPostReport[]\n\n  @@index([channelId, status, publishedAt])\n  @@index([status, scheduledPublishAt])\n  @@index([authorAccountId, createdAt])\n}\n\nmodel CommunityPollOption {\n  id        String   @id @default(uuid()) @db.Uuid\n  postId    String   @db.Uuid\n  label     String   @db.VarChar(160)\n  position  Int\n  createdAt DateTime @default(now())\n\n  post  CommunityPost       @relation(fields: [postId], references: [id], onDelete: Cascade)\n  votes CommunityPollVote[]\n\n  @@unique([postId, position])\n}\n\nmodel CommunityPollVote {\n  id        String   @id @default(uuid()) @db.Uuid\n  postId    String   @db.Uuid\n  optionId  String   @db.Uuid\n  profileId String   @db.Uuid\n  createdAt DateTime @default(now())\n  updatedAt DateTime @updatedAt\n\n  post    CommunityPost       @relation(fields: [postId], references: [id], onDelete: Cascade)\n  option  CommunityPollOption @relation(fields: [optionId], references: [id], onDelete: Cascade)\n  profile ViewerProfile       @relation(fields: [profileId], references: [id], onDelete: Cascade)\n\n  @@unique([postId, profileId])\n  @@index([optionId])\n}\n\nmodel CommunityPostReaction {\n  id        String       @id @default(uuid()) @db.Uuid\n  postId    String       @db.Uuid\n  profileId String       @db.Uuid\n  type      ReactionType @default(LIKE)\n  createdAt DateTime     @default(now())\n  updatedAt DateTime     @updatedAt\n\n  post    CommunityPost @relation(fields: [postId], references: [id], onDelete: Cascade)\n  profile ViewerProfile @relation(fields: [profileId], references: [id], onDelete: Cascade)\n\n  @@unique([postId, profileId])\n  @@index([postId, type])\n}\n\nmodel CommunityPostComment {\n  id              String        @id @default(uuid()) @db.Uuid\n  postId          String        @db.Uuid\n  authorProfileId String        @db.Uuid\n  parentId        String?       @db.Uuid\n  body            String        @db.Text\n  status          CommentStatus @default(PUBLISHED)\n  createdAt       DateTime      @default(now())\n  updatedAt       DateTime      @updatedAt\n  removedAt       DateTime?\n\n  post          CommunityPost          @relation(fields: [postId], references: [id], onDelete: Cascade)\n  authorProfile ViewerProfile          @relation(fields: [authorProfileId], references: [id], onDelete: Cascade)\n  parent        CommunityPostComment?  @relation("CommunityCommentThread", fields: [parentId], references: [id], onDelete: SetNull)\n  replies       CommunityPostComment[] @relation("CommunityCommentThread")\n\n  @@index([postId, status, createdAt])\n  @@index([parentId, createdAt])\n}\n\nmodel CommunityPostReport {\n  id                String       @id @default(uuid()) @db.Uuid\n  postId            String       @db.Uuid\n  reporterProfileId String       @db.Uuid\n  reason            ReportReason\n  details           String?      @db.Text\n  status            ReportStatus @default(OPEN)\n  createdAt         DateTime     @default(now())\n  updatedAt         DateTime     @updatedAt\n  resolvedAt        DateTime?\n\n  post            CommunityPost @relation(fields: [postId], references: [id], onDelete: Cascade)\n  reporterProfile ViewerProfile @relation(fields: [reporterProfileId], references: [id], onDelete: Cascade)\n\n  @@index([status, createdAt])\n  @@index([postId, status])\n}\n'''
          p.write_text(s)

          p = Path('apps/api/src/app.module.ts')
          s = p.read_text().replace('import { CommentsModule } from "./comments/comments.module.js";\n', 'import { CommentsModule } from "./comments/comments.module.js";\nimport { CommunityModule } from "./community/community.module.js";\n')
          s = s.replace('    CommentsModule,\n', '    CommentsModule,\n    CommunityModule,\n')
          p.write_text(s)

          p = Path('apps/api/src/platform-config/platform-settings.catalog.ts')
          s = p.read_text()
          marker = '  clipsEnabled: {'
          insert = '''  communityPostsEnabled: {\n    namespace: "DISCOVERY",\n    key: "communityPostsEnabled",\n    valueType: "BOOLEAN",\n    defaultValue: true,\n    schema: z.boolean(),\n    section: "watching",\n    label: "Community posts enabled",\n    description: "Enable channel community publishing and subscriber community feeds.",\n    control: "toggle",\n    highImpact: true,\n    superadminOnly: false,\n  },\n'''
          s = s.replace(marker, insert + marker)
          p.write_text(s)
          PY

          mkdir -p packages/db/prisma/migrations/20260830175000_community_posts
          cat > packages/db/prisma/migrations/20260830175000_community_posts/migration.sql <<'SQL'
          ALTER TYPE "MediaAssetKind" ADD VALUE 'COMMUNITY_IMAGE';
          CREATE TYPE "CommunityPostType" AS ENUM ('TEXT', 'IMAGE', 'POLL', 'VIDEO_SHARE');
          CREATE TYPE "CommunityPostStatus" AS ENUM ('DRAFT', 'SCHEDULED', 'PUBLISHED', 'HIDDEN', 'REMOVED');
          CREATE TABLE "CommunityPost" ("id" UUID NOT NULL, "channelId" UUID NOT NULL, "authorAccountId" UUID NOT NULL, "type" "CommunityPostType" NOT NULL, "status" "CommunityPostStatus" NOT NULL DEFAULT 'DRAFT', "body" TEXT, "imageAssetId" UUID, "sharedVideoId" UUID, "scheduledPublishAt" TIMESTAMP(3), "publishedAt" TIMESTAMP(3), "notifiedAt" TIMESTAMP(3), "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, "updatedAt" TIMESTAMP(3) NOT NULL, "removedAt" TIMESTAMP(3), CONSTRAINT "CommunityPost_pkey" PRIMARY KEY ("id"));
          CREATE UNIQUE INDEX "CommunityPost_imageAssetId_key" ON "CommunityPost"("imageAssetId");
          CREATE INDEX "CommunityPost_channelId_status_publishedAt_idx" ON "CommunityPost"("channelId", "status", "publishedAt");
          CREATE INDEX "CommunityPost_status_scheduledPublishAt_idx" ON "CommunityPost"("status", "scheduledPublishAt");
          CREATE INDEX "CommunityPost_authorAccountId_createdAt_idx" ON "CommunityPost"("authorAccountId", "createdAt");
          CREATE TABLE "CommunityPollOption" ("id" UUID NOT NULL, "postId" UUID NOT NULL, "label" VARCHAR(160) NOT NULL, "position" INTEGER NOT NULL, "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, CONSTRAINT "CommunityPollOption_pkey" PRIMARY KEY ("id"));
          CREATE UNIQUE INDEX "CommunityPollOption_postId_position_key" ON "CommunityPollOption"("postId", "position");
          CREATE TABLE "CommunityPollVote" ("id" UUID NOT NULL, "postId" UUID NOT NULL, "optionId" UUID NOT NULL, "profileId" UUID NOT NULL, "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, "updatedAt" TIMESTAMP(3) NOT NULL, CONSTRAINT "CommunityPollVote_pkey" PRIMARY KEY ("id"));
          CREATE UNIQUE INDEX "CommunityPollVote_postId_profileId_key" ON "CommunityPollVote"("postId", "profileId"); CREATE INDEX "CommunityPollVote_optionId_idx" ON "CommunityPollVote"("optionId");
          CREATE TABLE "CommunityPostReaction" ("id" UUID NOT NULL, "postId" UUID NOT NULL, "profileId" UUID NOT NULL, "type" "ReactionType" NOT NULL DEFAULT 'LIKE', "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, "updatedAt" TIMESTAMP(3) NOT NULL, CONSTRAINT "CommunityPostReaction_pkey" PRIMARY KEY ("id"));
          CREATE UNIQUE INDEX "CommunityPostReaction_postId_profileId_key" ON "CommunityPostReaction"("postId", "profileId"); CREATE INDEX "CommunityPostReaction_postId_type_idx" ON "CommunityPostReaction"("postId", "type");
          CREATE TABLE "CommunityPostComment" ("id" UUID NOT NULL, "postId" UUID NOT NULL, "authorProfileId" UUID NOT NULL, "parentId" UUID, "body" TEXT NOT NULL, "status" "CommentStatus" NOT NULL DEFAULT 'PUBLISHED', "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, "updatedAt" TIMESTAMP(3) NOT NULL, "removedAt" TIMESTAMP(3), CONSTRAINT "CommunityPostComment_pkey" PRIMARY KEY ("id"));
          CREATE INDEX "CommunityPostComment_postId_status_createdAt_idx" ON "CommunityPostComment"("postId", "status", "createdAt"); CREATE INDEX "CommunityPostComment_parentId_createdAt_idx" ON "CommunityPostComment"("parentId", "createdAt");
          CREATE TABLE "CommunityPostReport" ("id" UUID NOT NULL, "postId" UUID NOT NULL, "reporterProfileId" UUID NOT NULL, "reason" "ReportReason" NOT NULL, "details" TEXT, "status" "ReportStatus" NOT NULL DEFAULT 'OPEN', "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP, "updatedAt" TIMESTAMP(3) NOT NULL, "resolvedAt" TIMESTAMP(3), CONSTRAINT "CommunityPostReport_pkey" PRIMARY KEY ("id"));
          CREATE INDEX "CommunityPostReport_status_createdAt_idx" ON "CommunityPostReport"("status", "createdAt"); CREATE INDEX "CommunityPostReport_postId_status_idx" ON "CommunityPostReport"("postId", "status");
          ALTER TABLE "CommunityPost" ADD CONSTRAINT "CommunityPost_channelId_fkey" FOREIGN KEY ("channelId") REFERENCES "Channel"("id") ON DELETE CASCADE ON UPDATE CASCADE; ALTER TABLE "CommunityPost" ADD CONSTRAINT "CommunityPost_authorAccountId_fkey" FOREIGN KEY ("authorAccountId") REFERENCES "Account"("id") ON DELETE RESTRICT ON UPDATE CASCADE; ALTER TABLE "CommunityPost" ADD CONSTRAINT "CommunityPost_imageAssetId_fkey" FOREIGN KEY ("imageAssetId") REFERENCES "MediaAsset"("id") ON DELETE SET NULL ON UPDATE CASCADE; ALTER TABLE "CommunityPost" ADD CONSTRAINT "CommunityPost_sharedVideoId_fkey" FOREIGN KEY ("sharedVideoId") REFERENCES "Video"("id") ON DELETE SET NULL ON UPDATE CASCADE;
          ALTER TABLE "CommunityPollOption" ADD CONSTRAINT "CommunityPollOption_postId_fkey" FOREIGN KEY ("postId") REFERENCES "CommunityPost"("id") ON DELETE CASCADE ON UPDATE CASCADE; ALTER TABLE "CommunityPollVote" ADD CONSTRAINT "CommunityPollVote_postId_fkey" FOREIGN KEY ("postId") REFERENCES "CommunityPost"("id") ON DELETE CASCADE ON UPDATE CASCADE; ALTER TABLE "CommunityPollVote" ADD CONSTRAINT "CommunityPollVote_optionId_fkey" FOREIGN KEY ("optionId") REFERENCES "CommunityPollOption"("id") ON DELETE CASCADE ON UPDATE CASCADE; ALTER TABLE "CommunityPollVote" ADD CONSTRAINT "CommunityPollVote_profileId_fkey" FOREIGN KEY ("profileId") REFERENCES "ViewerProfile"("id") ON DELETE CASCADE ON UPDATE CASCADE;
          ALTER TABLE "CommunityPostReaction" ADD CONSTRAINT "CommunityPostReaction_postId_fkey" FOREIGN KEY ("postId") REFERENCES "CommunityPost"("id") ON DELETE CASCADE ON UPDATE CASCADE; ALTER TABLE "CommunityPostReaction" ADD CONSTRAINT "CommunityPostReaction_profileId_fkey" FOREIGN KEY ("profileId") REFERENCES "ViewerProfile"("id") ON DELETE CASCADE ON UPDATE CASCADE;
          ALTER TABLE "CommunityPostComment" ADD CONSTRAINT "CommunityPostComment_postId_fkey" FOREIGN KEY ("postId") REFERENCES "CommunityPost"("id") ON DELETE CASCADE ON UPDATE CASCADE; ALTER TABLE "CommunityPostComment" ADD CONSTRAINT "CommunityPostComment_authorProfileId_fkey" FOREIGN KEY ("authorProfileId") REFERENCES "ViewerProfile"("id") ON DELETE CASCADE ON UPDATE CASCADE; ALTER TABLE "CommunityPostComment" ADD CONSTRAINT "CommunityPostComment_parentId_fkey" FOREIGN KEY ("parentId") REFERENCES "CommunityPostComment"("id") ON DELETE SET NULL ON UPDATE CASCADE;
          ALTER TABLE "CommunityPostReport" ADD CONSTRAINT "CommunityPostReport_postId_fkey" FOREIGN KEY ("postId") REFERENCES "CommunityPost"("id") ON DELETE CASCADE ON UPDATE CASCADE; ALTER TABLE "CommunityPostReport" ADD CONSTRAINT "CommunityPostReport_reporterProfileId_fkey" FOREIGN KEY ("reporterProfileId") REFERENCES "ViewerProfile"("id") ON DELETE CASCADE ON UPDATE CASCADE;
          SQL

          mkdir -p apps/api/src/community
          cat > apps/api/src/community/community.schemas.ts <<'TS'
          import { z } from "zod";

          export const communityPostInputSchema = z.object({
            type: z.enum(["TEXT", "IMAGE", "POLL", "VIDEO_SHARE"]),
            body: z.string().trim().max(5000).nullable().optional(),
            sharedVideoId: z.string().uuid().nullable().optional(),
            pollOptions: z.array(z.string().trim().min(1).max(160)).min(2).max(6).optional(),
            scheduledPublishAt: z.string().datetime({ offset: true }).nullable().optional(),
          }).strict();
          export const communityCommentSchema = z.object({ body: z.string().trim().min(1).max(4000), parentId: z.string().uuid().optional() }).strict();
          export const communityReportSchema = z.object({ reason: z.enum(["COPYRIGHT", "SPAM", "HARASSMENT", "HATE", "SEXUAL_CONTENT", "VIOLENCE", "MISLEADING", "OTHER"]), details: z.string().trim().max(2000).nullable().optional() }).strict();
          export type CommunityPostInput = z.infer<typeof communityPostInputSchema>;
          TS

          cat > apps/api/src/community/community.service.ts <<'TS'
          import { randomUUID } from "node:crypto";
          import { Inject, Injectable } from "@nestjs/common";
          import type { Prisma } from "@ayin/db";

          import { DatabaseService } from "../database/database.service.js";
          import { MEDIA_STORAGE_ADAPTER, MEDIA_STORAGE_CONFIG, type MediaStorageAdapter } from "../media/media-storage.adapter.js";
          import type { MediaStorageConfig } from "../media/media-storage.config.js";
          import { PlatformSettingsService } from "../platform-config/platform-settings.service.js";
          import { AdminAuditLogService } from "../admin/admin-audit-log.service.js";
          import type { CommunityPostInput } from "./community.schemas.js";

          export class CommunityError extends Error { constructor(readonly code: string, message: string, readonly statusCode = 400) { super(message); this.name = "CommunityError"; } }

          @Injectable()
          export class CommunityService {
            constructor(
              @Inject(DatabaseService) private readonly database: DatabaseService,
              @Inject(PlatformSettingsService) private readonly settings: PlatformSettingsService,
              @Inject(MEDIA_STORAGE_ADAPTER) private readonly storage: MediaStorageAdapter,
              @Inject(MEDIA_STORAGE_CONFIG) private readonly storageConfig: MediaStorageConfig,
              @Inject(AdminAuditLogService) private readonly audit: AdminAuditLogService,
            ) {}

            async creatorPosts(accountId: string) {
              const channel = await this.creatorChannel(accountId);
              return this.database.client.communityPost.findMany({ where: { channelId: channel.id, status: { not: "REMOVED" } }, orderBy: { createdAt: "desc" }, include: this.include() });
            }

            async create(accountId: string, input: CommunityPostInput) {
              await this.ensureEnabled();
              const channel = await this.creatorChannel(accountId);
              await this.validateInput(input);
              const status = input.scheduledPublishAt ? "SCHEDULED" : "DRAFT";
              return this.database.client.communityPost.create({
                data: {
                  channelId: channel.id, authorAccountId: accountId, type: input.type, status,
                  body: input.body ?? null, sharedVideoId: input.sharedVideoId ?? null,
                  scheduledPublishAt: input.scheduledPublishAt ? new Date(input.scheduledPublishAt) : null,
                  ...(input.type === "POLL" && input.pollOptions ? { pollOptions: { create: input.pollOptions.map((label, position) => ({ label, position })) } } : {}),
                }, include: this.include(),
              });
            }

            async update(accountId: string, postId: string, input: CommunityPostInput) {
              const post = await this.ownedPost(accountId, postId);
              if (post.status === "PUBLISHED") throw new CommunityError("POST_ALREADY_PUBLISHED", "Published posts cannot change type or poll structure.", 409);
              await this.validateInput(input);
              return this.database.client.$transaction(async (tx) => {
                if (post.type === "POLL" || input.type === "POLL") await tx.communityPollOption.deleteMany({ where: { postId } });
                return tx.communityPost.update({
                  where: { id: postId }, data: {
                    type: input.type, body: input.body ?? null, sharedVideoId: input.sharedVideoId ?? null,
                    scheduledPublishAt: input.scheduledPublishAt ? new Date(input.scheduledPublishAt) : null,
                    status: input.scheduledPublishAt ? "SCHEDULED" : "DRAFT",
                    ...(input.type === "POLL" && input.pollOptions ? { pollOptions: { create: input.pollOptions.map((label, position) => ({ label, position })) } } : {}),
                  }, include: this.include(),
                });
              });
            }

            async publish(accountId: string, postId: string) {
              const post = await this.ownedPost(accountId, postId);
              await this.assertPublishable(post);
              return this.database.client.$transaction(async (tx) => {
                const published = await tx.communityPost.update({ where: { id: postId }, data: { status: "PUBLISHED", publishedAt: new Date(), scheduledPublishAt: null }, include: this.include() });
                if (!post.notifiedAt) {
                  const subscribers = await tx.subscription.findMany({ where: { channelId: post.channelId }, select: { profile: { select: { accountId: true } } } });
                  const accountIds = [...new Set(subscribers.map((item) => item.profile.accountId))];
                  if (accountIds.length) await tx.notification.createMany({ data: accountIds.map((targetAccountId) => ({ accountId: targetAccountId, type: "CHANNEL" as const, title: `${post.channel.name} posted`, body: post.body?.slice(0, 180) ?? "New community post", data: { channelId: post.channelId, communityPostId: post.id } })) });
                  await tx.communityPost.update({ where: { id: postId }, data: { notifiedAt: new Date() } });
                }
                return published;
              });
            }

            async remove(accountId: string, postId: string) {
              await this.ownedPost(accountId, postId);
              await this.database.client.communityPost.update({ where: { id: postId }, data: { status: "REMOVED", removedAt: new Date() } });
              return { id: postId, status: "REMOVED" as const };
            }

            async authorizeImage(accountId: string, postId: string, input: { mimeType: string; sizeBytes: number }) {
              const post = await this.ownedPost(accountId, postId);
              if (post.type !== "IMAGE") throw new CommunityError("IMAGE_POST_REQUIRED", "Only image posts accept an image upload.");
              if (!this.storage.available) throw new CommunityError("MEDIA_STORAGE_UNAVAILABLE", "Community image uploads require configured media storage.", 503);
              if (!(["image/jpeg", "image/png", "image/webp"] as string[]).includes(input.mimeType) || input.sizeBytes < 1 || input.sizeBytes > 10 * 1024 * 1024) throw new CommunityError("INVALID_COMMUNITY_IMAGE", "Use a JPG, PNG or WebP image up to 10 MB.");
              const assetId = randomUUID(); const key = `channels/${post.channelId}/community/${post.id}/${assetId}`;
              await this.database.client.mediaAsset.create({ data: { id: assetId, channelId: post.channelId, kind: "COMMUNITY_IMAGE", status: "PENDING", r2ObjectKey: key, mimeType: input.mimeType, sizeBytes: BigInt(input.sizeBytes) } });
              await this.database.client.communityPost.update({ where: { id: postId }, data: { imageAssetId: assetId } });
              const authorization = await this.storage.authorizeSinglePut({ key, contentType: input.mimeType, expiresInSeconds: this.storageConfig.uploadUrlTtlSeconds });
              return { assetId, upload: { url: authorization.url, method: "PUT" as const, headers: { "content-type": input.mimeType } }, expiresAt: authorization.expiresAt.toISOString() };
            }

            async completeImage(accountId: string, postId: string, assetId: string) {
              const post = await this.ownedPost(accountId, postId);
              if (post.imageAssetId !== assetId) throw new CommunityError("IMAGE_ASSET_MISMATCH", "This image does not belong to the post.");
              const asset = await this.database.client.mediaAsset.findUniqueOrThrow({ where: { id: assetId } });
              const head = await this.storage.headObject(asset.r2ObjectKey);
              if (head.sizeBytes < 1 || head.sizeBytes > 10 * 1024 * 1024 || head.contentType !== asset.mimeType) throw new CommunityError("INVALID_STORED_IMAGE", "The stored image did not match the authorized upload.");
              await this.database.client.mediaAsset.update({ where: { id: assetId }, data: { status: "VALIDATED", sizeBytes: BigInt(head.sizeBytes) } });
              return { assetId, status: "VALIDATED" as const };
            }

            async channelPosts(handle: string, take = 30) {
              await this.ensureEnabled();
              const channel = await this.database.client.channel.findFirst({ where: { handle, status: "ACTIVE", removedAt: null }, select: { id: true, handle: true, name: true } });
              if (!channel) throw new CommunityError("CHANNEL_NOT_FOUND", "This channel is not available.", 404);
              const items = await this.visiblePosts({ channelId: channel.id }, take);
              return { channel, items };
            }

            async subscriberFeed(accountId: string, take = 50) {
              await this.ensureEnabled(); const profile = await this.profile(accountId);
              const subscriptions = await this.database.client.subscription.findMany({ where: { profileId: profile.id }, select: { channelId: true } });
              return { items: await this.visiblePosts({ channelId: { in: subscriptions.map((item) => item.channelId) } }, take) };
            }

            async react(accountId: string, postId: string, liked: boolean) {
              const profile = await this.profile(accountId); await this.publicPost(postId);
              if (liked) await this.database.client.communityPostReaction.upsert({ where: { postId_profileId: { postId, profileId: profile.id } }, create: { postId, profileId: profile.id, type: "LIKE" }, update: { type: "LIKE" } });
              else await this.database.client.communityPostReaction.deleteMany({ where: { postId, profileId: profile.id } });
              return { postId, liked, likeCount: await this.database.client.communityPostReaction.count({ where: { postId, type: "LIKE" } }) };
            }

            async vote(accountId: string, postId: string, optionId: string) {
              const profile = await this.profile(accountId); const post = await this.publicPost(postId);
              if (post.type !== "POLL" || !post.pollOptions.some((option) => option.id === optionId)) throw new CommunityError("INVALID_POLL_OPTION", "That poll option is not available.");
              await this.database.client.communityPollVote.upsert({ where: { postId_profileId: { postId, profileId: profile.id } }, create: { postId, optionId, profileId: profile.id }, update: { optionId } });
              return this.publicPost(postId);
            }

            async comment(accountId: string, postId: string, body: string, parentId?: string) {
              const profile = await this.profile(accountId); await this.publicPost(postId);
              if (parentId) { const parent = await this.database.client.communityPostComment.findFirst({ where: { id: parentId, postId, status: "PUBLISHED" }, select: { id: true } }); if (!parent) throw new CommunityError("COMMENT_PARENT_NOT_FOUND", "The parent comment is unavailable."); }
              return this.database.client.communityPostComment.create({ data: { postId, authorProfileId: profile.id, body, ...(parentId ? { parentId } : {}) }, select: { id: true, body: true, createdAt: true } });
            }

            async report(accountId: string, postId: string, input: { reason: string; details?: string | null | undefined }) {
              const profile = await this.profile(accountId); await this.publicPost(postId);
              const report = await this.database.client.communityPostReport.create({ data: { postId, reporterProfileId: profile.id, reason: input.reason as never, details: input.details ?? null } });
              return { id: report.id, status: report.status };
            }

            async adminQueue() { return this.database.client.communityPostReport.findMany({ where: { status: { in: ["OPEN", "REVIEWING"] } }, orderBy: { createdAt: "asc" }, include: { post: { include: { channel: { select: { id: true, name: true, handle: true } } } }, reporterProfile: { select: { id: true, name: true } } } }); }
            async adminModerate(actorAccountId: string, postId: string, action: "HIDE" | "REMOVE" | "RESTORE", reason: string) {
              const status = action === "HIDE" ? "HIDDEN" : action === "REMOVE" ? "REMOVED" : "PUBLISHED";
              return this.database.client.$transaction(async (tx) => { const post = await tx.communityPost.update({ where: { id: postId }, data: { status, ...(status === "REMOVED" ? { removedAt: new Date() } : { removedAt: null }) } }); await tx.communityPostReport.updateMany({ where: { postId, status: { in: ["OPEN", "REVIEWING"] } }, data: { status: "RESOLVED", resolvedAt: new Date() } }); await this.audit.recordInTransaction(tx, { actorAccountId, action: `COMMUNITY_POST_${action}`, entityType: "CommunityPost", entityId: postId, reason }); return post; });
            }

            private include(): Prisma.CommunityPostInclude { return { channel: { select: { id: true, handle: true, name: true } }, imageAsset: { select: { id: true, r2ObjectKey: true, status: true } }, sharedVideo: { select: { id: true, slug: true, title: true } }, pollOptions: { orderBy: { position: "asc" }, include: { _count: { select: { votes: true } } } }, _count: { select: { reactions: true, comments: true, reports: true } } }; }
            private async visiblePosts(where: Prisma.CommunityPostWhereInput, take: number) { const now = new Date(); return this.database.client.communityPost.findMany({ where: { ...where, removedAt: null, OR: [{ status: "PUBLISHED", publishedAt: { lte: now } }, { status: "SCHEDULED", scheduledPublishAt: { lte: now } }] }, orderBy: [{ publishedAt: "desc" }, { scheduledPublishAt: "desc" }, { createdAt: "desc" }], take: Math.min(Math.max(take, 1), 100), include: this.include() }); }
            private async creatorChannel(accountId: string) { const membership = await this.database.client.channelMember.findFirst({ where: { accountId, role: { in: ["OWNER", "ADMIN", "EDITOR"] }, channel: { status: "ACTIVE", removedAt: null } }, select: { channel: { select: { id: true, name: true } } } }); if (!membership) throw new CommunityError("CREATOR_CHANNEL_REQUIRED", "An active creator channel is required.", 403); return membership.channel; }
            private async ownedPost(accountId: string, postId: string) { const post = await this.database.client.communityPost.findFirst({ where: { id: postId, channel: { members: { some: { accountId, role: { in: ["OWNER", "ADMIN", "EDITOR"] } } } }, status: { not: "REMOVED" } }, include: { channel: { select: { id: true, name: true } }, imageAsset: true, pollOptions: true } }); if (!post) throw new CommunityError("POST_NOT_FOUND", "This community post is unavailable.", 404); return post; }
            private async profile(accountId: string) { const profile = await this.database.client.viewerProfile.findFirst({ where: { accountId, isDefault: true, deletedAt: null }, select: { id: true } }); if (!profile) throw new CommunityError("PROFILE_REQUIRED", "A viewer profile is required.", 403); return profile; }
            private async publicPost(postId: string) { const now = new Date(); const post = await this.database.client.communityPost.findFirst({ where: { id: postId, removedAt: null, channel: { status: "ACTIVE", removedAt: null }, OR: [{ status: "PUBLISHED", publishedAt: { lte: now } }, { status: "SCHEDULED", scheduledPublishAt: { lte: now } }] }, include: { pollOptions: true } }); if (!post) throw new CommunityError("POST_NOT_FOUND", "This community post is unavailable.", 404); return post; }
            private async ensureEnabled() { if (!((await this.settings.get("communityPostsEnabled")) as boolean)) throw new CommunityError("COMMUNITY_DISABLED", "Community posts are currently disabled.", 404); }
            private async validateInput(input: CommunityPostInput) { if (input.type === "POLL" && (!input.pollOptions || input.pollOptions.length < 2)) throw new CommunityError("POLL_OPTIONS_REQUIRED", "Polls require at least two options."); if (input.type === "VIDEO_SHARE") { if (!input.sharedVideoId) throw new CommunityError("SHARED_VIDEO_REQUIRED", "Choose a published video to share."); const video = await this.database.client.video.findFirst({ where: { id: input.sharedVideoId, status: "PUBLISHED", visibility: { in: ["PUBLIC", "UNLISTED"] }, removedAt: null }, select: { id: true } }); if (!video) throw new CommunityError("SHARED_VIDEO_NOT_FOUND", "The shared video is unavailable."); } if ((input.type === "TEXT" || input.type === "IMAGE") && !input.body?.trim()) throw new CommunityError("POST_BODY_REQUIRED", "Add text to the community post."); }
            private async assertPublishable(post: Awaited<ReturnType<CommunityService["ownedPost"]>>) { if (post.type === "IMAGE" && post.imageAsset?.status !== "VALIDATED") throw new CommunityError("COMMUNITY_IMAGE_REQUIRED", "Upload and validate the image before publishing."); if (post.type === "POLL" && post.pollOptions.length < 2) throw new CommunityError("POLL_OPTIONS_REQUIRED", "Polls require at least two options."); }
          }
          TS

