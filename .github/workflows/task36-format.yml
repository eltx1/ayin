name: Task36 format
on:
  push:
    branches: [task-36-gam-production]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-36-gam-production
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/ads/ads.module.ts apps/api/src/ads/gam-production.config.ts apps/api/src/ads/gam-production.service.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/ads/ads.module.ts apps/api/src/ads/gam-production.config.ts apps/api/src/ads/gam-production.service.ts
          git diff --cached --quiet || git commit -m "Format Task 36 GAM files"
          git push origin HEAD:task-36-gam-production
