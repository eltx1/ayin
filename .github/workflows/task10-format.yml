name: Task 10 format

on:
  push:
    branches:
      - task-10-creator-tv-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-10-creator-tv-v1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Add TV watch entry and format Task 10
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('apps/web/src/app/(viewer)/c/[handle]/page.tsx')
          text = page.read_text()
          old = '          <span className={styles.status}>{formatTvStatus(data.creatorTv.status)}</span>'
          new = '''          <Link className={styles.status} href={`/c/${data.channel.handle}/tv`}>\n            Watch · {formatTvStatus(data.creatorTv.status)}\n          </Link>'''
          if old not in text:
              raise SystemExit('Creator TV status entry not found')
          page.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            'apps/api/src/creator/creator-tv-ad-break.hook.ts' \
            'apps/api/src/creator/creator-tv.controller.ts' \
            'apps/api/src/creator/creator-tv.scheduler.ts' \
            'apps/api/src/creator/creator-tv.scheduler.test.ts' \
            'apps/api/src/creator/creator-tv.service.ts' \
            'apps/api/src/creator/creator.module.ts' \
            'apps/api/src/platform-config/platform-settings.catalog.ts' \
            'apps/api/test/creator-tv.integration.test.ts' \
            'apps/web/src/app/(viewer)/c/[handle]/page.tsx' \
            'apps/web/src/app/(viewer)/c/[handle]/tv/page.tsx' \
            'apps/web/src/app/(viewer)/channel/tv/page.tsx' \
            'apps/web/src/components/channel/owner-channel-actions.tsx' \
            'apps/web/src/components/creator-tv/creator-tv-player.tsx' \
            'apps/web/src/components/creator-tv/creator-tv-manager.tsx' \
            'apps/web/src/components/creator-tv/creator-tv.module.css' \
            'apps/web/src/lib/creator-tv.ts' \
            'docs/TASK10_CREATOR_TV.md' \
            'packages/db/prisma/creator-tv.prisma' \
            'packages/db/prisma/schema.prisma' \
            'packages/db/src/creator-tv.test.mjs'
      - name: Commit formatted Task 10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web docs packages/db
          git commit -m "Format Task 10 Creator TV implementation"
          git push origin HEAD:task-10-creator-tv-v1
