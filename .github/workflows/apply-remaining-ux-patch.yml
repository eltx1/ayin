name: Apply remaining upload and player behavior updates

on:
  push:
    branches:
      - fix/upload-reliability-publish-player

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/upload-reliability-publish-player
      - name: Apply application patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/ayin-ux-patch.py
          python /tmp/ayin-ux-patch.py
      - name: Install formatter
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Format touched files
        run: pnpm exec prettier --write apps/web/src/lib/direct-video-upload.ts apps/web/src/components/upload/quick-upload.tsx apps/web/src/components/upload/quick-upload.module.css apps/web/src/components/player/ayin-player.tsx apps/web/src/components/player/ayin-player.module.css apps/web/src/components/player/ad-enabled-ayin-player.tsx apps/web/src/components/player/ad-enabled-ayin-player.module.css apps/web/src/app/'(viewer)'/watch/'[slug]'/page.tsx apps/web/src/app/'(viewer)'/watch/'[slug]'/page.module.css
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-remaining-ux-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve upload completion and player experience"
          git push origin HEAD:fix/upload-reliability-publish-player
