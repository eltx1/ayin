name: One-shot format video inspection

on:
  push:
    paths:
      - ".github/workflows/one-shot-format-video-inspection.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix-media-runtime-formats-20260905
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/lib/video-inspection.ts
      - run: |
          rm -f .github/workflows/one-shot-format-video-inspection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format video inspection helper"
          git push origin HEAD:hotfix-media-runtime-formats-20260905
