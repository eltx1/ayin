name: Task 33 apply
on:
  push:
    branches: [task-33-recommendations-lens]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-33-recommendations-lens
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Apply integration edits
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          schema = Path('packages/db/prisma/schema.prisma')
          text = schema.read_text()
          enum_block = '''enum RecommendationFeedbackType {
            NOT_INTERESTED
            DISMISSED
          }

          '''
          if 'enum RecommendationFeedbackType' not in text:
              text = text.replace('model Account {', enum_block + 'model Account {', 1)
          if 'recommendationFeedback RecommendationFeedback[]' not in text:
              text = text.replace(
                  '  communityReports   CommunityPostReport[]\n',
                  '  communityReports   CommunityPostReport[]\n  recommendationFeedback RecommendationFeedback[]\n  recommendationState RecommendationProfileState?\n',
                  1,
              )
          if 'recommendationFeedback RecommendationFeedback[]' not in text.split('model Video {', 1)[1]:
              text = text.replace(
                  '  communityShares    CommunityPost[]            @relation("CommunitySharedVideo")\n',
                  '  communityShares    CommunityPost[]            @relation("CommunitySharedVideo")\n  recommendationFeedback RecommendationFeedback[]\n',
                  1,
              )
          models = '''model RecommendationProfileState {
            profileId String @id @db.Uuid
            resetAt   DateTime?
            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            profile ViewerProfile @relation(fields: [profileId], references: [id], onDelete: Cascade)
          }

          model RecommendationFeedback {
            id        String                     @id @default(uuid()) @db.Uuid
            profileId String                     @db.Uuid
            videoId   String                     @db.Uuid
            type      RecommendationFeedbackType
            createdAt DateTime                   @default(now())
            updatedAt DateTime                   @updatedAt

            profile ViewerProfile @relation(fields: [profileId], references: [id], onDelete: Cascade)
            video   Video         @relation(fields: [videoId], references: [id], onDelete: Cascade)

            @@unique([profileId, videoId])
            @@index([profileId, type, createdAt])
            @@index([videoId, type])
          }

          '''
          if 'model RecommendationFeedback {' not in text:
              text = text.replace('model PlatformSetting {', models + 'model PlatformSetting {', 1)
          schema.write_text(text)

          replace_once(
              'apps/api/src/app.module.ts',
              'import { RevenueModule } from "./revenue/revenue.module.js";\n',
              'import { RecommendationModule } from "./recommendations/recommendation.module.js";\nimport { RevenueModule } from "./revenue/revenue.module.js";\n',
          )
          replace_once(
              'apps/api/src/app.module.ts',
              '    RevenueModule,\n',
              '    RevenueModule,\n    RecommendationModule,\n',
          )

          catalog = Path('apps/api/src/platform-config/platform-settings.catalog.ts')
          catalog_text = catalog.read_text()
          settings_block = '''  recommendationsPersonalizedEnabled: {
            namespace: "DISCOVERY",
            key: "recommendationsPersonalizedEnabled",
            valueType: "BOOLEAN",
            defaultValue: true,
            schema: z.boolean(),
            section: "watching",
            label: "Personalized recommendations",
            description: "Enable AYIN's explainable first-party recommendation scorer. Disable for deterministic safe fallback ranking.",
            control: "toggle",
            highImpact: true,
            superadminOnly: false,
          },
          recommendationWeightHistory: {
            namespace: "DISCOVERY",
            key: "recommendationWeightHistory",
            valueType: "INTEGER",
            defaultValue: 30,
            schema: z.number().int().min(0).max(100),
            section: "watching",
            label: "Recommendation history weight",
            description: "Weight for creator affinity learned from recent first-party watch history.",
            control: "number",
            highImpact: false,
            superadminOnly: false,
          },
          recommendationWeightSubscriptions: {
            namespace: "DISCOVERY",
            key: "recommendationWeightSubscriptions",
            valueType: "INTEGER",
            defaultValue: 25,
            schema: z.number().int().min(0).max(100),
            section: "watching",
            label: "Recommendation subscription weight",
            description: "Weight for content from channels the active profile follows.",
            control: "number",
            highImpact: false,
            superadminOnly: false,
          },
          recommendationWeightLikes: {
            namespace: "DISCOVERY",
            key: "recommendationWeightLikes",
            valueType: "INTEGER",
            defaultValue: 15,
            schema: z.number().int().min(0).max(100),
            section: "watching",
            label: "Recommendation likes weight",
            description: "Weight for creator affinity derived from explicit video likes.",
            control: "number",
            highImpact: false,
            superadminOnly: false,
          },
          recommendationWeightPopularity: {
            namespace: "DISCOVERY",
            key: "recommendationWeightPopularity",
            valueType: "INTEGER",
            defaultValue: 10,
            schema: z.number().int().min(0).max(100),
            section: "watching",
            label: "Recommendation popularity weight",
            description: "Weight for aggregate AYIN watch and reaction popularity.",
            control: "number",
            highImpact: false,
            superadminOnly: false,
          },
          recommendationWeightRecency: {
            namespace: "DISCOVERY",
            key: "recommendationWeightRecency",
            valueType: "INTEGER",
            defaultValue: 10,
            schema: z.number().int().min(0).max(100),
            section: "watching",
            label: "Recommendation recency weight",
            description: "Weight for recently published eligible content.",
            control: "number",
            highImpact: false,
            superadminOnly: false,
          },
          recommendationWeightCompletion: {
            namespace: "DISCOVERY",
            key: "recommendationWeightCompletion",
            valueType: "INTEGER",
            defaultValue: 10,
            schema: z.number().int().min(0).max(100),
            section: "watching",
            label: "Recommendation completion weight",
            description: "Weight for channels whose videos the profile tends to complete.",
            control: "number",
            highImpact: false,
            superadminOnly: false,
          },
          lensSemanticSearchEnabled: {
            namespace: "DISCOVERY",
            key: "lensSemanticSearchEnabled",
            valueType: "BOOLEAN",
            defaultValue: false,
            schema: z.boolean(),
            section: "watching",
            label: "AYIN Lens semantic search",
            description: "Enable semantic Lens search only when a reviewed provider adapter reports that it is configured; otherwise AYIN stays on lexical fallback.",
            control: "toggle",
            highImpact: true,
            superadminOnly: true,
          },
          '''
          if 'recommendationsPersonalizedEnabled:' not in catalog_text:
              catalog_text = catalog_text.replace('  defaultMonetizationAdEligibility: {', settings_block + '  defaultMonetizationAdEligibility: {', 1)
              catalog.write_text(catalog_text)

          replace_once(
              'apps/api/src/analytics/analytics.schemas.ts',
              '  "CLIP_SHARE",\n',
              '  "CLIP_SHARE",\n  "RECOMMENDATION_IMPRESSION",\n  "RECOMMENDATION_CLICK",\n  "LENS_OPEN",\n  "LENS_DISMISS",\n  "LENS_NOT_INTERESTED",\n',
          )
          replace_once(
              'apps/web/src/lib/analytics.ts',
              '  | "CLIP_SHARE"\n',
              '  | "CLIP_SHARE"\n  | "RECOMMENDATION_IMPRESSION"\n  | "RECOMMENDATION_CLICK"\n  | "LENS_OPEN"\n  | "LENS_DISMISS"\n  | "LENS_NOT_INTERESTED"\n',
          )

          search_module = Path('apps/api/src/search/search.module.ts')
          search_module.write_text('''import { Module } from "@nestjs/common";

          import { DatabaseModule } from "../database/database.module.js";
          import { PlatformConfigModule } from "../platform-config/platform-config.module.js";
          import {
            AYIN_LENS_SEARCH_PROVIDER,
            UnconfiguredAyinLensSearchProvider,
          } from "./lens-search.provider.js";
          import { LensSearchService } from "./lens-search.service.js";
          import { SearchController } from "./search.controller.js";
          import { SearchRateLimiter } from "./search-rate-limiter.js";
          import { SearchService } from "./search.service.js";

          @Module({
            imports: [DatabaseModule, PlatformConfigModule],
            controllers: [SearchController],
            providers: [
              SearchService,
              LensSearchService,
              SearchRateLimiter,
              UnconfiguredAyinLensSearchProvider,
              { provide: AYIN_LENS_SEARCH_PROVIDER, useExisting: UnconfiguredAyinLensSearchProvider },
            ],
          })
          export class SearchModule {}
          ''')

          controller = Path('apps/api/src/search/search.controller.ts')
          c = controller.read_text()
          if 'LensSearchService' not in c:
              c = c.replace(
                  'import { SearchRateLimiter } from "./search-rate-limiter.js";\n',
                  'import { LensSearchService } from "./lens-search.service.js";\nimport { SearchRateLimiter } from "./search-rate-limiter.js";\n',
                  1,
              )
              c = c.replace(
                  '    @Inject(SearchService) private readonly searchService: SearchService,\n',
                  '    @Inject(SearchService) private readonly searchService: SearchService,\n    @Inject(LensSearchService) private readonly lensSearch: LensSearchService,\n',
                  1,
              )
              marker = '''  @Get("suggestions")
          async suggestions'''
              method = '''  @Get("lens")
            async lens(@Req() request: { ip?: string }, @Query() query: unknown) {
              return runSearch(() => {
                this.rateLimiter.consume(`lens:${request.ip ?? "unknown"}`);
                const parsed = searchSchema.safeParse(query);
                if (!parsed.success)
                  throw new SearchError("INVALID_SEARCH_QUERY", "The Lens search request is invalid.");
                return this.lensSearch.searchLens(parsed.data.q, parsed.data.limit);
              });
            }

            @Get("suggestions")
            async suggestions'''
              if marker not in c:
                  raise SystemExit('search controller anchor missing')
              c = c.replace(marker, method, 1)
              controller.write_text(c)

          migration = Path('packages/db/prisma/migrations/20260830170000_recommendations_lens/migration.sql')
          m = migration.read_text().replace('"id" UUID NOT NULL,', '"id" UUID NOT NULL DEFAULT gen_random_uuid(),')
          migration.write_text(m)
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate and format
        run: |
          pnpm --filter @ayin/db exec prisma generate
          pnpm exec prettier --write packages/db/prisma/schema.prisma apps/api/src/app.module.ts apps/api/src/platform-config/platform-settings.catalog.ts apps/api/src/analytics/analytics.schemas.ts apps/web/src/lib/analytics.ts apps/api/src/search/search.module.ts apps/api/src/search/search.controller.ts apps/api/src/recommendations apps/api/src/search/lens-search.provider.ts apps/api/src/search/lens-search.service.ts apps/web/src/app/'(viewer)'/my-ayin/lens docs/RECOMMENDATIONS_AND_LENS.md
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Task 33: integrate recommendations and AYIN Lens" || exit 0
          git push origin HEAD:task-33-recommendations-lens
