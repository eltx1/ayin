name: Task 10 patch

on:
  push:
    branches:
      - task-10-creator-tv-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-10-creator-tv-v1
      - name: Patch Creator TV schema and service
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('packages/db/prisma/schema.prisma')
          text = schema.read_text()
          old = '  tvScheduleItems    TvScheduleItem[]\n  watchProgress'
          new = '  tvScheduleItems    TvScheduleItem[]\n  tvPreferences      CreatorTvVideoPreference[]\n  watchProgress'
          if old not in text:
              raise SystemExit('Video relation insertion point missing')
          text = text.replace(old, new, 1)
          old = '  scheduleItems     TvScheduleItem[]\n\n  @@index([channelId, status])'
          new = '  scheduleItems     TvScheduleItem[]\n  videoPreferences  CreatorTvVideoPreference[]\n\n  @@index([channelId, status])'
          if old not in text:
              raise SystemExit('CreatorTv relation insertion point missing')
          schema.write_text(text.replace(old, new, 1))

          service = Path('apps/api/src/creator/creator-tv.service.ts')
          text = service.read_text()
          old = '      playbackOffsetMs: program.playbackOffsetMs,\n    }));'
          new = '      playbackOffsetMs: 0,\n    }));'
          if old not in text:
              raise SystemExit('Playback offset mapping missing')
          text = text.replace(old, new, 1)
          old = '''      videos: ordered.map((entry) => ({\n        ...entry.payload,\n        included: entry.payloadPreference.included,\n        priority: entry.priority,\n        sortOrder: entry.sortOrder,\n        effectiveDurationMs: entry.durationMs ?? policy.fallbackDurationMs,\n      })),'''
          new = '''      videos: ordered.map((entry) => {\n        const { payloadPreference, ...video } = entry.payload;\n        return {\n          ...video,\n          included: payloadPreference.included,\n          priority: entry.priority,\n          sortOrder: entry.sortOrder,\n          effectiveDurationMs: entry.durationMs ?? policy.fallbackDurationMs,\n        };\n      }),'''
          if old not in text:
              raise SystemExit('Management mapping missing')
          service.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/prisma/schema.prisma apps/api/src/creator/creator-tv.service.ts
          git commit -m "Fix Task 10 schema relations and playback offsets"
          git push origin HEAD:task-10-creator-tv-v1
