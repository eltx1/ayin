name: Task 61 formatter

on:
  push:
    branches:
      - task-61-localized-metadata

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-61-localized-metadata
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format Task 61 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/catalog-localization/catalog-localization.controller.ts
          apps/api/src/catalog-localization/catalog-localization.service.ts
          apps/api/src/catalog-localization/catalog-localization.ts
          apps/web/src/app/series/[slug]/page.tsx
          apps/web/src/components/admin/admin-catalog-localizations.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/catalog-localization apps/web/src/app/series/'[slug]'/page.tsx apps/web/src/components/admin/admin-catalog-localizations.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(task61): format localized metadata implementation"
          git push origin HEAD:task-61-localized-metadata
