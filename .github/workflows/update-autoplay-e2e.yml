name: Update autoplay acceptance expectation
on:
  push:
    branches:
      - fix/upload-reliability-publish-player
    paths:
      - .github/workflows/update-autoplay-e2e.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/upload-reliability-publish-player
      - name: Update changed playback expectation
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/e2e/v1.acceptance.spec.ts")
          text = path.read_text()
          old = '''    await page.route("https://imasdk.googleapis.com/**", (route) => route.abort());
    await page.goto(`/watch/${video.slug}`);
    await page.getByRole("button", { name: "Start playback" }).click();
    await expect(page.locator("video")).toHaveCount(1);
    await expect(page.getByRole("button", { name: "Start playback" })).toHaveCount(0);
'''
          new = '''    let imaRequested = false;
    await page.route("https://imasdk.googleapis.com/**", async (route) => {
      imaRequested = true;
      await route.abort();
    });
    await page.goto(`/watch/${video.slug}`);
    await expect.poll(() => imaRequested).toBe(true);
    await expect(page.locator("video")).toHaveCount(1);
    await expect(page.getByRole("button", { name: "Start playback" })).toHaveCount(0);
'''
          if old not in text:
              raise SystemExit("Expected legacy IMA acceptance block was not found")
          path.write_text(text.replace(old, new, 1))
      - name: Format test
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm exec prettier --write tests/e2e/v1.acceptance.spec.ts
      - name: Commit test update and remove one-shot workflow
        run: |
          rm -f .github/workflows/update-autoplay-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align IMA acceptance with autoplay behavior"
          git push origin HEAD:fix/upload-reliability-publish-player
