name: Task 33 finish
on:
  push:
    branches: [task-33-recommendations-lens]
permissions:
  contents: write
jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-33-recommendations-lens
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Integrate
        run: |
          python3 <<'PY'
          from pathlib import Path
          schema=Path('packages/db/prisma/schema.prisma'); s=schema.read_text()
          if 'enum RecommendationFeedbackType' not in s:
            s=s.replace('model Account {','enum RecommendationFeedbackType {\n  NOT_INTERESTED\n  DISMISSED\n}\n\nmodel Account {',1)
          if 'recommendationState RecommendationProfileState?' not in s:
            s=s.replace('  communityReports   CommunityPostReport[]\n','  communityReports   CommunityPostReport[]\n  recommendationFeedback RecommendationFeedback[]\n  recommendationState    RecommendationProfileState?\n',1)
          video_part=s.split('model Video {',1)[1]
          if 'recommendationFeedback RecommendationFeedback[]' not in video_part.split('model MediaAsset {',1)[0]:
            s=s.replace('  communityShares    CommunityPost[]            @relation("CommunitySharedVideo")\n','  communityShares    CommunityPost[]            @relation("CommunitySharedVideo")\n  recommendationFeedback RecommendationFeedback[]\n',1)
          if 'model RecommendationFeedback {' not in s:
            models='''model RecommendationProfileState {
            profileId String @id @db.Uuid
            resetAt   DateTime?
            createdAt DateTime @default(now())
            updatedAt DateTime @updatedAt

            profile ViewerProfile @relation(fields: [profileId], references: [id], onDelete: Cascade)
          }

          model RecommendationFeedback {
            id        String                     @id @default(uuid()) @db.Uuid
            profileId String                     @db.Uuid
            videoId   String                     @db.Uuid
            type      RecommendationFeedbackType
            createdAt DateTime                   @default(now())
            updatedAt DateTime                   @updatedAt

            profile ViewerProfile @relation(fields: [profileId], references: [id], onDelete: Cascade)
            video   Video         @relation(fields: [videoId], references: [id], onDelete: Cascade)

            @@unique([profileId, videoId])
            @@index([profileId, type, createdAt])
            @@index([videoId, type])
          }

          '''
            s=s.replace('model PlatformSetting {',models+'model PlatformSetting {',1)
          schema.write_text(s)

          app=Path('apps/api/src/app.module.ts'); a=app.read_text()
          if 'recommendations/recommendation.module.js' not in a:
            a=a.replace('import { RevenueModule } from "./revenue/revenue.module.js";','import { RecommendationModule } from "./recommendations/recommendation.module.js";\nimport { RevenueModule } from "./revenue/revenue.module.js";',1)
            a=a.replace('    RevenueModule,','    RevenueModule,\n    RecommendationModule,',1)
          app.write_text(a)

          cat=Path('apps/api/src/platform-config/platform-settings.catalog.ts'); c=cat.read_text()
          if 'recommendationsPersonalizedEnabled:' not in c:
            block='''  recommendationsPersonalizedEnabled: {
            namespace: "DISCOVERY", key: "recommendationsPersonalizedEnabled", valueType: "BOOLEAN", defaultValue: true,
            schema: z.boolean(), section: "watching", label: "Personalized recommendations",
            description: "Enable explainable first-party recommendation scoring; disable for deterministic fallback.", control: "toggle", highImpact: true, superadminOnly: false,
          },
          recommendationWeightHistory: { namespace: "DISCOVERY", key: "recommendationWeightHistory", valueType: "INTEGER", defaultValue: 30, schema: z.number().int().min(0).max(100), section: "watching", label: "Recommendation history weight", description: "Watch-history channel-affinity weight.", control: "number", highImpact: false, superadminOnly: false },
          recommendationWeightSubscriptions: { namespace: "DISCOVERY", key: "recommendationWeightSubscriptions", valueType: "INTEGER", defaultValue: 25, schema: z.number().int().min(0).max(100), section: "watching", label: "Recommendation subscription weight", description: "Followed-channel weight.", control: "number", highImpact: false, superadminOnly: false },
          recommendationWeightLikes: { namespace: "DISCOVERY", key: "recommendationWeightLikes", valueType: "INTEGER", defaultValue: 15, schema: z.number().int().min(0).max(100), section: "watching", label: "Recommendation likes weight", description: "Explicit-like affinity weight.", control: "number", highImpact: false, superadminOnly: false },
          recommendationWeightPopularity: { namespace: "DISCOVERY", key: "recommendationWeightPopularity", valueType: "INTEGER", defaultValue: 10, schema: z.number().int().min(0).max(100), section: "watching", label: "Recommendation popularity weight", description: "Aggregate popularity weight.", control: "number", highImpact: false, superadminOnly: false },
          recommendationWeightRecency: { namespace: "DISCOVERY", key: "recommendationWeightRecency", valueType: "INTEGER", defaultValue: 10, schema: z.number().int().min(0).max(100), section: "watching", label: "Recommendation recency weight", description: "Recent-publication weight.", control: "number", highImpact: false, superadminOnly: false },
          recommendationWeightCompletion: { namespace: "DISCOVERY", key: "recommendationWeightCompletion", valueType: "INTEGER", defaultValue: 10, schema: z.number().int().min(0).max(100), section: "watching", label: "Recommendation completion weight", description: "Completed-video creator-affinity weight.", control: "number", highImpact: false, superadminOnly: false },
          lensSemanticSearchEnabled: { namespace: "DISCOVERY", key: "lensSemanticSearchEnabled", valueType: "BOOLEAN", defaultValue: false, schema: z.boolean(), section: "watching", label: "AYIN Lens semantic search", description: "Enable only with a reviewed configured semantic provider; otherwise use lexical fallback.", control: "toggle", highImpact: true, superadminOnly: true },
          '''
            c=c.replace('  defaultMonetizationAdEligibility: {',block+'  defaultMonetizationAdEligibility: {',1)
          cat.write_text(c)

          ana=Path('apps/api/src/analytics/analytics.schemas.ts'); x=ana.read_text()
          if '"RECOMMENDATION_IMPRESSION"' not in x:
            x=x.replace('  "CLIP_SHARE",','  "CLIP_SHARE",\n  "RECOMMENDATION_IMPRESSION",\n  "RECOMMENDATION_CLICK",\n  "LENS_OPEN",\n  "LENS_DISMISS",\n  "LENS_NOT_INTERESTED",',1)
          ana.write_text(x)
          weba=Path('apps/web/src/lib/analytics.ts'); x=weba.read_text()
          if '| "RECOMMENDATION_IMPRESSION"' not in x:
            x=x.replace('  | "CLIP_SHARE"','  | "CLIP_SHARE"\n  | "RECOMMENDATION_IMPRESSION"\n  | "RECOMMENDATION_CLICK"\n  | "LENS_OPEN"\n  | "LENS_DISMISS"\n  | "LENS_NOT_INTERESTED"',1)
          weba.write_text(x)

          sm=Path('apps/api/src/search/search.module.ts'); sm.write_text('''import { Module } from "@nestjs/common";

          import { DatabaseModule } from "../database/database.module.js";
          import { PlatformConfigModule } from "../platform-config/platform-config.module.js";
          import { AYIN_LENS_SEARCH_PROVIDER, UnconfiguredAyinLensSearchProvider } from "./lens-search.provider.js";
          import { LensSearchService } from "./lens-search.service.js";
          import { SearchController } from "./search.controller.js";
          import { SearchRateLimiter } from "./search-rate-limiter.js";
          import { SearchService } from "./search.service.js";

          @Module({
            imports: [DatabaseModule, PlatformConfigModule],
            controllers: [SearchController],
            providers: [SearchService, LensSearchService, SearchRateLimiter, UnconfiguredAyinLensSearchProvider, { provide: AYIN_LENS_SEARCH_PROVIDER, useExisting: UnconfiguredAyinLensSearchProvider }],
          })
          export class SearchModule {}
          ''')

          sc=Path('apps/api/src/search/search.controller.ts'); x=sc.read_text()
          if 'LensSearchService' not in x:
            x=x.replace('import { SearchRateLimiter } from "./search-rate-limiter.js";','import { LensSearchService } from "./lens-search.service.js";\nimport { SearchRateLimiter } from "./search-rate-limiter.js";',1)
            x=x.replace('    @Inject(SearchService) private readonly searchService: SearchService,','    @Inject(SearchService) private readonly searchService: SearchService,\n    @Inject(LensSearchService) private readonly lensSearch: LensSearchService,',1)
            marker='  @Get("suggestions")\n  async suggestions'
            method='''  @Get("lens")
            async lens(@Req() request: { ip?: string }, @Query() query: unknown) {
              return runSearch(() => {
                this.rateLimiter.consume(`lens:${request.ip ?? "unknown"}`);
                const parsed = searchSchema.safeParse(query);
                if (!parsed.success) throw new SearchError("INVALID_SEARCH_QUERY", "The Lens search request is invalid.");
                return this.lensSearch.searchLens(parsed.data.q, parsed.data.limit);
              });
            }

            @Get("suggestions")
            async suggestions'''
            if marker not in x: raise SystemExit('corrected search anchor still missing')
            x=x.replace(marker,method,1)
          sc.write_text(x)

          mig=Path('packages/db/prisma/migrations/20260830170000_recommendations_lens/migration.sql'); m=mig.read_text()
          m=m.replace('"id" UUID NOT NULL,','"id" UUID NOT NULL DEFAULT gen_random_uuid(),')
          mig.write_text(m)
          PY
          pnpm install --frozen-lockfile
          pnpm --filter @ayin/db exec prisma generate
          pnpm exec prettier --write packages/db/prisma/schema.prisma apps/api/src/app.module.ts apps/api/src/platform-config/platform-settings.catalog.ts apps/api/src/analytics/analytics.schemas.ts apps/web/src/lib/analytics.ts apps/api/src/search apps/api/src/recommendations apps/web/src/app/'(viewer)'/my-ayin/lens docs/RECOMMENDATIONS_AND_LENS.md
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Task 33: integrate recommendations and AYIN Lens" || exit 0
          git push origin HEAD:task-33-recommendations-lens
