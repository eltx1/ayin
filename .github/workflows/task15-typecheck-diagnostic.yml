name: Temporary Task 15 typecheck diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/task15-typecheck-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck > TASK15_TYPECHECK_DIAGNOSTIC.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TASK15_TYPECHECK_DIAGNOSTIC.txt
          git commit -m "chore: capture Task 15 typecheck diagnostic"
          git push origin HEAD:main
