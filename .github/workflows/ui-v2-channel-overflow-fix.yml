name: UI V2 channel overflow fixer

on:
  push:
    branches:
      - design/ui-ux-v2-modern-responsive
    paths:
      - ".github/workflows/ui-v2-channel-overflow-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/ui-ux-v2-modern-responsive
      - name: Contain channel actions on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/channel/public-channel.module.css')
          text = path.read_text()
          old = '''  .actions {\n    grid-column: 1 / -1;\n    padding-bottom: 0;\n    width: 100%;\n  }\n\n  .actions > * {\n    flex: 1 1 auto;\n  }'''
          new = '''  .actions {\n    grid-column: 1 / -1;\n    max-width: 100%;\n    min-width: 0;\n    overflow-x: auto;\n    overscroll-behavior-inline: contain;\n    padding-bottom: 0.25rem;\n    scroll-padding-inline: 0.25rem;\n    scrollbar-width: none;\n    width: 100%;\n  }\n\n  .actions::-webkit-scrollbar {\n    display: none;\n  }\n\n  .actions > * {\n    flex: 0 0 auto;\n  }'''
          if old not in text:
              raise SystemExit('mobile channel actions marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed style
        run: npx --yes prettier@3.9.6 --write apps/web/src/components/channel/public-channel.module.css
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/channel/public-channel.module.css
          git commit -m "fix(ui): contain mobile channel actions in local rail"
          git push origin HEAD:design/ui-ux-v2-modern-responsive
