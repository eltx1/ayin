          p.write_text(s)
          PY
          cat > apps/web/src/app/admin/trust/page.tsx <<'EOF'
          import { apiFetch } from "../../../lib/api";
          export default async function AdminTrustPage(){let data:any=null;try{data=await apiFetch("/admin/trust/queue");}catch{}return <main><h1>Trust &amp; Safety</h1><p>Moderation reports, takedowns, cases and appeals. Destructive actions require the protected API and are audited.</p><pre>{JSON.stringify(data,null,2)}</pre></main>}
          EOF
          cat > apps/web/src/app/studio/trust/page.tsx <<'EOF'
          import { apiFetch } from "../../../lib/api";
          export default async function StudioTrustPage(){let data:any=null;try{data=await apiFetch("/trust/creator/history");}catch{}return <main><h1>Trust &amp; Safety</h1><p>Your moderation notices, trust status and appeal history.</p><pre>{JSON.stringify(data,null,2)}</pre></main>}
          EOF
          cat > docs/MODERATION_RIGHTS_TRUST.md <<'EOF'
          # Moderation, rights and creator trust
          Task 24 keeps publishing UX simple while retaining the existing versioned `ContentRightsDeclaration`; channel context remains normalized through each declaration's immutable video-to-channel relationship.
          Authenticated viewers can report videos/comments and submit copyright/takedown requests. Admin has queues for reports, moderation cases, takedowns and appeals, plus audited warn/strike/suspend/unpublish/remove actions. Creator-facing history exposes notices, actions, appeals and trust state.
          Moderation settings include blocked-term hooks and `newCreatorsRequireReview`, whose default is false. Trust levels are NEW, STANDARD, TRUSTED and RESTRICTED. Destructive state changes and trust/settings changes are audit logged.
          No external legal notice processor or automated copyright matching service is represented as configured.
          EOF
          corepack enable && corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm format
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages docs
          git commit -m "feat: implement moderation rights and creator trust"
