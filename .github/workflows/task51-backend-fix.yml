name: Task 51 backend fix

on:
  push:
    branches:
      - task-51-video-metadata-v2

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-51-video-metadata-v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Reuse and apply reviewed backend patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/task51-implementation.yml').read_text()
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, 'task51-backend-patch', 'exec'))
          PY
      - name: Validate backend in workspace build order
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ayin/db exec prisma format --schema prisma
          pnpm exec prettier --write apps/api/src/creator/quick-upload.service.ts apps/api/src/creator/studio.service.ts apps/api/src/search/search.service.ts apps/api/src/admin/admin-control.service.ts apps/api/src/creator/creator-tv.service.ts apps/api/src/creator/video-metadata.validation.ts apps/api/src/creator/quick-upload.controller.ts
          pnpm typecheck
      - name: Commit validated backend and remove temporary workflows
        run: |
          rm .github/workflows/task51-implementation.yml .github/workflows/task51-backend-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(task-51): integrate creator metadata across backend"
          git push origin HEAD:task-51-video-metadata-v2
