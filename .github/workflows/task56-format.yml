name: Task 56 temporary formatter

on:
  push:
    branches:
      - task-56-series-catalog
    paths:
      - .github/workflows/task56-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-56-series-catalog
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/api/src/series-catalog/admin-series-catalog.controller.ts
          apps/api/src/series-catalog/series-catalog.module.ts
          apps/api/src/series-catalog/series-catalog.service.ts
          apps/api/src/watch/watch.module.ts
          apps/web/src/app/series/[slug]/page.tsx
          apps/web/src/components/admin/admin-series-catalog.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/series-catalog/admin-series-catalog.controller.ts apps/api/src/series-catalog/series-catalog.module.ts apps/api/src/series-catalog/series-catalog.service.ts apps/api/src/watch/watch.module.ts apps/web/src/app/series/'[slug]'/page.tsx apps/web/src/components/admin/admin-series-catalog.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style(task56): format series catalog files"
          git push origin HEAD:task-56-series-catalog
