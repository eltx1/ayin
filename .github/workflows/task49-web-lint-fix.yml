name: Task 49 temporary web lint fix

on:
  push:
    branches:
      - task-49-privacy-controls

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-49-privacy-controls
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix React effect lint and verify web lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/components/account/account-privacy-controls.tsx')
          text = path.read_text()
          old = '''  useEffect(() => {\n    void refresh().catch((caught) => {\n      setError(caught instanceof Error ? caught.message : "Privacy controls could not be loaded.");\n    });\n  }, []);'''
          new = '''  useEffect(() => {\n    let active = true;\n    void readStatus().then(\n      (nextStatus) => {\n        if (active) setStatus(nextStatus);\n      },\n      (caught) => {\n        if (active) {\n          setError(caught instanceof Error ? caught.message : "Privacy controls could not be loaded.");\n        }\n      },\n    );\n    return () => {\n      active = false;\n    };\n  }, []);'''
          if old not in text:
              raise SystemExit('Expected effect block not found')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write apps/web/src/components/account/account-privacy-controls.tsx
          pnpm --filter @ayin/web run lint
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task49-web-lint-fix.yml
          git add -A
          git commit -m "fix(task-49): load privacy state asynchronously"
          git push origin HEAD:task-49-privacy-controls
