name: tvOS app validation

on:
  pull_request:
    paths:
      - "platforms/tvos/**"
      - "platforms/ios/AYIN/**"
      - "docs/TVOS_STRATEGY.md"
      - ".github/workflows/tvos-app.yml"
  push:
    branches: [main]
    paths:
      - "platforms/tvos/**"
      - "platforms/ios/AYIN/**"
      - "docs/TVOS_STRATEGY.md"
      - ".github/workflows/tvos-app.yml"

permissions:
  contents: read

jobs:
  tvos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Show Apple TV toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Reject committed signing secrets and web wrappers
        run: |
          set -euo pipefail
          if find platforms/tvos -type f \( -name '*.p8' -o -name '*.p12' -o -name '*.mobileprovision' -o -name '*.cer' \) -print -quit | grep -q .; then
            echo "Apple signing material must not be committed."
            exit 1
          fi
          if grep -R -E 'DEVELOPMENT_TEAM[[:space:]]*=[[:space:]]*[A-Z0-9]{10}' platforms/tvos --exclude-dir=.git; then
            echo "A concrete Apple Team ID must not be committed by Task 81."
            exit 1
          fi
          if grep -R -E 'WKWebView|TVMLKit|TVApplicationController' platforms/tvos/AYINTV; then
            echo "Task 81 must remain native SwiftUI/UIKit/AVKit on tvOS."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate tvOS project and validate property lists
        working-directory: platforms/tvos
        run: |
          set -euo pipefail
          xcodegen generate
          plutil -lint AYINTV/Info.plist
          plutil -lint AYINTV/AYINTV.entitlements
          python3 -m json.tool store/apple-app-site-association.template.json >/dev/null
          python3 -m json.tool CERTIFICATION_STATUS.json >/dev/null
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' AYINTV/Info.plist >/dev/null 2>&1; then
            echo "ATS arbitrary loads must remain disabled."
            exit 1
          fi

      - name: Build unsigned Apple TV Simulator application
        working-directory: platforms/tvos
        run: |
          set -euo pipefail
          xcodebuild             -project AYINTV.xcodeproj             -scheme AYINTV             -configuration Debug             -sdk appletvsimulator             -destination 'generic/platform=tvOS Simulator'             CODE_SIGNING_ALLOWED=NO             clean build

      - name: Verify resolved production origins
        run: |
          set -euo pipefail
          app_plist="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Debug-appletvsimulator/AYIN.app/Info.plist' -print -quit)"
          test -n "$app_plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :AYINAPIBaseURL' "$app_plist")" = "https://api.ayin.stream"
          test "$(/usr/libexec/PlistBuddy -c 'Print :AYINMediaBaseURL' "$app_plist")" = "https://media.ayin.stream"
          test "$(/usr/libexec/PlistBuddy -c 'Print :AYINWebBaseURL' "$app_plist")" = "https://ayin.stream"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_plist")" = "AYIN"

      - name: Select available Apple TV Simulator
        id: simulator
        run: |
          set -euo pipefail
          udid="$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in reversed(list(payload["devices"].items())):
              if "tvOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("Apple TV"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available Apple TV Simulator found")
          PY
          )"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Using Apple TV simulator $udid"

      - name: Run tvOS unit tests
        working-directory: platforms/tvos
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          xcodebuild             -project AYINTV.xcodeproj             -scheme AYINTV             -configuration Debug             -destination "platform=tvOS Simulator,id=${{ steps.simulator.outputs.udid }}"             CODE_SIGNING_ALLOWED=NO             -resultBundlePath "$RUNNER_TEMP/AYINTVTests.xcresult"             test

      - name: Upload tvOS test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayin-tvos-xcresult
          path: ${{ runner.temp }}/AYINTVTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
