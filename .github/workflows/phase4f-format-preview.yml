name: Phase4F formatting preview

on:
  pull_request:
    paths:
      - ".github/workflows/phase4f-format-preview.yml"

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Phase4F files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/social/notification-feed.tsx \
            apps/web/src/lib/notifications.ts \
            tests/e2e/notifications.acceptance.spec.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: phase4f-formatted-files
          path: |
            apps/web/src/components/social/notification-feed.tsx
            apps/web/src/lib/notifications.ts
            tests/e2e/notifications.acceptance.spec.ts
          retention-days: 1
