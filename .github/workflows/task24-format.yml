name: Task 24 format
on:
  push:
    branches: [task-24-moderation-rights-trust]
    paths: [".github/workflows/task24-format.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: task-24-moderation-rights-trust }
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate && pnpm install --frozen-lockfile && pnpm exec prettier --write apps/web/src/app/admin/trust/page.tsx apps/web/src/app/studio/trust/page.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/admin/trust/page.tsx apps/web/src/app/studio/trust/page.tsx
          git commit -m "style: format trust pages"
          git push origin HEAD:task-24-moderation-rights-trust
