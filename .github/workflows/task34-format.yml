name: Task34 format
on:
  push:
    branches: [task-34-live-streaming]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-34-live-streaming
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/live/live.controller.ts apps/api/src/live/live.service.ts 'apps/web/src/app/(studio)/studio/live/studio-live-client.tsx' 'apps/web/src/app/(viewer)/live/[slug]/live-watch-client.tsx' packages/db/src/live-streaming.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Format Task 34 files"
          git push origin HEAD:task-34-live-streaming
