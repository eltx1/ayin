name: Phase4G docs formatting apply

on:
  pull_request:
    paths:
      - ".github/workflows/phase4g-doc-format-preview.yml"

permissions:
  contents: write

jobs:
  format-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'web-pwa-phase-4g-social-action-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and commit docs only
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md \
            docs/AYIN_DESIGN_SYSTEM.md
          if git diff --quiet -- docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md docs/AYIN_DESIGN_SYSTEM.md; then
            echo "Docs already canonical."
            exit 0
          fi
          test -z "$(git diff --name-only -- . ':!docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md' ':!docs/AYIN_DESIGN_SYSTEM.md' ':!.github/workflows/phase4g-doc-format-preview.yml')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md docs/AYIN_DESIGN_SYSTEM.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "docs/AYIN_DESIGN_SYSTEM.md docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md "
          git commit -m "docs(phase4g): apply canonical formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
