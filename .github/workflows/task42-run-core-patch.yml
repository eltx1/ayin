name: Task 42 core patch runner

on:
  push:
    branches:
      - task-42-adaptive-rollout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-42-adaptive-rollout
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply extracted core patch
        run: |
          python - <<'PY'
          from pathlib import Path
          raw = Path('.github/workflows/task42-core-patch.yml').read_text()
          script = raw.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())
          exec(compile(script, 'task42-core-patch.py', 'exec'))
          PY
          pnpm exec prettier --write apps/api/src/platform-config/platform-settings.catalog.ts apps/api/src/media/media-adaptive-processing.service.ts apps/api/src/media/media-processing-lifecycle.service.ts apps/api/src/media/media-processing-queue.service.ts apps/api/src/media/media.module.ts apps/api/src/media/media-adaptive-lifecycle.service.ts packages/db/prisma/media-v2.prisma
          pnpm db:generate
          pnpm packages:build
          pnpm --filter @ayin/api lint
          pnpm --filter @ayin/api typecheck
      - name: Commit core rollout patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src packages/db/prisma/media-v2.prisma
          git commit -m "feat(media): add controlled adaptive rollout core"
          git push origin HEAD:task-42-adaptive-rollout
