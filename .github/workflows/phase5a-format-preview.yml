name: Phase5A format preview

on:
  pull_request:
    paths:
      - ".github/workflows/phase5a-format-preview.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "apps/web/src/app/(viewer)/kids/kids.module.css"
      - uses: actions/upload-artifact@v4
        with:
          name: phase5a-formatted-css
          path: apps/web/src/app/(viewer)/kids/kids.module.css
          retention-days: 1
