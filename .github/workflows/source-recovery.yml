name: AYIN workspace source recovery
on:
  pull_request:
    paths:
      - ".github/workflows/source-recovery.yml"
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output=ayin-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ayin-source-recovery
          path: ayin-source.zip
          retention-days: 1
          if-no-files-found: error
