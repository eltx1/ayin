name: Task 70 format assist

on:
  push:
    branches:
      - task-70-payout-provider
    paths:
      - ".github/workflows/task70-format-assist.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-70-payout-provider
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 70 files
        run: |
          pnpm exec prettier --write \
            apps/api/src/revenue/admin-payout-creation.service.ts \
            apps/api/src/revenue/creator-finance.service.ts \
            apps/api/src/revenue/external-payout-provider.adapter.ts \
            apps/api/src/revenue/payout-provider-state-machine.ts \
            apps/api/src/revenue/payout-provider-transfer.service.ts \
            apps/api/src/revenue/payout-provider.controller.ts \
            apps/api/src/revenue/revenue.module.ts \
            apps/web/src/components/admin/admin-payout-detail.tsx \
            packages/db/src/payout-provider.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/revenue/admin-payout-creation.service.ts \
            apps/api/src/revenue/creator-finance.service.ts \
            apps/api/src/revenue/external-payout-provider.adapter.ts \
            apps/api/src/revenue/payout-provider-state-machine.ts \
            apps/api/src/revenue/payout-provider-transfer.service.ts \
            apps/api/src/revenue/payout-provider.controller.ts \
            apps/api/src/revenue/revenue.module.ts \
            apps/web/src/components/admin/admin-payout-detail.tsx \
            packages/db/src/payout-provider.test.mjs
          git commit -m "Format Task 70 payout provider files"
          git push origin HEAD:task-70-payout-provider
