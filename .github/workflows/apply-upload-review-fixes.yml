name: Apply upload review fixes

on:
  push:
    branches:
      - feat/modern-upload-experience

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/modern-upload-experience
      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          tsx = Path("apps/web/src/components/upload/quick-upload.tsx")
          source = tsx.read_text()
          source = source.replace(
              'import { inspectVideoFile, type VideoInspectionResult } from "@/lib/video-inspection";',
              'import {\n  inspectVideoFile,\n  isSupportedVideoFile,\n  type VideoInspectionResult,\n} from "@/lib/video-inspection";',
          )
          source = source.replace(
              '    const selected = Array.from(event.dataTransfer.files).find((candidate) =>\n      candidate.type.startsWith("video/"),\n    );',
              '    const selected = Array.from(event.dataTransfer.files).find(isSupportedVideoFile);',
          )
          tsx.write_text(source)

          css = Path("apps/web/src/components/upload/quick-upload.module.css")
          styles = css.read_text()
          styles = styles.replace(
              '.picker:hover:not(.pickerDisabled),\n.pickerActive {',
              '.picker:hover:not(.pickerDisabled),\n.picker:focus-within,\n.pickerActive {',
          )
          css.write_text(styles)
      - name: Verify intended changes
        run: |
          grep -q 'isSupportedVideoFile' apps/web/src/components/upload/quick-upload.tsx
          grep -q 'picker:focus-within' apps/web/src/components/upload/quick-upload.module.css
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/upload/quick-upload.tsx apps/web/src/components/upload/quick-upload.module.css
          git commit -m "Address upload interaction review feedback"
          git push origin HEAD:feat/modern-upload-experience
