name: Apply media processing product gates

on:
  push:
    paths:
      - ".github/workflows/apply-media-processing-product-gates.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ec2-ffmpeg-media-pipeline-20260904
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Apply product gates
        run: python3 scripts/apply-media-processing-product-gates.py
      - name: Format TypeScript
        run: npx --yes prettier@3.9.6 --write apps/api/src/creator/quick-upload.service.ts apps/api/src/creator/quick-upload.controller.ts apps/api/src/watch/watch.service.ts apps/api/src/discovery/discovery.service.ts apps/web/src/lib/video-inspection.ts
      - name: Commit product gates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/creator/quick-upload.service.ts apps/api/src/creator/quick-upload.controller.ts apps/api/src/watch/watch.service.ts apps/api/src/discovery/discovery.service.ts apps/web/src/lib/video-inspection.ts
          git commit -m "feat: gate publish and playback on processed media"
          git push origin HEAD:ec2-ffmpeg-media-pipeline-20260904
