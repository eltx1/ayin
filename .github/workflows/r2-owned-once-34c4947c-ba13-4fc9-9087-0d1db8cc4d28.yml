name: Owned R2 one-time invocation 34c4947c-ba13-4fc9-9087-0d1db8cc4d28

# LOCAL REVIEW ONLY: final bounded invocation after verified unsafe-parent refusal.
# HELD: permission repair has not been executed or established by this template.
# Replace the invalid PERMISSION_REPAIR_PROOF_SHA256 only after independent review
# of the exact successful 0770-to-0750 repair evidence and its final review record.
# That record must bind the target/owner, before/after modes, unchanged ACLs,
# successful operation run/job IDs, fresh absent manifest, healthy active a6c15842,
# and diagnostic evidence: ACL/mode/ctime run 37862702086 (job 113601966929),
# absent-manifest run 37860910607, modules run 37861518489, browser run 37861667516.
# Driver failure alone never authorizes this exception. The 0770 mode existed
# before attempt 2 and createManifest refuses it before reservation/provider I/O.
# Sole permitted publication: same branch/path, one modified file, single child
# of 301937cca45f32cfae281371182309e46a7aa127, nonforce expected-head update.
# Preserve both failed runs, the complete three-run history, and any O_EXCL host
# manifest. No GitHub rerun, branch recreation, history/manifest deletion, flags,
# provider changes, CORS, access or permission changes are performed here.
# Existing immutable deployment-proof IDs/digest and exact current-main/active-SHA
# health preconditions remain mandatory; API head_sha alone is insufficient.
on:
  push:
    branches:
      - ops/r2-owned-once-34c4947c-ba13-4fc9-9087-0d1db8cc4d28
    paths:
      - .github/workflows/r2-owned-once-34c4947c-ba13-4fc9-9087-0d1db8cc4d28.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: ayin-production-deploy
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      ${{
        github.repository == 'eltx1/ayin' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/ops/r2-owned-once-34c4947c-ba13-4fc9-9087-0d1db8cc4d28' &&
        github.event.created == false &&
        github.event.deleted == false &&
        github.event.forced == false &&
        github.run_attempt == 1
      }}
    runs-on: ubuntu-latest
    # Preserve all existing production protections. GitHub will record this
    # acceptance job as an environment deployment metadata event, not application
    # activation. Do not set deployment:false to bypass custom protection rules.
    environment: production
    timeout-minutes: 20
    env:
      RELEASE_SHA: a6c15842bd2cf6990715f18d58a550a5929d8d41
      PERMISSION_REPAIR_PROOF_SHA256: 8e287e885b9957713ca911d9131e96dd43cd33bb8ab61f282cd6843ae7a62383
      FIXTURE_RUN_ID: 34c4947c-ba13-4fc9-9087-0d1db8cc4d28
      CONFIRM_PREFIX: ayin-recovery-acceptance/34c4947c-ba13-4fc9-9087-0d1db8cc4d28/
      CLEANUP_ACK: DELETE_ONLY_CREATED_FIXTURES
      INVOCATION_BRANCH: ops/r2-owned-once-34c4947c-ba13-4fc9-9087-0d1db8cc4d28
      INVOCATION_PATH: .github/workflows/r2-owned-once-34c4947c-ba13-4fc9-9087-0d1db8cc4d28.yml
      INVOCATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Refuse placeholder and require the fixed approved scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PERMISSION_REPAIR_PROOF_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FIXTURE_RUN_ID" == '34c4947c-ba13-4fc9-9087-0d1db8cc4d28' ]]
          [[ "$CONFIRM_PREFIX" == 'ayin-recovery-acceptance/34c4947c-ba13-4fc9-9087-0d1db8cc4d28/' ]]
          [[ "$CLEANUP_ACK" == 'DELETE_ONLY_CREATED_FIXTURES' ]]
          [[ "$GITHUB_WORKFLOW_REF" == "eltx1/ayin/$INVOCATION_PATH@refs/heads/$INVOCATION_BRANCH" ]]
          [[ "$INVOCATION_WORKFLOW_SHA" == "$GITHUB_SHA" ]]

      - name: Require both exact prior failures and reviewed deployed current main
        uses: actions/github-script@v8
        with:
          script: |
            const repo = { owner: 'eltx1', repo: 'ayin' };
            const sha = process.env.RELEASE_SHA;
            const branchName = process.env.INVOCATION_BRANCH;
            const workflowPath = process.env.INVOCATION_PATH;
            const payload = context.payload;
            const failedSha = 'dbcca97054e25a2eb7f74366ffa8256143091036';
            const failedRunId = 37858547088;
            const failedJobId = 113588502016;
            const parentRefusalSha = '301937cca45f32cfae281371182309e46a7aa127';
            const parentRefusalRunId = 37860166953;
            const parentRefusalJobId = 113593725609;
            const workflowId = 379112770;
            if (context.eventName !== 'push' || context.repo.owner !== repo.owner || context.repo.repo !== repo.repo ||
                context.ref !== `refs/heads/${branchName}` || payload.repository?.fork !== false ||
                payload.repository?.default_branch !== 'main' || payload.created !== false ||
                payload.deleted !== false || payload.forced !== false ||
                payload.before !== parentRefusalSha ||
                payload.after !== context.sha || payload.head_commit?.id !== context.sha ||
                process.env.GITHUB_RUN_ATTEMPT !== '1') {
              throw new Error('Only the reviewed final update from the exact unsafe-parent refusal commit is eligible.');
            }
            const { data: invocationBranch } = await github.rest.repos.getBranch({ ...repo, branch: branchName });
            if (invocationBranch.commit.sha !== context.sha) throw new Error('Invocation branch changed.');
            const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: context.sha });
            if (commit.sha !== context.sha || commit.parents.length !== 1 || commit.parents[0].sha !== parentRefusalSha ||
                commit.files?.length !== 1 || commit.files[0].filename !== workflowPath ||
                commit.files[0].status !== 'modified' || commit.files[0].previous_filename) {
              throw new Error('Final invocation must modify only this workflow directly on the second failed invocation.');
            }
            const { data: failed } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: failedRunId });
            const matchesRun = (run, id, head, number) => run?.id === id && run.head_sha === head &&
              run.path === workflowPath && run.workflow_id === workflowId && run.head_branch === branchName &&
              run.event === 'push' && run.run_attempt === 1 && run.run_number === number &&
              run.name === 'Owned R2 one-time invocation 34c4947c-ba13-4fc9-9087-0d1db8cc4d28';
            if (!matchesRun(failed, failedRunId, failedSha, 1) || failed.status !== 'completed' || failed.conclusion !== 'failure') {
              throw new Error('The exact original attempt must remain the known completed bootstrap failure.');
            }
            const { data: parentRefusal } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: parentRefusalRunId });
            if (!matchesRun(parentRefusal, parentRefusalRunId, parentRefusalSha, 2) ||
                parentRefusal.status !== 'completed' || parentRefusal.conclusion !== 'failure') {
              throw new Error('The exact second attempt must remain the independently reviewed unsafe-parent refusal.');
            }
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: workflowId, per_page: 100,
            });
            const prior = runs.workflow_runs.filter(run => run.id === failedRunId);
            const second = runs.workflow_runs.filter(run => run.id === parentRefusalRunId);
            const current = runs.workflow_runs.filter(run => run.id === context.runId);
            if (context.runId === failedRunId || context.runId === parentRefusalRunId ||
                runs.total_count !== 3 || runs.workflow_runs.length !== 3 ||
                prior.length !== 1 || second.length !== 1 || current.length !== 1 ||
                !matchesRun(prior[0], failedRunId, failedSha, 1) || prior[0].status !== 'completed' || prior[0].conclusion !== 'failure' ||
                !matchesRun(second[0], parentRefusalRunId, parentRefusalSha, 2) || second[0].status !== 'completed' || second[0].conclusion !== 'failure' ||
                !matchesRun(current[0], context.runId, context.sha, 3) || current[0].status !== 'in_progress' || current[0].conclusion !== null) {
              throw new Error('Only both exact failed runs and this first-attempt final invocation may exist.');
            }
            const { data: source } = await github.rest.repos.getContent({ ...repo, path: workflowPath, ref: failedSha });
            if (source.type !== 'file' || source.encoding !== 'base64' ||
                require('node:crypto').createHash('sha256').update(Buffer.from(source.content, 'base64')).digest('hex') !==
                '95a978fe106ed25768995d3c834e6758430e3cbd8bd05d2c46c92ff75e0e2fad') {
              throw new Error('Original failed workflow source does not match the reviewed bootstrap-only evidence.');
            }
            const { data: jobs } = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {
              ...repo, run_id: failedRunId, attempt_number: 1, per_page: 100,
            });
            const job = jobs.jobs?.[0];
            if (jobs.total_count !== 1 || jobs.jobs.length !== 1 || job.id !== failedJobId || job.run_id !== failedRunId ||
                job.run_attempt !== 1 || job.head_sha !== failedSha || job.head_branch !== branchName ||
                job.name !== 'acceptance' || job.status !== 'completed' || job.conclusion !== 'failure') {
              throw new Error('Original bootstrap job identity or attempt is ambiguous.');
            }
            const expectedSteps = [
              [1, 'Set up job', 'success'],
              [2, 'Refuse placeholder and require the fixed approved scope', 'success'],
              [3, 'Require first exact invocation and reviewed deployed current main', 'success'],
              [4, 'Checkout exact already-deployed main tooling', 'success'],
              [5, 'Set up pinned Node', 'failure'],
              [6, 'Verify the unchanged exact fixture plan and all 38 offline guards', 'skipped'],
              [7, 'Configure existing pinned AYIN SSH trust', 'skipped'],
              [8, 'Require healthy exact active release without provider calls', 'skipped'],
              [9, 'Recheck current main and successful deployment immediately before execution', 'skipped'],
              [10, 'Invoke the unchanged approved driver exactly once', 'skipped'],
              [11, 'Upload only allowlisted observations', 'success'],
              [12, 'Remove ephemeral runner SSH material', 'success'],
              [23, 'Post Set up pinned Node', 'skipped'],
              [24, 'Post Checkout exact already-deployed main tooling', 'success'],
              [25, 'Complete job', 'success'],
            ];
            if (!Array.isArray(job.steps) || job.steps.length !== expectedSteps.length ||
                job.steps.some((step, index) => step.status !== 'completed' ||
                  step.number !== expectedSteps[index][0] || step.name !== expectedSteps[index][1] ||
                  step.conclusion !== expectedSteps[index][2])) {
              throw new Error('Original run must have only the known Node bootstrap failure with every SSH/provider step skipped.');
            }
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({ ...repo, run_id: failedRunId, per_page: 100 });
            if (artifacts.total_count !== 0 || artifacts.artifacts.length !== 0) {
              throw new Error('Unexpected original-run artifacts make the bootstrap exception inconclusive.');
            }
            const { data: secondSource } = await github.rest.repos.getContent({ ...repo, path: workflowPath, ref: parentRefusalSha });
            if (secondSource.type !== 'file' || secondSource.encoding !== 'base64' ||
                require('node:crypto').createHash('sha256').update(Buffer.from(secondSource.content, 'base64')).digest('hex') !==
                'b84206d7d8494c86e4e5050127a89e626570940173675968cb84a5edc7cc03a2') {
              throw new Error('Second failed workflow source does not match the reviewed parent-refusal evidence.');
            }
            const { data: secondJobs } = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs', {
              ...repo, run_id: parentRefusalRunId, attempt_number: 1, per_page: 100,
            });
            const secondJob = secondJobs.jobs?.[0];
            if (secondJobs.total_count !== 1 || secondJobs.jobs.length !== 1 || secondJob.id !== parentRefusalJobId ||
                secondJob.run_id !== parentRefusalRunId || secondJob.run_attempt !== 1 || secondJob.head_sha !== parentRefusalSha ||
                secondJob.head_branch !== branchName || secondJob.name !== 'acceptance' ||
                secondJob.status !== 'completed' || secondJob.conclusion !== 'failure') {
              throw new Error('Second failed job identity or attempt is ambiguous.');
            }
            const expectedSecondSteps = [
              [1, "Set up job", "success"],
              [2, "Refuse placeholder and require the fixed approved scope", "success"],
              [3, "Require the exact bootstrap exception and reviewed deployed current main", "success"],
              [4, "Checkout exact already-deployed main tooling", "success"],
              [5, "Set up pinned Node", "success"],
              [6, "Verify the unchanged exact fixture plan and all 38 offline guards", "success"],
              [7, "Configure existing pinned AYIN SSH trust", "success"],
              [8, "Require healthy exact active release without provider calls", "success"],
              [9, "Recheck current main and successful deployment immediately before execution", "success"],
              [10, "Invoke the unchanged approved driver exactly once", "failure"],
              [11, "Upload only allowlisted observations", "success"],
              [12, "Remove ephemeral runner SSH material", "success"],
              [23, "Post Set up pinned Node", "skipped"],
              [24, "Post Checkout exact already-deployed main tooling", "success"],
              [25, "Complete job", "success"],
            ];
            if (!Array.isArray(secondJob.steps) || secondJob.steps.length !== expectedSecondSteps.length ||
                secondJob.steps.some((step, index) => step.status !== 'completed' ||
                  step.number !== expectedSecondSteps[index][0] || step.name !== expectedSecondSteps[index][1] ||
                  step.conclusion !== expectedSecondSteps[index][2])) {
              throw new Error('Second attempt differs from the exact independently reviewed parent-refusal record.');
            }
            const { data: secondArtifacts } = await github.rest.actions.listWorkflowRunArtifacts({ ...repo, run_id: parentRefusalRunId, per_page: 100 });
            if (secondArtifacts.total_count !== 0 || secondArtifacts.artifacts.length !== 0) {
              throw new Error('Unexpected second-run artifacts require separate review.');
            }
            const { data: branch } = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
            if (branch.commit.sha !== sha) throw new Error('Acceptance requires current main.');
            for (const [workflow, name] of [['deploy.yml', 'Production deployment'], ['database.yml', 'Task quality gates']]) {
              const { data } = await github.rest.actions.listWorkflowRuns({ ...repo, workflow_id: workflow, head_sha: sha, status: 'success', per_page: 100 });
              const valid = data.workflow_runs.some(run => run.name === name && run.head_sha === sha && run.head_branch === 'main' && run.conclusion === 'success' && (workflow !== 'database.yml' || run.event === 'push'));
              if (!valid) throw new Error('The exact main release needs successful quality gates and production deployment.');
            }

      - name: Checkout exact already-deployed main tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify the unchanged exact fixture plan and all 38 offline guards
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          corepack enable
          corepack pnpm install --frozen-lockfile
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { RUN_ID, PREFIX, BUCKET, CLEANUP_ACK, FIXTURES, MAX_RETAINED_BYTES } from './deploy/media/r2-owned-fixture-provider.mjs';
          import { PLAN } from './deploy/media/r2-owned-fixture-browser.mjs';
          assert.equal(RUN_ID, '34c4947c-ba13-4fc9-9087-0d1db8cc4d28');
          assert.equal(PREFIX, 'ayin-recovery-acceptance/34c4947c-ba13-4fc9-9087-0d1db8cc4d28/');
          assert.equal(BUCKET, 'ayin-production-media');
          assert.equal(CLEANUP_ACK, 'DELETE_ONLY_CREATED_FIXTURES');
          assert.equal(MAX_RETAINED_BYTES, 10485815);
          assert.deepEqual(FIXTURES, [
            { name: 'small.bin', size: 38 },
            { name: 'multipart.bin', size: 5242897 },
            { name: 'abort.bin', size: 5242880 },
          ]);
          assert.deepEqual(PLAN, [
            { fixture: 'small.bin', partNumber: 1, expectedSizeBytes: 38, payloadSizeBytes: 39, offset: 0 },
            { fixture: 'small.bin', partNumber: 1, expectedSizeBytes: 38, payloadSizeBytes: 38, offset: 0 },
            { fixture: 'multipart.bin', partNumber: 1, expectedSizeBytes: 5242880, payloadSizeBytes: 5242880, offset: 0 },
            { fixture: 'multipart.bin', partNumber: 2, expectedSizeBytes: 17, payloadSizeBytes: 17, offset: 5242880 },
            { fixture: 'abort.bin', partNumber: 1, expectedSizeBytes: 5242880, payloadSizeBytes: 5242880, offset: 0 },
          ]);
          NODE
          node --test --test-reporter=tap deploy/media/r2-owned-fixture-provider.test.mjs deploy/media/r2-owned-fixture-browser.test.mjs > "$RUNNER_TEMP/owned-r2-offline-guards.tap"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = readFileSync(`${process.env.RUNNER_TEMP}/owned-r2-offline-guards.tap`, 'utf8');
          for (const line of ['# tests 38', '# pass 38', '# fail 0', '# cancelled 0', '# skipped 0', '# todo 0']) {
            assert.equal(report.split('\n').filter(value => value === line).length, 1, 'All 38 offline guards must pass without skips.');
          }
          NODE
          corepack pnpm exec playwright install --with-deps chromium

      - name: Configure existing pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"
          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          [[ "$actual_fingerprint" == "$PINNED_SSH_HOST_FINGERPRINT" ]]
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Require healthy exact active release without provider calls
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 75s ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes \
            -o "IdentityFile=$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p 22 ayin@13.52.116.200 \
            "set -eu; test \"\$(whoami)\" = ayin; test \"\$HOME\" = /home/ayin; test ! -w /home/horusapp; cd /home/ayin/htdocs/current; test \"\$(git rev-parse HEAD)\" = '$RELEASE_SHA'; test -z \"\$(git status --porcelain --untracked-files=no)\"; curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ >/dev/null; curl --fail --silent --show-error --max-time 15 http://127.0.0.1:4000/health >/dev/null; curl --fail --silent --show-error --max-time 15 http://127.0.0.1:4000/ready >/dev/null" \
            >/dev/null 2>&1; then
            echo 'Exact active release or direct-origin health could not be verified; fixture execution refused.' >&2
            exit 1
          fi

      - name: Verify repaired parent and absent manifest without writes
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout --kill-after=2s 35s ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes \
            -o "IdentityFile=$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -p 22 ayin@13.52.116.200 \
            'python3 -' >/dev/null 2>&1 <<'PYTHON'
          import errno, os, pwd, stat
          parent = '/home/ayin'
          assert pwd.getpwuid(os.getuid()).pw_name == 'ayin' and os.environ.get('HOME') == parent
          info = os.lstat(parent)
          assert stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode)
          assert os.path.realpath(parent) == parent and info.st_uid == os.getuid()
          assert stat.S_IMODE(info.st_mode) == 0o750
          fd = os.open(parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              opened = os.fstat(fd)
              assert stat.S_ISDIR(opened.st_mode) and opened.st_uid == os.getuid()
              assert stat.S_IMODE(opened.st_mode) == 0o750 and (opened.st_dev, opened.st_ino) == (info.st_dev, info.st_ino)
              for name in ('system.posix_acl_access', 'system.posix_acl_default'):
                  try:
                      os.getxattr(fd, name)
                  except OSError as error:
                      if error.errno != errno.ENODATA:
                          raise
                  else:
                      raise AssertionError('Unexpected ACL')
              try:
                  os.stat('.r2-acceptance-manifests', dir_fd=fd, follow_symlinks=False)
              except FileNotFoundError:
                  pass
              else:
                  raise AssertionError('Existing manifest directory requires review')
          finally:
              os.close(fd)
          PYTHON
          then
            echo 'Secure repaired parent and absent manifest could not be verified; invocation refused.' >&2
            exit 1
          fi

      - name: Recheck current main and successful deployment immediately before execution
        uses: actions/github-script@v8
        with:
          script: |
            const repo = { owner: 'eltx1', repo: 'ayin' };
            const sha = process.env.RELEASE_SHA;
            const { data: branch } = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
            if (branch.commit.sha !== sha) throw new Error('Acceptance requires current main.');
            const { data: invocation } = await github.rest.repos.getBranch({ ...repo, branch: process.env.INVOCATION_BRANCH });
            if (invocation.commit.sha !== context.sha) throw new Error('Invocation branch changed.');
            for (const [workflow, name] of [['deploy.yml', 'Production deployment'], ['database.yml', 'Task quality gates']]) {
              const { data } = await github.rest.actions.listWorkflowRuns({ ...repo, workflow_id: workflow, head_sha: sha, status: 'success', per_page: 100 });
              const valid = data.workflow_runs.some(run => run.name === name && run.head_sha === sha && run.head_branch === 'main' && run.conclusion === 'success' && (workflow !== 'database.yml' || run.event === 'push'));
              if (!valid) throw new Error('The exact main release needs successful quality gates and production deployment.');
            }

      - name: Invoke the unchanged approved driver exactly once
        shell: bash
        run: |
          set -euo pipefail
          node deploy/media/r2-owned-fixture-browser.mjs \
            --execute-approved --release-sha "$RELEASE_SHA" \
            --run-id "$FIXTURE_RUN_ID" --confirm-prefix "$CONFIRM_PREFIX" \
            --ack-cleanup "$CLEANUP_ACK"

      - name: Upload only allowlisted observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: owned-r2-fixture-proof-34c4947c-ba13-4fc9-9087-0d1db8cc4d28
          path: owned-r2-proof.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove ephemeral runner SSH material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/known_hosts.candidate"
