name: Task 60 one-shot test formatter

on:
  push:
    branches:
      - task-60-arabic-rtl

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-60-arabic-rtl
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format test
        run: pnpm exec prettier --write apps/web/src/components/viewer/viewer-shell.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/viewer/viewer-shell.test.ts
          git commit -m "style(task60): format viewer shell test"
          git push origin HEAD:task-60-arabic-rtl
