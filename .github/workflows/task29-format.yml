name: Task29 format CSP

on:
  push:
    branches: [task-29-e2e-launch-checklist]
    paths: [.github/workflows/task29-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-29-e2e-launch-checklist
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/web/next.config.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/next.config.ts
          git diff --cached --quiet || git commit -m "Task 29: format CSP configuration"
          git push
