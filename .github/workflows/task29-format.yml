name: Task29 format

on:
  push:
    branches: [task-29-e2e-launch-checklist]
    paths: [.github/workflows/task29-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-29-e2e-launch-checklist
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write docs/LAUNCH_CHECKLIST.md playwright.config.ts tests/e2e/v1.acceptance.spec.ts apps/api/src/media/e2e-media-storage.adapter.ts apps/api/src/media/media-storage.config.ts apps/api/src/media/media.module.ts .github/workflows/e2e.yml package.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git diff --cached --quiet || git commit -m "Task 29: format browser acceptance suite"
          git push
