name: Security gates

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/security.yml"
      - ".github/codeql/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/workflows/security.yml"
      - ".github/codeql/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect dependency changes
        id: dependency-changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            'apps/**/package.json' \
            'packages/**/package.json')"
          if [[ -z "$changed" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency manifest or lockfile changes in this pull request."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dependency files changed:"
            printf '%s\n' "$changed"
          fi

      - name: Set up Node.js
        if: steps.dependency-changes.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        if: steps.dependency-changes.outputs.changed == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Verify dependency change and audit production graph
        if: steps.dependency-changes.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit:prod

  supply-chain:
    name: Lockfile, production audit and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Verify lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Generate sanitized CycloneDX SBOM
        run: |
          set -euo pipefail
          inventory="$RUNNER_TEMP/pnpm-production-dependencies.json"
          sbom="$RUNNER_TEMP/ayin-sbom.cdx.json"
          pnpm list --prod --recursive --depth Infinity --json > "$inventory"
          node deploy/security/generate-sbom.mjs "$inventory" "$sbom"

      - name: Upload sanitized SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ayin-sbom-cyclonedx
          path: ${{ runner.temp }}/ayin-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    name: Secret detection
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks without a token
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          checksums="$RUNNER_TEMP/gitleaks-checksums.txt"
          archive="$RUNNER_TEMP/gitleaks-linux-x64.tar.gz"
          curl --fail --silent --show-error --location \
            "$release/gitleaks_${version}_checksums.txt" \
            --output "$checksums"
          echo "061476c21adaf5441516f96f185c1a4706a83cd6329b9b38762271b3d4a52fae  $checksums" | sha256sum --check --status
          expected="$(awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz" { print $1 }' "$checksums")"
          test -n "$expected"
          curl --fail --silent --show-error --location \
            "$release/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$expected  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod 700 "$RUNNER_TEMP/gitleaks"

      - name: Scan changed commits for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              range="${GITHUB_SHA}^..${GITHUB_SHA}"
            else
              range="${BEFORE_SHA}..${GITHUB_SHA}"
            fi
          fi
          "$RUNNER_TEMP/gitleaks" git \
            --log-opts="$range" \
            --no-banner \
            --redact \
            .

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:javascript-typescript
          upload-database: false
