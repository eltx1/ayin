name: Phase5E formatting apply

on:
  pull_request:
    paths:
      - ".github/workflows/phase5e-format-preview.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'web-pwa-phase-5e-clips-policy-viewer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format only Phase5E files
        run: |
          pnpm exec prettier --write \
            apps/api/src/creator/clips.service.ts \
            apps/api/test/clips-policy.integration.test.ts \
            'apps/web/src/app/(viewer)/clips/clips-feed.tsx' \
            'apps/web/src/app/(viewer)/clips/page.tsx' \
            apps/web/src/lib/clips.ts \
            tests/e2e/clips-viewer.acceptance.spec.ts
      - name: Commit formatted files only
        shell: bash
        run: |
          set -euo pipefail
          allowed="$(mktemp)"
          actual="$(mktemp)"
          cat >"$allowed" <<'EOF'
          apps/api/src/creator/clips.service.ts
          apps/api/test/clips-policy.integration.test.ts
          apps/web/src/app/(viewer)/clips/clips-feed.tsx
          apps/web/src/app/(viewer)/clips/page.tsx
          apps/web/src/lib/clips.ts
          tests/e2e/clips-viewer.acceptance.spec.ts
          EOF
          sed -i 's/^          //' "$allowed"
          sort -o "$allowed" "$allowed"
          git diff --name-only | sort >"$actual"
          if ! diff -u "$allowed" "$actual"; then
            echo "Unexpected formatted path detected."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --pathspec-from-file="$allowed"
          test -n "$(git diff --cached --name-only)"
          git commit -m "style(clips): apply repository formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
