name: Phase5E formatting preview

on:
  pull_request:
    paths:
      - ".github/workflows/phase5e-format-preview.yml"

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Phase5E files
        run: |
          pnpm exec prettier --write \
            apps/api/src/creator/clips.service.ts \
            apps/api/test/clips-policy.integration.test.ts \
            'apps/web/src/app/(viewer)/clips/clips-feed.tsx' \
            'apps/web/src/app/(viewer)/clips/page.tsx' \
            apps/web/src/lib/clips.ts \
            tests/e2e/clips-viewer.acceptance.spec.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: phase5e-formatted-files
          path: |
            apps/api/src/creator/clips.service.ts
            apps/api/test/clips-policy.integration.test.ts
            apps/web/src/app/(viewer)/clips/clips-feed.tsx
            apps/web/src/app/(viewer)/clips/page.tsx
            apps/web/src/lib/clips.ts
            tests/e2e/clips-viewer.acceptance.spec.ts
          retention-days: 1
