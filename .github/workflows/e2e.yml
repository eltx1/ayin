name: V1 browser acceptance

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/e2e/**"
      - "tests/pwa/**"
      - "playwright.config.ts"
      - "playwright.pwa.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_e2e
          POSTGRES_USER: ayin
          POSTGRES_PASSWORD: ayin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_e2e?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_e2e?schema=public
      AUTH_TOKEN_SECRET: task-29-e2e-auth-secret-with-more-than-32-characters
      UPLOAD_SESSION_SECRET: task-29-e2e-upload-secret-with-more-than-32-characters
      PAYOUT_DATA_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      WEB_ORIGIN: http://127.0.0.1:3000
      CORS_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_MEDIA_BASE_URL: http://media.invalid
      AYIN_E2E_STORAGE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate Prisma client and migrate
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed
      - name: Build release candidate
        run: pnpm build
      - name: Run browser acceptance
        # Separate server processes keep independent fixture registration bursts
        # from exhausting the real test-mode limiter; every ordinary test runs once.
        run: |
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/shard-1 pnpm test:e2e --shard=1/3 --output=test-results/shard-1
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/shard-2 pnpm test:e2e --shard=2/3 --output=test-results/shard-2
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/shard-3 pnpm test:e2e --shard=3/3 --output=test-results/shard-3
      - name: Run real PWA lifecycle acceptance
        run: pnpm exec playwright test --config playwright.pwa.config.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Upload PWA lifecycle failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pwa
          path: playwright-report-pwa
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve public product visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-directory-visuals
          path: |
            test-results/**/directory-*.png
            test-results/**/navigation-*.png
            test-results/**/design-*.png
            test-results-pwa/**/design-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve controlled runtime measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-runtime-measurements
          path: test-results/**/performance-baseline-*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve real PWA lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-lifecycle-evidence
          path: test-results-pwa/**/pwa-lifecycle-*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve PWA lifecycle visual evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-lifecycle-visuals
          path: test-results-pwa/**/design-pwa-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve Admin channel visual evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-channel-visuals
          path: test-results/**/design-admin-channels-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve Creator finance visual evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-finance-visuals
          path: test-results/**/design-creator-finance-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve Creator TV visual evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-tv-visuals
          path: test-results/**/design-creator-tv-management-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve Admin finance visual evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-finance-visuals
          path: test-results/**/design-admin-finance-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve upload history visual evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-history-visuals
          path: test-results/**/design-upload-history-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve Admin payout detail visual evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-payout-detail-visuals
          path: test-results/**/design-admin-payout-detail-*.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Preserve native account administration visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-users-visuals
          path: test-results/**/design-admin-users-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve public policy channel and playlist visuals separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-channel-playlist-policy-visuals
          path: test-results/**/design-policy-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve native TV administration visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-tv-visuals
          path: test-results/**/design-admin-tv-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve native video administration visuals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-videos-visuals
          path: test-results/**/design-admin-videos-*.png
