name: V1 browser acceptance

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "tests/e2e/**"
      - "tests/performance-media/**"
      - "tests/performance-upload/**"
      - "tests/recovery/**"
      - "tests/player-localization/**"
      - "tests/pwa/**"
      - "tests/captions/**"
      - "playwright.config.ts"
      - "playwright.performance.config.ts"
      - "playwright.native-media.config.ts"
      - "playwright.changed-routes.config.ts"
      - "playwright.upload-transport.config.ts"
      - "playwright.recovery.config.ts"
      - "playwright.player-localization.config.ts"
      - "playwright.pwa.config.ts"
      - "playwright.captions.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_e2e
          POSTGRES_USER: ayin
          POSTGRES_PASSWORD: ayin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_e2e?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_e2e?schema=public
      AUTH_TOKEN_SECRET: task-29-e2e-auth-secret-with-more-than-32-characters
      UPLOAD_SESSION_SECRET: task-29-e2e-upload-secret-with-more-than-32-characters
      PAYOUT_DATA_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      WEB_ORIGIN: http://127.0.0.1:3000
      CORS_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_MEDIA_BASE_URL: http://media.invalid
      AYIN_E2E_STORAGE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate Prisma client and migrate
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed
      - name: Build release candidate
        run: pnpm build
      - name: Run browser acceptance
        # Separate server processes keep independent fixture registration bursts
        # from exhausting the real test-mode limiter; every ordinary test runs once.
        run: |
          status=0
          for shard in 1 2 3 4 5 6 7 8; do
            PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/shard-${shard}" pnpm test:e2e --shard="${shard}/8" --output="test-results/shard-${shard}" || status=1
          done
          exit "$status"
      - name: Run real PWA lifecycle acceptance
        run: pnpm exec playwright test --config playwright.pwa.config.ts
      - name: Run dormant upload recovery against synthetic provider and PostgreSQL
        run: pnpm test:e2e:recovery
      - name: Preserve upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-recovery-evidence
          path: test-results-recovery
          if-no-files-found: ignore
          retention-days: 7
      - name: Run caption recovery against independent HTTP storage
        timeout-minutes: 10
        # The eighteen dedicated journeys use real PUT/HEAD/read bytes, not the
        # ordinary E2E adapter's hardcoded caption object. Keep counts separate.
        env:
          NEXT_PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:3002
        run: |
          pnpm --filter @ayin/web build
          pnpm test:e2e:captions
      - name: Preserve caption recovery evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caption-recovery-visuals-and-traces
          path: |
            test-results-captions/**/captions-*.png
            test-results-captions/**/test-failed-*.png
            test-results-captions/**/trace.zip
            playwright-report-captions
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare native player media tooling
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Run localized native player acceptance
        env:
          NEXT_PUBLIC_MEDIA_BASE_URL: http://127.0.0.1:3000
        run: |
          pnpm --filter @ayin/web build
          pnpm exec playwright test --config playwright.player-localization.config.ts
      - name: Preserve localized player evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-localization-evidence
          path: |
            test-results-player-localization/**/player-*.png
            test-results-player-localization/**/player-*.json
            test-results-player-localization/**/test-failed-*.png
            test-results-player-localization/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve policy navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-navigation-evidence
          path: test-results/**/legal-navigation-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Preserve Clips layout evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-layout-evidence
          path: |
            test-results/**/clips-layout-*.png
            test-results/**/clips-layout-*.json
            test-results/**/clips-layout.acceptance-*/test-failed-*.png
            test-results/**/clips-layout.acceptance-*/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve Clips audience and social evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-audience-evidence
          path: |
            test-results/**/clips-audience-*.png
            test-results/**/clips-audience-*.json
            test-results/**/clips-viewer-audience.acceptance-*/test-failed-*.png
            test-results/**/clips-viewer-audience.acceptance-*/error-context.md
            test-results/**/clips-viewer-audience.acceptance-*/trace.zip
            test-results/**/clips-social-scope.acceptance-*/test-failed-*.png
            test-results/**/clips-social-scope.acceptance-*/error-context.md
            test-results/**/clips-social-scope.acceptance-*/trace.zip
            test-results/**/clips-focus-autoplay.acceptance-*/test-failed-*.png
            test-results/**/clips-focus-autoplay.acceptance-*/error-context.md
            test-results/**/clips-position-authority.acceptance-*/test-failed-*.png
            test-results/**/clips-position-authority.acceptance-*/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve Auth recovery visual evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-recovery-visuals
          path: |
            test-results/**/design-auth-recovery-*.png
            test-results/**/auth-recovery.acceptance-*/test-failed-*.png
            test-results/**/auth-recovery.acceptance-*/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve Catalog discovery visual evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-discovery-visuals
          path: |
            test-results/**/catalog-*.png
            test-results/**/catalog-*.json
            test-results/**/global-search-*.png
            test-results/**/catalog-*.acceptance-*/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload PWA lifecycle failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pwa
          path: playwright-report-pwa
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve public product visual evidence
        if: always()
