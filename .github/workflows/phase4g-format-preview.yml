name: Phase4G formatting apply

on:
  pull_request:
    paths:
      - ".github/workflows/phase4g-format-preview.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'web-pwa-phase-4g-social-action-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact Phase4G files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/social/subscribe-button.tsx \
            apps/web/src/components/social/video-social-actions.tsx \
            apps/web/src/lib/social-action-contracts.test.ts \
            tests/e2e/social-actions.acceptance.spec.ts
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/web/src/components/social/subscribe-button.tsx \
            apps/web/src/components/social/video-social-actions.tsx \
            apps/web/src/lib/social-action-contracts.test.ts \
            tests/e2e/social-actions.acceptance.spec.ts
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            apps/web/src/components/social/subscribe-button.tsx \
            apps/web/src/components/social/video-social-actions.tsx \
            apps/web/src/lib/social-action-contracts.test.ts \
            tests/e2e/social-actions.acceptance.spec.ts | sort)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(social): apply repository formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
