name: Diagnose AYIN deployment resources
# Read-only existing bucket CORS preflight; no provider writes or configuration changes.

on:
  push:
    branches:
      - diagnose/ayin-build-resources-20261008
    paths:
      - .github/workflows/diagnose-build-resources.yml

permissions:
  contents: read

concurrency:
  group: ayin-readonly-build-diagnostic-20261008
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Checkout resource diagnostics
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"

          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$PINNED_SSH_HOST_FINGERPRINT" ]]; then
            echo "SSH host fingerprint mismatch. Expected $PINNED_SSH_HOST_FINGERPRINT, got $actual_fingerprint" >&2
            rm -f "$candidate"
            exit 1
          fi

          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "Pinned AYIN SSH host fingerprint verified."

      - name: Read existing R2 CORS flags without changes
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 35s ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes \
            -o "IdentityFile=$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts" -o ConnectTimeout=10 \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(id -un)" == 'ayin' && "$HOME" == '/home/ayin' ]]
          test ! -w /home/horusapp
          current="$(readlink -f /home/ayin/htdocs/current)"
          [[ "$current" == /home/ayin/htdocs/releases/* ]]
          cd /home/ayin/htdocs/current
          [[ "$(git rev-parse HEAD)" == 'a6c15842bd2cf6990715f18d58a550a5929d8d41' ]]
          timeout --kill-after=2s 20s node deploy/run-with-env.cjs /home/ayin/env/api.env node - 2>/dev/null <<'NODE'
          const originalFetch = globalThis.fetch;
          globalThis.fetch = () => { throw new Error('UNEXPECTED_NETWORK'); };
          const { pathToFileURL } = require('node:url');
          const { resolve } = require('node:path');
          let networkStatus = null;
          const emit = (x) => process.stdout.write(JSON.stringify(x) + '\n');
          (async () => {
            const moduleUrl = (p) => pathToFileURL(resolve(process.cwd(),p)).href;
            const [{loadMediaStorageConfig},{R2SigV4},xml] = await Promise.all([
              import(moduleUrl('apps/api/dist/media/media-storage.config.js')),
              import(moduleUrl('apps/api/dist/media/r2-sigv4.js')),
              import(moduleUrl('apps/api/dist/media/r2-xml.js')),
            ]);
            const config = loadMediaStorageConfig(process.env);
            if(config.mode !== 'r2' || config.bucket !== 'ayin-production-media' || config.recoveryV2Enabled) throw new Error('CONFIG');
            const origin = new URL(config.endpoint).origin;
            if(!/^https:\/\/[a-f0-9]{32}\.r2\.cloudflarestorage\.com$/.test(origin)) throw new Error('ORIGIN');
            let requests = 0;
            globalThis.fetch = async (input,init) => {
              const url = new URL(input);
              if(++requests !== 1 || init.method !== 'GET' || url.origin !== origin || url.pathname !== '/ayin-production-media' || [...url.searchParams.keys()].join(',') !== 'cors' || url.searchParams.get('cors') !== '' || url.username || url.password || url.hash) throw new Error('SCOPE');
              const signal = AbortSignal.timeout(10000);
              const response = await originalFetch(input,{...init,redirect:'error',signal});
              networkStatus = response.status;
              const body = await xml.readR2XmlText(response,16384,signal);
              return new Response(body,{status:response.status,headers:response.headers});
            };
            const response = await new R2SigV4(config).request({method:'GET',query:[['cors','']]});
            if(response.status !== 200) {
              await response.body?.cancel();
              emit({probe:'existing-bucket-cors',method:'GET',httpStatus:response.status,available:false});
              process.exitCode = 1;
              return;
            }
            const root = xml.parseR2Xml(await xml.readR2XmlText(response,16384));
            if(root.name !== 'CORSConfiguration') throw new Error('SCHEMA');
            const values = (rule,name) => rule.children.filter((child) => child.name === name).map((child) => child.text.trim());
            const rules = root.children.filter((child) => child.name === 'CORSRule');
            if(rules.length > 100) throw new Error('LIMIT');
            const matching = rules.filter((rule) => values(rule,'AllowedOrigin').some((v) => v === 'https://ayin.stream' || v === '*') && values(rule,'AllowedMethod').includes('PUT'));
            emit({probe:'existing-bucket-cors',method:'GET',httpStatus:200,available:true,ayinPutAllowed:matching.length > 0,etagExposedOnFirstNoCustomHeaderMatch:matching.length > 0 && values(matching[0],'ExposeHeader').some((v) => ['etag','*'].includes(v.toLowerCase())),contentTypeAllowedOnFirstMatch:matching.length > 0 && values(matching[0],'AllowedHeader').some((v) => ['content-type','*'].includes(v.toLowerCase())),providerWrites:0});
          })().catch(() => { emit({probe:'existing-bucket-cors',available:false,httpStatus:Number.isInteger(networkStatus) ? networkStatus : null,code:'READ_ONLY_CORS_PROBE_FAILED'}); process.exitCode=1; });
          NODE
          REMOTE
