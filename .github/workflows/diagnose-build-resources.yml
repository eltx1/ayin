name: Diagnose AYIN deployment resources
# One bounded GET-only signature-negative CORS probe; preserve all retained state.

on:
  push:
    branches:
      - diagnose/ayin-build-resources-20261008
    paths:
      - .github/workflows/diagnose-build-resources.yml

permissions:
  contents: read

concurrency:
  group: ayin-readonly-build-diagnostic-20261008
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.run_attempt == 1
    environment:
      name: production
      deployment: false
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Checkout resource diagnostics
        uses: actions/checkout@v7
        with:
          ref: a6c15842bd2cf6990715f18d58a550a5929d8d41
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install locked Chromium tooling on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == 'a6c15842bd2cf6990715f18d58a550a5929d8d41' ]]
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm exec playwright install --with-deps chromium

      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"

          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$PINNED_SSH_HOST_FINGERPRINT" ]]; then
            echo "SSH host fingerprint mismatch. Expected $PINNED_SSH_HOST_FINGERPRINT, got $actual_fingerprint" >&2
            rm -f "$candidate"
            exit 1
          fi

          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "Pinned AYIN SSH host fingerprint verified."

      - name: Observe GET-only authentication failure from fresh Chromium
        shell: bash
        run: |
          set -euo pipefail
          cat > private-retained-grant.cjs <<'PRIVATE_SOURCE'
          globalThis.fetch = () => { throw new Error('DIAGNOSTIC_NETWORK_FORBIDDEN'); };
          const fs = require('node:fs');
          const { resolve } = require('node:path');
          const { pathToFileURL } = require('node:url');
          const emit = () => {};
          const expectedRelease = 'a6c15842bd2cf6990715f18d58a550a5929d8d41';
          const expectedRun = '34c4947c-ba13-4fc9-9087-0d1db8cc4d28';
          const directory = '/home/ayin/.r2-acceptance-manifests';
          const manifestPath = `${directory}/${expectedRun}.json`;
          const stages = new Set(['reserved', 'signature-capability-verified', 'all-exact-keys-clear', 'wrong-length-put-dispatched', 'part-1-put-dispatched', 'part-2-put-dispatched', 'wrong-length-provider-rejected-with-no-part', 'resume-authoritative-part-one-observed', 'direct-get-sha256-and-ayin-root-verified', 'abort-and-absence-observed', 'owned-object-deletion-and-absence-observed']);
          const states = new Set(['not-dispatched', 'dispatched-unknown', 'acknowledged', 'acknowledged-receipt-discarded']);
          const assert = (condition) => { if (!condition) throw new Error('DIAGNOSTIC_VALIDATION_FAILED'); };
          let phase = 'imports', provider;
          (async () => {
            const moduleUrl = (path) => pathToFileURL(resolve(process.cwd(), path)).href;
            const [browser, constants, configModule, adapterModule] = await Promise.all([
              import(moduleUrl('deploy/media/r2-owned-fixture-browser.mjs')),
              import(moduleUrl('deploy/media/r2-owned-fixture-provider.mjs')),
              import(moduleUrl('apps/api/dist/media/media-storage.config.js')),
              import(moduleUrl('apps/api/dist/media/r2-media-storage.adapter.js')),
            ]);
            provider = constants;
            assert(provider.RUN_ID === expectedRun && provider.BUCKET === 'ayin-production-media' && provider.PREFIX === `ayin-recovery-acceptance/${expectedRun}/`);
            phase = 'retained-manifest';
            const dir = fs.lstatSync(directory);
            assert(dir.isDirectory() && !dir.isSymbolicLink() && dir.uid === process.getuid() && (dir.mode & 0o077) === 0 && fs.realpathSync(directory) === directory);
            const before = fs.lstatSync(manifestPath);
            assert(before.isFile() && !before.isSymbolicLink() && before.uid === process.getuid() && (before.mode & 0o077) === 0 && before.size > 0 && before.size <= 65536);
            const fd = fs.openSync(manifestPath, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
            let document;
            try {
              const current = fs.fstatSync(fd);
              assert(current.isFile() && current.dev === before.dev && current.ino === before.ino && current.uid === process.getuid() && (current.mode & 0o077) === 0 && current.size > 0 && current.size <= 65536);
              const bytes = Buffer.alloc(65537);
              let length = 0, count;
              while (length < bytes.length && (count = fs.readSync(fd, bytes, length, bytes.length - length, null)) > 0) length += count;
              assert(length > 0 && length <= 65536);
              document = JSON.parse(bytes.subarray(0, length).toString('utf8'));
            } finally { fs.closeSync(fd); }
            assert(document.schema === 1 && document.runId === expectedRun && document.bucket === provider.BUCKET && document.prefix === provider.PREFIX && document.releaseSha === expectedRelease);
            assert(['RESERVED', 'OBSERVATIONS_PASSED', 'FAILED'].includes(document.status) && stages.has(document.stage));
            assert(Array.isArray(document.fixtures) && document.fixtures.length === 3);
            for (let i = 0; i < 3; i++) {
              const item = document.fixtures[i], expected = provider.FIXTURES[i];
              assert(item.name === expected.name && item.size === expected.size && item.key === provider.PREFIX + expected.name);
              assert(['create', 'complete', 'abort', 'deletion'].every((key) => states.has(item[key])) && typeof item.debt === 'boolean');
              assert(item.uploadId === null || (typeof item.uploadId === 'string' && /^[\x21-\x7e]{1,1024}$/.test(item.uploadId)));
              assert(Array.isArray(item.stages) && item.stages.length <= 256 && item.stages.every((stage) => stages.has(stage)));
            }
            const small = document.fixtures[0];
            assert(small.name === 'small.bin' && small.create === 'acknowledged' && small.abort === 'acknowledged' && small.complete === 'not-dispatched' && small.debt === false && typeof small.uploadId === 'string');
            emit({phase, result:'pass', smallFixtureStages:small.stages});
            phase = 'config-and-adapter';
            const config = configModule.loadMediaStorageConfig(process.env);
            assert(config.mode === 'r2' && config.bucket === provider.BUCKET && config.recoveryV2Enabled === false);
            const adapter = new adapterModule.R2MediaStorageAdapter(config);
            phase = 'validate-ready';
            const origin = browser.validateReady({type:'ready', r2Origin:new URL(config.endpoint).origin, releaseSha:expectedRelease}, expectedRelease);
            emit({phase, result:'pass'});
            phase = 'local-signing';
            const signed = await adapter.authorizeMultipartPart({key:small.key, uploadId:small.uploadId, partNumber:1, expectedSizeBytes:38, expiresInSeconds:90});
            const grant = {type:'grant', seq:1, fixture:'small.bin', partNumber:1, expectedSizeBytes:38, payloadSizeBytes:39, offset:0, url:signed.url, expiresAt:signed.expiresAt.toISOString()};
            browser.validateGrant(grant, 1, origin);
            // Private SSH stdout only: the GitHub controller never logs or persists this message.
            process.stdout.write(JSON.stringify({ready:{type:'ready',r2Origin:origin,releaseSha:expectedRelease}, grant}) + '\n');
          })().catch(() => { process.exitCode = 1; });
          PRIVATE_SOURCE
          cat > readonly-get-probe.mjs <<'GET_DRIVER'
          import { spawnSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { homedir } from 'node:os';
          import { chromium } from '@playwright/test';
          import { validateReady, validateGrant } from './deploy/media/r2-owned-fixture-browser.mjs';
          
          const release = 'a6c15842bd2cf6990715f18d58a550a5929d8d41';
          const webOrigin = 'https://ayin.stream';
          const emit = (value) => process.stdout.write(JSON.stringify(value) + '\n');
          const check = (value) => { if (!value) throw new Error('READ_ONLY_PROBE_GUARD'); };
          const allowedCodes = new Set(['SignatureDoesNotMatch','AccessDenied','InvalidRequest','InvalidArgument','NoSuchUpload','NoSuchKey','RequestTimeTooSkewed','ExpiredToken']);
          const header = (headers, name) => Object.entries(headers ?? {}).find(([key]) => key.toLowerCase() === name)?.[1];
          const status = (value) => Number.isInteger(value) && value >= 100 && value <= 599 ? value : null;
          let phase = 'browser-start', browser;
          try {
            browser = await chromium.launch({headless:true});
            const context = await browser.newContext({serviceWorkers:'block'});
            let grant, navigationCount = 0, browserGetCount = 0, blockedTargetMutation = false;
            await context.route('**/*', async (route) => {
              const request = route.request();
              if (!grant && request.isNavigationRequest() && request.url() === `${webOrigin}/` && request.method() === 'GET' && navigationCount++ === 0) return route.continue();
              if (grant && request.url() === grant.url) {
                if (request.method() === 'GET' && request.postData() === null && browserGetCount++ === 0) return route.continue();
                blockedTargetMutation = true;
              }
              return route.abort('blockedbyclient');
            });
            const page = await context.newPage();
            phase = 'fresh-origin';
            const navigation = await page.goto(`${webOrigin}/`, {waitUntil:'domcontentloaded',timeout:20000});
            check(navigation?.status() === 200 && new URL(page.url()).origin === webOrigin);
            phase = 'private-grant';
            const source = readFileSync('private-retained-grant.cjs','utf8');
            const remote = `set -eu\ntest "$(id -un)" = ayin\ntest "$HOME" = /home/ayin\ntest ! -w /home/horusapp\ncd /home/ayin/htdocs/current\ntest "$(git rev-parse HEAD)" = '${release}'\nexec node deploy/run-with-env.cjs /home/ayin/env/api.env node - 2>/dev/null <<'PRIVATE_GRANT'\n${source}\nPRIVATE_GRANT\n`;
            const ssh = spawnSync('ssh', ['-F','/dev/null','-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o',`IdentityFile=${homedir()}/.ssh/id_ed25519`,'-o','StrictHostKeyChecking=yes','-o',`UserKnownHostsFile=${homedir()}/.ssh/known_hosts`,'-o','ConnectTimeout=10','-o','ServerAliveInterval=5','-o','ServerAliveCountMax=3','-p','22','ayin@13.52.116.200','bash -s'], {input:remote,encoding:'utf8',timeout:35000,maxBuffer:16384,stdio:['pipe','pipe','pipe']});
            check(!ssh.error && ssh.status === 0 && Buffer.byteLength(ssh.stdout) <= 16384);
            const envelope = JSON.parse(ssh.stdout);
            check(Object.keys(envelope).sort().join(',') === 'grant,ready');
            const origin = validateReady(envelope.ready, release);
            grant = validateGrant(envelope.grant,1,origin);
            check(grant.fixture === 'small.bin' && grant.expectedSizeBytes === 38 && grant.payloadSizeBytes === 39);
            // Only the GET below consumes this PUT signature. No provider mutation is reachable.
            phase = 'browser-get';
            const client = await context.newCDPSession(page);
            await client.send('Network.enable');
            const targetIds = new Set(), extra = new Map(), requestExtra = new Map();
            const network = {httpStatus:null,acaoMatches:null,corsFailure:false,originMatches:null,noCookieOrAuthorization:null};
            const applyExtra = (event) => {
              network.httpStatus = event.httpStatus ?? network.httpStatus;
              network.acaoMatches = event.acaoMatches;
            };
            client.on('Network.requestWillBeSent', (event) => {
              if (event.request.url !== grant.url) return;
              targetIds.add(event.requestId);
              if (event.request.method !== 'GET' || event.request.hasPostData) blockedTargetMutation = true;
              if (extra.has(event.requestId)) applyExtra(extra.get(event.requestId));
              if (requestExtra.has(event.requestId)) Object.assign(network,requestExtra.get(event.requestId));
            });
            client.on('Network.requestWillBeSentExtraInfo', (event) => {
              const projected = {originMatches:header(event.headers,'origin') === webOrigin,noCookieOrAuthorization:!header(event.headers,'cookie') && !header(event.headers,'authorization')};
              if (targetIds.has(event.requestId)) Object.assign(network,projected);
              else if (requestExtra.size < 8) requestExtra.set(event.requestId,projected);
            });
            client.on('Network.responseReceived', (event) => {
              if (!targetIds.has(event.requestId)) return;
              network.httpStatus = status(event.response.status);
              network.acaoMatches = header(event.response.headers,'access-control-allow-origin') === webOrigin;
            });
            client.on('Network.responseReceivedExtraInfo', (event) => {
              const projected = {httpStatus:status(event.statusCode),acaoMatches:header(event.headers,'access-control-allow-origin') === webOrigin};
              if (targetIds.has(event.requestId)) applyExtra(projected);
              else if (extra.size < 8) extra.set(event.requestId,projected);
            });
            client.on('Network.loadingFailed', (event) => {
              if (targetIds.has(event.requestId)) network.corsFailure = Boolean(event.corsErrorStatus);
            });
            const js = await page.evaluate(async (url) => {
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(),15000);
              try {
                const response = await fetch(url,{method:'GET',mode:'cors',credentials:'omit',redirect:'error',signal:controller.signal});
                if (response.body) await response.body.cancel();
                return {outcome:'http',httpStatus:response.status};
              } catch { return {outcome:controller.signal.aborted ? 'timeout' : 'network-error',httpStatus:null}; }
              finally { clearTimeout(timer); }
            },grant.url);
            await page.waitForTimeout(250);
            emit({phase:'browser-get',methodGetOnly:browserGetCount === 1 && !blockedTargetMutation,jsOutcome:js.outcome,jsHttpStatus:status(js.httpStatus),networkHttpStatus:network.httpStatus,acaoMatches:network.acaoMatches,corsFailure:network.corsFailure,originMatches:network.originMatches,noCookieOrAuthorization:network.noCookieOrAuthorization});
            check(browserGetCount === 1 && !blockedTargetMutation && !(js.httpStatus >= 200 && js.httpStatus < 300));
            phase = 'node-get';
            validateGrant(grant,1,origin);
            const controller = new AbortController(), timer = setTimeout(() => controller.abort(),10000);
            try {
              const response = await fetch(grant.url,{method:'GET',headers:{Origin:webOrigin},redirect:'error',signal:controller.signal});
              let size = 0, text = '', code = 'unavailable';
              const reader = response.body?.getReader();
              try {
                if (reader) while (true) {
                  const part = await reader.read();
                  if (part.done) break;
                  size += part.value.byteLength;
                  if (size > 16384) break;
                  text += new TextDecoder().decode(part.value);
                }
                if (size <= 16384) {
                  const candidate = /<Code>([A-Za-z]{1,60})<\/Code>/.exec(text)?.[1];
                  code = allowedCodes.has(candidate) ? candidate : 'unrecognized';
                }
              } finally { if (reader) await reader.cancel().catch(() => {}); }
              emit({phase:'node-get',methodGetOnly:true,httpStatus:response.status,acaoMatches:response.headers.get('access-control-allow-origin') === webOrigin,bodyWithinLimit:size <= 16384,providerCode:code});
              check(response.status === 401 || response.status === 403);
            } finally { clearTimeout(timer); controller.abort(); }
          } catch {
            emit({phase,result:'failed',code:'READ_ONLY_PROBE_FAILED'});
            process.exitCode = 1;
          } finally {
            if (browser) await browser.close().catch(() => {});
          }
          GET_DRIVER
          node --check private-retained-grant.cjs
          node --check readonly-get-probe.mjs
          timeout --kill-after=2s 100s node readonly-get-probe.mjs
