name: Diagnose AYIN deployment resources

on:
  push:
    branches:
      - diagnose/ayin-build-resources-20261008
    paths:
      - .github/workflows/diagnose-build-resources.yml

permissions:
  contents: read

concurrency:
  group: ayin-readonly-build-diagnostic-20261008
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Checkout resource diagnostics
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"

          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$PINNED_SSH_HOST_FINGERPRINT" ]]; then
            echo "SSH host fingerprint mismatch. Expected $PINNED_SSH_HOST_FINGERPRINT, got $actual_fingerprint" >&2
            rm -f "$candidate"
            exit 1
          fi

          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "Pinned AYIN SSH host fingerprint verified."

      - name: Minimal one-connection resource attribution
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 20s ssh -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export LC_ALL=C
          [[ "$(id -un)" == 'ayin' && "$HOME" == '/home/ayin' ]]
          test ! -w /home/horusapp
          date -u '+snapshot=%Y-%m-%dT%H:%M:%SZ'
          getent passwd 1004 | awk -F: '
            $3 == 1004 {
              name=$1;
              if (name !~ /^(horusapp|ayin|lordai|www-data|nginx|apache|mysql|postgres)$/) name="other-service-account";
              print "uid=1004 account=" name;
            }
          ' || echo 'uid1004_account_unavailable'
          echo 'UID1004 groups: lifetime_CPU_percent_sum RSS_KiB_sum processes runnable blocked command_name'
          ps -u 1004 -o comm:20=,state=,pcpu=,rss= | awk '
            {
              name=substr($0,1,20); sub(/ +$/, "", name); gsub(/[^A-Za-z0-9_.(): -]/,"?",name);
              rest=substr($0,21); sub(/^[[:space:]]+/,"",rest); split(rest,f,/[[:space:]]+/);
              if (f[1] !~ /^[RSDTtXZPI]$/ || f[2] !~ /^[0-9.]+$/ || f[3] !~ /^[0-9]+$/) next;
              cpu[name]+=f[2]; rss[name]+=f[3]; n[name]++; run[name]+=(f[1]=="R"); blocked[name]+=(f[1]=="D");
            }
            END {for(name in n) printf "%.1f %d %d %d %d %s\n",cpu[name],rss[name],n[name],run[name],blocked[name],name}
          ' | sort -k1,1nr | awk 'NR <= 10'
          echo 'RSS sums include shared pages; CPU is process-lifetime average, not interval utilization.'
          uptime
          free -k
          REMOTE
