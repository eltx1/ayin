name: Diagnose AYIN deployment resources
# Read-only exact parent permission mode and named-access-ACL count.

on:
  push:
    branches:
      - diagnose/ayin-build-resources-20261008
    paths:
      - .github/workflows/diagnose-build-resources.yml

permissions:
  contents: read

concurrency:
  group: ayin-readonly-build-diagnostic-20261008
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Checkout resource diagnostics
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"

          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$PINNED_SSH_HOST_FINGERPRINT" ]]; then
            echo "SSH host fingerprint mismatch. Expected $PINNED_SSH_HOST_FINGERPRINT, got $actual_fingerprint" >&2
            rm -f "$candidate"
            exit 1
          fi

          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "Pinned AYIN SSH host fingerprint verified."

      - name: Read exact parent permission metadata only
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 35s ssh -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(id -un)" == 'ayin' && "$HOME" == '/home/ayin' ]]
          test ! -w /home/horusapp
          current="$(readlink -f /home/ayin/htdocs/current)"
          [[ "$current" == /home/ayin/htdocs/releases/* ]]
          cd /home/ayin/htdocs/current
          [[ "$(git rev-parse HEAD)" == 'a6c15842bd2cf6990715f18d58a550a5929d8d41' ]]
          python3 - <<'PYTHON'
          import json, os, re, shutil, stat, subprocess
          path = '/home/ayin'
          try:
              info = os.lstat(path)
              if not stat.S_ISDIR(info.st_mode) or stat.S_ISLNK(info.st_mode) or os.path.realpath(path) != path:
                  raise ValueError()
              result = {'mode':format(stat.S_IMODE(info.st_mode), '04o'), 'groupWritable':bool(info.st_mode & stat.S_IWGRP), 'worldWritable':bool(info.st_mode & stat.S_IWOTH), 'sticky':bool(info.st_mode & stat.S_ISVTX), 'ownerMatchesCurrentUid':info.st_uid == os.getuid()}
              tool = shutil.which('getfacl')
              result['aclToolAvailable'] = tool is not None
              if tool:
                  result['namedAccessAclEntryCount'] = None
                  result['hasNamedAccessAclEntries'] = None
                  try:
                      completed = subprocess.run([tool, '-c', '-n', '-p', '-a', '--', path], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=3, check=False)
                      if completed.returncode == 0 and len(completed.stdout) <= 16384:
                          lines = completed.stdout.decode('ascii', errors='strict').splitlines()
                          count = sum(bool(re.fullmatch(r'(?:user|group):[0-9]+:[rwx-]{3}(?:\s+#effective:[rwx-]{3})?', line)) for line in lines)
                          result['namedAccessAclEntryCount'] = count
                          result['hasNamedAccessAclEntries'] = count > 0
                  except Exception:
                      pass
              print(json.dumps(result), flush=True)
          except Exception:
              print(json.dumps({'metadataAvailable':False}), flush=True)
          PYTHON
          REMOTE
