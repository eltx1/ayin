name: Diagnose AYIN deployment resources
# Final read-only repaired-parent, absent-manifest and active-release attestation.

on:
  push:
    branches:
      - diagnose/ayin-build-resources-20261008
    paths:
      - .github/workflows/diagnose-build-resources.yml

permissions:
  contents: read

concurrency:
  group: ayin-readonly-build-diagnostic-20261008
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Checkout resource diagnostics
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"

          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$PINNED_SSH_HOST_FINGERPRINT" ]]; then
            echo "SSH host fingerprint mismatch. Expected $PINNED_SSH_HOST_FINGERPRINT, got $actual_fingerprint" >&2
            rm -f "$candidate"
            exit 1
          fi

          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "Pinned AYIN SSH host fingerprint verified."

      - name: Attest repaired parent and exact active release without provider calls
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 35s ssh -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(id -un)" == 'ayin' && "$HOME" == '/home/ayin' ]]
          test ! -w /home/horusapp
          current="$(readlink -f /home/ayin/htdocs/current)"
          [[ "$current" == /home/ayin/htdocs/releases/* ]]
          cd /home/ayin/htdocs/current
          active="$(git rev-parse HEAD)"
          [[ "$active" == 'a6c15842bd2cf6990715f18d58a550a5929d8d41' ]]
          printf 'current_release=%s\n' "$active"
          if ! python3 - 2>/dev/null <<'PYTHON'
          import errno, os, pwd, stat
          parent = '/home/ayin'
          assert pwd.getpwuid(os.getuid()).pw_name == 'ayin' and os.environ.get('HOME') == parent
          info = os.lstat(parent)
          assert stat.S_ISDIR(info.st_mode) and not stat.S_ISLNK(info.st_mode)
          assert os.path.realpath(parent) == parent and info.st_uid == os.getuid()
          assert stat.S_IMODE(info.st_mode) == 0o750
          fd = os.open(parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              opened = os.fstat(fd)
              assert stat.S_ISDIR(opened.st_mode) and opened.st_uid == os.getuid()
              assert stat.S_IMODE(opened.st_mode) == 0o750 and (opened.st_dev, opened.st_ino) == (info.st_dev, info.st_ino)
              for name in ('system.posix_acl_access', 'system.posix_acl_default'):
                  try:
                      os.getxattr(fd, name)
                  except OSError as error:
                      if error.errno != errno.ENODATA:
                          raise
                  else:
                      raise AssertionError('Unexpected ACL')
              try:
                  os.stat('.r2-acceptance-manifests', dir_fd=fd, follow_symlinks=False)
              except FileNotFoundError:
                  pass
              else:
                  raise AssertionError('Existing manifest directory requires review')
          finally:
              os.close(fd)
          PYTHON
          then
            echo '{"secureParentAndAbsentManifest":"failed"}'
            exit 1
          fi
          echo '{"secureParentAndAbsentManifest":"passed","manifestDirectory":"absent"}'
          python3 - <<'HEALTH'
          import json, re, urllib.error, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          passed = True
          for name, url in [('web','http://127.0.0.1:3000/'),('api_health','http://127.0.0.1:4000/health'),('api_ready','http://127.0.0.1:4000/ready')]:
              try:
                  try: response = opener.open(url, timeout=5)
                  except urllib.error.HTTPError as error: response = error
                  with response:
                      result = {'kind':name,'http_status':response.status}
                      passed = passed and response.status == 200
                      if name == 'api_ready':
                          raw = response.read(16385)
                          if len(raw) > 16384: raise ValueError()
                          body = json.loads(raw)
                          release = body.get('releaseSha','')
                          result['status'] = body.get('status') if body.get('status') in ['ready','not_ready'] else 'unavailable'
                          result['release_sha'] = release if type(release) is str and re.fullmatch('[0-9a-f]{40}',release) else 'unknown'
                          passed = passed and result['status'] == 'ready' and result['release_sha'] == 'a6c15842bd2cf6990715f18d58a550a5929d8d41'
                      print(json.dumps(result), flush=True)
              except Exception:
                  print(json.dumps({'kind':name,'status':'unavailable'}), flush=True)
                  passed = False
          raise SystemExit(0 if passed else 1)
          HEALTH
          REMOTE
