name: Diagnose AYIN deployment resources

on:
  push:
    branches:
      - diagnose/ayin-build-resources-20261008
    paths:
      - .github/workflows/diagnose-build-resources.yml

permissions:
  contents: read

concurrency:
  group: ayin-readonly-build-diagnostic-20261008
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Checkout resource diagnostics
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"

          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$PINNED_SSH_HOST_FINGERPRINT" ]]; then
            echo "SSH host fingerprint mismatch. Expected $PINNED_SSH_HOST_FINGERPRINT, got $actual_fingerprint" >&2
            rm -f "$candidate"
            exit 1
          fi

          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "Pinned AYIN SSH host fingerprint verified."

      - name: Bounded read-only lordai PHP pool projection
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 35s ssh -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(id -un)" == 'ayin' && "$HOME" == '/home/ayin' ]]
          test ! -w /home/horusapp
          command -v python3 >/dev/null
          python3 - <<'PYTHON'
          import collections, datetime, hashlib, json, os, pathlib, pwd, re, stat
          UID = 1004
          NOW = datetime.datetime.now(datetime.timezone.utc)
          START = datetime.datetime(2026, 10, 8, 20, 0, tzinfo=datetime.timezone.utc)
          END = datetime.datetime(2026, 10, 8, 20, 33, tzinfo=datetime.timezone.utc)
          def emit(kind, **values):
              print(json.dumps({'kind': kind, **values}, sort_keys=True), flush=True)
          def bounded(path, limit=131072, tail=False):
              try:
                  if not stat.S_ISREG(os.stat(path).st_mode): return None
                  with open(path, 'rb') as source:
                      size = os.fstat(source.fileno()).st_size
                      if tail:
                          source.seek(max(0, size-limit))
                      elif size > limit:
                          return None
                      return source.read(limit).decode('utf-8', 'replace')
              except (OSError, ValueError):
                  return None
          if pwd.getpwuid(UID).pw_name != 'lordai':
              emit('identity_changed'); raise SystemExit(1)
          emit('lordai_pool_snapshot', at=NOW.isoformat(), uid=UID)
          settings = {'pm', 'pm.max_children', 'pm.start_servers', 'pm.min_spare_servers', 'pm.max_spare_servers', 'pm.max_requests', 'pm.process_idle_timeout', 'request_terminate_timeout', 'request_slowlog_timeout'}
          found = 0
          scanned = 0
          for file in sorted(pathlib.Path('/etc/php/8.3/fpm/pool.d').glob('*.conf'))[:64]:
              if file.is_symlink():
                  continue
              scanned += 1
              text = bounded(file)
              if text is None:
                  continue
              sections = {}; section = None
              for line in text.splitlines():
                  line = line.strip()
                  if not line or line.startswith((';', '#')): continue
                  if re.fullmatch(r'\[[A-Za-z0-9_.:-]{1,100}\]', line):
                      section = line[1:-1]; sections.setdefault(section, {})
                  elif section and '=' in line:
                      key, value = line.split('=', 1)
                      sections[section][key.strip()] = value.split(';', 1)[0].strip()
              for section, values in sections.items():
                  if values.get('user') != 'lordai': continue
                  selected = {}
                  for key in settings:
                      value = values.get(key)
                      if value is None: selected[key] = 'not_explicit'
                      elif (key == 'pm' and value in ['dynamic', 'static', 'ondemand']) or (key != 'pm' and re.fullmatch(r'[0-9]{1,8}[smhd]?', value)): selected[key] = value
                      else: selected[key] = 'unresolved'
                  listen = values.get('listen', '')
                  listen_digest = hashlib.sha256(listen.encode()).hexdigest() if re.fullmatch(r'(127\.0\.0\.1:[0-9]{1,5}|/[A-Za-z0-9_./-]+)', listen) else None
                  emit('pool_configuration', pool=section, settings=selected, listen_sha256=listen_digest)
                  found += 1
          emit('pool_config_coverage', matching_pools=found, files_scanned=scanned, max_files=64, note='Unreadable, symlinked, or oversized files were not read.')
          for candidate in ['/etc/nginx/sites-enabled/lordai.net.conf', '/etc/nginx/sites-available/lordai.net.conf']:
              path = pathlib.Path(candidate)
              try:
                  real = path.resolve()
                  if not any(str(real).startswith(prefix) for prefix in ['/etc/nginx/sites-enabled/', '/etc/nginx/sites-available/']): continue
              except OSError: continue
              text = bounded(real)
              if text is None: continue
              domains = re.findall(r'^\s*server_name\s+([^;]+);', text, re.M)
              confirmed = any('lordai.net' in names.split() for names in domains)
              digests = []
              if confirmed:
                  for value in re.findall(r'^\s*fastcgi_pass\s+([^;]+);', text, re.M):
                      value = value.removeprefix('unix:')
                      if re.fullmatch(r'(127\.0\.0\.1:[0-9]{1,5}|/[A-Za-z0-9_./-]+)', value): digests.append(hashlib.sha256(value.encode()).hexdigest())
              emit('vhost_pool_mapping', domain='lordai.net', domain_confirmed=confirmed, fastcgi_listener_sha256=sorted(set(digests)))
              break
          else: emit('vhost_pool_mapping', domain='lordai.net', readable=False)
          processes = []
          for entry in list(pathlib.Path('/proc').iterdir())[:4096]:
              if not entry.name.isdigit(): continue
              try:
                  if entry.stat().st_uid != UID: continue
                  process_stat = (entry/'stat').read_text(); start = process_stat.rsplit(')',1)[1].split()[19]
                  status = (entry/'status').read_text()
                  fields = {key:int(value) for key,value in re.findall(r'^(VmRSS|VmHWM|VmSwap):\s+([0-9]+)', status, re.M)}
                  if entry.stat().st_uid != UID or (entry/'stat').read_text().rsplit(')',1)[1].split()[19] != start: continue
                  processes.append((fields.get('VmRSS',0), entry, start, fields))
              except (OSError, ValueError, IndexError): continue
          for _, entry, start, fields in sorted(processes, key=lambda row: row[0], reverse=True)[:5]:
              pss = bounded(entry/'smaps_rollup', 16384)
              try:
                  if entry.stat().st_uid != UID or (entry/'stat').read_text().rsplit(')',1)[1].split()[19] != start: continue
              except (OSError, IndexError): continue
              parsed = {key:int(value) for key,value in re.findall(r'^(Pss|SwapPss|Private_Clean|Private_Dirty):\s+([0-9]+)', pss or '', re.M)}
              emit('top_resident_php_sample', pid=int(entry.name), **fields, pss_readable=pss is not None, pss_kib=parsed)
          for label, candidate in [('fpm_global','/var/log/php8.3-fpm.log'), ('fpm_error','/home/lordai/logs/php/error.log'), ('fpm_slow','/home/lordai/logs/php/slow.log')]:
              text = bounded(candidate, 131072, True)
              if text is None:
                  emit('fpm_log_counts', source=label, readable=False); continue
              lines = [line for line in text.splitlines() if label != 'fpm_global' or '[pool lordai]' in line]
              counts = collections.Counter()
              stamps = []
              for line in lines:
                  low = line.lower()
                  for category, needle in [('max_children','max_children'),('busy','seems busy'),('slow_request','executing too slow'),('request_timeout','execution timed out'),('signal9','signal 9')]:
                      if needle in low: counts[category]+=1
                  match = re.match(r'\[([0-9]{2}-[A-Za-z]{3}-[0-9]{4} [0-9:]{8})\]', line)
                  if match: stamps.append(match.group(1))
              emit('fpm_log_counts', source=label, readable=True, counts=dict(counts), first_log_timestamp=stamps[0] if stamps else None, last_log_timestamp=stamps[-1] if stamps else None, note='Bounded tail counts; FPM log timezone is not established.')
          for candidate in ['/home/lordai/logs/nginx/access.log','/home/lordai/logs/nginx/lordai.net.access.log','/var/log/nginx/lordai.net.access.log']:
              text = bounded(candidate, 262144, True)
              if text is None: continue
              routes=collections.Counter(); agents=collections.Counter(); statuses=collections.Counter(); caches=collections.Counter(); minutes=collections.Counter(); durations=collections.Counter(); count=0; observed=[]
              for line in text.splitlines():
                  pieces=line.split('"')
                  if len(pieces)<7: continue
                  match=re.search(r'\[([0-9]{2}/[A-Za-z]{3}/[0-9]{4}:[0-9:]{8} [+-][0-9]{4})\]', pieces[0])
                  if not match: continue
                  try: timestamp=datetime.datetime.strptime(match.group(1),'%d/%b/%Y:%H:%M:%S %z').astimezone(datetime.timezone.utc)
                  except ValueError: continue
                  observed.append(timestamp)
                  if not START <= timestamp <= END: continue
                  request=pieces[1].split(); meta=pieces[2].split()
                  if len(request)<2 or not meta or not re.fullmatch('[1-5][0-9]{2}',meta[0]): continue
                  path=request[1].split('?',1)[0]
                  category='other_dynamic_candidate'
                  if re.search(r'\.(js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|mp4|webm)$',path,re.I): category='static_extension'
                  elif path.endswith('.php'): category='other_php'
                  for prefix, name in [('/wp-login.php','wp_login'),('/xmlrpc.php','xmlrpc'),('/wp-cron.php','wp_cron'),('/wp-admin/','wp_admin'),('/wp-json/','wp_json'),('/robots.txt','robots'),('/sitemap','sitemap')]:
                      if path.startswith(prefix): category=name; break
                  ua=pieces[5].lower(); claimed='other'
                  for needle,name in [('googlebot','ua_claim_googlebot'),('bingbot','ua_claim_bingbot'),('facebookexternalhit','ua_claim_meta_facebook'),('facebot','ua_claim_meta_facebook'),('facebookcatalog','ua_claim_meta_facebook'),('meta-external','ua_claim_meta_facebook'),('meta-webindexer','ua_claim_meta_facebook'),('bot','ua_claim_other_bot'),('spider','ua_claim_other_bot'),('crawler','ua_claim_other_bot')]:
                      if needle in ua: claimed=name; break
                  cache=re.search(r'\b(HIT|MISS|BYPASS|EXPIRED|STALE|UPDATING|REVALIDATED)\b',pieces[-1])
                  duration=re.search(r'\b(?:rt|request_time)=([0-9]{1,8}(?:\.[0-9]{1,6})?)\b',pieces[-1])
                  seconds=float(duration.group(1)) if duration else None
                  durations['not_observed' if seconds is None else 'lt_100ms' if seconds<0.1 else '100ms_to_1s' if seconds<1 else '1s_to_5s' if seconds<5 else 'gte_5s']+=1
                  routes[category]+=1; agents[claimed]+=1; statuses[meta[0][0]+'xx']+=1; caches[cache.group(1) if cache else 'not_observed']+=1; minutes[timestamp.strftime('%Y-%m-%dT%H:%MZ')]+=1;count+=1
              emit('access_log_categories', readable=True, incident_start=START.isoformat(), incident_end=END.isoformat(), observed_first=min(observed).isoformat() if observed else None, observed_last=max(observed).isoformat() if observed else None, bounded_tail_bytes=262144, requests=count, routes=dict(routes), user_agent_claims=dict(agents), status_classes=dict(statuses), cache_tokens=dict(caches), duration_buckets=dict(durations), requests_by_minute=dict(sorted(minutes.items())), note='UA text is not verified bot identity; tail counts are not complete incident totals.')
              break
          else: emit('access_log_categories', readable=False)
          PYTHON
          REMOTE
