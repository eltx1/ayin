name: Diagnose AYIN deployment resources

on:
  push:
    branches:
      - diagnose/ayin-build-resources-20261008
    paths:
      - .github/workflows/diagnose-build-resources.yml

permissions:
  contents: read

concurrency:
  group: ayin-readonly-build-diagnostic-20261008
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Checkout resource diagnostics
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"

          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$PINNED_SSH_HOST_FINGERPRINT" ]]; then
            echo "SSH host fingerprint mismatch. Expected $PINNED_SSH_HOST_FINGERPRINT, got $actual_fingerprint" >&2
            rm -f "$candidate"
            exit 1
          fi

          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "Pinned AYIN SSH host fingerprint verified."

      - name: Verify isolated AYIN account
        id: verify_isolated_account
        shell: bash
        run: |
          set -euo pipefail
          remote_user="$(ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'whoami')"
          [[ "$remote_user" == 'ayin' ]]
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; test \"\$HOME\" = '/home/ayin'; test -w /home/ayin/htdocs/releases; test -w /home/ayin/env; test ! -w /home/horusapp"

      - name: Read isolated resource and health snapshot
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=5s 90s ssh -o BatchMode=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(id -un)" == 'ayin' && "$HOME" == '/home/ayin' ]]
          test ! -w /home/horusapp
          echo '=== snapshot timestamp ==='
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          uptime
          echo '=== memory and swap KiB ==='
          free -k
          echo '=== aggregate kernel OOM counter (not attribution) ==='
          awk '$1 == "oom_kill" {print}' /proc/vmstat
          echo '=== CPU architecture/count ==='
          uname -m
          getconf _NPROCESSORS_ONLN
          echo '=== release filesystem capacity ==='
          df -k /home/ayin/htdocs/releases
          echo '=== AYIN process names and RSS KiB only ==='
          ps -u "$(id -u)" -o pid=,ppid=,comm=,state=,etimes=,pcpu=,rss= --sort=-rss | awk 'NR <= 30'
          echo '=== aggregate process states (no other-user process details) ===' 
          ps -e -o state= | awk '{state[$1]++} END {for (s in state) if (s ~ /^[RSDTtXZPI]$/) print s, state[s]}'
          echo '=== aggregate pressure counters ==='
          for resource in cpu memory io; do
            if [[ -r "/proc/pressure/$resource" ]]; then
              printf '%s: ' "$resource"
              tr '\n' ' ' < "/proc/pressure/$resource"
              printf '\n'
            fi
          done
          if command -v vmstat >/dev/null 2>&1; then vmstat 1 3; fi
          echo '=== readable cgroup memory counters ==='
          cgroup_path="$(awk -F: '$1 == "0" {print $3}' /proc/self/cgroup)"
          if [[ "$cgroup_path" == /* && "$cgroup_path" != *..* ]]; then
            relative="$cgroup_path"
            while :; do
              for counter in memory.current memory.peak memory.max memory.events memory.swap.current memory.swap.max; do
                file="/sys/fs/cgroup${relative}/$counter"
                if [[ -r "$file" ]]; then
                  printf '%s: ' "$file"
                  tr '\n' ' ' < "$file"
                  printf '\n'
                fi
              done
              [[ -n "$relative" ]] || break
              relative="${relative%/*}"
            done
          fi
          echo '=== currently selected AYIN release ==='
          current="$(readlink -f /home/ayin/htdocs/current || true)"
          case "$current" in
            /home/ayin/htdocs/releases/*)
              git -C "$current" rev-parse HEAD
              ;;
            *) echo 'current_release_unavailable' ;;
          esac
          echo '=== direct-origin health HTTP status only ==='
          for route in 'http://127.0.0.1:3000/' 'http://127.0.0.1:4000/health' 'http://127.0.0.1:4000/ready'; do
            code="$(curl --silent --output /dev/null --max-time 10 --write-out '%{http_code}' "$route" || true)"
            printf '%s %s\n' "$route" "$code"
          done
          echo '=== bounded readiness projection and failed-build process lineage ==='
          node <<'NODE'
          const fs = require("node:fs");
          const ownUid = process.getuid();
          const failedRelease = "/home/ayin/htdocs/releases/20261008T193523Z-654092a7a0bc";
          const safeNumber = (n) => typeof n === "number" && Number.isFinite(n) && n >= 0 ? n : null;
          const safeStatus = (s) => ["ready", "not_ready", "ok", "unhealthy", "unknown", "disabled"].includes(s) ? s : "unavailable";
          const sha = (s) => typeof s === "string" && /^[0-9a-f]{40}$/i.test(s) ? s : "unknown";
          async function readiness() {
            try {
              const response = await fetch("http://127.0.0.1:4000/ready", {signal: AbortSignal.timeout(10000)});
              const reader = response.body.getReader();
              let size = 0;
              const chunks = [];
              while (true) {
                const {done, value} = await reader.read();
                if (done) break;
                size += value.length;
                if (size > 16384) {await reader.cancel(); throw new Error("size");}
                chunks.push(Buffer.from(value));
              }
              const body = JSON.parse(Buffer.concat(chunks).toString("utf8"));
              const checks = body.checks ?? {};
              const worker = checks.worker ?? {};
              console.log(JSON.stringify({
                kind: "readiness", httpStatus: response.status,
                status: safeStatus(body.status), releaseSha: sha(body.releaseSha),
                database: {status: safeStatus(checks.database?.status), latencyMs: safeNumber(checks.database?.latencyMs)},
                configuration: {status: safeStatus(checks.configuration?.status)},
                worker: {
                  status: safeStatus(worker.status), ageSeconds: safeNumber(worker.ageSeconds),
                  releaseMatchesApi: typeof worker.releaseMatchesApi === "boolean" ? worker.releaseMatchesApi : null,
                  activeJobs: safeNumber(worker.activeJobs),
                  reason: ["settings_unavailable", "heartbeat_missing"].includes(worker.reason) ? worker.reason : null,
                },
              }));
            } catch {
              console.log(JSON.stringify({kind: "readiness", status: "unavailable"}));
            }
          }
          function processIdentity(pid) {
            const dir = `/proc/${pid}`;
            if (fs.statSync(dir).uid !== ownUid) return null;
            const data = fs.readFileSync(`${dir}/stat`, "utf8");
            const fields = data.slice(data.lastIndexOf(")") + 2).split(" ");
            const ppid = Number(fields[1]);
            const startTicks = Number(fields[19]);
            if (!Number.isSafeInteger(ppid) || !Number.isSafeInteger(startTicks)) return null;
            const name = fs.readFileSync(`${dir}/comm`, "utf8").trim().slice(0, 15).replace(/[^A-Za-z0-9 _./():-]/g, "?");
            if (fs.statSync(dir).uid !== ownUid) return null;
            const verified = fs.readFileSync(`${dir}/stat`, "utf8");
            const verifiedFields = verified.slice(verified.lastIndexOf(")") + 2).split(" ");
            if (Number(verifiedFields[19]) !== startTicks || Number(verifiedFields[1]) !== ppid) return null;
            return {pid, ppid, name, startTicks};
          }
          const numericField = (data, field) => {
            const value = data.match(new RegExp(`^${field}:\\s+([0-9]+)(?:\\s|$)`, "m"));
            return value ? Number(value[1]) : 0;
          };
          function resourceSnapshot() {
            const byUid = new Map();
            const own = [];
            let examined = 0;
            for (const entry of fs.readdirSync("/proc")) {
              if (!/^[0-9]+$/.test(entry)) continue;
              try {
                if (++examined > 4096) break;
                const pid = Number(entry);
                const beforeIdentity = fs.statSync(`/proc/${pid}`).uid === ownUid ? processIdentity(pid) : null;
                const status = fs.readFileSync(`/proc/${pid}/status`, "utf8");
                const uid = numericField(status, "Uid");
                const rssKiB = numericField(status, "VmRSS");
                const swapKiB = numericField(status, "VmSwap");
                const threads = numericField(status, "Threads");
                const stateMatch = status.match(/^State:\s+([A-Zt])/m);
                const state = stateMatch ? stateMatch[1] : "?";
                const aggregate = byUid.get(uid) ?? {uid, processes: 0, rssKiB: 0, swapKiB: 0, threads: 0, blocked: 0};
                aggregate.processes++; aggregate.rssKiB += rssKiB; aggregate.swapKiB += swapKiB;
                aggregate.threads += threads; aggregate.blocked += state === "D" ? 1 : 0;
                byUid.set(uid, aggregate);
                if (uid !== ownUid || own.length >= 64) continue;
                const identity = processIdentity(pid);
                if (!identity || !beforeIdentity || identity.startTicks !== beforeIdentity.startTicks || identity.ppid !== beforeIdentity.ppid) continue;
                let readBytes = null; let writeBytes = null;
                try {
                  const io = fs.readFileSync(`/proc/${pid}/io`, "utf8");
                  readBytes = numericField(io, "read_bytes"); writeBytes = numericField(io, "write_bytes");
                } catch {}
                const afterIdentity = processIdentity(pid);
                if (!afterIdentity || afterIdentity.startTicks !== identity.startTicks || afterIdentity.ppid !== identity.ppid) continue;
                own.push({...identity, state, rssKiB, swapKiB, threads, readBytes, writeBytes});
              } catch {}
            }
            return {byUid: [...byUid.values()].sort((a,b) => b.rssKiB - a.rssKiB).slice(0,8), own, truncated: examined > 4096};
          }
          async function resourceAttribution() {
            const started = performance.now();
            const before = resourceSnapshot();
            await new Promise(resolve => setTimeout(resolve, 1000));
            const after = resourceSnapshot();
            console.log(JSON.stringify({kind: "per_uid_resource_totals", at: new Date().toISOString(), aggregates: after.byUid, truncated: after.truncated, intervalMs: Math.round(performance.now() - started), note: "RSS sums include shared pages; these are not PSS totals."}));
            for (const process of after.own) {
              const old = before.own.find(item => item.pid === process.pid && item.startTicks === process.startTicks);
              console.log(JSON.stringify({kind: "own_process_resources", ...process,
                readBytesDelta: old && old.readBytes !== null && process.readBytes !== null ? safeNumber(process.readBytes - old.readBytes) : null,
                writeBytesDelta: old && old.writeBytes !== null && process.writeBytes !== null ? safeNumber(process.writeBytes - old.writeBytes) : null,
              }));
            }
          }
          let matches = 0;
          let inspected = 0;
          for (const entry of fs.readdirSync("/proc")) {
            if (!/^[0-9]+$/.test(entry)) continue;
            try {
              const pid = Number(entry);
              if (fs.statSync(`/proc/${pid}`).uid !== ownUid) continue;
              if (++inspected > 256) break;
              const initialIdentity = processIdentity(pid);
              if (!initialIdentity) continue;
              const cwd = fs.readlinkSync(`/proc/${pid}/cwd`);
              if (cwd !== failedRelease && !cwd.startsWith(`${failedRelease}/`)) continue;
              const lineage = [];
              let ancestor = pid;
              for (let i = 0; i < 8 && ancestor > 1; i++) {
                const identity = processIdentity(ancestor);
                if (!identity) break;
                lineage.push(identity);
                if (identity.ppid === ancestor) break;
                ancestor = identity.ppid;
              }
              const finalIdentity = processIdentity(pid);
              if (!finalIdentity || finalIdentity.startTicks !== initialIdentity.startTicks || finalIdentity.ppid !== initialIdentity.ppid) continue;
              matches++;
              console.log(JSON.stringify({kind: "failed_release_process", matchesFailedRelease: true, lineage}));
            } catch {}
          }
          console.log(JSON.stringify({kind: "failed_release_process_summary", matches, ownProcessesInspected: inspected, truncated: inspected > 256}));
          void Promise.all([readiness(), resourceAttribution()]);
          NODE
          echo '=== readable kernel OOM evidence (allowlisted fields only) ==='
          if command -v journalctl >/dev/null 2>&1; then
            uid="$(id -u)"
            journalctl --kernel --since '2026-10-08 19:30:00 UTC' --until '2026-10-08 20:10:00 UTC' \
              --no-pager --quiet --output=short-iso 2>/dev/null | \
              awk -v uid="$uid" '
                /Out of memory: Killed process|Memory cgroup out of memory: Killed process/ && $0 ~ "(^|[[:space:]])UID:" uid "([[:space:]]|$)" {
                  for (i=1;i<=NF;i++) {
                    if ($1 ~ /^[0-9T:+.-]+$/ && $i == "Killed" && $(i+1) == "process" && $(i+2) ~ /^[0-9]+$/ && $(i+3) ~ /^\((node|next-server|next-build|pnpm|npm)\)$/) {
                      printf "timestamp=%s process=%s pid=%s", $1, $(i+3), $(i+2);
                      for (j=i+4;j<=NF;j++) if ($j ~ /^((total-vm|anon-rss|file-rss|shmem-rss):[0-9]+kB,?|UID:[0-9]+|oom_score_adj:-?[0-9]+)$/) printf " %s", $j;
                      printf "\n";
                      matches++;
                    }
                  }
                }
                END {if (!matches) print "No matching readable AYIN Node OOM evidence (not proof of absence)."}
              ' || echo 'Kernel evidence unavailable to the AYIN account.'
          else
            echo 'Kernel journal unavailable.'
          fi
          REMOTE
