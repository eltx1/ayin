name: Diagnose AYIN deployment resources
# Post-release verification for 83faf1a249dfd083458a9c25646dc2fe6982b7db on 2026-10-08.

on:
  push:
    branches:
      - diagnose/ayin-build-resources-20261008
    paths:
      - .github/workflows/diagnose-build-resources.yml

permissions:
  contents: read

concurrency:
  group: ayin-readonly-build-diagnostic-20261008
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Checkout resource diagnostics
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"

          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$PINNED_SSH_HOST_FINGERPRINT" ]]; then
            echo "SSH host fingerprint mismatch. Expected $PINNED_SSH_HOST_FINGERPRINT, got $actual_fingerprint" >&2
            rm -f "$candidate"
            exit 1
          fi

          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "Pinned AYIN SSH host fingerprint verified."

      - name: Read AYIN release readiness and shared-host headroom
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=2s 35s ssh -o BatchMode=yes \
            -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3 \
            -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(id -un)" == 'ayin' && "$HOME" == '/home/ayin' ]]
          test ! -w /home/horusapp
          date -u '+snapshot=%Y-%m-%dT%H:%M:%SZ'
          current="$(readlink -f /home/ayin/htdocs/current || true)"
          case "$current" in
            /home/ayin/htdocs/releases/*) printf 'current_release='; git -C "$current" rev-parse HEAD ;;
            *) echo 'current_release=unavailable' ;;
          esac
          uptime
          free -k
          for resource in cpu memory io; do
            if [[ -r "/proc/pressure/$resource" ]]; then
              printf '%s_pressure: ' "$resource"
              tr '\n' ' ' < "/proc/pressure/$resource"
              printf '\n'
            fi
          done
          python3 - <<'PYTHON'
          import json, math, re, urllib.error, urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          def status(value):
              return value if value in ['ready','not_ready','alive','ok','unhealthy','unknown','disabled'] else 'unavailable'
          def number(value):
              return value if type(value) in (int,float) and math.isfinite(value) and value >= 0 else None
          for name, url in [('web','http://127.0.0.1:3000/'),('api_health','http://127.0.0.1:4000/health'),('api_ready','http://127.0.0.1:4000/ready')]:
              try:
                  try: response = opener.open(url, timeout=5)
                  except urllib.error.HTTPError as error: response = error
                  with response:
                      result = {'kind':name,'http_status':response.status}
                      if name == 'api_ready':
                          raw = response.read(16385)
                          if len(raw) > 16384: raise ValueError('size')
                          body = json.loads(raw)
                          checks = body.get('checks',{}); worker = checks.get('worker',{})
                          release = body.get('releaseSha','')
                          result.update(status=status(body.get('status')), release_sha=release if type(release) is str and re.fullmatch('[0-9a-fA-F]{40}',release) else 'unknown', database_status=status(checks.get('database',{}).get('status')), database_latency_ms=number(checks.get('database',{}).get('latencyMs')), configuration_status=status(checks.get('configuration',{}).get('status')), worker_status=status(worker.get('status')), worker_age_seconds=number(worker.get('ageSeconds')), worker_active_jobs=number(worker.get('activeJobs')), worker_release_matches=worker.get('releaseMatchesApi') if type(worker.get('releaseMatchesApi')) is bool else None)
                      print(json.dumps(result), flush=True)
              except Exception:
                  print(json.dumps({'kind':name,'status':'unavailable'}), flush=True)
          PYTHON
          REMOTE
