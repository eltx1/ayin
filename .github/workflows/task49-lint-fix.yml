name: Task 49 temporary lint fix

on:
  push:
    branches:
      - task-49-privacy-controls

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-49-privacy-controls
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix lint and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/privacy/privacy-lifecycle.service.ts')
          text = path.read_text()
          text = text.replace('await this.startGrace(request, now);', 'await this.startGrace(request);')
          text = text.replace('private async startGrace(request: LifecycleClaim, now: Date)', 'private async startGrace(request: LifecycleClaim)')
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/api/src/privacy/privacy-lifecycle.service.ts
          pnpm --filter @ayin/api run lint
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task49-lint-fix.yml
          git add -A
          git commit -m "fix(task-49): remove unused lifecycle argument"
          git push origin HEAD:task-49-privacy-controls
