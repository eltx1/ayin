name: Task 41 native E2E fix helper

on:
  push:
    branches:
      - task-41-player-hls-abr

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-41-player-hls-abr
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix native-HLS browser harness
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/player-hls.acceptance.spec.ts')
          text = path.read_text()
          anchor = '      const originalCanPlayType = HTMLMediaElement.prototype.canPlayType;\n      HTMLMediaElement.prototype.canPlayType = function (type: string) {\n        if (type.toLowerCase().includes("mpegurl")) return native ? "probably" : "";\n        return originalCanPlayType.call(this, type);\n      };\n'
          addition = '      if (native) {\n        const nativeSources = new WeakMap<HTMLMediaElement, string>();\n        Object.defineProperty(HTMLMediaElement.prototype, "src", {\n          configurable: true,\n          get() {\n            return nativeSources.get(this) ?? "";\n          },\n          set(value: string) {\n            nativeSources.set(this, value);\n            (this as HTMLMediaElement).dataset.nativeHlsSource = value;\n          },\n        });\n      }\n'
          if anchor not in text:
              raise SystemExit('native canPlayType anchor missing')
          text = text.replace(anchor, anchor + addition, 1)
          old = '    await expect(page.locator("video")).toHaveAttribute("src", /master\\.m3u8$/);\n    await expect.poll(async () => (await harnessState(page)).hlsAttachCalls).toBe(0);\n'
          new = '    await expect(page.locator("video")).toHaveAttribute("data-native-hls-source", /master\\.m3u8$/);\n    await expect.poll(async () => (await harnessState(page)).hlsAttachCalls).toBe(0);\n'
          if old not in text:
              raise SystemExit('native assertion anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write tests/e2e/player-hls.acceptance.spec.ts
          pnpm exec prettier --check tests/e2e/player-hls.acceptance.spec.ts
      - name: Commit harness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/player-hls.acceptance.spec.ts
          git commit -m "test: isolate native HLS capability branch"
          git push origin HEAD:task-41-player-hls-abr
