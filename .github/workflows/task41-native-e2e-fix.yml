name: Task 41 native E2E fix helper

on:
  push:
    branches:
      - task-41-player-hls-abr

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-41-player-hls-abr
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix native-HLS browser harness
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/player-hls.acceptance.spec.ts')
          text = path.read_text()
          anchor = '''      const originalCanPlayType = HTMLMediaElement.prototype.canPlayType;
      HTMLMediaElement.prototype.canPlayType = function (type: string) {
        if (type.toLowerCase().includes("mpegurl")) return native ? "probably" : "";
        return originalCanPlayType.call(this, type);
      };
'''
          replacement = anchor + '''      if (native) {
        const nativeSources = new WeakMap<HTMLMediaElement, string>();
        Object.defineProperty(HTMLMediaElement.prototype, "src", {
          configurable: true,
          get() {
            return nativeSources.get(this) ?? "";
          },
          set(value: string) {
            nativeSources.set(this, value);
            (this as HTMLMediaElement).dataset.nativeHlsSource = value;
          },
        });
      }
'''
          if anchor not in text:
              raise SystemExit('native canPlayType anchor missing')
          text = text.replace(anchor, replacement, 1)
          old = '''    await expect(page.locator("video")).toHaveAttribute("src", /master\\.m3u8$/);
    await expect.poll(async () => (await harnessState(page)).hlsAttachCalls).toBe(0);
'''
          new = '''    await expect(page.locator("video")).toHaveAttribute("data-native-hls-source", /master\\.m3u8$/);
    await expect.poll(async () => (await harnessState(page)).hlsAttachCalls).toBe(0);
'''
          if old not in text:
              raise SystemExit('native assertion anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write tests/e2e/player-hls.acceptance.spec.ts
          pnpm exec prettier --check tests/e2e/player-hls.acceptance.spec.ts
      - name: Commit harness fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/player-hls.acceptance.spec.ts
          git commit -m "test: isolate native HLS capability branch"
          git push origin HEAD:task-41-player-hls-abr
