name: Task 21 formatter
on:
  push:
    branches: [task-21-ad-control-direct-campaigns]
    paths:
      - ".github/workflows/task21-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-21-ad-control-direct-campaigns
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/ads apps/api/src/admin/admin.module.ts apps/web/src docs/ADVERTISING_CONTROL_CENTER.md packages/db/prisma/direct-ads.prisma packages/db/prisma/migrations/20260830002100_direct_campaign_controls
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Task 21 advertising control"
          git push origin HEAD:task-21-ad-control-direct-campaigns
