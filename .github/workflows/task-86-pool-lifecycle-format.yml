name: Task 86 pool lifecycle format

on:
  push:
    branches:
      - task-86-postgres-scaling
    paths:
      - ".github/workflows/task-86-pool-lifecycle-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-86-postgres-scaling
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format pool lifecycle files
        run: |
          pnpm exec prettier --write \
            packages/db/src/index.ts \
            packages/db/test/database.integration.test.mjs
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/index.ts packages/db/test/database.integration.test.mjs
          git commit -m "style(task-86): format pool lifecycle fix"
          git push origin HEAD:task-86-postgres-scaling
