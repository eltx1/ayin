name: Patch player keyboard propagation

on:
  push:
    branches:
      - fix/upload-reliability-publish-player

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/upload-reliability-publish-player
      - name: Keep stage shortcuts away from interactive controls
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/web/src/components/player/ayin-player.tsx")
          text = path.read_text()
          old = '''  function onStageKeyDown(event: KeyboardEvent<HTMLDivElement>) {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
'''
          new = '''  function onStageKeyDown(event: KeyboardEvent<HTMLDivElement>) {
    if (
      event.target instanceof HTMLElement &&
      event.target.closest("button,input,select,textarea,a")
    ) {
      return;
    }
    if (event.altKey || event.ctrlKey || event.metaKey) return;
'''
          if old not in text:
              raise SystemExit("Expected stage keyboard handler was not found")
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch and remove temporary workflow
        run: |
          rm -f .github/workflows/patch-player-keyboard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep player shortcuts off interactive controls"
          git push origin HEAD:fix/upload-reliability-publish-player
