name: One-shot integrate media pipeline

on:
  push:
    paths:
      - ".github/workflows/one-shot-integrate-media-pipeline.yml"
      - "scripts/apply-media-pipeline-integration.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_test
          POSTGRES_PASSWORD: ayin
          POSTGRES_USER: ayin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      AUTH_TOKEN_SECRET: media-pipeline-integration-auth-secret-with-more-than-32-characters
      UPLOAD_SESSION_SECRET: media-pipeline-integration-upload-secret-with-more-than-32-characters
      CORS_ORIGIN: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public
    steps:
      - name: Check out media pipeline branch
        uses: actions/checkout@v7
        with:
          ref: ec2-ffmpeg-media-pipeline-20260904
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply integration patch
        run: python3 scripts/apply-media-pipeline-integration.py

      - name: Format integrated source
        run: pnpm exec prettier --write .

      - name: Verify formatting
        run: pnpm exec prettier --check .

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply clean migrations
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration

      - name: Production build
        run: pnpm build

      - name: Remove one-shot integration tooling
        run: |
          rm -f scripts/apply-media-pipeline-integration.py
          rm -f .github/workflows/one-shot-integrate-media-pipeline.yml

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No validated integration changes to commit."
            exit 0
          fi
          git commit -m "feat: integrate canonical media processing pipeline"
          git push origin HEAD:ec2-ffmpeg-media-pipeline-20260904
