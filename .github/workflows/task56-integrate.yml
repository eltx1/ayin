name: Task 56 temporary integrator

on:
  push:
    branches:
      - task-56-series-catalog
    paths:
      - scripts/task56-integrate.py
      - .github/workflows/task56-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v7
        with:
          ref: task-56-series-catalog

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch integrations
        run: python3 scripts/task56-integrate.py

      - name: Format changed integration files
        run: pnpm exec prettier --write apps/api/src/watch/watch.service.ts apps/api/src/search/search.service.ts apps/api/src/discovery/discovery.service.ts

      - name: Workspace typecheck
        run: pnpm typecheck

      - name: Commit integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/watch/watch.service.ts apps/api/src/search/search.service.ts apps/api/src/discovery/discovery.service.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(task56): integrate series with watch search and discovery"
          git push origin HEAD:task-56-series-catalog
