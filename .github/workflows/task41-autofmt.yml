name: Task 41 autofmt helper

on:
  push:
    branches:
      - task-41-player-hls-abr

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-41-player-hls-abr
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 41 files
        run: >-
          pnpm exec prettier --write
          apps/web/src/components/player/ayin-player.tsx
          apps/web/src/lib/adaptive-playback.ts
          apps/web/src/lib/analytics.ts
          tests/e2e/player-hls.acceptance.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/player/ayin-player.tsx apps/web/src/lib/adaptive-playback.ts apps/web/src/lib/analytics.ts tests/e2e/player-hls.acceptance.spec.ts
          git commit -m "style: format Task 41 player changes"
          git push origin HEAD:task-41-player-hls-abr
