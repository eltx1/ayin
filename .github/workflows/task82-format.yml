name: Task 82 temporary formatter

on:
  push:
    branches:
      - task-82-analytics-rollups

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-82-analytics-rollups
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository formatting and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/api/src/analytics/analytics-rollup.service.ts \
            apps/api/src/analytics/analytics.service.ts \
            apps/api/test/analytics-rollups.integration.test.ts \
            apps/web/src/components/admin/admin-dashboard.tsx
          git rm .github/workflows/task82-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/analytics/analytics-rollup.service.ts \
            apps/api/src/analytics/analytics.service.ts \
            apps/api/test/analytics-rollups.integration.test.ts \
            apps/web/src/components/admin/admin-dashboard.tsx
          git commit -m "task 82: apply repository formatting"
          git push origin HEAD:task-82-analytics-rollups
