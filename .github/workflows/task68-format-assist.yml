name: Task 68 format assist

on:
  push:
    branches:
      - task-68-gam-production

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-68-gam-production
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Format Task 68 files
        run: |
          corepack pnpm exec prettier --write \
            apps/api/src/ads/authorized-seller-file.service.test.ts \
            apps/api/src/ads/gam-production.config.ts \
            apps/api/src/ads/gam-production.controller.ts \
            apps/api/src/ads/gam-production.service.ts \
            apps/api/src/ads/gam-production.test.ts \
            apps/api/src/ads/page-ad.service.ts \
            apps/api/src/ads/video-ad.service.ts \
            apps/web/src/components/ads/page-ad-slot.tsx \
            apps/web/src/lib/advertising-consent.test.ts \
            apps/web/src/lib/advertising-consent.ts \
            apps/web/src/lib/google-ad-runtime.test.ts \
            apps/web/src/lib/google-gpt-page-ad-service.ts \
            apps/web/src/lib/google-ima-video-ad-service.ts \
            apps/web/src/lib/video-ads.ts \
            docs/GAM_PRODUCTION.md \
            packages/db/src/gam-production-hardening.test.mjs
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/ads/authorized-seller-file.service.test.ts \
            apps/api/src/ads/gam-production.config.ts \
            apps/api/src/ads/gam-production.controller.ts \
            apps/api/src/ads/gam-production.service.ts \
            apps/api/src/ads/gam-production.test.ts \
            apps/api/src/ads/page-ad.service.ts \
            apps/api/src/ads/video-ad.service.ts \
            apps/web/src/components/ads/page-ad-slot.tsx \
            apps/web/src/lib/advertising-consent.test.ts \
            apps/web/src/lib/advertising-consent.ts \
            apps/web/src/lib/google-ad-runtime.test.ts \
            apps/web/src/lib/google-gpt-page-ad-service.ts \
            apps/web/src/lib/google-ima-video-ad-service.ts \
            apps/web/src/lib/video-ads.ts \
            docs/GAM_PRODUCTION.md \
            packages/db/src/gam-production-hardening.test.mjs
          git commit -m "Format Task 68 files [skip ci]"
          git push origin HEAD:task-68-gam-production
