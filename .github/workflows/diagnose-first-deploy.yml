name: Diagnose AYIN first production startup

on:
  push:
    paths:
      - ".github/workflows/diagnose-first-deploy.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Configure pinned SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts.candidate"
          actual="$(ssh-keygen -lf "$HOME/.ssh/known_hosts.candidate" -E sha256 | awk 'NR==1 {print $2}')"
          [[ "$actual" == "$PINNED_SSH_HOST_FINGERPRINT" ]]
          mv "$HOME/.ssh/known_hosts.candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect AYIN process startup without environment output
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            echo "=== PM2 status ==="
            pm2 status
            echo "=== Listening ports 3000/4000 ==="
            ss -ltn | grep -E ":(3000|4000)[[:space:]]" || true
            echo "=== AYIN web stderr (last 80 lines) ==="
            if [ -f "$HOME/.pm2/logs/ayin-web-error.log" ]; then
              tail -n 80 "$HOME/.pm2/logs/ayin-web-error.log" \
                | sed -E "s#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g; s#(SECRET|TOKEN|PASSWORD|ACCESS_KEY)[=:][^[:space:]]+#\1=[REDACTED]#g"
            else
              echo "no ayin-web error log"
            fi
            echo "=== AYIN web stdout (last 40 lines) ==="
            if [ -f "$HOME/.pm2/logs/ayin-web-out.log" ]; then
              tail -n 40 "$HOME/.pm2/logs/ayin-web-out.log"
            else
              echo "no ayin-web out log"
            fi
            echo "=== API health only ==="
            curl --silent --show-error --output /dev/null --write-out "api_health=%{http_code}\n" --max-time 5 http://127.0.0.1:4000/health || true
          '
