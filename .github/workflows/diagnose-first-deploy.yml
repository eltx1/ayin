name: Diagnose AYIN first production startup

on:
  push:
    paths:
      - ".github/workflows/diagnose-first-deploy.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Configure pinned SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts.candidate"
          actual="$(ssh-keygen -lf "$HOME/.ssh/known_hosts.candidate" -E sha256 | awk 'NR==1 {print $2}')"
          [[ "$actual" == "$PINNED_SSH_HOST_FINGERPRINT" ]]
          mv "$HOME/.ssh/known_hosts.candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect PM2 and probe fixed release without environment output
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" '
            set -u
            current=/home/ayin/htdocs/current
            fixed_release=$(find /home/ayin/htdocs/releases -maxdepth 1 -mindepth 1 -type d -name "*-e63fe399f84e" -print -quit)

            sanitize() {
              sed -E \
                -e "s#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g" \
                -e "s#([A-Za-z0-9_]*(SECRET|TOKEN|PASSWORD|ACCESS_KEY)[A-Za-z0-9_]*[=:])[[:space:]]*[^[:space:]]+#\1[REDACTED]#g" \
                -e "s#(R2_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)=).*#\1[REDACTED]#g"
            }

            echo "=== Release pointers ==="
            printf "current=%s\n" "$(readlink -f "$current" 2>/dev/null || echo missing)"
            printf "fixed_release=%s\n" "${fixed_release:-missing}"

            echo "=== PM2 status ==="
            pm2 status || true
            echo "=== PM2 web launch definition ==="
            pm2 describe ayin-web 2>/dev/null | grep -E "status|script path|script args|exec cwd|interpreter|error log path|out log path" || true
            echo "=== PM2 api launch definition ==="
            pm2 describe ayin-api 2>/dev/null | grep -E "status|script path|script args|exec cwd|interpreter|error log path|out log path" || true

            echo "=== Existing PM2 logs ==="
            for log in \
              "$HOME/.pm2/logs/ayin-web-error-0.log" \
              "$HOME/.pm2/logs/ayin-web-out-0.log" \
              "$HOME/.pm2/logs/ayin-api-error-1.log" \
              "$HOME/.pm2/logs/ayin-api-out-1.log"; do
              echo "--- $(basename "$log") ---"
              if [ -f "$log" ]; then tail -n 60 "$log" | sanitize; else echo missing; fi
            done

            echo "=== Listening ports before direct probes ==="
            ss -ltn | grep -E ":(3000|4000)[[:space:]]" || true

            if [ -n "${fixed_release:-}" ]; then
              echo "=== Direct fixed-release API probe ==="
              api_log=$(mktemp)
              timeout 10s node "$fixed_release/deploy/run-with-env.cjs" /home/ayin/env/api.env node "$fixed_release/apps/api/dist/main.js" >"$api_log" 2>&1 &
              api_pid=$!
              sleep 4
              api_code=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 3 http://127.0.0.1:4000/health || true)
              echo "direct_fixed_api_health=$api_code"
              if [ "$api_code" != "200" ]; then tail -n 80 "$api_log" | sanitize; fi
              kill "$api_pid" 2>/dev/null || true
              wait "$api_pid" 2>/dev/null || true
              rm -f "$api_log"

              echo "=== Direct fixed-release web probe ==="
              web_log=$(mktemp)
              cd "$fixed_release/apps/web"
              timeout 10s node "$fixed_release/deploy/run-with-env.cjs" /home/ayin/env/web.env node "$fixed_release/apps/web/node_modules/next/dist/bin/next" start --hostname 127.0.0.1 --port 3000 >"$web_log" 2>&1 &
              web_pid=$!
              sleep 4
              web_code=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 3 http://127.0.0.1:3000/ || true)
              echo "direct_fixed_web_health=$web_code"
              if [ "$web_code" != "200" ]; then tail -n 80 "$web_log" | sanitize; fi
              kill "$web_pid" 2>/dev/null || true
              wait "$web_pid" 2>/dev/null || true
              rm -f "$web_log"
            fi
          '
