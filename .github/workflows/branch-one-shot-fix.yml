name: Temporary branch safety fixes

on:
  push:
    branches:
      - feature/brand-monetization-admin-control-center

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brand-monetization-admin-control-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          studio = Path('apps/web/src/components/studio/studio-revenue.tsx')
          text = studio.read_text()
          old = '''  useEffect(() => {\n    void load();\n  }, [load]);'''
          new = '''  useEffect(() => {\n    const timer = window.setTimeout(() => void load(), 0);\n    return () => window.clearTimeout(timer);\n  }, [load]);'''
          if old not in text:
              raise SystemExit('Studio revenue effect target not found')
          studio.write_text(text.replace(old, new, 1))

          finance = Path('apps/api/src/revenue/creator-finance.service.ts')
          text = finance.read_text()
          old = 'role: { in: ["OWNER", "ADMIN", "EDITOR"] },'
          new = 'role: { in: ["OWNER", "ADMIN"] },'
          if old not in text:
              raise SystemExit('Creator finance role target not found')
          finance.write_text(text.replace(old, new, 1))

          command = Path('apps/api/src/admin/admin-command-center.service.ts')
          text = command.read_text()
          old = 'href: `/admin/revenue?channel=${encodeURIComponent(payout.channel.handle)}`,'
          new = 'href: "/admin/revenue",'
          if old not in text:
              raise SystemExit('Admin payout search target not found')
          command.write_text(text.replace(old, new, 1))
          PY
      - name: Format patched files
        run: pnpm format
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden creator finance and resolve studio lint [skip ci]"
          git push origin HEAD:feature/brand-monetization-admin-control-center
