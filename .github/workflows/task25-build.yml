name: Task 25 implementation
on:
  push:
    branches: [task-25-pwa-platform-adapters]
    paths: [".github/workflows/task25-build.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: task-25-pwa-platform-adapters }
      - run: |
          mkdir -p apps/web/src/lib/platform apps/web/src/components/pwa docs
          cat > apps/web/src/lib/platform/capabilities.ts <<'EOF'
          export type AyinPlatformFamily = "web" | "ios" | "android" | "android-tv" | "fire-tv" | "tizen" | "webos";
          export interface PlatformCapabilities {
            family: AyinPlatformFamily;
            tv: boolean;
            touch: boolean;
            installable: boolean;
            nativeBridge: boolean;
            safeArea: boolean;
          }
          export interface AyinPlatformBridge {
            capabilities(): PlatformCapabilities;
            openExternal?(url: string): Promise<void> | void;
            exitApp?(): Promise<void> | void;
          }
          declare global { interface Window { AYIN_PLATFORM_BRIDGE?: AyinPlatformBridge } }
          export function detectPlatformCapabilities(): PlatformCapabilities {
            if (typeof window !== "undefined" && window.AYIN_PLATFORM_BRIDGE) return window.AYIN_PLATFORM_BRIDGE.capabilities();
            const touch = typeof navigator !== "undefined" && navigator.maxTouchPoints > 0;
            return { family: "web", tv: false, touch, installable: true, nativeBridge: false, safeArea: true };
          }
          EOF
          cat > apps/web/src/lib/platform/remote-keys.ts <<'EOF'
          export type RemoteAction = "up" | "down" | "left" | "right" | "select" | "back" | "play-pause" | "fast-forward" | "rewind" | "unknown";
          const mapping: Record<string, RemoteAction> = {
            ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right", Enter:"select", Escape:"back", Backspace:"back",
            MediaPlayPause:"play-pause", MediaFastForward:"fast-forward", MediaRewind:"rewind"
          };
          const keyCodes: Record<number, RemoteAction> = { 10009:"back", 461:"back", 415:"play-pause", 19:"play-pause", 417:"fast-forward", 412:"rewind" };
          export function mapRemoteKey(key: string, keyCode?: number): RemoteAction { return mapping[key] ?? (keyCode === undefined ? "unknown" : keyCodes[keyCode] ?? "unknown"); }
          EOF
          cat > apps/web/src/lib/platform/remote-keys.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { mapRemoteKey } from "./remote-keys";
          describe("TV remote key mapping",()=>{
            it("maps standard directional/select keys",()=>{expect(mapRemoteKey("ArrowLeft")).toBe("left");expect(mapRemoteKey("Enter")).toBe("select")});
            it("maps common TV back codes",()=>{expect(mapRemoteKey("Unidentified",10009)).toBe("back");expect(mapRemoteKey("Unidentified",461)).toBe("back")});
            it("returns unknown safely",()=>expect(mapRemoteKey("F13")).toBe("unknown"));
          });
          EOF
          cat > apps/web/src/components/pwa/install-update-controller.tsx <<'EOF'
          "use client";
          import { useEffect, useState } from "react";
          interface BeforeInstallPromptEvent extends Event { prompt(): Promise<void>; userChoice: Promise<{ outcome: "accepted" | "dismissed" }> }
          export function InstallUpdateController(){
            const [install,setInstall]=useState<BeforeInstallPromptEvent|null>(null); const [update,setUpdate]=useState<ServiceWorkerRegistration|null>(null);
            useEffect(()=>{
              const onInstall=(event:Event)=>{event.preventDefault();setInstall(event as BeforeInstallPromptEvent)};
              window.addEventListener("beforeinstallprompt",onInstall);
              if("serviceWorker" in navigator) void navigator.serviceWorker.getRegistration().then(reg=>{ if(reg?.waiting)setUpdate(reg); reg?.addEventListener("updatefound",()=>{const worker=reg.installing;if(worker)worker.addEventListener("statechange",()=>{if(worker.state==="installed"&&navigator.serviceWorker.controller)setUpdate(reg)})}) });
              return()=>window.removeEventListener("beforeinstallprompt",onInstall);
            },[]);
            if(!install&&!update)return null;
            return <aside className="pwa-prompt" aria-live="polite">{update?<><span>AYIN update ready.</span><button onClick={()=>{update.waiting?.postMessage({type:"SKIP_WAITING"});location.reload()}}>Update</button></>:<><span>Install AYIN for quicker access.</span><button onClick={()=>{void install?.prompt().then(()=>setInstall(null))}}>Install</button><button onClick={()=>setInstall(null)}>Not now</button></>}</aside>;
          }
          EOF
          cat > apps/web/public/sw.js <<'EOF'
          const VERSION = "ayin-pwa-v2";
          const STATIC_CACHE = `${VERSION}-static`;
          const READ_CACHE = `${VERSION}-read`;
          const APP_SHELL = ["/", "/manifest.webmanifest", "/icons/ayin-192.svg", "/icons/ayin-512.svg"];
          const STATIC_DESTINATIONS = new Set(["font", "image", "script", "style"]);
          self.addEventListener("install", (event) => { event.waitUntil(caches.open(STATIC_CACHE).then(cache=>cache.addAll(APP_SHELL)).then(()=>self.skipWaiting())); });
          self.addEventListener("activate", (event) => { event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>!k.startsWith(VERSION)).map(k=>caches.delete(k)))).then(()=>self.clients.claim())); });
          self.addEventListener("message", event=>{if(event.data?.type==="SKIP_WAITING")self.skipWaiting()});
          function isMedia(url, request){return request.destination==="video"||request.destination==="audio"||url.pathname.startsWith("/watch/")||url.pathname.startsWith("/media/")||url.pathname.includes("upload")||url.pathname.includes("playback")}
          function safeApiRead(url,request){return request.method==="GET"&&url.pathname.startsWith("/api/")&&(/\/health$/.test(url.pathname)||url.pathname.startsWith("/api/discovery/")||url.pathname.startsWith("/api/public/"))}
          self.addEventListener("fetch",event=>{
            const request=event.request;if(request.method!=="GET")return;const url=new URL(request.url);if(url.origin!==self.location.origin||isMedia(url,request))return;
            if(STATIC_DESTINATIONS.has(request.destination)){event.respondWith(caches.open(STATIC_CACHE).then(async cache=>{const hit=await cache.match(request);const network=fetch(request).then(async response=>{if(response.ok&&response.type==="basic")await cache.put(request,response.clone());return response});return hit??network}));return}
            if(safeApiRead(url,request)){event.respondWith(caches.open(READ_CACHE).then(async cache=>{try{const response=await fetch(request);if(response.ok)await cache.put(request,response.clone());return response}catch{return (await cache.match(request))??Response.error()}}));}
          });
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/app/layout.tsx');s=p.read_text()
          s=s.replace('import { ServiceWorkerRegistration } from "@/components/pwa/service-worker-registration";','import { ServiceWorkerRegistration } from "@/components/pwa/service-worker-registration";\nimport { InstallUpdateController } from "@/components/pwa/install-update-controller";')
          s=s.replace('<ServiceWorkerRegistration />','<ServiceWorkerRegistration />\n        <InstallUpdateController />')
          p.write_text(s)
          p=Path('apps/web/src/app/manifest.ts');s=p.read_text();s=s.replace('start_url: "/",','start_url: "/?source=pwa",').replace('display: "standalone",','display: "standalone",\n    display_override: ["window-controls-overlay", "standalone", "minimal-ui"],').replace('categories: ["entertainment", "video"],','categories: ["entertainment", "video", "social"],\n    shortcuts: [\n      { name: "Uploads", short_name: "Uploads", url: "/uploads", icons: [{ src: "/icons/ayin-192.svg", sizes: "192x192", type: "image/svg+xml" }] },\n      { name: "Creator TV", short_name: "TV", url: "/tv", icons: [{ src: "/icons/ayin-192.svg", sizes: "192x192", type: "image/svg+xml" }] },\n    ],')
          p.write_text(s)
          p=Path('apps/web/src/app/globals.css');s=p.read_text();s+='''\n:root { --ayin-safe-top: env(safe-area-inset-top, 0px); --ayin-safe-right: env(safe-area-inset-right, 0px); --ayin-safe-bottom: env(safe-area-inset-bottom, 0px); --ayin-safe-left: env(safe-area-inset-left, 0px); }\nbody { padding-left: var(--ayin-safe-left); padding-right: var(--ayin-safe-right); }\n.pwa-prompt { position: fixed; z-index: 1000; left: max(1rem, var(--ayin-safe-left)); right: max(1rem, var(--ayin-safe-right)); bottom: max(1rem, var(--ayin-safe-bottom)); display: flex; gap: .75rem; align-items: center; justify-content: center; padding: .75rem 1rem; border: 1px solid rgba(255,255,255,.2); border-radius: .75rem; background: rgba(5,7,13,.94); backdrop-filter: blur(12px); }\n.pwa-prompt button { min-height: 44px; }\n''';p.write_text(s)
          PY
          cat > docs/PLATFORM_WRAPPERS.md <<'EOF'
          # AYIN PWA and platform wrapper strategy
          The web/PWA remains the product source of truth. Platform wrappers consume the same deep links and expose only a narrow `AYIN_PLATFORM_BRIDGE` capability contract.

          ## PWA
          The service worker precaches the small app shell/repository-owned icons and cache-first static assets. Only explicitly safe same-origin public/read API paths may use network-first fallback caching. Video/audio, watch/media/playback/upload paths are deliberately never offline-cached as a library.

          Install UI is optional and dismissible. Service-worker updates surface only after a replacement worker is installed; users opt into reload. Safe-area CSS supports notches/home indicators.

          ## Wrapper candidates
          - Android/iOS: hybrid shell (Capacitor-equivalent candidate) around HTTPS web origin, using native bridge only for platform capabilities that need it.
          - Android TV / Fire TV: thin web shell with remote-key/native lifecycle bridge; web remote mapper remains fallback.
          - Samsung Tizen: packaged web application using the same routes and bridge contract.
          - LG webOS: packaged web application using the same routes and bridge contract.
          - Roku and tvOS: exceptions requiring more native-specific clients later; do not pretend the web wrapper is sufficient.

          Store packages/signing are intentionally deferred to Tasks 37–38.
          EOF
          corepack enable && corepack prepare pnpm@11.24.0 --activate && pnpm install --frozen-lockfile && pnpm format
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps docs
          git commit -m "feat: harden PWA and platform adapter boundaries"
          git push origin HEAD:task-25-pwa-platform-adapters
