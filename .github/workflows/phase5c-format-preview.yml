name: Phase5C formatting apply

on:
  pull_request:
    paths:
      - ".github/workflows/phase5c-format-preview.yml"

permissions:
  contents: write

jobs:
  format-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'web-pwa-phase-5c-my-ayin-lens'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format exact Phase5C files
        run: |
          pnpm exec prettier --write \
            apps/api/test/recommendation-viewer.integration.test.ts \
            "apps/web/src/app/(viewer)/my-ayin/lens/lens-client.tsx" \
            "apps/web/src/app/(viewer)/my-ayin/lens/lens.module.css" \
            apps/web/src/components/discovery/discovery.module.css \
            apps/web/src/lib/i18n/my-ayin.ts \
            apps/web/src/lib/i18n/resources/my-ayin.ts \
            apps/web/src/lib/my-ayin-contracts.test.ts \
            apps/web/src/lib/my-ayin-contracts.ts \
            tests/e2e/db-helper.mjs \
            tests/e2e/my-ayin-lens.acceptance.spec.ts
          git diff --exit-code -- package.json pnpm-lock.yaml
      - name: Commit formatted files only
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            apps/api/test/recommendation-viewer.integration.test.ts \
            "apps/web/src/app/(viewer)/my-ayin/lens/lens-client.tsx" \
            "apps/web/src/app/(viewer)/my-ayin/lens/lens.module.css" \
            apps/web/src/components/discovery/discovery.module.css \
            apps/web/src/lib/i18n/my-ayin.ts \
            apps/web/src/lib/i18n/resources/my-ayin.ts \
            apps/web/src/lib/my-ayin-contracts.test.ts \
            apps/web/src/lib/my-ayin-contracts.ts \
            tests/e2e/db-helper.mjs \
            tests/e2e/my-ayin-lens.acceptance.spec.ts
          if git diff --cached --quiet; then
            echo "Files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(viewer): apply Phase5C formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
