name: Task 49 temporary formatter

on:
  push:
    branches:
      - task-49-privacy-controls

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-49-privacy-controls
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 49 files
        run: |
          pnpm exec prettier --write \
            apps/api/src/privacy/privacy-export.service.ts \
            apps/api/src/privacy/privacy-lifecycle.service.ts \
            apps/api/src/privacy/privacy.controller.ts \
            apps/api/test/privacy-controls.integration.test.ts \
            apps/web/src/components/account/account-privacy-controls.tsx \
            docs/TASK49_PRIVACY_CONTROLS.md
      - name: Commit formatter output and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task49-format.yml
          git add -A
          git commit -m "style(task-49): format shared ownership coverage" || exit 0
          git push origin HEAD:task-49-privacy-controls
