name: Task 12 formatter

on:
  push:
    branches: [task-12-discovery-my-ayin]
    paths: [.github/workflows/task12-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-12-discovery-my-ayin
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/api/src/app.module.ts
          apps/api/src/discovery/discovery.controller.ts
          apps/api/src/discovery/discovery.module.ts
          apps/api/src/discovery/discovery.service.ts
          apps/api/test/discovery.integration.test.ts
          apps/web/src/app/'(viewer)'/page.tsx
          apps/web/src/app/'(viewer)'/my-ayin/page.tsx
          apps/web/src/components/discovery/discovery-home.tsx
          apps/web/src/components/discovery/discovery-row.tsx
          apps/web/src/components/discovery/discovery.module.css
          apps/web/src/components/discovery/my-ayin-library.tsx
          apps/web/src/lib/discovery.ts
          packages/db/prisma/discovery.prisma
          packages/db/src/discovery.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps packages
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "Format Task 12 discovery implementation"
            git push origin HEAD:task-12-discovery-my-ayin
          fi
