name: Task 39 format diagnostic

on:
  push:
    branches:
      - task-39-media-architecture-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          pnpm exec prettier --write \
            apps/api/src/media/media-architecture-v2.ts \
            apps/api/src/media/media-architecture-v2.test.ts \
            docs/MEDIA_ARCHITECTURE_V2.md \
            packages/db/src/media-v2.test.mjs
          if git diff --quiet -- \
            apps/api/src/media/media-architecture-v2.ts \
            apps/api/src/media/media-architecture-v2.test.ts \
            docs/MEDIA_ARCHITECTURE_V2.md \
            packages/db/src/media-v2.test.mjs; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/media/media-architecture-v2.ts \
            apps/api/src/media/media-architecture-v2.test.ts \
            docs/MEDIA_ARCHITECTURE_V2.md \
            packages/db/src/media-v2.test.mjs
          git commit -m "style(task39): apply prettier"
          git push origin HEAD:task-39-media-architecture-v2
