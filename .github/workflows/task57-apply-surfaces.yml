# Task 57 temporary surface application; remove before merge.
name: Task 57 temporary surface apply

on:
  push:
    branches:
      - task-57-kids-catalog
    paths:
      - .github/workflows/task57-apply-surfaces.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-57-kids-catalog
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/task57-surface-patch.py
      - run: >-
          pnpm exec prettier --write
          apps/api/src/discovery/discovery.service.ts
          apps/api/src/discovery/discovery.controller.ts
          apps/api/src/search/search.service.ts
          apps/api/src/search/search.controller.ts
          apps/api/src/recommendations/recommendation.service.ts
          apps/api/src/recommendations/recommendation.module.ts
          apps/api/src/recommendations/recommendation.service.test.ts
          apps/api/src/watch/watch.service.ts
          apps/api/src/watch/watch.controller.ts
          apps/web/src/lib/discovery.ts
          apps/web/src/components/discovery/discovery-home.tsx
          apps/web/src/components/admin/admin-sidebar.tsx
      - run: pnpm typecheck
      - run: pnpm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/discovery/discovery.service.ts apps/api/src/discovery/discovery.controller.ts apps/api/src/search/search.service.ts apps/api/src/search/search.controller.ts apps/api/src/recommendations/recommendation.service.ts apps/api/src/recommendations/recommendation.module.ts apps/api/src/recommendations/recommendation.service.test.ts apps/api/src/watch/watch.service.ts apps/api/src/watch/watch.controller.ts apps/web/src/lib/discovery.ts apps/web/src/components/discovery/discovery-home.tsx apps/web/src/components/admin/admin-sidebar.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(task57): enforce kids catalog surfaces"
          git push origin HEAD:task-57-kids-catalog
