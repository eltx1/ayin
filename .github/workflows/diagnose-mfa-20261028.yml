name: Diagnose upload state (read only)
on:
  push:
    branches: [codex/ayin-mfa-diagnostic-20261028]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Read only upload health, without identifiers or credentials
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 13.63.216.89
          SSH_PORT: "22"
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          bash deploy/acquire-ssh-host-key.sh "$HOME/.ssh/candidate"
          test "$(ssh-keygen -lf "$HOME/.ssh/candidate" -E sha256 | awk 'NR == 1 {print $2}')" = 'SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y'
          mv "$HOME/.ssh/candidate" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ayin@"$DEPLOY_HOST" 'cd /home/ayin/htdocs/current && git rev-parse HEAD && node deploy/run-with-env.cjs /home/ayin/env/api.env node --input-type=module' <<'JS'
          import { loadMediaStorageConfig } from './apps/api/dist/media/media-storage.config.js';
          import { R2SigV4 } from './apps/api/dist/media/r2-sigv4.js';
          import { parseR2Xml,readR2XmlText } from './apps/api/dist/media/r2-xml.js';
          const signer=new R2SigV4(loadMediaStorageConfig());
          const values=(n,k)=>n.children.filter(x=>x.name===k).map(x=>x.text);
          try {
            const signal=AbortSignal.timeout(30000);
            const response=await signer.request({method:'GET',query:[['cors','']],signal});
            const root=parseR2Xml(await readR2XmlText(response,65536,signal));
            console.log('SAFE_UPLOAD_CORS',JSON.stringify({rules:root.children.filter(x=>x.name==='CORSRule').map(x=>({ayinOrigin:values(x,'AllowedOrigin').includes('https://ayin.stream'),wildcardOrigin:values(x,'AllowedOrigin').includes('*'),methods:values(x,'AllowedMethod').filter(v=>/^[A-Z]{1,12}$/.test(v)),etagExposed:values(x,'ExposeHeader').some(v=>v.toLowerCase()==='etag'||v==='*'),contentTypeAllowed:values(x,'AllowedHeader').some(v=>v.toLowerCase()==='content-type'||v==='*')}))}));
          }catch(e){console.log('SAFE_UPLOAD_CORS',JSON.stringify({available:false,status:e?.status??null,code:/^[A-Za-z0-9_]{1,60}$/.test(e?.name??'')?e.name:'REDACTED'}));}
          JS
