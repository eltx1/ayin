name: Diagnose upload state (read only)
on:
  push:
    branches: [codex/ayin-mfa-diagnostic-20261028]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Read only upload health, without identifiers or credentials
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 13.63.216.89
          SSH_PORT: "22"
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          bash deploy/acquire-ssh-host-key.sh "$HOME/.ssh/candidate"
          test "$(ssh-keygen -lf "$HOME/.ssh/candidate" -E sha256 | awk 'NR == 1 {print $2}')" = 'SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y'
          mv "$HOME/.ssh/candidate" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ayin@"$DEPLOY_HOST" 'cd /home/ayin/htdocs/current && git rev-parse HEAD && node deploy/run-with-env.cjs /home/ayin/env/api.env node --input-type=module' <<'JS'
          import { createPrismaClient } from './packages/db/dist/index.js';
          import { statfs } from 'node:fs/promises';
          import { freemem, loadavg } from 'node:os';
          const db=createPrismaClient();
          try {
           const result=await db.$transaction(async tx=>{
            await tx.$executeRawUnsafe('SET TRANSACTION READ ONLY');
            const sources=await tx.mediaAsset.findMany({where:{kind:'SOURCE_VIDEO',sizeBytes:3736813160n,createdAt:{gte:new Date('2026-10-28T16:00:00Z')}},select:{videoId:true,status:true,createdAt:true,updatedAt:true,uploadIntegrityRequired:true},take:3});
            const rows=[];
            for(const s of sources){
             const jobs=await tx.mediaProcessingJob.findMany({where:{videoId:s.videoId},select:{status:true,stage:true,progressPercent:true,attempt:true,errorCode:true,queuedAt:true,startedAt:true,completedAt:true,heartbeatAt:true,leaseExpiresAt:true,updatedAt:true,sourceSizeBytes:true,outputSizeBytes:true},orderBy:{createdAt:'desc'},take:2});
             const video=await tx.video.findUnique({where:{id:s.videoId},select:{status:true,visibility:true}});
             rows.push({source:{status:s.status,createdAt:s.createdAt,updatedAt:s.updatedAt,integrity:s.uploadIntegrityRequired},video,jobs});
            }
            return {matched:sources.length,rows};
           });
           console.log('SAFE_LARGE_UPLOAD',JSON.stringify(result,(_,v)=>typeof v==='bigint'?String(v):v));
           const disk=await statfs('/home/ayin');
           console.log('SAFE_HOST_CAPACITY',JSON.stringify({freeMemoryBytes:freemem(),load:loadavg(),diskAvailableBytes:disk.bavail*disk.bsize}));
          }catch(e){console.log('SAFE_LARGE_UPLOAD',JSON.stringify({inspected:false,errorType:e?.name??'UNKNOWN'}));}
          finally{await db.$disconnect();}
          JS
