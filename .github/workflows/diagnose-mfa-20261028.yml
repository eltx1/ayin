name: Diagnose upload state (read only)
on:
  push:
    branches: [codex/ayin-mfa-diagnostic-20261028]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Read only upload health, without identifiers or credentials
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 13.63.216.89
          SSH_PORT: "22"
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          bash deploy/acquire-ssh-host-key.sh "$HOME/.ssh/candidate"
          test "$(ssh-keygen -lf "$HOME/.ssh/candidate" -E sha256 | awk 'NR == 1 {print $2}')" = 'SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y'
          mv "$HOME/.ssh/candidate" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ayin@"$DEPLOY_HOST" 'cd /home/ayin/htdocs/current && git rev-parse HEAD && node deploy/run-with-env.cjs /home/ayin/env/api.env node --input-type=module' <<'JS'
          import { createPrismaClient } from './packages/db/dist/index.js';
          import { readdir,stat } from 'node:fs/promises';
          import { createReadStream } from 'node:fs';
          import { createInterface } from 'node:readline';
          const db=createPrismaClient();
          try{
            const data=await db.$transaction(async tx=>{
              await tx.$executeRawUnsafe('SET TRANSACTION READ ONLY');
              const rows=await tx.mediaAsset.findMany({where:{kind:'SOURCE_VIDEO',status:'PENDING',removedAt:null,sizeBytes:3735538284n,createdAt:{gte:new Date('2026-10-28T00:00:00Z'),lt:new Date('2026-10-29T00:00:00Z')}},select:{videoId:true},take:2});
              if(rows.length!==1)return{matched:rows.length};
              const item=await tx.contentSeedItem.findUnique({where:{videoId:rows[0].videoId},select:{status:true}});
              return{matched:1,adminSeed:!!item,seedStatus:item?.status??null};
            });
            console.log('SAFE_UPLOAD_ROUTE',JSON.stringify(data));
            const dir='/home/ayin/.pm2/logs';
            const allowed=new Set(['/media/uploads/sessions','/media/uploads/sessions/authorize-part','/media/uploads/sessions/resume','/media/uploads/sessions/complete','/creator/videos/drafts','/admin/content-seeding/items/:itemId/upload-session']);
            const stats=new Map();
            let files=0;
            for(const name of await readdir(dir)){
              if(!/^ayin-api-(?:out|error)(?:-[0-9]+)?[.]log$/.test(name))continue;
              const p=dir+'/'+name,s=await stat(p);files++;
              const lines=createInterface({input:createReadStream(p,{start:Math.max(0,s.size-64*1024*1024)}),crlfDelay:Infinity});
              for await(const line of lines){
                const k=line.indexOf('{');if(k<0)continue;
                let x;try{x=JSON.parse(line.slice(k));}catch{continue;}
                if(x.event!=='http.request'||x.timestamp<'2026-10-28T12:49:00Z'||x.timestamp>'2026-10-28T13:35:00Z'||!allowed.has(x.path))continue;
                const key=x.path+' '+x.statusCode;
                const old=stats.get(key)??{path:x.path,status:x.statusCode,count:0,first:x.timestamp,last:x.timestamp};
                old.count++;old.first=old.first<x.timestamp?old.first:x.timestamp;old.last=old.last>x.timestamp?old.last:x.timestamp;stats.set(key,old);
              }
            }
            console.log('SAFE_UPLOAD_REQUESTS',JSON.stringify({files,requests:[...stats.values()]}));
          }catch(e){console.log('SAFE_UPLOAD_ROUTE',JSON.stringify({inspected:false,code:/^[A-Za-z0-9_]{1,60}$/.test(e?.name??'')?e.name:'REDACTED'}));}
          finally{await db.$disconnect();}
          JS
