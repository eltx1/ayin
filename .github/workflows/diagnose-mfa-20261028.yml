name: Diagnose upload state (read only)
on:
  push:
    branches: [codex/ayin-mfa-diagnostic-20261028]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Read only upload health, without identifiers or credentials
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 13.63.216.89
          SSH_PORT: "22"
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          bash deploy/acquire-ssh-host-key.sh "$HOME/.ssh/candidate"
          test "$(ssh-keygen -lf "$HOME/.ssh/candidate" -E sha256 | awk 'NR == 1 {print $2}')" = 'SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y'
          mv "$HOME/.ssh/candidate" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ayin@"$DEPLOY_HOST" 'cd /home/ayin/htdocs/current && git rev-parse HEAD && node deploy/run-with-env.cjs /home/ayin/env/api.env node --input-type=module' <<'JS'
          import { createRequire } from 'node:module';
          const require=createRequire(new URL('./apps/api/package.json',import.meta.url));
          const {S3Client,GetBucketLifecycleConfigurationCommand}=require('@aws-sdk/client-s3');
          const client=new S3Client({region:process.env.R2_REGION??'auto',endpoint:'https://'+process.env.R2_ACCOUNT_ID+'.r2.cloudflarestorage.com',credentials:{accessKeyId:process.env.R2_ACCESS_KEY_ID,secretAccessKey:process.env.R2_SECRET_ACCESS_KEY}});
          try {
            const r=await client.send(new GetBucketLifecycleConfigurationCommand({Bucket:process.env.R2_BUCKET}));
            console.log('SAFE_UPLOAD_LIFECYCLE',JSON.stringify({rules:(r.Rules??[]).map(x=>({enabled:x.Status==='Enabled',abortAfterDays:x.AbortIncompleteMultipartUpload?.DaysAfterInitiation??null,hasPrefix:!!(x.Prefix||x.Filter?.Prefix),hasTagFilter:!!(x.Filter?.Tag||x.Filter?.And)}))}));
          }catch(e){console.log('SAFE_UPLOAD_LIFECYCLE',JSON.stringify({available:false,status:e?.$metadata?.httpStatusCode??null,code:/^[A-Za-z0-9_]{1,60}$/.test(e?.name??'')?e.name:'REDACTED'}));}
          finally {client.destroy();}
          JS
