name: Task 53 final format

on:
  push:
    branches:
      - task-53-rights-geo-maturity
    paths:
      - .github/workflows/task53-format-final.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: task-53-rights-geo-maturity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format remaining file and verify repository formatting
        run: |
          pnpm exec prettier --write apps/api/src/creator/creator-tv-policy.test.ts
          rm .github/workflows/task53-format-final.yml
          pnpm exec prettier --check .

      - name: Commit final formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style(task-53): normalize Creator TV policy test"
          git push origin HEAD:task-53-rights-geo-maturity
