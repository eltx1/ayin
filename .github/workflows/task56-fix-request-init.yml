name: Task 56 temporary request-init fixer

on:
  push:
    branches:
      - task-56-series-catalog
    paths:
      - .github/workflows/task56-fix-request-init.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-56-series-catalog
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/task56-fix-request-init.py
      - run: pnpm exec prettier --write apps/web/src/components/admin/admin-series-catalog.tsx
      - run: pnpm typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/admin/admin-series-catalog.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(task56): type-safe admin catalog requests"
          git push origin HEAD:task-56-series-catalog
