name: Task 59 formatter

on:
  push:
    branches:
      - task-59-i18n-foundation
    paths:
      - .github/workflows/task59-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-59-i18n-foundation
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository formatting
        run: >-
          pnpm exec prettier --write
          apps/web/src/components/i18n/i18n-provider.tsx
          apps/web/src/lib/i18n/resources/ar.ts
          apps/web/src/lib/i18n/resources/en.ts
          apps/web/src/proxy.ts
      - name: Persist formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/i18n/i18n-provider.tsx apps/web/src/lib/i18n/resources/ar.ts apps/web/src/lib/i18n/resources/en.ts apps/web/src/proxy.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(task59): apply repository formatting"
          git push origin HEAD:task-59-i18n-foundation
