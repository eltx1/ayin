name: Final Task 03 formatting pass

on:
  push:
    branches:
      - task-03-auth-instant-provisioning
    paths:
      - ".github/workflows/task03-format-final.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-03-auth-instant-provisioning
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/test/auth.integration.test.ts
      - name: Commit formatted test and remove helper
        run: |
          rm .github/workflows/task03-format-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/auth.integration.test.ts .github/workflows/task03-format-final.yml
          git commit -m "Format Task 03 auth integration test"
          git push origin HEAD:task-03-auth-instant-provisioning
