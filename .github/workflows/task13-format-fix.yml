name: Task 13 lint-fix formatter

on:
  push:
    branches: [task-13-search-content-details]
    paths: [.github/workflows/task13-format-fix.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-13-search-content-details
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/search/search-experience.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/search/search-experience.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "Format Task 13 React lint fix"
            git push origin HEAD:task-13-search-content-details
          fi
