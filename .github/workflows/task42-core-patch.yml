name: Task 42 core patch helper

on:
  push:
    branches:
      - task-42-adaptive-rollout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-42-adaptive-rollout
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Task 42 core rollout patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          catalog = Path('apps/api/src/platform-config/platform-settings.catalog.ts')
          text = catalog.read_text()
          anchor = '  mediaHls360pEnabled: {'
          insertion = '''  mediaHlsNewUploadsEnabled: {
            namespace: "UPLOAD",
            key: "mediaHlsNewUploadsEnabled",
            valueType: "BOOLEAN",
            defaultValue: false,
            schema: z.boolean(),
            section: "uploads",
            label: "Adaptive HLS for new uploads",
            description:
              "Allow verified HLS generation for new media-processing jobs independently from adaptive playback and catalog backfill.",
            control: "toggle",
            highImpact: true,
            superadminOnly: true,
          },
          mediaHlsBackfillEnabled: {
            namespace: "UPLOAD",
            key: "mediaHlsBackfillEnabled",
            valueType: "BOOLEAN",
            defaultValue: false,
            schema: z.boolean(),
            section: "uploads",
            label: "Adaptive HLS catalog backfill",
            description:
              "Permit bounded adaptive backfill batches for eligible published videos. This does not itself resume a paused backfill.",
            control: "toggle",
            highImpact: true,
            superadminOnly: true,
          },
          mediaHlsBackfillPaused: {
            namespace: "UPLOAD",
            key: "mediaHlsBackfillPaused",
            valueType: "BOOLEAN",
            defaultValue: true,
            schema: z.boolean(),
            section: "uploads",
            label: "Adaptive backfill paused",
            description: "Persistent operational pause switch for adaptive catalog backfill.",
            control: "toggle",
            highImpact: true,
            superadminOnly: true,
          },
          mediaHlsBackfillBatchSize: {
            namespace: "UPLOAD",
            key: "mediaHlsBackfillBatchSize",
            valueType: "INTEGER",
            defaultValue: 2,
            schema: z.number().int().min(1).max(20),
            section: "uploads",
            label: "Adaptive backfill batch size",
            description: "Maximum number of eligible videos considered by one controlled backfill batch.",
            control: "number",
            unit: "videos",
            highImpact: true,
            superadminOnly: true,
          },
          mediaHlsBackfillMaxInFlight: {
            namespace: "UPLOAD",
            key: "mediaHlsBackfillMaxInFlight",
            valueType: "INTEGER",
            defaultValue: 1,
            schema: z.number().int().min(1).max(4),
            section: "uploads",
            label: "Adaptive backfill max in flight",
            description:
              "Hard operational ceiling for queued plus active adaptive backfill jobs, protecting CPU and storage from spikes.",
            control: "number",
            unit: "jobs",
            highImpact: true,
            superadminOnly: true,
          },
'''
          if 'mediaHlsNewUploadsEnabled' not in text:
              text = text.replace(anchor, insertion + anchor, 1)
              catalog.write_text(text)

          replace_once(
              'apps/api/src/media/media-adaptive-processing.service.ts',
              'const settings = await this.settings.resolve();',
              'const settings = await this.settings.resolve(input.job);',
          )

          lifecycle = Path('apps/api/src/media/media-processing-lifecycle.service.ts')
          text = lifecycle.read_text()
          if 'ADAPTIVE_BACKFILL_MARKER' not in text:
              text = text.replace(
                  'import { DatabaseService } from "../database/database.service.js";\n',
                  'import { DatabaseService } from "../database/database.service.js";\nimport { ADAPTIVE_BACKFILL_MARKER } from "./media-adaptive-rollout.js";\n',
                  1,
              )
          if 'createAdaptiveBackfillJob' not in text:
              method = '''  async createAdaptiveBackfillJob(tx: Prisma.TransactionClient, videoId: string) {
            const video = await tx.video.findUnique({
              where: { id: videoId },
              select: {
                id: true,
                channelId: true,
                status: true,
                visibility: true,
                removedAt: true,
                channel: { select: { status: true, removedAt: true } },
                mediaAssets: {
                  where: {
                    kind: "SOURCE_VIDEO",
                    status: "VALIDATED",
                    mimeType: "video/mp4",
                    removedAt: null,
                  },
                  orderBy: { createdAt: "desc" },
                  take: 1,
                },
                mediaProcessingJobs: { orderBy: { generation: "desc" }, take: 1 },
              },
            });
            const source = video?.mediaAssets[0];
            if (
              !video ||
              !source ||
              video.status !== "PUBLISHED" ||
              video.visibility === "PRIVATE" ||
              video.removedAt ||
              video.channel.status !== "ACTIVE" ||
              video.channel.removedAt
            ) {
              return null;
            }

            const [readyAdaptive, activeJob, latestAdaptive] = await Promise.all([
              tx.mediaPlaybackGeneration.findFirst({
                where: {
                  videoId,
                  status: "READY",
                  fallbackStatus: "READY",
                  hlsMasterStatus: "READY",
                  renditions: { some: { status: "READY", protocol: "HLS" } },
                },
                select: { id: true },
              }),
              tx.mediaProcessingJob.findFirst({
                where: {
                  videoId,
                  status: { in: ["INGESTING", "QUEUED", "PROCESSING", "UPLOADING", "VERIFYING"] },
                },
                select: { id: true },
              }),
              tx.mediaPlaybackGeneration.findFirst({
                where: { videoId },
                orderBy: { generation: "desc" },
                select: { generation: true },
              }),
            ]);
            if (readyAdaptive || activeJob) return null;

            const generation =
              Math.max(video.mediaProcessingJobs[0]?.generation ?? 0, latestAdaptive?.generation ?? 0) + 1;
            return tx.mediaProcessingJob.create({
              data: {
                videoId,
                generation,
                status: "QUEUED",
                sourceMimeType: source.mimeType,
                sourceSizeBytes: source.sizeBytes,
                stagingKey: `${source.r2ObjectKey}${ADAPTIVE_BACKFILL_MARKER}${generation}`,
                inputR2ObjectKey: source.r2ObjectKey,
                outputR2ObjectKey: source.r2ObjectKey,
                queuedAt: new Date(),
                stage: "ADAPTIVE_BACKFILL_QUEUED",
                priority: -10,
              },
            });
          }

'''
              text = text.replace('  async createReprocessJob(tx: Prisma.TransactionClient, videoId: string) {', method + '  async createReprocessJob(tx: Prisma.TransactionClient, videoId: string) {', 1)
          lifecycle.write_text(text)

          queue = Path('apps/api/src/media/media-processing-queue.service.ts')
          text = queue.read_text()
          if 'async recoverStale()' not in text:
              method = '''  async recoverStale() {
            return this.database.client.$transaction(async (tx) => {
              await tx.$executeRawUnsafe("SELECT pg_advisory_xact_lock($1)", QUEUE_ADVISORY_LOCK);
              const capacity = await this.capacityInTransaction(tx);
              const now = new Date();
              const recovered = await tx.mediaProcessingJob.count({
                where: { status: { in: [...ACTIVE_STATUSES] }, leaseExpiresAt: { lt: now } },
              });
              await this.recoverStaleInTransaction(tx, now, capacity.retryLimit);
              return { recovered };
            });
          }

'''
              text = text.replace('  private async capacityInTransaction(', method + '  private async capacityInTransaction(', 1)
          queue.write_text(text)

          module = Path('apps/api/src/media/media.module.ts')
          text = module.read_text()
          if 'MediaAdaptiveRolloutService' not in text:
              text = text.replace(
                  'import { MediaAdaptiveProcessingService } from "./media-adaptive-processing.service.js";\n',
                  'import { MediaAdaptiveProcessingService } from "./media-adaptive-processing.service.js";\nimport { MediaAdaptiveRolloutService } from "./media-adaptive-rollout.service.js";\n',
                  1,
              )
              text = text.replace(
                  '    MediaAdaptiveProcessingService,\n',
                  '    MediaAdaptiveProcessingService,\n    MediaAdaptiveRolloutService,\n',
                  1,
              )
              text = text.replace(
                  '    MediaAdaptiveProcessingService,\n    MediaProcessingExecutorService,\n',
                  '    MediaAdaptiveProcessingService,\n    MediaAdaptiveRolloutService,\n    MediaProcessingExecutorService,\n',
                  1,
              )
          module.write_text(text)

          schema = Path('packages/db/prisma/media-v2.prisma')
          text = schema.read_text()
          if 'hlsOutputSizeBytes' not in text:
              text = text.replace(
                  '  hlsMasterStatus      MediaPlaybackOutputStatus     @default(PLANNED)\n',
                  '  hlsMasterStatus      MediaPlaybackOutputStatus     @default(PLANNED)\n  hlsOutputSizeBytes   BigInt                        @default(0)\n',
                  1,
              )
          schema.write_text(text)

          adaptive_lifecycle = Path('apps/api/src/media/media-adaptive-lifecycle.service.ts')
          text = adaptive_lifecycle.read_text()
          if 'setOutputSizeIfOwned' not in text:
              method = '''  async setOutputSizeIfOwned(
            input: OwnedGenerationInput & { sizeBytes: bigint },
          ): Promise<boolean> {
            if (input.sizeBytes < 0n) throw new Error("Adaptive output size cannot be negative.");
            return this.booleanMutationIfOwned(input, async (tx) => {
              const updated = await tx.mediaPlaybackGeneration.updateMany({
                where: { id: input.generationId, processingJobId: input.jobId },
                data: { hlsOutputSizeBytes: input.sizeBytes },
              });
              return updated.count === 1;
            });
          }

'''
              text = text.replace('  async markReadyIfCompleteIfOwned(', method + '  async markReadyIfCompleteIfOwned(', 1)
          adaptive_lifecycle.write_text(text)

          adaptive = Path('apps/api/src/media/media-adaptive-processing.service.ts')
          text = adaptive.read_text()
          old_ready = '''    if (
              generation.status === "READY" &&
              (await this.verifyReadyGeneration(generation, input.canonicalMetadata.hasAudio))
            ) {
              this.logger.log(
                `Reused verified adaptive generation ${generation.videoId}/g${generation.generation}.`,
              );
              return true;
            }
'''
          new_ready = '''    if (
              generation.status === "READY" &&
              (await this.verifyReadyGeneration(generation, input.canonicalMetadata.hasAudio))
            ) {
              this.requireAdaptiveOwnership(
                await this.adaptiveLifecycle.setOutputSizeIfOwned({
                  ...ownedGeneration,
                  sizeBytes: await this.measureGenerationBytes(generation),
                }),
              );
              this.logger.log(
                `Reused verified adaptive generation ${generation.videoId}/g${generation.generation}.`,
              );
              return true;
            }
'''
          if old_ready in text:
              text = text.replace(old_ready, new_ready, 1)
          marker = '''      const ready = await this.adaptiveLifecycle.markReadyIfCompleteIfOwned(ownedGeneration);
'''
          if 'sizeBytes: await this.measureGenerationBytes(generation)' not in text[text.find('HLS master manifest failed'):]:
              replacement = '''      this.requireAdaptiveOwnership(
                await this.adaptiveLifecycle.setOutputSizeIfOwned({
                  ...ownedGeneration,
                  sizeBytes: await this.measureGenerationBytes(generation),
                }),
              );
              const ready = await this.adaptiveLifecycle.markReadyIfCompleteIfOwned(ownedGeneration);
'''
              if marker not in text:
                  raise SystemExit('adaptive ready marker missing')
              text = text.replace(marker, replacement, 1)
          if 'private async measureGenerationBytes' not in text:
              method = '''  private async measureGenerationBytes(generation: AdaptiveGenerationState): Promise<bigint> {
            let total = BigInt((await this.storage.headObject(generation.hlsMasterR2ObjectKey)).sizeBytes);
            for (const rendition of generation.renditions) {
              total += BigInt((await this.storage.headObject(rendition.playlistR2ObjectKey)).sizeBytes);
              const playlist = await this.storage.downloadText(rendition.playlistR2ObjectKey);
              for (const sequence of parseHlsMediaPlaylistSegments(playlist)) {
                const key = hlsRenditionSegmentObjectKey(
                  {
                    channelId: generation.channelId,
                    videoId: generation.videoId,
                    generation: generation.generation,
                  },
                  rendition.identity,
                  sequence,
                );
                total += BigInt((await this.storage.headObject(key)).sizeBytes);
              }
            }
            return total;
          }

'''
              text = text.replace('  private async verifyReadyGeneration(', method + '  private async verifyReadyGeneration(', 1)
          adaptive.write_text(text)
          PY
          pnpm exec prettier --write apps/api/src/platform-config/platform-settings.catalog.ts apps/api/src/media/media-adaptive-processing.service.ts apps/api/src/media/media-processing-lifecycle.service.ts apps/api/src/media/media-processing-queue.service.ts apps/api/src/media/media.module.ts apps/api/src/media/media-adaptive-lifecycle.service.ts packages/db/prisma/media-v2.prisma
          pnpm db:generate
          pnpm packages:build
          pnpm --filter @ayin/api lint
          pnpm --filter @ayin/api typecheck
      - name: Commit core rollout patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src packages/db/prisma/media-v2.prisma
          git commit -m "feat(media): add controlled adaptive rollout core"
          git push origin HEAD:task-42-adaptive-rollout
