name: Task30 apply patches

on:
  push:
    branches: [task-30-content-seeding]
    paths: [.github/workflows/task30-apply.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-30-content-seeding
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('packages/db/prisma/schema.prisma')
          s = p.read_text()
          s = s.replace('enum VideoVisibility {\n  PUBLIC\n  UNLISTED\n  PRIVATE\n}\n', '''enum VideoVisibility {\n  PUBLIC\n  UNLISTED\n  PRIVATE\n}\n\nenum VideoContentType {\n  CREATOR_VIDEO\n  MOVIE\n  DOCUMENTARY\n}\n\nenum ContentSeedBatchStatus {\n  DRAFT\n  READY\n  ROLLED_BACK\n}\n\nenum ContentSeedItemStatus {\n  DRAFT\n  UPLOADING\n  READY\n  PUBLISHED\n  FAILED\n  ROLLED_BACK\n}\n''')
          s = s.replace('  assignedModerationCases ModerationCase[] @relation("ModerationAssignee")\n', '  assignedModerationCases ModerationCase[] @relation("ModerationAssignee")\n  contentSeedBatches      ContentSeedBatch[]\n')
          s = s.replace('  removedAt          DateTime?\n\n  primaryTvChannel', '  removedAt          DateTime?\n  isPlatformOwned    Boolean       @default(false)\n\n  primaryTvChannel')
          s = s.replace('  payouts           Payout[]\n', '  payouts           Payout[]\n  contentSeedBatches ContentSeedBatch[]\n')
          s = s.replace('  description        String?         @db.Text\n  status             VideoStatus', '  description        String?         @db.Text\n  contentType        VideoContentType @default(CREATOR_VIDEO)\n  status             VideoStatus')
          s = s.replace('  earningsEntries    EarningsLedgerEntry[]\n', '  earningsEntries    EarningsLedgerEntry[]\n  contentSeedItem    ContentSeedItem?\n')
          if 'model ContentSeedBatch {' not in s:
              s += '''\n\nmodel ContentSeedBatch {\n  id                 String                 @id @default(uuid()) @db.Uuid\n  createdByAccountId String                 @db.Uuid\n  channelId          String                 @db.Uuid\n  sourceLabel        String                 @db.VarChar(200)\n  status             ContentSeedBatchStatus @default(DRAFT)\n  createdAt          DateTime               @default(now())\n  updatedAt          DateTime               @updatedAt\n  rolledBackAt       DateTime?\n\n  createdBy Account           @relation(fields: [createdByAccountId], references: [id], onDelete: Restrict)\n  channel   Channel           @relation(fields: [channelId], references: [id], onDelete: Restrict)\n  items     ContentSeedItem[]\n\n  @@index([channelId, status, createdAt])\n  @@index([createdByAccountId, createdAt])\n}\n\nmodel ContentSeedItem {\n  id          String                @id @default(uuid()) @db.Uuid\n  batchId     String                @db.Uuid\n  videoId     String                @unique @db.Uuid\n  sourceNotes String                @db.Text\n  rightsBasis RightsBasis\n  status      ContentSeedItemStatus @default(DRAFT)\n  error       String?               @db.Text\n  createdAt   DateTime              @default(now())\n  updatedAt   DateTime              @updatedAt\n\n  batch ContentSeedBatch @relation(fields: [batchId], references: [id], onDelete: Cascade)\n  video Video            @relation(fields: [videoId], references: [id], onDelete: Cascade)\n\n  @@index([batchId, status])\n}\n'''
          p.write_text(s)

          p = Path('apps/api/src/media/upload-session-token.service.ts')
          s = p.read_text().replace('  accountId: z.string().uuid(),\n', '  accountId: z.string().uuid(),\n  adminOverride: z.boolean().optional(),\n')
          p.write_text(s)

          p = Path('apps/api/src/media/media-upload.service.ts')
          s = p.read_text()
          s = s.replace('  async createSession(accountId: string, input: CreateUploadSessionInput) {', '  async createSession(\n    accountId: string,\n    input: CreateUploadSessionInput,\n    options: { adminOverride?: boolean } = {},\n  ) {')
          s = s.replace('    await this.assertChannelOwner(accountId, input.channelId);\n', '    if (!options.adminOverride) await this.assertChannelOwner(accountId, input.channelId);\n', 1)
          s = s.replace('      accountId,\n      channelId: input.channelId,', '      accountId,\n      ...(options.adminOverride ? { adminOverride: true } : {}),\n      channelId: input.channelId,')
          s = s.replace('    await this.assertChannelOwner(accountId, session.channelId);\n', '    if (!session.adminOverride) await this.assertChannelOwner(accountId, session.channelId);\n')
          p.write_text(s)

          p = Path('apps/api/src/admin/admin.module.ts')
          s = p.read_text()
          s = s.replace('import { PlatformConfigModule } from "../platform-config/platform-config.module.js";\n', 'import { MediaModule } from "../media/media.module.js";\nimport { PlatformConfigModule } from "../platform-config/platform-config.module.js";\n')
          s = s.replace('import { AdminSettingsService } from "./admin-settings.service.js";\n', 'import { AdminSettingsService } from "./admin-settings.service.js";\nimport { ContentSeedingController } from "./content-seeding.controller.js";\nimport { ContentSeedingService } from "./content-seeding.service.js";\n')
          s = s.replace('  imports: [AuthModule, PlatformConfigModule],', '  imports: [AuthModule, MediaModule, PlatformConfigModule],')
          s = s.replace('    PublicProductController,\n', '    PublicProductController,\n    ContentSeedingController,\n')
          s = s.replace('    AdminProductService,\n', '    AdminProductService,\n    ContentSeedingService,\n')
          p.write_text(s)

          p = Path('apps/api/src/admin/admin-control.controller.ts')
          s = p.read_text().replace('    status: z.enum(["ACTIVE", "HIDDEN", "SUSPENDED"]).optional(),\n', '    status: z.enum(["ACTIVE", "HIDDEN", "SUSPENDED"]).optional(),\n    isPlatformOwned: z.boolean().optional(),\n', 1)
          p.write_text(s)

          p = Path('apps/api/src/admin/admin-control.service.ts')
          s = p.read_text()
          s = s.replace('  revenueShareBps?: number | null | undefined;\n', '  revenueShareBps?: number | null | undefined;\n  isPlatformOwned?: boolean | undefined;\n')
          s = s.replace('          status: true,\n          createdAt: true,\n          members:', '          status: true,\n          isPlatformOwned: true,\n          createdAt: true,\n          members:')
          s = s.replace('          ...(patch.status !== undefined ? { status: patch.status } : {}),\n', '          ...(patch.status !== undefined ? { status: patch.status } : {}),\n          ...(patch.isPlatformOwned !== undefined ? { isPlatformOwned: patch.isPlatformOwned } : {}),\n', 1)
          s = s.replace('          status: true,\n          updatedAt: true,\n', '          status: true,\n          isPlatformOwned: true,\n          updatedAt: true,\n', 1)
          s = s.replace('          status: channel.status,\n', '          status: channel.status,\n          isPlatformOwned: channel.isPlatformOwned,\n', 1)
          p.write_text(s)
          PY
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write packages/db/prisma/schema.prisma apps/api/src/media/upload-session-token.service.ts apps/api/src/media/media-upload.service.ts apps/api/src/admin/admin.module.ts apps/api/src/admin/admin-control.controller.ts apps/api/src/admin/admin-control.service.ts apps/api/src/admin/content-seeding.controller.ts apps/api/src/admin/content-seeding.service.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/db/prisma/schema.prisma apps/api/src/media/upload-session-token.service.ts apps/api/src/media/media-upload.service.ts apps/api/src/admin/admin.module.ts apps/api/src/admin/admin-control.controller.ts apps/api/src/admin/admin-control.service.ts apps/api/src/admin/content-seeding.controller.ts apps/api/src/admin/content-seeding.service.ts
          git diff --cached --quiet || git commit -m "Task 30: wire content seeding workflow"
          git push
