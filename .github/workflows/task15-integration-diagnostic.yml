name: Temporary Task 15 integration diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/task15-integration-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_test
          POSTGRES_PASSWORD: ayin
          POSTGRES_USER: ayin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      AUTH_TOKEN_SECRET: task-04-ci-auth-secret-with-more-than-32-characters
      CORS_ORIGIN: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck > /tmp/task15-typecheck.txt 2>&1
      - run: pnpm test:integration > TASK15_INTEGRATION_DIAGNOSTIC_2.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f TASK15_INTEGRATION_DIAGNOSTIC.txt
          git add -A TASK15_INTEGRATION_DIAGNOSTIC.txt TASK15_INTEGRATION_DIAGNOSTIC_2.txt
          git commit -m "chore: capture Task 15 integration diagnostic 2"
          git push origin HEAD:main
