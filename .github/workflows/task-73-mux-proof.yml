name: Task 73 Mux credential proof

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/src/live/**"
      - ".github/workflows/task-73-mux-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mux-credential-proof:
    name: Mux credential prerequisite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
      MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
      MUX_WEBHOOK_SIGNING_SECRET: ${{ secrets.MUX_WEBHOOK_SIGNING_SECRET }}
      MUX_TASK72_PROOF: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Verify Task 73 credential prerequisite
        shell: bash
        run: |
          missing=()
          [ -n "$MUX_TOKEN_ID" ] || missing+=("MUX_TOKEN_ID")
          [ -n "$MUX_TOKEN_SECRET" ] || missing+=("MUX_TOKEN_SECRET")
          [ -n "$MUX_WEBHOOK_SIGNING_SECRET" ] || missing+=("MUX_WEBHOOK_SIGNING_SECRET")
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'TASK_73_EXTERNAL_BLOCKER: missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 42
          fi
          echo "Task 73 credential prerequisite is present."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Mux test-mode control-plane proof
        run: pnpm --filter @ayin/api run proof:live-provider
