name: Task 27 hardening patch

on:
  push:
    branches: [task-27-security-hardening]
    paths:
      - ".github/workflows/task27-hardening-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-27-security-hardening
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Patch advertising hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/ads/advertising-control.service.ts')
          s = p.read_text()
          old = '''    return campaigns.map((campaign) => ({
      ...campaign,
      direct: byCampaign.get(campaign.id) ?? null,
    }));'''
          new = '''    return campaigns.map((campaign) => {
      const direct = byCampaign.get(campaign.id);
      return {
        ...campaign,
        direct: direct
          ? {
              ...direct,
              impressionGoal:
                direct.impressionGoal === null ? null : Number(direct.impressionGoal),
            }
          : null,
      };
    });'''
          if old not in s:
              raise SystemExit('listCampaigns target not found')
          s = s.replace(old, new, 1)
          old2 = '''    if (await this.isEmergencyKilled())
      return { enabled: false as const, reason: "EMERGENCY_KILL_SWITCH" };
    const campaigns = await this.database.client.campaign.findMany({'''
          new2 = '''    if (await this.isEmergencyKilled())
      return { enabled: false as const, reason: "EMERGENCY_KILL_SWITCH" };
    const placement = await this.database.client.adPlacement.findUnique({
      where: { key: context.placementKey },
      select: { enabled: true },
    });
    if (!placement?.enabled)
      return { enabled: false as const, reason: "PLACEMENT_DISABLED" };
    const campaigns = await this.database.client.campaign.findMany({'''
          if old2 not in s:
              raise SystemExit('decision target not found')
          p.write_text(s.replace(old2, new2, 1))
          PY
          pnpm install --frozen-lockfile
          pnpm format
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/ads/advertising-control.service.ts apps/api/src apps/web/next.config.ts docs/SECURITY_HARDENING.md
          git commit -m "Task 27: harden advertising and format security changes" || exit 0
          git push origin HEAD:task-27-security-hardening
