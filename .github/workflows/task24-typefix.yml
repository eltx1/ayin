name: Task 24 type fixes
on:
  push:
    branches: [task-24-moderation-rights-trust]
    paths: [".github/workflows/task24-typefix.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: task-24-moderation-rights-trust }
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/trust/trust.service.ts')
          s=p.read_text()
          s=s.replace('return this.db.client.takedownRequest.create({ data: { requesterId: accountId, ...d } });','''return this.db.client.takedownRequest.create({\n      data: {\n        requesterId: accountId,\n        claimantName: d.claimantName,\n        contactEmail: d.contactEmail,\n        rightsBasis: d.rightsBasis,\n        details: d.details,\n        ...(d.videoId ? { videoId: d.videoId } : {}),\n      },\n    });''')
          s=s.replace('''      const row = await tx.moderationAction.create({ data: { actorAccountId: actor, ...d } });''','''      const row = await tx.moderationAction.create({\n        data: {\n          actorAccountId: actor,\n          kind: d.kind,\n          reason: d.reason,\n          ...(d.caseId ? { caseId: d.caseId } : {}),\n          ...(d.targetAccountId ? { targetAccountId: d.targetAccountId } : {}),\n          ...(d.channelId ? { channelId: d.channelId } : {}),\n          ...(d.videoId ? { videoId: d.videoId } : {}),\n        },\n      });''')
          s=s.replace('''      const row = await tx.creatorTrustState.upsert({\n        where: { channelId },\n        update: d,\n        create: { channelId, ...d },\n      });''','''      const trustData = {\n        level: d.level,\n        ...(d.reviewRequired === undefined ? {} : { reviewRequired: d.reviewRequired }),\n      };\n      const row = await tx.creatorTrustState.upsert({\n        where: { channelId },\n        update: trustData,\n        create: { channelId, ...trustData },\n      });''')
          s=s.replace('''        reason: d.resolution,\n        metadata: { status: d.status },''','''        ...(d.resolution ? { reason: d.resolution } : {}),\n        metadata: { status: d.status },''',1)
          p.write_text(s)
          PY
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm exec prettier --write apps/api/src/trust/trust.service.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/trust/trust.service.ts
          git commit -m "fix: satisfy strict trust input typing"
          git push origin HEAD:task-24-moderation-rights-trust
