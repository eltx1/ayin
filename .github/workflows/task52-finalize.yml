name: Task 52 implementation validation

on:
  push:
    branches:
      - task-52-captions-chapters

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Task 52 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: task-52-captions-chapters
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Apply implementation patch
        run: python3 deploy/task52-finalize.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed source
        run: |
          pnpm exec prettier --write apps/api/src/creator/caption.service.ts apps/api/src/media/media-storage.adapter.ts apps/api/src/watch/watch.service.ts "apps/web/src/app/(viewer)/watch/[slug]/page.tsx" apps/web/src/components/studio/studio-content-manager.tsx apps/web/src/components/player/ayin-player.tsx apps/web/src/components/player/ayin-player.module.css
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Commit validated implementation
        run: |
          rm .github/workflows/task52-finalize.yml deploy/task52-finalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(task-52): integrate captions and chapter playback"
          git push origin HEAD:task-52-captions-chapters
