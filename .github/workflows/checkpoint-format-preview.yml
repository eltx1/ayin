name: Checkpoint format preview

on:
  pull_request:
    paths:
      - ".github/workflows/checkpoint-format-preview.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format checkpoint
        run: pnpm exec prettier --write docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-checkpoint
          path: docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md
          retention-days: 1
