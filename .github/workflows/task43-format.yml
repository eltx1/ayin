name: Task 43 formatter helper

on:
  push:
    branches:
      - task-43-observability

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-43-observability
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 43 files
        run: |
          pnpm exec prettier --write --ignore-unknown \
            apps/api/.env.example \
            apps/api/src/admin/admin-observability.controller.ts \
            apps/api/src/admin/admin.module.ts \
            apps/api/src/app.controller.ts \
            apps/api/src/app.module.ts \
            apps/api/src/main.ts \
            apps/api/src/media-worker.ts \
            apps/api/src/media/media-processing-worker.service.ts \
            apps/api/src/observability/observability-context.ts \
            apps/api/src/observability/observability-core.test.ts \
            apps/api/src/observability/observability-core.ts \
            apps/api/src/observability/observability-exception.filter.ts \
            apps/api/src/observability/observability-fastify.ts \
            apps/api/src/observability/observability.module.ts \
            apps/api/src/observability/observability.service.ts \
            apps/api/src/observability/structured-logger.service.ts \
            apps/api/src/observability/telemetry.adapter.ts \
            apps/web/src/app/api/health/route.ts \
            apps/web/src/components/player/ad-enabled-ayin-player.tsx \
            apps/web/src/instrumentation.ts \
            apps/web/src/proxy.ts \
            deploy/ecosystem.config.cjs \
            docs/TASK43_OBSERVABILITY.md \
            tests/e2e/observability.acceptance.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web deploy/ecosystem.config.cjs docs/TASK43_OBSERVABILITY.md tests/e2e/observability.acceptance.spec.ts
          git diff --cached --quiet || git commit -m "style(observability): format Task 43 changes"
          git push origin HEAD:task-43-observability
