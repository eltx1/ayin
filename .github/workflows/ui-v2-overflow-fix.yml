name: UI V2 responsive overflow fixer

on:
  push:
    branches:
      - design/ui-ux-v2-modern-responsive
    paths:
      - ".github/workflows/ui-v2-overflow-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/ui-ux-v2-modern-responsive
      - name: Fix mobile intrinsic overflow
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('apps/web/src/app/studio/studio.module.css'),
              Path('apps/web/src/app/admin/admin.module.css'),
          ]

          for path in paths:
              text = path.read_text()
              old_frame = '''@media (max-width: 900px) {\n  .frame {\n    grid-template-columns: 1fr;\n  }'''
              new_frame = '''@media (max-width: 900px) {\n  .frame {\n    grid-template-columns: minmax(0, 1fr);\n    min-width: 0;\n    width: 100%;\n  }'''
              if old_frame not in text:
                  raise SystemExit(f'frame marker not found in {path}')
              text = text.replace(old_frame, new_frame, 1)

              old_sidebar = '''  .sidebar {\n    backdrop-filter: blur(24px) saturate(140%);'''
              new_sidebar = '''  .sidebar {\n    backdrop-filter: blur(24px) saturate(140%);\n    max-width: 100%;\n    min-width: 0;\n    width: 100%;'''
              if old_sidebar not in text:
                  raise SystemExit(f'sidebar marker not found in {path}')
              text = text.replace(old_sidebar, new_sidebar, 1)

              old_nav = '''  .nav {\n    display: flex;'''
              new_nav = '''  .nav {\n    display: flex;\n    max-width: 100%;\n    min-width: 0;\n    width: 100%;'''
              if old_nav not in text:
                  raise SystemExit(f'nav marker not found in {path}')
              text = text.replace(old_nav, new_nav, 1)
              path.write_text(text)
          PY
      - name: Format changed styles
        run: npx --yes prettier@3.9.6 --write apps/web/src/app/studio/studio.module.css apps/web/src/app/admin/admin.module.css
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/studio/studio.module.css apps/web/src/app/admin/admin.module.css
          git commit -m "fix(ui): contain mobile dashboard navigation overflow"
          git push origin HEAD:design/ui-ux-v2-modern-responsive
