name: Task 85 worker scaling format

on:
  push:
    branches:
      - task-85-worker-scaling
    paths:
      - ".github/workflows/task-85-worker-scaling-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-85-worker-scaling
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format task 85 files
        run: |
          pnpm exec prettier --write             apps/api/src/admin/admin-media-processing.controller.ts             apps/api/src/media/media-adaptive-processing.service.ts             apps/api/src/media/media-hls-transcoder.service.ts             apps/api/src/media/media-process-runner.ts             apps/api/src/media/media-processing-executor.service.ts             apps/api/src/media/media-processing-lifecycle.service.ts             apps/api/src/media/media-processing-queue.service.ts             apps/api/src/media/media-processing-worker.service.test.ts             apps/api/src/media/media-processing-worker.service.ts             apps/api/test/media-processing-queue.integration.test.ts             deploy/README.md             deploy/ecosystem.config.cjs             docs/MEDIA_WORKER_SCALING.md
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api deploy docs packages/db/prisma/schema.prisma packages/db/prisma/media-workers.prisma
          git commit -m "style(task-85): format worker scaling"
          git push origin HEAD:task-85-worker-scaling
