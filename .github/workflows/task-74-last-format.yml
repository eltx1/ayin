name: Task 74 last format

on:
  push:
    branches:
      - task-74-live-playback-hardening
    paths:
      - ".github/workflows/task-74-last-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-74-live-playback-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format last Task 74 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/components/player/live-ayin-player.tsx \
            tests/e2e/live-playback.acceptance.spec.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/player/live-ayin-player.tsx tests/e2e/live-playback.acceptance.spec.ts
          git commit -m "style(task-74): format last playback fixes"
          git push origin HEAD:task-74-live-playback-hardening
