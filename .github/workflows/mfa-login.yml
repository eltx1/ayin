name: MFA login regression

on:
  push:
    paths:
      - "apps/api/src/auth/**"
      - "apps/api/src/admin/admin.guard.ts"
      - "apps/api/src/admin/admin-account-write-authority.ts"
      - "apps/api/test/*mfa*"
      - "apps/api/test/admin-account-write-authority.integration.test.ts"
      - "apps/api/test/comments-availability.integration.test.ts"
      - "apps/web/src/components/account/account-mfa.tsx"
      - "apps/web/src/components/admin/admin-reauthentication.tsx"
      - "apps/web/src/app/auth-form*"
      - "apps/web/src/lib/login-mfa*"
      - "apps/web/src/lib/account-mfa*"
      - "tests/e2e/*mfa*"
      - ".github/workflows/mfa-login.yml"

permissions:
  contents: read

jobs:
  mfa:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_e2e
          POSTGRES_USER: ayin
          POSTGRES_PASSWORD: ayin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_e2e?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_e2e?schema=public
      AUTH_TOKEN_SECRET: task-29-e2e-auth-secret-with-more-than-32-characters
      UPLOAD_SESSION_SECRET: task-29-e2e-upload-secret-with-more-than-32-characters
      PAYOUT_DATA_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      WEB_ORIGIN: http://127.0.0.1:3000
      CORS_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_MEDIA_BASE_URL: http://media.invalid
      AYIN_E2E_STORAGE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate Prisma client and migrate
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm db:seed
      - name: Build release candidate
        run: pnpm build
      - name: Verify MFA enrollment, account changes, recovery and concurrency
        run: pnpm --filter @ayin/api exec vitest run --testTimeout=30000 --fileParallelism=false src/auth/mfa-optional-policy.test.ts test/admin-mfa.integration.test.ts test/mfa-enrollment-concurrency.integration.test.ts test/mfa-recovery-concurrency.integration.test.ts test/mfa-management-concurrency.integration.test.ts test/admin-account-write-authority.integration.test.ts test/comments-availability.integration.test.ts
      - name: Verify administrator sign-in and recovery in Chromium
        run: pnpm exec playwright test tests/e2e/admin-mfa.acceptance.spec.ts tests/e2e/account-mfa.acceptance.spec.ts tests/e2e/account-mfa-disable-recovery.acceptance.spec.ts tests/e2e/admin-reauthentication.acceptance.spec.ts
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mfa-login-failure-evidence
          path: test-results/
          retention-days: 7
