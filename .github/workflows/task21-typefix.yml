name: Task 21 type fixes
on:
  push:
    branches: [task-21-ad-control-direct-campaigns]
    paths:
      - ".github/workflows/task21-typefix.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-21-ad-control-direct-campaigns
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/ads/advertising-control.service.ts')
          s=p.read_text()
          s=s.replace('''          ...(data.config !== undefined\n            ? { config: data.config === null ? undefined : json(data.config) }\n            : {}),''','''          ...(data.config !== undefined && data.config !== null\n            ? { config: json(data.config) }\n            : {}),''')
          s=s.replace('''      const advertiser = await tx.advertiser.update({ where: { id: advertiserId }, data });''','''      const advertiser = await tx.advertiser.update({\n        where: { id: advertiserId },\n        data: {\n          ...(data.name !== undefined ? { name: data.name } : {}),\n          ...(data.status !== undefined ? { status: data.status } : {}),\n        },\n      });''')
          p.write_text(s)
          p=Path('apps/api/src/ads/advertising-control.controller.ts')
          s=p.read_text()
          s=s.replace('''    return this.advertising.recordDirectEvent(parsed.data);''','''    return this.advertising.recordDirectEvent({\n      placementKey: parsed.data.placementKey,\n      campaignId: parsed.data.campaignId,\n      creativeId: parsed.data.creativeId,\n      eventType: parsed.data.eventType,\n      sessionId: parsed.data.sessionId,\n      ...(parsed.data.requestId !== undefined ? { requestId: parsed.data.requestId } : {}),\n    });''')
          p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/ads
          git commit -m "fix: satisfy exact optional advertising types"
          git push origin HEAD:task-21-ad-control-direct-campaigns
