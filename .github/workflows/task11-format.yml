name: Task 11 formatter

on:
  push:
    branches:
      - task-11-ayin-player-watch-progress

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-11-ayin-player-watch-progress
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 11 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/watch/watch.controller.ts
          apps/api/test/watch-progress.integration.test.ts
          'apps/web/src/app/(viewer)/watch/[slug]/page.module.css'
          'apps/web/src/app/(viewer)/watch/[slug]/page.tsx'
          apps/web/src/components/player/ayin-player.module.css
          apps/web/src/components/player/ayin-player.tsx
          apps/web/src/lib/player-progress.test.ts
          apps/web/src/lib/player-progress.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/watch/watch.controller.ts apps/api/test/watch-progress.integration.test.ts 'apps/web/src/app/(viewer)/watch/[slug]/page.module.css' 'apps/web/src/app/(viewer)/watch/[slug]/page.tsx' apps/web/src/components/player/ayin-player.module.css apps/web/src/components/player/ayin-player.tsx apps/web/src/lib/player-progress.test.ts apps/web/src/lib/player-progress.ts
          git diff --cached --quiet || git commit -m "Format Task 11 player files"
          git push origin HEAD:task-11-ayin-player-watch-progress
