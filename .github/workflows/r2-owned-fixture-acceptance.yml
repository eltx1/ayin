name: Owned R2 fixture acceptance

# Isolated manual boundary. Neither deployment nor a push can start this job.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed exact main commit already successfully deployed (40 lowercase hex)
        required: true
        type: string
      run_id:
        description: Approved one-time run UUID 34c4947c-ba13-4fc9-9087-0d1db8cc4d28
        required: true
        type: string
      confirm_prefix:
        description: Exact approved ayin-recovery-acceptance/UUID/ prefix
        required: true
        type: string
      cleanup_ack:
        description: Explicit approved irreversible cleanup; enter DELETE_ONLY_CREATED_FIXTURES
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ayin-production-deploy
  cancel-in-progress: false

jobs:
  acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      FIXTURE_RUN_ID: ${{ inputs.run_id }}
      CONFIRM_PREFIX: ${{ inputs.confirm_prefix }}
      CLEANUP_ACK: ${{ inputs.cleanup_ack }}
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Require exact manually approved one-time scope
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FIXTURE_RUN_ID" == '34c4947c-ba13-4fc9-9087-0d1db8cc4d28' ]]
          [[ "$CONFIRM_PREFIX" == 'ayin-recovery-acceptance/34c4947c-ba13-4fc9-9087-0d1db8cc4d28/' ]]
          [[ "$CLEANUP_ACK" == 'DELETE_ONLY_CREATED_FIXTURES' ]]

      - name: Require reviewed main and successful exact deployment
        uses: actions/github-script@v8
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const sha = process.env.RELEASE_SHA;
            const { data: branch } = await github.rest.repos.getBranch({ ...repo, branch: 'main' });
            if (branch.commit.sha !== sha) throw new Error('Acceptance requires current main.');
            for (const [workflow, name] of [['deploy.yml', 'Production deployment'], ['database.yml', 'Task quality gates']]) {
              const { data } = await github.rest.actions.listWorkflowRuns({ ...repo, workflow_id: workflow, head_sha: sha, status: 'success', per_page: 100 });
              const valid = data.workflow_runs.some(run => run.name === name && run.head_sha === sha && run.head_branch === 'main' && run.conclusion === 'success' && (workflow !== 'database.yml' || run.event === 'push')); 
              if (!valid) throw new Error('The exact main release needs successful quality gates and production deployment.');
            }

      - name: Checkout exact already-deployed main tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install locked official browser tooling and run offline guards
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          node --test deploy/media/r2-owned-fixture-provider.test.mjs deploy/media/r2-owned-fixture-browser.test.mjs
          corepack pnpm exec playwright install --with-deps chromium

      - name: Configure existing pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"
          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          [[ "$actual_fingerprint" == "$PINNED_SSH_HOST_FINGERPRINT" ]]
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Observe approved fixtures through browser and existing remote credentials
        shell: bash
        run: |
          set -euo pipefail
          node deploy/media/r2-owned-fixture-browser.mjs \
            --execute-approved --release-sha "$RELEASE_SHA" \
            --run-id "$FIXTURE_RUN_ID" --confirm-prefix "$CONFIRM_PREFIX" \
            --ack-cleanup "$CLEANUP_ACK"

      - name: Upload only allowlisted observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: owned-r2-fixture-proof-${{ inputs.run_id }}
          path: owned-r2-proof.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove ephemeral runner SSH material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$HOME/.ssh/known_hosts.candidate"
