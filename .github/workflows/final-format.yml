name: Final hardening format

on:
  push:
    branches:
      - feature/brand-monetization-admin-control-center
    paths:
      - .github/workflows/final-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brand-monetization-admin-control-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format final changes
        run: pnpm exec prettier --write apps/api/src/revenue/creator-finance.service.ts apps/api/test/admin-operations.integration.test.ts apps/api/src/admin/admin-governance.service.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/revenue/creator-finance.service.ts apps/api/test/admin-operations.integration.test.ts apps/api/src/admin/admin-governance.service.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format final hardening changes"
          git push origin HEAD:feature/brand-monetization-admin-control-center
