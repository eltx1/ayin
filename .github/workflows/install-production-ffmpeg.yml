name: Activate production FFmpeg runtime

on:
  push:
    paths:
      - ".github/workflows/install-production-ffmpeg.yml"

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: 22
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Activate verified runtime and smoke test
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ffmpeg=/home/ayin/bin/ffmpeg
          ffprobe=/home/ayin/bin/ffprobe
          test -x "$ffmpeg"
          test -x "$ffprobe"
          "$ffmpeg" -version | sed -n '1p'
          "$ffprobe" -version | sed -n '1p'

          encoders="$(mktemp /tmp/ayin-encoders.XXXXXX)"
          "$ffmpeg" -hide_banner -encoders > "$encoders" 2>/dev/null
          grep -q 'libx264' "$encoders"
          rm -f "$encoders"

          env_file=/home/ayin/env/api.env
          test -f "$env_file"
          env_tmp="$(mktemp /home/ayin/env/api.env.tmp.XXXXXX)"
          awk '!/^FFMPEG_PATH=/ && !/^FFPROBE_PATH=/' "$env_file" > "$env_tmp"
          printf '%s\n' 'FFMPEG_PATH=/home/ayin/bin/ffmpeg' 'FFPROBE_PATH=/home/ayin/bin/ffprobe' >> "$env_tmp"
          chmod 600 "$env_tmp"
          mv "$env_tmp" "$env_file"

          pm2 restart ayin-media-worker --update-env >/dev/null
          sleep 3
          pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(x=>x.name==="ayin-media-worker");if(!p||p.pm2_env?.status!=="online")process.exit(1);console.log(JSON.stringify({name:p.name,status:p.pm2_env.status,restarts:p.pm2_env.restart_time,pid:p.pid}))})'

          smoke="$(mktemp -d /tmp/ayin-ffmpeg-smoke.XXXXXX)"
          trap 'rm -rf "$smoke"' EXIT
          "$ffmpeg" -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc=size=320x180:rate=24' \
            -f lavfi -i 'sine=frequency=1000:sample_rate=44100' \
            -t 1 -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p -threads 1 \
            -c:a aac -b:a 96k -ac 2 -movflags +faststart \
            "$smoke/canonical.mp4"
          test -s "$smoke/canonical.mp4"
          "$ffprobe" -v error -show_entries format=duration:stream=codec_name,codec_type,width,height -of json "$smoke/canonical.mp4"

          grep -q '^FFMPEG_PATH=/home/ayin/bin/ffmpeg$' "$env_file"
          grep -q '^FFPROBE_PATH=/home/ayin/bin/ffprobe$' "$env_file"
          echo 'AYIN_FFMPEG_RUNTIME_READY=1'
          REMOTE
