name: Install production FFmpeg runtime

on:
  push:
    paths:
      - ".github/workflows/install-production-ffmpeg.yml"

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: 22
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Install verified FFmpeg and restart media worker
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          asset='ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz'
          base='https://github.com/BtbN/FFmpeg-Builds/releases/latest/download'
          work="$(mktemp -d /tmp/ayin-ffmpeg-install.XXXXXX)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"

          curl --fail --location --retry 3 --retry-delay 2 -o "$asset" "$base/$asset"
          curl --fail --location --retry 3 --retry-delay 2 -o checksums.sha256 "$base/checksums.sha256"
          grep -E "[[:space:]*]${asset}$" checksums.sha256 > expected.sha256
          test -s expected.sha256
          sha256sum -c expected.sha256

          mkdir extracted
          tar -xJf "$asset" -C extracted
          ffmpeg_src="$(find extracted -type f -path '*/bin/ffmpeg' -print -quit)"
          ffprobe_src="$(find extracted -type f -path '*/bin/ffprobe' -print -quit)"
          test -n "$ffmpeg_src"
          test -n "$ffprobe_src"

          install -d -m 755 /home/ayin/bin
          install -m 755 "$ffmpeg_src" /home/ayin/bin/ffmpeg
          install -m 755 "$ffprobe_src" /home/ayin/bin/ffprobe

          /home/ayin/bin/ffmpeg -version | head -n 1
          /home/ayin/bin/ffprobe -version | head -n 1
          /home/ayin/bin/ffmpeg -hide_banner -encoders 2>/dev/null | grep -q 'libx264'

          env_file=/home/ayin/env/api.env
          test -f "$env_file"
          env_tmp="$(mktemp /home/ayin/env/api.env.tmp.XXXXXX)"
          awk '!/^FFMPEG_PATH=/ && !/^FFPROBE_PATH=/' "$env_file" > "$env_tmp"
          printf '%s\n' 'FFMPEG_PATH=/home/ayin/bin/ffmpeg' 'FFPROBE_PATH=/home/ayin/bin/ffprobe' >> "$env_tmp"
          chmod 600 "$env_tmp"
          mv "$env_tmp" "$env_file"

          pm2 restart ayin-media-worker --update-env
          sleep 3
          pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(x=>x.name==="ayin-media-worker");if(!p||p.pm2_env?.status!=="online")process.exit(1);console.log(JSON.stringify({name:p.name,status:p.pm2_env.status,restarts:p.pm2_env.restart_time,pid:p.pid}))})'

          smoke="$(mktemp -d /tmp/ayin-ffmpeg-smoke.XXXXXX)"
          trap 'rm -rf "$work" "$smoke"' EXIT
          /home/ayin/bin/ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc=size=320x180:rate=24' \
            -f lavfi -i 'sine=frequency=1000:sample_rate=44100' \
            -t 1 -map 0:v:0 -map 1:a:0 \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p -threads 1 \
            -c:a aac -b:a 96k -ac 2 -movflags +faststart \
            "$smoke/canonical.mp4"
          test -s "$smoke/canonical.mp4"
          /home/ayin/bin/ffprobe -v error -show_entries format=duration:stream=codec_name,codec_type,width,height -of json "$smoke/canonical.mp4"
          echo 'AYIN_FFMPEG_RUNTIME_READY=1'
          REMOTE
