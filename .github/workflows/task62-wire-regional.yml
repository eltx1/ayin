name: Task 62 wire regional discovery

on:
  push:
    branches: [task-62-regional-discovery]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-62-regional-discovery
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply scoped Task 62 discovery patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('apps/api/src/discovery/discovery.service.ts')
          s = p.read_text()

          old = 'import { VideoPolicyService } from "../video-policy/video-policy.service.js";\n'
          new = old + 'import { RegionalDiscoveryService, type RegionalDiscoverySignal } from "./regional-discovery.service.js";\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  async listEnabled(authenticated: boolean) {
    return this.database.client.homeRowConfig.findMany({
      where: {
        enabled: true,
        audience: { in: authenticated ? ["ALL", "AUTHENTICATED"] : ["ALL", "ANONYMOUS"] },
      },
      orderBy: [{ position: "asc" }, { key: "asc" }],
    });
  }

  async getEnabled(key: string, authenticated: boolean) {
    return this.database.client.homeRowConfig.findFirst({
      where: {
        key,
        enabled: true,
        audience: { in: authenticated ? ["ALL", "AUTHENTICATED"] : ["ALL", "ANONYMOUS"] },
      },
    });
  }

  async listAll() {
    return this.database.client.homeRowConfig.findMany({
      orderBy: [{ position: "asc" }, { key: "asc" }],
      include: { manualItems: { orderBy: { position: "asc" } } },
    });
  }
'''
          new = '''  async listEnabled(authenticated: boolean, regionCode?: string) {
    return this.database.client.homeRowConfig.findMany({
      where: {
        enabled: true,
        audience: { in: authenticated ? ["ALL", "AUTHENTICATED"] : ["ALL", "ANONYMOUS"] },
        ...regionTargetWhere(regionCode),
      },
      orderBy: [{ position: "asc" }, { key: "asc" }],
    });
  }

  async getEnabled(key: string, authenticated: boolean, regionCode?: string) {
    return this.database.client.homeRowConfig.findFirst({
      where: {
        key,
        enabled: true,
        audience: { in: authenticated ? ["ALL", "AUTHENTICATED"] : ["ALL", "ANONYMOUS"] },
        ...regionTargetWhere(regionCode),
      },
    });
  }

  async listAll() {
    return this.database.client.homeRowConfig.findMany({
      orderBy: [{ position: "asc" }, { key: "asc" }],
      include: {
        manualItems: { orderBy: { position: "asc" } },
        regionTargets: { orderBy: { regionCode: "asc" } },
      },
    });
  }
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    @Inject(SeriesCatalogService) private readonly seriesCatalog: SeriesCatalogService,
    @Inject(VideoPolicyService) private readonly videoPolicy: VideoPolicyService,
  ) {}
'''
          new = '''    @Inject(SeriesCatalogService) private readonly seriesCatalog: SeriesCatalogService,
    @Inject(VideoPolicyService) private readonly videoPolicy: VideoPolicyService,
    @Inject(RegionalDiscoveryService) private readonly regionalDiscovery: RegionalDiscoveryService,
  ) {}
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    const normalized = await this.normalizeContext(context);
    const rows = await this.rows.listEnabled(Boolean(normalized.profileId));
'''
          new = '''    const normalized = await this.normalizeContext(context);
    const rows = await this.rows.listEnabled(
      Boolean(normalized.profileId),
      regionalMerchandisingCode(normalized),
    );
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''          ...(await this.enforcePage(
            await this.loadRowPage(row, normalized, 0, Math.min(firstPageSize, row.maxItems)),
            normalized,
          )),
'''
          new = '''          ...(await this.enforcePage(
            await this.rankRegionalPage(
              row.source,
              await this.loadRowPage(row, normalized, 0, Math.min(firstPageSize, row.maxItems)),
              normalized,
            ),
            normalized,
          )),
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '    const row = await this.rows.getEnabled(key, Boolean(normalized.profileId));\n'
          new = '''    const row = await this.rows.getEnabled(
      key,
      Boolean(normalized.profileId),
      regionalMerchandisingCode(normalized),
    );
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''      ...(await this.enforcePage(
        await this.loadRowPage(row, normalized, offset, limit),
        normalized,
      )),
'''
          new = '''      ...(await this.enforcePage(
        await this.rankRegionalPage(
          row.source,
          await this.loadRowPage(row, normalized, offset, limit),
          normalized,
        ),
        normalized,
      )),
'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''  private async loadRowPage(
'''
          insert = '''  private async rankRegionalPage(
    source: string,
    page: DiscoveryPage,
    context: DiscoveryContext,
  ): Promise<DiscoveryPage> {
    if (
      !context.regionPersonalizationAllowed ||
      !context.regionCode ||
      page.items.length < 2
    ) {
      return page;
    }
    const signal = regionalSignalForSource(source);
    if (!signal) return page;
    return {
      ...page,
      items: await this.regionalDiscovery.rankItems(context.regionCode, signal, page.items),
    };
  }

'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)

          old = '''      case "POPULAR_REGION":
        return emptyPage(
          context.regionPersonalizationAllowed && context.regionCode
            ? "A privacy-approved region signal is present, but AYIN does not yet store regional watch aggregates, so no regional ranking is invented."
            : "Regional discovery requires an approved location signal and personalization permission.",
          "UNAVAILABLE",
        );
'''
          new = '''      case "POPULAR_REGION":
        return this.loadRankedVideos(hoursAgo(24), offset, limit, "Popular in your region");
'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''function normalizeRegionCode(region?: string): string | undefined {
'''
          helpers = '''function regionalMerchandisingCode(context: DiscoveryContext): string | undefined {
  return context.regionPersonalizationAllowed ? context.regionCode : undefined;
}

function regionalSignalForSource(
  source: string,
): Exclude<RegionalDiscoverySignal, "CATEGORY_AFFINITY"> | null {
  if (["TRENDING_WORLDWIDE", "POPULAR_NOW", "POPULAR_REGION"].includes(source)) {
    return "POPULAR_CONTENT";
  }
  if (["MOVIES", "SERIES"].includes(source)) return "CATALOG";
  if (source === "CREATOR_TV") return "CREATOR_TV";
  return null;
}

function regionTargetWhere(regionCode?: string): Prisma.HomeRowConfigWhereInput {
  if (!regionCode) return { regionTargets: { none: {} } };
  return {
    OR: [
      { regionTargets: { none: {} } },
      { regionTargets: { some: { regionCode } } },
    ],
  };
}

'''
          assert marker in s
          s = s.replace(marker, helpers + marker, 1)
          p.write_text(s)
          PY
      - run: pnpm exec prettier --write apps/api/src/discovery/discovery.service.ts
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/task62-wire-regional.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/discovery/discovery.service.ts .github/workflows/task62-wire-regional.yml
          git commit -m "Wire regional signals into discovery ranking"
          git push origin HEAD:task-62-regional-discovery
