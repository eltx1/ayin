name: Task 09 patch

on:
  push:
    branches:
      - task-09-playlists

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-09-playlists
      - name: Patch Task 09 integration points
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          schema = "packages/db/prisma/schema.prisma"
          replace(schema,
              "enum PlaylistSystemKey {\n  UPLOADS\n}\n",
              "enum PlaylistSystemKey {\n  UPLOADS\n}\n\nenum PlaylistVisibility {\n  PUBLIC\n  UNLISTED\n  PRIVATE\n}\n")
          replace(schema,
              "  watchProgress WatchProgress[]\n  watchHistory  WatchHistory[]\n  subscriptions Subscription[]",
              "  watchProgress  WatchProgress[]\n  watchHistory   WatchHistory[]\n  watchLaterItems WatchLaterItem[]\n  subscriptions  Subscription[]")
          replace(schema,
              "  watchProgress      WatchProgress[]\n  watchHistory       WatchHistory[]\n  reactions          Reaction[]",
              "  watchProgress      WatchProgress[]\n  watchHistory       WatchHistory[]\n  watchLaterItems    WatchLaterItem[]\n  reactions          Reaction[]")
          replace(schema,
              "  systemKey   PlaylistSystemKey?\n  isProtected Boolean            @default(false)\n  isPublic    Boolean            @default(true)",
              "  systemKey   PlaylistSystemKey?\n  isProtected Boolean            @default(false)\n  visibility  PlaylistVisibility @default(PUBLIC)\n  isPublic    Boolean            @default(true)")
          replace(schema,
              "  @@unique([channelId, slug])\n  @@unique([channelId, systemKey])\n  @@index([channelId, createdAt])\n}\n\nmodel PlaylistItem",
              "  @@unique([channelId, slug])\n  @@unique([channelId, systemKey])\n  @@index([channelId, createdAt])\n  @@index([channelId, visibility, createdAt])\n}\n\nmodel PlaylistItem")

          settings = "apps/api/src/platform-config/platform-settings.catalog.ts"
          p = Path(settings)
          text = p.read_text()
          marker = "  creatorTvNameTemplate: {"
          if "allowCreatorUploadsPlaylistRename" not in text:
              block = '''  allowCreatorUploadsPlaylistRename: {\n    namespace: "CREATOR",\n    key: "allowCreatorUploadsPlaylistRename",\n    valueType: "BOOLEAN",\n    defaultValue: true,\n    schema: z.boolean(),\n    section: "creatorDefaults",\n    label: "Creators can rename Uploads",\n    description:\n      "Allow channel owners to rename the protected Uploads playlist while AYIN keeps its system identity and automatic membership behavior.",\n    control: "toggle",\n    highImpact: false,\n    superadminOnly: false,\n  },\n'''
              if marker not in text:
                  raise SystemExit("Settings insertion marker missing")
              p.write_text(text.replace(marker, block + marker, 1))

          module = "apps/api/src/creator/creator.module.ts"
          replace(module,
              'import { ChannelService } from "./channel.service.js";\nimport { QuickUploadController } from "./quick-upload.controller.js";',
              'import { ChannelService } from "./channel.service.js";\nimport {\n  CreatorPlaylistCollectionController,\n  CreatorPlaylistController,\n  PublicPlaylistController,\n} from "./playlist.controller.js";\nimport { PlaylistService } from "./playlist.service.js";\nimport { QuickUploadController } from "./quick-upload.controller.js";')
          replace(module,
              "  controllers: [QuickUploadController, PublicChannelController, CreatorChannelController],\n  providers: [QuickUploadService, ChannelService],\n  exports: [ChannelService],",
              "  controllers: [\n    QuickUploadController,\n    PublicChannelController,\n    CreatorChannelController,\n    PublicPlaylistController,\n    CreatorPlaylistCollectionController,\n    CreatorPlaylistController,\n  ],\n  providers: [QuickUploadService, ChannelService, PlaylistService],\n  exports: [ChannelService, PlaylistService],")

          actions = "apps/web/src/components/channel/owner-channel-actions.tsx"
          replace(actions,
              '  return (\n    <Link className={styles.editAction} href="/channel/edit">\n      Edit channel\n    </Link>\n  );',
              '  return (\n    <>\n      <Link className={styles.editAction} href="/channel/playlists">\n        Manage playlists\n      </Link>\n      <Link className={styles.editAction} href="/channel/edit">\n        Edit channel\n      </Link>\n    </>\n  );')

          channel_page = "apps/web/src/app/(viewer)/c/[handle]/page.tsx"
          replace(channel_page,
              '''          {playlists.map((playlist) => (\n            <article className={styles.playlistCard} key={playlist.id}>\n              <h3>{playlist.name}</h3>\n              <p>{playlist.description || "A public collection from this channel."}</p>\n              <p className={styles.meta}>\n                {playlist.itemCount} {playlist.itemCount === 1 ? "video" : "videos"}\n              </p>\n            </article>\n          ))}''',
              '''          {playlists.map((playlist) => (\n            <Link\n              className={styles.playlistCard}\n              href={`/c/${data.channel.handle}/playlists/${playlist.slug}`}\n              key={playlist.id}\n            >\n              <h3>{playlist.name}</h3>\n              <p>{playlist.description || "A public collection from this channel."}</p>\n              <p className={styles.meta}>\n                {playlist.itemCount} {playlist.itemCount === 1 ? "video" : "videos"}\n              </p>\n            </Link>\n          ))}''')

          css = Path("apps/web/src/components/channel/public-channel.module.css")
          css_text = css.read_text()
          addition = '''\n.playlistCard {\n  color: inherit;\n  text-decoration: none;\n  transition: border-color 140ms ease, transform 140ms ease;\n}\n\n.playlistCard:hover {\n  border-color: color-mix(in srgb, var(--channel-accent) 42%, transparent);\n  transform: translateY(-2px);\n}\n'''
          if "transform: translateY(-2px);" not in css_text:
              css.write_text(css_text + addition)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/prisma/schema.prisma apps/api/src/platform-config/platform-settings.catalog.ts apps/api/src/creator/creator.module.ts apps/web/src/components/channel/owner-channel-actions.tsx 'apps/web/src/app/(viewer)/c/[handle]/page.tsx' apps/web/src/components/channel/public-channel.module.css
          git commit -m "Integrate Task 09 playlist product"
          git push origin HEAD:task-09-playlists
