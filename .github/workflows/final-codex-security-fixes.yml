name: Final Codex security fixes

on:
  push:
    branches:
      - feature/brand-monetization-admin-control-center
    paths:
      - .github/workflows/final-codex-security-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brand-monetization-admin-control-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply final Codex fixes and regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1. Only treat the full value as an email before exposing its domain in a mask.
          path = Path("apps/api/src/revenue/creator-finance.crypto.ts")
          text = path.read_text()
          old = '''  if (normalized.includes("@")) {
    const [local = "", domain = ""] = normalized.split("@", 2);
    const visible = local.slice(0, Math.min(2, local.length));
    return `${visible}${"•".repeat(Math.max(3, local.length - visible.length))}@${domain}`;
  }
'''
          new = '''  const emailMatch = /^([A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+)@((?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)$/.exec(
    normalized,
  );
  if (emailMatch) {
    const [, local = "", domain = ""] = emailMatch;
    const visible = local.slice(0, Math.min(2, local.length));
    return `${visible}${"•".repeat(Math.max(3, local.length - visible.length))}@${domain}`;
  }
'''
          if old not in text:
              raise SystemExit("crypto mask anchor not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("apps/api/src/revenue/creator-finance.crypto.test.ts")
          text = path.read_text()
          old = '''  it("returns masked display values instead of payout destinations", () => {
    expect(maskPayoutDestination("creator@example.com")).toBe("cr•••••@example.com");
    expect(maskPayoutDestination("GB12 AYIN 1234 5678 9012 34")).toBe("•••• 1234");
  });
'''
          new = '''  it("returns masked display values instead of payout destinations", () => {
    expect(maskPayoutDestination("creator@example.com")).toBe("cr•••••@example.com");
    expect(maskPayoutDestination("GB12 AYIN 1234 5678 9012 34")).toBe("•••• 1234");

    const freeForm = maskPayoutDestination("contact@example.com, account 00112233");
    expect(freeForm).toBe("•••• 2233");
    expect(freeForm).not.toContain("example.com");
    expect(freeForm).not.toContain("00112233");
  });
'''
          if old not in text:
              raise SystemExit("crypto test anchor not found")
          path.write_text(text.replace(old, new, 1))

          # 2. Make every finance surface select the same OWNER/ADMIN channel deterministically.
          path = Path("apps/api/src/revenue/revenue.service.ts")
          text = path.read_text()
          old = '''  private async creatorChannel(accountId: string) {
    const membership = await this.database.client.channelMember.findFirst({
      where: {
        accountId,
        role: { in: ["OWNER", "ADMIN", "EDITOR"] },
        channel: { status: { not: "REMOVED" } },
      },
      orderBy: { createdAt: "asc" },
      select: { channel: { select: { id: true, name: true, handle: true } } },
    });
    return membership?.channel ?? null;
  }
'''
          new = '''  private async creatorChannel(accountId: string) {
    const membership = await this.database.client.channelMember.findFirst({
      where: {
        accountId,
        role: { in: ["OWNER", "ADMIN"] },
        channel: { status: { not: "REMOVED" } },
      },
      orderBy: [{ createdAt: "asc" }, { id: "asc" }],
      select: { channel: { select: { id: true, name: true, handle: true } } },
    });
    return membership?.channel ?? null;
  }
'''
          if old not in text:
              raise SystemExit("revenue creator channel anchor not found")
          path.write_text(text.replace(old, new, 1))

          for file_name in [
              "apps/api/src/revenue/creator-finance.service.ts",
              "apps/api/src/revenue/creator-monetization-analytics.service.ts",
          ]:
              path = Path(file_name)
              text = path.read_text()
              old = '      orderBy: { createdAt: "asc" },\n'
              new = '      orderBy: [{ createdAt: "asc" }, { id: "asc" }],\n'
              if old not in text:
                  raise SystemExit(f"creator channel deterministic ordering anchor not found: {file_name}")
              path.write_text(text.replace(old, new, 1))

          # 3. Neutralize spreadsheet formula injection in both admin exports and creator statements.
          def patch_csv(path_name: str, function_name: str):
              path = Path(path_name)
              text = path.read_text()
              if function_name == "csvCell":
                  old = '''function csvCell(value: unknown): string {
  if (value === null || value === undefined) return "";
  const text = value instanceof Date ? value.toISOString() : String(value);
  return `"${text.replaceAll('"', '""')}"`;
}
'''
                  new = '''function csvCell(value: unknown): string {
  if (value === null || value === undefined) return "";
  const text = value instanceof Date ? value.toISOString() : String(value);
  const candidate = text.trimStart();
  const numericLiteral = /^-?\\d+(?:\\.\\d+)?$/.test(candidate);
  const formulaLeading =
    /^[\\t\\r\\n]/.test(text) ||
    /^[=+@]/.test(candidate) ||
    (candidate.startsWith("-") && !numericLiteral);
  const safeText = formulaLeading ? `'${text}` : text;
  return `"${safeText.replaceAll('"', '""')}"`;
}
'''
              else:
                  old = '''function csv(value: unknown): string {
  if (value === null || value === undefined) return "";
  const text = value instanceof Date ? value.toISOString() : String(value);
  return `"${text.replaceAll('"', '""')}"`;
}
'''
                  new = '''function csv(value: unknown): string {
  if (value === null || value === undefined) return "";
  const text = value instanceof Date ? value.toISOString() : String(value);
  const candidate = text.trimStart();
  const numericLiteral = /^-?\\d+(?:\\.\\d+)?$/.test(candidate);
  const formulaLeading =
    /^[\\t\\r\\n]/.test(text) ||
    /^[=+@]/.test(candidate) ||
    (candidate.startsWith("-") && !numericLiteral);
  const safeText = formulaLeading ? `'${text}` : text;
  return `"${safeText.replaceAll('"', '""')}"`;
}
'''
              if old not in text:
                  raise SystemExit(f"CSV anchor not found: {path_name}")
              path.write_text(text.replace(old, new, 1))

          patch_csv("apps/api/src/admin/admin-governance.service.ts", "csvCell")
          patch_csv("apps/api/src/revenue/creator-monetization-analytics.service.ts", "csv")

          # Finance channel regression: an older EDITOR membership must never drive balances/actions.
          path = Path("apps/api/test/payout-safety.integration.test.ts")
          text = path.read_text()
          anchor = '''  it("atomically snapshots creator payouts, keeps the snapshot immutable and never exposes ciphertext", async () => {
'''
          regression = '''  it("uses one authorized channel consistently when an older editor membership also exists", async () => {
    const editorChannelOwner = await register("Editor Channel Owner", "editor-channel-owner@example.com");
    const creator = await register("Multi Channel Creator", "multi-channel-creator@example.com");

    await prisma.channelMember.create({
      data: {
        channelId: editorChannelOwner.user.channel.id,
        accountId: creator.user.account.id,
        role: "EDITOR",
        createdAt: new Date("2000-01-01T00:00:00.000Z"),
      },
    });
    await prisma.earningsLedgerEntry.createMany({
      data: [
        {
          channelId: editorChannelOwner.user.channel.id,
          type: "AD_REVENUE",
          state: "FINAL",
          amount: "999.000000",
          currency: "USD",
        },
        {
          channelId: creator.user.channel.id,
          type: "AD_REVENUE",
          state: "FINAL",
          amount: "125.000000",
          currency: "USD",
        },
      ],
    });

    const profile = await app.inject({
      method: "PUT",
      url: "/creator/studio/revenue/payment-profile",
      headers: { cookie: creator.cookie },
      payload: {
        legalName: "Multi Channel Creator",
        preferredCurrency: "USD",
        provider: "MANUAL",
        destination: "bank account ending 4321",
        countryCode: "US",
      },
    });
    expect(profile.statusCode).toBe(200);
    expect(profile.json().channelId).toBe(creator.user.channel.id);

    const overview = await app.inject({
      method: "GET",
      url: "/creator/studio/revenue",
      headers: { cookie: creator.cookie },
    });
    expect(overview.statusCode).toBe(200);
    expect(overview.json()).toMatchObject({
      channel: { id: creator.user.channel.id },
      currency: "USD",
      finalizedRevenue: "125.000000",
      availableForPayout: "125.000000",
      paymentProfile: { channelId: creator.user.channel.id },
    });

    const requested = await app.inject({
      method: "POST",
      url: "/creator/studio/revenue/payout-requests",
      headers: { cookie: creator.cookie },
      payload: { currency: "USD" },
    });
    expect(requested.statusCode).toBe(201);
    expect(requested.json().payout.channelId).toBe(creator.user.channel.id);
    expect(
      await prisma.payout.count({ where: { channelId: editorChannelOwner.user.channel.id } }),
    ).toBe(0);
  });

  it("neutralizes formula-leading creator statement cells", async () => {
    const creator = await register("Statement Creator", "statement-formula@example.com");
    await prisma.earningsLedgerEntry.create({
      data: {
        channelId: creator.user.channel.id,
        type: "ADJUSTMENT",
        state: "ADJUSTMENT",
        amount: "1.000000",
        currency: "USD",
        memo: '=HYPERLINK("https://example.invalid","click")',
      },
    });

    const statement = await app.inject({
      method: "GET",
      url: "/creator/studio/revenue/statement",
      headers: { cookie: creator.cookie },
    });
    expect(statement.statusCode).toBe(200);
    const content = statement.json().content as string;
    expect(content).toContain('"\'=HYPERLINK(""https://example.invalid"",""click"")"');
    expect(content).not.toContain('"=HYPERLINK(');
  });

'''
          if anchor not in text:
              raise SystemExit("payout safety regression anchor not found")
          path.write_text(text.replace(anchor, regression + anchor, 1))

          # Admin export regression for formula-leading attacker-controlled display names.
          path = Path("apps/api/test/admin-operations.integration.test.ts")
          text = path.read_text()
          anchor = '''  it("scopes global search result kinds to each staff role", async () => {
'''
          regression = '''  it("neutralizes formula-leading cells in administrative CSV exports", async () => {
    const operations = await register("CSV Operations", "csv-operations@example.com");
    const target = await register("CSV Target", "csv-target@example.com");
    await grant(operations.user.account.id, "OPERATIONS");
    await prisma.account.update({
      where: { id: target.user.account.id },
      data: { displayName: '=HYPERLINK("https://example.invalid","click")' },
    });

    const exported = await app.inject({
      method: "GET",
      url: "/admin/operations/exports/users",
      headers: { cookie: operations.cookie },
    });
    expect(exported.statusCode).toBe(200);
    const content = exported.json().content as string;
    expect(content).toContain('"\'=HYPERLINK(""https://example.invalid"",""click"")"');
    expect(content).not.toContain('"=HYPERLINK(');
  });

'''
          if anchor not in text:
              raise SystemExit("admin CSV regression anchor not found")
          path.write_text(text.replace(anchor, regression + anchor, 1))
          PY
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/api/src/revenue/creator-finance.crypto.ts
          apps/api/src/revenue/creator-finance.crypto.test.ts
          apps/api/src/revenue/revenue.service.ts
          apps/api/src/revenue/creator-finance.service.ts
          apps/api/src/revenue/creator-monetization-analytics.service.ts
          apps/api/src/admin/admin-governance.service.ts
          apps/api/test/payout-safety.integration.test.ts
          apps/api/test/admin-operations.integration.test.ts
      - name: Run focused unit test
        run: pnpm --filter @ayin/api exec vitest run src/revenue/creator-finance.crypto.test.ts
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/revenue/creator-finance.crypto.ts apps/api/src/revenue/creator-finance.crypto.test.ts apps/api/src/revenue/revenue.service.ts apps/api/src/revenue/creator-finance.service.ts apps/api/src/revenue/creator-monetization-analytics.service.ts apps/api/src/admin/admin-governance.service.ts apps/api/test/payout-safety.integration.test.ts apps/api/test/admin-operations.integration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: close final finance and export security gaps"
          git push origin HEAD:feature/brand-monetization-admin-control-center
