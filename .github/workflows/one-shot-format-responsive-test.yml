name: One-shot format responsive test

on:
  push:
    branches:
      - mobile-ux-iphone-upload-20260904

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mobile-ux-iphone-upload-20260904
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format responsive acceptance test
        run: pnpm exec prettier --write tests/e2e/responsive.acceptance.spec.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/responsive.acceptance.spec.ts
          git commit -m 'Format responsive acceptance test'
          git push origin HEAD:mobile-ux-iphone-upload-20260904
