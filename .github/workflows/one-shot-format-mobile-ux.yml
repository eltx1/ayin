name: One-shot format mobile UX branch

on:
  push:
    branches:
      - mobile-ux-iphone-upload-20260904

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mobile-ux-iphone-upload-20260904
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed UX files
        run: |
          pnpm exec prettier --write \
            'apps/web/src/app/(viewer)/account/account.module.css' \
            'apps/web/src/components/account/account-overview.tsx' \
            'apps/web/src/components/account/account-revenue.tsx' \
            'apps/web/src/components/upload/quick-upload.tsx' \
            'apps/web/src/components/viewer/viewer-shell.tsx' \
            'apps/web/src/lib/video-inspection.ts'
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'apps/web/src/app/(viewer)/account/account.module.css' \
            'apps/web/src/components/account/account-overview.tsx' \
            'apps/web/src/components/account/account-revenue.tsx' \
            'apps/web/src/components/upload/quick-upload.tsx' \
            'apps/web/src/components/viewer/viewer-shell.tsx' \
            'apps/web/src/lib/video-inspection.ts'
          git commit -m 'Format mobile UX and account changes'
          git push origin HEAD:mobile-ux-iphone-upload-20260904
