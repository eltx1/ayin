name: Validate media processing queue phase 1

on:
  push:
    paths:
      - ".github/workflows/validate-media-processing-queue-phase1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_test
          POSTGRES_PASSWORD: ayin
          POSTGRES_USER: ayin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      AUTH_TOKEN_SECRET: media-queue-ci-auth-secret-with-more-than-32-characters
      CORS_ORIGIN: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public
    steps:
      - name: Check out queue branch
        uses: actions/checkout@v7
        with:
          ref: ec2-ffmpeg-media-pipeline-20260904

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema and generate client
        run: |
          pnpm --filter @ayin/db exec prisma validate
          pnpm db:generate

      - name: Apply clean migrations
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build production applications
        run: pnpm build

# validation iteration 2
