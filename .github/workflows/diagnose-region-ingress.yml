name: Diagnose trusted country ingress (read only)

on:
  push:
    branches: [codex/ayin-region-ingress-20261029]
    paths:
      - .github/workflows/diagnose-region-ingress.yml
      - deploy/diagnose-region-ingress.mjs
      - deploy/test-region-ingress-diagnostic.mjs

permissions:
  contents: read

concurrency:
  group: ayin-region-read-only-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_HOST: 13.63.216.89
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify diagnostic redaction and read-only behavior
        run: node --test deploy/test-region-ingress-diagnostic.mjs
      - name: Configure existing pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          [[ "$actual_fingerprint" == "$PINNED_SSH_HOST_FINGERPRINT" ]]
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Read only AYIN runtime flags and ingress configuration indicators
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'node --input-type=module - --origin' < deploy/diagnose-region-ingress.mjs
      - name: Read only exact AYIN Cloudflare zone settings
        env:
          CF_TOKEN: ${{ secrets.AYIN_CLOUDFLARE_API_TOKEN }}
        run: node deploy/diagnose-region-ingress.mjs --cloudflare
