name: Discovery thumbnail precedence patch

on:
  push:
    branches:
      - feat/seo-auto-thumbnails-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/seo-auto-thumbnails-hardening
      - name: Keep completed creator thumbnails visible in discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/discovery/discovery.service.ts")
          text = path.read_text()
          old_const = 'const playableAssetStates = ["VALIDATED"] as const;\n'
          new_const = old_const + 'const completedThumbnailAssetStates = ["UPLOADED", "VALIDATED"] as const;\n'
          if old_const not in text:
              raise SystemExit("playable asset state anchor not found")
          text = text.replace(old_const, new_const, 1)
          old_filter = '''    where: {\n      kind: "THUMBNAIL",\n      status: { in: [...playableAssetStates] },\n      removedAt: null,\n    },'''
          new_filter = '''    where: {\n      kind: "THUMBNAIL",\n      status: { in: [...completedThumbnailAssetStates] },\n      removedAt: null,\n    },'''
          if old_filter not in text:
              raise SystemExit("thumbnail discovery filter anchor not found")
          text = text.replace(old_filter, new_filter, 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/discovery-thumbnail-precedence-patch-once.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/discovery/discovery.service.ts .github/workflows/discovery-thumbnail-precedence-patch-once.yml
          git commit -m "Keep creator thumbnails visible in discovery"
          git push origin HEAD:feat/seo-auto-thumbnails-hardening
