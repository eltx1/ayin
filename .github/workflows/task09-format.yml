name: Task 09 formatter

on:
  push:
    branches:
      - task-09-playlists

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-09-playlists
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 09 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/creator/playlist.controller.ts
          apps/api/src/creator/playlist.service.ts
          apps/api/src/creator/creator.module.ts
          apps/api/src/platform-config/platform-settings.catalog.ts
          apps/api/test/playlist-product.integration.test.ts
          apps/web/src/lib/playlist.ts
          apps/web/src/components/playlist/playlist-manager.tsx
          apps/web/src/components/playlist/playlist-editor.tsx
          apps/web/src/components/playlist/playlist-management.module.css
          apps/web/src/components/playlist/public-playlist.module.css
          'apps/web/src/app/(viewer)/channel/playlists/page.tsx'
          'apps/web/src/app/(viewer)/channel/playlists/[playlistId]/page.tsx'
          'apps/web/src/app/(viewer)/c/[handle]/playlists/[slug]/page.tsx'
          'apps/web/src/app/(viewer)/c/[handle]/page.tsx'
          apps/web/src/components/channel/owner-channel-actions.tsx
          apps/web/src/components/channel/public-channel.module.css
          docs/TASK09_PLAYLISTS.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web docs/TASK09_PLAYLISTS.md
          if ! git diff --cached --quiet; then
            git commit -m "Format Task 09 implementation"
            git push origin HEAD:task-09-playlists
          fi
