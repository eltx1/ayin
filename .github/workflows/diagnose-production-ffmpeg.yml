name: Diagnose production FFmpeg worker

on:
  push:
    paths:
      - ".github/workflows/diagnose-production-ffmpeg.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: 22
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read-only production media readiness
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'set -euo pipefail
            echo "CURRENT_RELEASE=$(readlink -f /home/ayin/htdocs/current)"
            printf "CURRENT_SHA="; git -C /home/ayin/htdocs/current rev-parse HEAD
            printf "FFMPEG="; command -v ffmpeg || true
            printf "FFPROBE="; command -v ffprobe || true
            if command -v ffmpeg >/dev/null 2>&1; then ffmpeg -version | head -n 1; fi
            if command -v ffprobe >/dev/null 2>&1; then ffprobe -version | head -n 1; fi
            echo "--- PM2 media worker ---"
            pm2 jlist | node -e '\''let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s)){if(p.name==="ayin-media-worker") console.log(JSON.stringify({name:p.name,status:p.pm2_env?.status,restarts:p.pm2_env?.restart_time,pid:p.pid,memory:p.monit?.memory,cpu:p.monit?.cpu}))}})'\''
            echo "--- recent worker logs ---"
            pm2 logs ayin-media-worker --nostream --lines 40 2>&1 | tail -n 80
          '
