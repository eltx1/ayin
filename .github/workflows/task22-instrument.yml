name: Task 22 instrumentation
on:
  push:
    branches: [task-22-analytics-pipeline]
    paths:
      - ".github/workflows/task22-instrument.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-22-analytics-pipeline
      - run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('apps/web/src/components/player/ayin-player.tsx')
          s=p.read_text()
          if 'onWaiting={() =>' not in s:
              s=s.replace('''            onPlay={() => {\n              setPlaying(true);\n              analytics.emit({ type: "play", videoId });\n            }}\n            onTimeUpdate''','''            onPlay={() => {\n              setPlaying(true);\n              analytics.emit({ type: "play", videoId });\n            }}\n            onWaiting={() => {\n              analytics.emit({ type: "buffer", videoId, positionMs });\n            }}\n            onStalled={() => {\n              analytics.emit({ type: "buffer", videoId, positionMs });\n            }}\n            onTimeUpdate''')
          p.write_text(s)

          p=Path('apps/web/src/components/upload/quick-upload.tsx')
          s=p.read_text()
          if 'from "@/lib/analytics"' not in s:
              s=s.replace('''import { apiBaseUrl, type AyinIdentity, readApiError } from "@/lib/api";''','''import { trackAnalyticsEvent } from "@/lib/analytics";\nimport { apiBaseUrl, type AyinIdentity, readApiError } from "@/lib/api";''')
          if 'trackAnalyticsEvent("UPLOAD_START"' not in s:
              s=s.replace('''      const draft = await createQuickDraft({''','''      trackAnalyticsEvent("UPLOAD_START", { channelId: identity.channel.id });\n      const draft = await createQuickDraft({''')
          if 'trackAnalyticsEvent("UPLOAD_COMPLETE"' not in s:
              s=s.replace('''      await confirmQuickUpload(draft.video.id);\n      setUploadComplete(true);''','''      await confirmQuickUpload(draft.video.id);\n      trackAnalyticsEvent("UPLOAD_COMPLETE", {\n        channelId: identity.channel.id,\n        videoId: draft.video.id,\n      });\n      setUploadComplete(true);''')
          if 'trackAnalyticsEvent("PUBLISH"' not in s:
              s=s.replace('''      setPublished(true);\n      setMessage(''','''      trackAnalyticsEvent("PUBLISH", {\n        ...(identity ? { channelId: identity.channel.id } : {}),\n        videoId,\n        metadata: { scheduled: result.video.status === "SCHEDULED" },\n      });\n      setPublished(true);\n      setMessage(''')
          p.write_text(s)

          p=Path('apps/web/src/components/creator-tv/creator-tv-player.tsx')
          s=p.read_text()
          s=s.replace('''import { useCallback, useMemo, useState } from "react";''','''import { useCallback, useEffect, useMemo, useState } from "react";''')
          if 'from "@/lib/analytics"' not in s:
              s=s.replace('''import { apiBaseUrl } from "@/lib/api";''','''import { trackAnalyticsEvent } from "@/lib/analytics";\nimport { apiBaseUrl } from "@/lib/api";''')
          marker='''  const current = data.schedule.nowPlaying;\n  const mediaUrl = mediaAssetUrl(current?.video.source.objectKey);'''
          if 'trackAnalyticsEvent("TV_START"' not in s:
              repl='''  const current = data.schedule.nowPlaying;\n  useEffect(() => {\n    if (!current) return;\n    trackAnalyticsEvent("TV_START", {\n      channelId: data.channel.id,\n      videoId: current.video.id,\n    });\n  }, [current?.occurrenceKey, current?.video.id, data.channel.id]);\n  const mediaUrl = mediaAssetUrl(current?.video.source.objectKey);'''
              s=s.replace(marker,repl)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: complete Task 22 event instrumentation"
          git pull --rebase origin task-22-analytics-pipeline
          git push origin HEAD:task-22-analytics-pipeline
