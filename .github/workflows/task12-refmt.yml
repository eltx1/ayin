name: Task 12 service formatter

on:
  push:
    branches: [task-12-discovery-my-ayin]
    paths: [.github/workflows/task12-refmt.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-12-discovery-my-ayin
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/discovery/discovery.service.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/discovery/discovery.service.ts
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "Format discovery service"
            git push origin HEAD:task-12-discovery-my-ayin
          fi
