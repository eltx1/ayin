name: Creator thumbnail precedence patch

on:
  push:
    branches:
      - feat/seo-auto-thumbnails-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/seo-auto-thumbnails-hardening
      - name: Patch thumbnail completion precedence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/creator/quick-upload.service.ts")
          text = path.read_text()
          old = '''          kind: "THUMBNAIL",\n          status: "UPLOADED",\n          id: { not: assetId },\n'''
          new = '''          kind: "THUMBNAIL",\n          status: { in: ["UPLOADED", "VALIDATED"] },\n          id: { not: assetId },\n'''
          if old not in text:
              raise SystemExit("thumbnail replacement anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/manual-thumbnail-precedence-patch-once.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/creator/quick-upload.service.ts .github/workflows/manual-thumbnail-precedence-patch-once.yml
          git commit -m "Keep creator thumbnails authoritative"
          git push origin HEAD:feat/seo-auto-thumbnails-hardening
