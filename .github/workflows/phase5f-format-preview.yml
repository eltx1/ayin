name: Phase5F formatting preview

on:
  pull_request:
    paths:
      - ".github/workflows/phase5f-format-preview.yml"

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Phase5F files
        run: |
          pnpm exec prettier --write \
            "apps/web/src/app/(viewer)/live/[slug]/live-watch-client.tsx" \
            apps/web/src/lib/i18n/resources/live-viewer.ts \
            apps/web/src/lib/live-viewer.ts \
            docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md \
            tests/e2e/live-playback.acceptance.spec.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: phase5f-formatted-files
          path: |
            apps/web/src/app/(viewer)/live/[slug]/live-watch-client.tsx
            apps/web/src/lib/i18n/resources/live-viewer.ts
            apps/web/src/lib/live-viewer.ts
            docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md
            tests/e2e/live-playback.acceptance.spec.ts
          retention-days: 1
