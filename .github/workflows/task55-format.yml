name: Task 55 temporary formatter

on:
  push:
    branches:
      - task-55-movie-catalog

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-55-movie-catalog
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format Task 55 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/movie-catalog/admin-movie-catalog.controller.test.ts
          apps/api/src/movie-catalog/admin-movie-catalog.controller.ts
          apps/api/src/movie-catalog/movie-catalog.controller.ts
          apps/api/src/movie-catalog/movie-catalog.policy.test.ts
          apps/api/src/movie-catalog/movie-catalog.policy.ts
          apps/api/src/movie-catalog/movie-catalog.service.ts
          'apps/web/src/app/movies/[slug]/movie.module.css'
          'apps/web/src/app/movies/[slug]/page.tsx'
          apps/web/src/components/admin/admin-movie-catalog.tsx
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/movie-catalog/admin-movie-catalog.controller.test.ts \
            apps/api/src/movie-catalog/admin-movie-catalog.controller.ts \
            apps/api/src/movie-catalog/movie-catalog.controller.ts \
            apps/api/src/movie-catalog/movie-catalog.policy.test.ts \
            apps/api/src/movie-catalog/movie-catalog.policy.ts \
            apps/api/src/movie-catalog/movie-catalog.service.ts \
            'apps/web/src/app/movies/[slug]/movie.module.css' \
            'apps/web/src/app/movies/[slug]/page.tsx' \
            apps/web/src/components/admin/admin-movie-catalog.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format task 55 movie catalog files"
          git push origin HEAD:task-55-movie-catalog
