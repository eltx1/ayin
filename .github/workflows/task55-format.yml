name: Task 55 temporary formatter

on:
  push:
    branches:
      - task-55-movie-catalog

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-55-movie-catalog
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/components/admin/admin-movie-catalog.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/admin/admin-movie-catalog.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format movie catalog admin fix"
          git push origin HEAD:task-55-movie-catalog
