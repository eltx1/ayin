name: Fastify lock apply

on:
  pull_request:
    paths:
      - ".github/workflows/fastify-lock-apply.yml"

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'web-pwa-phase-4f-notifications-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Generate and verify unified Fastify graph
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm install --frozen-lockfile
          test "$(pnpm list -r fastify --depth -1 --json | grep -c '5.12.5')" -ge 1
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json apps/api/package.json
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          test "$(git diff --cached --name-only)" = "pnpm-lock.yaml"
          git commit -m "security(deps): unify Fastify on patched 5.12.5"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
