name: Apply Task 03 schema patch

on:
  push:
    branches:
      - task-03-auth-instant-provisioning
    paths:
      - ".github/workflows/task03-schema-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-03-auth-instant-provisioning
      - name: Patch Prisma schema for authentication
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/db/prisma/schema.prisma")
          text = path.read_text()
          text = text.replace('output   = "../generated/prisma"', 'output   = "../src/generated/prisma"', 1)
          needle = '  status          AccountStatus @default(ACTIVE)\n  emailVerifiedAt DateTime?'
          replacement = '  status          AccountStatus @default(ACTIVE)\n  authVersion     Int           @default(0)\n  emailVerifiedAt DateTime?'
          if needle not in text:
              raise SystemExit("Account schema anchor not found")
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
      - name: Commit schema patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/prisma/schema.prisma
          git commit -m "Add authentication version to Account schema"
          git push origin HEAD:task-03-auth-instant-provisioning
