name: Temporary Task 17 formatter

on:
  push:
    branches:
      - task-17-admin-control-plane
    paths:
      - ".github/workflows/task17-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format Task 17 files
        run: |
          pnpm exec prettier --write \
            apps/api/src/admin/admin-control.controller.ts \
            apps/api/src/admin/admin-control.service.ts \
            apps/api/src/admin/admin.module.ts \
            apps/api/test/admin-control.integration.test.ts \
            apps/web/src/app/admin/admin.module.css \
            apps/web/src/app/admin/layout.tsx \
            apps/web/src/app/admin/page.tsx \
            apps/web/src/app/admin/users/page.tsx \
            apps/web/src/app/admin/channels/page.tsx \
            apps/web/src/app/admin/videos/page.tsx \
            apps/web/src/app/admin/tv/page.tsx \
            apps/web/src/app/admin/moderation/page.tsx \
            apps/web/src/components/admin/admin-dashboard.tsx \
            apps/web/src/components/admin/admin-users.tsx \
            apps/web/src/components/admin/admin-channels.tsx \
            apps/web/src/components/admin/admin-videos.tsx \
            apps/web/src/components/admin/admin-tv.tsx \
            apps/web/src/components/admin/admin-moderation.tsx \
            apps/web/src/lib/admin-control.ts
          rm -f .github/workflows/task17-format.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format Task 17 Admin control plane"
          git push origin HEAD:task-17-admin-control-plane
