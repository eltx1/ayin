name: Product source inventory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source under review
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Verify deterministic read-only inventory
        run: node --test scripts/test-product-inventory.mjs

      - name: Capture exact source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ayin-product-inventory"
          node scripts/audit-product-integration.mjs --stdout > "$RUNNER_TEMP/ayin-product-inventory/inventory.json"
          git diff --exit-code
          node -e 'const fs = require("node:fs"); const p = process.env.RUNNER_TEMP + "/ayin-product-inventory/inventory.json"; const r = JSON.parse(fs.readFileSync(p, "utf8")); console.log(JSON.stringify({ sourceSha: r.sourceSha, counts: r.counts, models: r.models.length, migrations: r.migrations.length }));'

      - name: Preserve source evidence only
        uses: actions/upload-artifact@v7
        with:
          name: ayin-product-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/ayin-product-inventory/inventory.json
          retention-days: 90
          if-no-files-found: error
