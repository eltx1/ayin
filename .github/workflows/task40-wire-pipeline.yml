name: Task 40 wire pipeline

on:
  push:
    branches:
      - task-40-hls-transcoding

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-40-hls-transcoding
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Wire Task 40 services and settings
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return False
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))
              return True

          catalog = Path("apps/api/src/platform-config/platform-settings.catalog.ts")
          text = catalog.read_text()
          marker = "  initialMediaCompatibilityProfileText: {"
          if "  mediaHlsEnabled: {" not in text:
              block = '''  mediaHlsEnabled: {
            namespace: "UPLOAD",
            key: "mediaHlsEnabled",
            valueType: "BOOLEAN",
            defaultValue: false,
            schema: z.boolean(),
            section: "uploads",
            label: "Adaptive HLS generation enabled",
            description:
              "Generate verified HLS renditions in addition to the canonical MP4. Playback remains MP4 until a later rollout task.",
            control: "toggle",
            highImpact: true,
            superadminOnly: true,
          },
          mediaHls360pEnabled: {
            namespace: "UPLOAD",
            key: "mediaHls360pEnabled",
            valueType: "BOOLEAN",
            defaultValue: true,
            schema: z.boolean(),
            section: "uploads",
            label: "HLS 360p rendition",
            description: "Allow the 360p HLS rendition when the source resolution justifies it.",
            control: "toggle",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls480pEnabled: {
            namespace: "UPLOAD",
            key: "mediaHls480pEnabled",
            valueType: "BOOLEAN",
            defaultValue: true,
            schema: z.boolean(),
            section: "uploads",
            label: "HLS 480p rendition",
            description: "Allow the 480p HLS rendition when the source resolution justifies it.",
            control: "toggle",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls720pEnabled: {
            namespace: "UPLOAD",
            key: "mediaHls720pEnabled",
            valueType: "BOOLEAN",
            defaultValue: true,
            schema: z.boolean(),
            section: "uploads",
            label: "HLS 720p rendition",
            description: "Allow the 720p HLS rendition when the source resolution justifies it.",
            control: "toggle",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls1080pEnabled: {
            namespace: "UPLOAD",
            key: "mediaHls1080pEnabled",
            valueType: "BOOLEAN",
            defaultValue: true,
            schema: z.boolean(),
            section: "uploads",
            label: "HLS 1080p rendition",
            description: "Allow the 1080p HLS rendition when the source resolution justifies it.",
            control: "toggle",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls360pVideoBitrateKbps: {
            namespace: "UPLOAD",
            key: "mediaHls360pVideoBitrateKbps",
            valueType: "INTEGER",
            defaultValue: 800,
            schema: z.number().int().min(300).max(2_000),
            section: "uploads",
            label: "HLS 360p video bitrate",
            description: "Target H.264 video bitrate for 360p HLS output.",
            control: "number",
            unit: "kbps",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls480pVideoBitrateKbps: {
            namespace: "UPLOAD",
            key: "mediaHls480pVideoBitrateKbps",
            valueType: "INTEGER",
            defaultValue: 1_400,
            schema: z.number().int().min(500).max(3_500),
            section: "uploads",
            label: "HLS 480p video bitrate",
            description: "Target H.264 video bitrate for 480p HLS output.",
            control: "number",
            unit: "kbps",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls720pVideoBitrateKbps: {
            namespace: "UPLOAD",
            key: "mediaHls720pVideoBitrateKbps",
            valueType: "INTEGER",
            defaultValue: 2_800,
            schema: z.number().int().min(1_000).max(6_500),
            section: "uploads",
            label: "HLS 720p video bitrate",
            description: "Target H.264 video bitrate for 720p HLS output.",
            control: "number",
            unit: "kbps",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls1080pVideoBitrateKbps: {
            namespace: "UPLOAD",
            key: "mediaHls1080pVideoBitrateKbps",
            valueType: "INTEGER",
            defaultValue: 5_000,
            schema: z.number().int().min(2_000).max(10_000),
            section: "uploads",
            label: "HLS 1080p video bitrate",
            description: "Target H.264 video bitrate for 1080p HLS output.",
            control: "number",
            unit: "kbps",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls360pAudioBitrateKbps: {
            namespace: "UPLOAD",
            key: "mediaHls360pAudioBitrateKbps",
            valueType: "INTEGER",
            defaultValue: 96,
            schema: z.number().int().min(64).max(256),
            section: "uploads",
            label: "HLS 360p audio bitrate",
            description: "Target AAC audio bitrate for 360p HLS output when audio exists.",
            control: "number",
            unit: "kbps",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls480pAudioBitrateKbps: {
            namespace: "UPLOAD",
            key: "mediaHls480pAudioBitrateKbps",
            valueType: "INTEGER",
            defaultValue: 128,
            schema: z.number().int().min(64).max(256),
            section: "uploads",
            label: "HLS 480p audio bitrate",
            description: "Target AAC audio bitrate for 480p HLS output when audio exists.",
            control: "number",
            unit: "kbps",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls720pAudioBitrateKbps: {
            namespace: "UPLOAD",
            key: "mediaHls720pAudioBitrateKbps",
            valueType: "INTEGER",
            defaultValue: 128,
            schema: z.number().int().min(64).max(256),
            section: "uploads",
            label: "HLS 720p audio bitrate",
            description: "Target AAC audio bitrate for 720p HLS output when audio exists.",
            control: "number",
            unit: "kbps",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHls1080pAudioBitrateKbps: {
            namespace: "UPLOAD",
            key: "mediaHls1080pAudioBitrateKbps",
            valueType: "INTEGER",
            defaultValue: 160,
            schema: z.number().int().min(64).max(320),
            section: "uploads",
            label: "HLS 1080p audio bitrate",
            description: "Target AAC audio bitrate for 1080p HLS output when audio exists.",
            control: "number",
            unit: "kbps",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHlsSegmentDurationSeconds: {
            namespace: "UPLOAD",
            key: "mediaHlsSegmentDurationSeconds",
            valueType: "INTEGER",
            defaultValue: 6,
            schema: z.number().int().min(2).max(10),
            section: "uploads",
            label: "HLS segment duration",
            description: "Target VOD HLS segment duration used for deterministic packaging and keyframe cadence.",
            control: "number",
            unit: "seconds",
            highImpact: false,
            superadminOnly: false,
          },
          mediaHlsMaxOutputHeight: {
            namespace: "UPLOAD",
            key: "mediaHlsMaxOutputHeight",
            valueType: "INTEGER",
            defaultValue: 1080,
            schema: z.number().int().min(360).max(1080),
            section: "uploads",
            label: "Maximum HLS output height",
            description: "Upper adaptive-rendition height. Task 40 intentionally caps production HLS at 1080p.",
            control: "number",
            unit: "px",
            highImpact: false,
            superadminOnly: false,
          },
          mediaProcessingScratchMaxBytesPerJob: {
            namespace: "UPLOAD",
            key: "mediaProcessingScratchMaxBytesPerJob",
            valueType: "INTEGER",
            defaultValue: 12 * 1024 * 1024 * 1024,
            schema: z
              .number()
              .int()
              .min(1024 * 1024 * 1024)
              .max(100 * 1024 * 1024 * 1024),
            section: "uploads",
            label: "Per-job processing scratch budget",
            description:
              "Maximum local ephemeral bytes budgeted for canonical plus one HLS rendition during processing.",
            control: "number",
            unit: "bytes",
            highImpact: true,
            superadminOnly: false,
          },
          '''
              if marker not in text:
                  raise SystemExit("platform settings insertion marker missing")
              catalog.write_text(text.replace(marker, block + marker, 1))

          storage = Path("apps/api/src/media/media-processing-storage.service.ts")
          text = storage.read_text()
          if "async downloadText(" not in text:
              marker = "  async uploadFile(key: string, filePath: string, contentType = \"video/mp4\"): Promise<void> {"
              method = '''  async downloadText(key: string, maxBytes = 2 * 1024 * 1024): Promise<string> {
            this.assertR2();
            if (!Number.isSafeInteger(maxBytes) || maxBytes < 1024 || maxBytes > 8 * 1024 * 1024) {
              throw new Error("R2 text verification limit is outside the safe range.");
            }
            return this.withDeadline("text download", this.r2TransferTimeoutMs, async (signal) => {
              const response = await new R2SigV4(this.config).request({ method: "GET", key, signal });
              const declaredLength = Number(response.headers.get("content-length") ?? "0");
              if (Number.isFinite(declaredLength) && declaredLength > maxBytes) {
                throw new Error("R2 text object exceeds the verification size limit.");
              }
              const text = await response.text();
              if (Buffer.byteLength(text, "utf8") > maxBytes) {
                throw new Error("R2 text object exceeds the verification size limit.");
              }
              return text;
            });
          }

          '''
              if marker not in text:
                  raise SystemExit("storage insertion marker missing")
              storage.write_text(text.replace(marker, method + marker, 1))

          module = Path("apps/api/src/media/media.module.ts")
          text = module.read_text()
          if '"./media-adaptive-processing.service.js"' not in text:
              text = text.replace(
                  'import { DevelopmentMediaStorageAdapter } from "./development-media-storage.adapter.js";\n',
                  'import { DevelopmentMediaStorageAdapter } from "./development-media-storage.adapter.js";\nimport { MediaAdaptiveLifecycleService } from "./media-adaptive-lifecycle.service.js";\nimport { MediaAdaptiveProcessingService } from "./media-adaptive-processing.service.js";\n',
                  1,
              )
              text = text.replace(
                  'import { MediaAutoThumbnailService } from "./media-auto-thumbnail.service.js";\n',
                  'import { MediaAutoThumbnailService } from "./media-auto-thumbnail.service.js";\nimport { MediaHlsSettingsService } from "./media-hls-settings.service.js";\nimport { MediaHlsTranscoderService } from "./media-hls-transcoder.service.js";\n',
                  1,
              )
              text = text.replace(
                  '    MediaProcessingStorageService,\n    MediaAutoThumbnailService,\n',
                  '    MediaProcessingStorageService,\n    MediaAdaptiveLifecycleService,\n    MediaHlsSettingsService,\n    MediaHlsTranscoderService,\n    MediaAdaptiveProcessingService,\n    MediaAutoThumbnailService,\n',
                  1,
              )
              text = text.replace(
                  '    MediaProcessingStorageService,\n    MediaProcessingExecutorService,\n',
                  '    MediaProcessingStorageService,\n    MediaAdaptiveLifecycleService,\n    MediaAdaptiveProcessingService,\n    MediaProcessingExecutorService,\n',
                  1,
              )
              module.write_text(text)

          worker = Path("apps/api/src/media/media-processing-worker.service.ts")
          text = worker.read_text()
          if "localSlotLimit" not in text:
              old = '''    while (!this.stopping) {
              let claimedAny = false;
              while (!this.stopping && this.active.size < MAX_LOCAL_SLOTS) {
          '''
              new = '''    while (!this.stopping) {
              const capacity = await this.queue.capacity();
              const localSlotLimit = Math.min(MAX_LOCAL_SLOTS, capacity.concurrentJobs);
              let claimedAny = false;
              while (!this.stopping && this.active.size < localSlotLimit) {
          '''
              if old not in text:
                  raise SystemExit("worker concurrency marker missing")
              worker.write_text(text.replace(old, new, 1))

          executor = Path("apps/api/src/media/media-processing-executor.service.ts")
          text = executor.read_text()
          text = text.replace('import { execFile, spawn } from "node:child_process";', 'import { execFile } from "node:child_process";')
          if 'MediaAdaptiveProcessingService' not in text:
              text = text.replace(
                  'import { PlatformSettingsService } from "../platform-config/platform-settings.service.js";\n',
                  'import { PlatformSettingsService } from "../platform-config/platform-settings.service.js";\nimport { MediaAdaptiveProcessingService } from "./media-adaptive-processing.service.js";\n',
                  1,
              )
              text = text.replace(
                  'import { MediaProcessingStorageService } from "./media-processing-storage.service.js";\n',
                  'import { MediaProcessingStorageService } from "./media-processing-storage.service.js";\nimport { runBoundedMediaProcess } from "./media-process-runner.js";\nimport { parseFfprobeOutput, type MediaProbeMetadata } from "./media-probe.js";\n',
                  1,
              )
              start = text.index("interface ProbeMetadata {")
              end = text.index("}\n\n@Injectable()", start) + 2
              text = text[:start] + text[end:]
              text = text.replace(
                  '    @Inject(MediaProcessingStorageService) private readonly storage: MediaProcessingStorageService,\n    @Inject(MediaAutoThumbnailService)',
                  '    @Inject(MediaProcessingStorageService) private readonly storage: MediaProcessingStorageService,\n    @Inject(MediaAdaptiveProcessingService)\n    private readonly adaptive: MediaAdaptiveProcessingService,\n    @Inject(MediaAutoThumbnailService)',
                  1,
              )
              text = text.replace("      let canonicalMetadata: ProbeMetadata;", "      let canonicalMetadata: MediaProbeMetadata;")
              text = text.replace(
                  '        if (!sourceMetadata.width || !sourceMetadata.height) {\n          throw new Error("The uploaded file does not contain a readable video stream.");\n        }',
                  '        if (!sourceMetadata.width || !sourceMetadata.height || !sourceMetadata.videoCodec) {\n          throw new Error("The uploaded file does not contain a readable video stream.");\n        }',
                  1,
              )
              thumbnail_marker = '''      if (
                job.inputR2ObjectKey &&
                job.stagingKey === job.inputR2ObjectKey &&
          '''
              adaptive_block = '''      await rm(inputPath, { force: true }).catch(() => undefined);
              await this.adaptive.process({
                job,
                workerId,
                workDirectory,
                canonicalPath: outputPath,
                canonicalMetadata,
              });

          '''
              if thumbnail_marker not in text:
                  raise SystemExit("executor adaptive insertion marker missing")
              text = text.replace(thumbnail_marker, adaptive_block + thumbnail_marker, 1)
              text = text.replace("  private async probe(filePath: string): Promise<ProbeMetadata> {", "  private async probe(filePath: string): Promise<MediaProbeMetadata> {")
              text = text.replace(
                  '          "format=duration:stream=codec_type,width,height",',
                  '          "format=duration:stream=codec_type,codec_name,width,height,duration:stream_tags=rotate:stream_side_data=rotation",',
                  1,
              )
              parse_start = text.index("    const parsed = JSON.parse(stdout) as {")
              parse_end_marker = "    };\n  }\n\n  private async tryHead"
              parse_end = text.index(parse_end_marker, parse_start)
              text = text[:parse_start] + "    return parseFfprobeOutput(stdout);\n  }\n\n  private async tryHead" + text[parse_end + len(parse_end_marker):]
              text = text.replace(
                  '  if (message.includes("ffmpeg") || message.includes("ffprobe")) return "FFMPEG_PROCESSING_FAILED";',
                  '  if (message.includes("hls") || message.includes("rendition")) return "HLS_PROCESSING_FAILED";\n  if (message.includes("ffmpeg") || message.includes("ffprobe")) return "FFMPEG_PROCESSING_FAILED";',
                  1,
              )
              fn_start = text.index("async function runFfmpeg(input:")
              prefix = text[:fn_start]
              fn = '''async function runFfmpeg(input: {
            executable: string;
            inputPath: string;
            outputPath: string;
            threads: number;
            maxHeight: number;
            crf: number;
            preset: string;
            timeoutMs: number;
          }): Promise<void> {
            const scaleFilter = `scale=-2:trunc(min(${input.maxHeight}\\\\,ih)/2)*2`;
            const args = [
              "-hide_banner",
              "-nostdin",
              "-loglevel",
              "warning",
              "-y",
              "-i",
              input.inputPath,
              "-map",
              "0:v:0",
              "-map",
              "0:a:0?",
              "-map_metadata",
              "-1",
              "-vf",
              scaleFilter,
              "-c:v",
              "libx264",
              "-preset",
              input.preset,
              "-crf",
              String(input.crf),
              "-pix_fmt",
              "yuv420p",
              "-threads",
              String(input.threads),
              "-c:a",
              "aac",
              "-b:a",
              "128k",
              "-ac",
              "2",
              "-movflags",
              "+faststart",
              input.outputPath,
            ];

            await runBoundedMediaProcess({
              executable: input.executable,
              args,
              timeoutMs: input.timeoutMs,
              label: "FFmpeg canonical transcode",
            });
          }
          '''
              executor.write_text(prefix + fn)

          ffmpeg = Path("deploy/ensure-ffmpeg-runtime.sh")
          text = ffmpeg.read_text()
          if "-muxers" not in text:
              marker = '  "$AYIN_BIN_DIR/ffmpeg" -hide_banner -encoders 2>/dev/null | grep -F "libx264" >/dev/null || return 1\n'
              replacement = marker + '  "$AYIN_BIN_DIR/ffmpeg" -hide_banner -encoders 2>/dev/null | grep -E "[[:space:]]aac[[:space:]]" >/dev/null || return 1\n  "$AYIN_BIN_DIR/ffmpeg" -hide_banner -muxers 2>/dev/null | grep -E "[[:space:]]hls[[:space:]]" >/dev/null || return 1\n'
              if marker not in text:
                  raise SystemExit("ffmpeg runtime marker missing")
              ffmpeg.write_text(text.replace(marker, replacement, 1))
          PY
          pnpm exec prettier --write \
            apps/api/src/platform-config/platform-settings.catalog.ts \
            apps/api/src/media/media-processing-storage.service.ts \
            apps/api/src/media/media.module.ts \
            apps/api/src/media/media-processing-worker.service.ts \
            apps/api/src/media/media-processing-executor.service.ts \
            apps/api/src/media/media-architecture-v2.ts \
            apps/api/src/media/media-probe.ts \
            apps/api/src/media/media-process-runner.ts \
            apps/api/src/media/media-hls-manifest.ts \
            apps/api/src/media/media-hls-settings.service.ts \
            apps/api/src/media/media-hls-transcoder.service.ts \
            apps/api/src/media/media-adaptive-lifecycle.service.ts \
            apps/api/src/media/media-adaptive-processing.service.ts
          if git diff --quiet; then
            echo "Task 40 wiring already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src deploy/ensure-ffmpeg-runtime.sh
          git commit -m "feat(task40): wire HLS pipeline behind platform gate"
          git push origin HEAD:task-40-hls-transcoding
