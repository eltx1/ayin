name: Task quality gates

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/db/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_test
          POSTGRES_PASSWORD: ayin
          POSTGRES_USER: ayin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      AUTH_TOKEN_SECRET: task-03-ci-auth-secret-with-more-than-32-characters
      CORS_ORIGIN: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck and generate Prisma client
        run: pnpm typecheck

      - name: Run unit and schema tests
        run: pnpm test

      - name: Apply clean migrations and integration tests
        run: pnpm test:integration

      - name: Build production packages and applications
        run: pnpm build
