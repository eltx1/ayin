name: Task quality gates

on:
  # Every main SHA must have all release evidence, including shared/config-only changes.
  push:
    branches: [main]
  # Include stacked PRs; production evidence still comes only from main pushes.
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_test
          POSTGRES_PASSWORD: ayin
          POSTGRES_USER: ayin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      AUTH_TOKEN_SECRET: task-04-ci-auth-secret-with-more-than-32-characters
      CORS_ORIGIN: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Validate deployment tooling
        run: |
          set -euo pipefail
          bash -n deploy/release.sh
          bash -n deploy/preflight-production.sh
          bash -n deploy/cloudflare/sync-production-edge.sh
          bash -n deploy/cloudflare/bootstrap-r2-production.sh
          bash -n deploy/postgres/bootstrap-local-production.sh
          bash -n deploy/env/bootstrap-production-env.sh
          bash -n deploy/env/rotate-r2-credentials.sh
          bash -n deploy/ensure-ffmpeg-runtime.sh
          bash -n deploy/acquire-ssh-host-key.sh
          node --test deploy/test-ssh-host-key.mjs deploy/release-gates.test.mjs deploy/test-web-runtime-launch.mjs
          # Offline transport/provider fixtures only; never dispatch the live proof here.
          node --test deploy/media/r2-owned-fixture-provider.test.mjs deploy/media/r2-owned-fixture-browser.test.mjs deploy/media/r2-owned-continuation-browser.test.mjs
          node --test deploy/test-web-build-artifact.mjs deploy/test-release-web-artifact.mjs
          node --test deploy/test-critical-browser-transport.mjs
          node --check deploy/smoke-web-build-artifact.mjs
          node --check deploy/admin/bootstrap-first-superadmin.mjs
          node --check deploy/media/requeue-missing-content-length.mjs
          node --check deploy/security/generate-sbom.mjs
          node --check deploy/env-file.cjs
          node --check deploy/run-with-env.cjs
          node --check deploy/validate-production-env.cjs
          node --check deploy/ecosystem.config.cjs

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cat > "$tmpdir/web.env" <<'EOF'
          NODE_ENV=production
          NEXT_PUBLIC_API_BASE_URL=https://api.ayin.stream
          NEXT_PUBLIC_MEDIA_BASE_URL=https://media.ayin.stream
          EOF
          cat > "$tmpdir/api.env" <<'EOF'
          NODE_ENV=production
          APP_ENV=production
          API_HOST=127.0.0.1
          PORT=4000
          CORS_ORIGIN=https://ayin.stream
          WEB_ORIGIN=https://ayin.stream
          DATABASE_URL=postgresql://ayin_app:ci-password@127.0.0.1:5432/ayin?schema=public
          AUTH_TOKEN_SECRET=ci-production-auth-secret-more-than-32-characters
          PAYOUT_DATA_ENCRYPTION_KEY=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
          ANALYTICS_HASH_SALT=ci-analytics-hash-salt-more-than-32-characters
          R2_ACCOUNT_ID=test-account
          R2_BUCKET=test-bucket
          R2_ACCESS_KEY_ID=test-access-key
          R2_SECRET_ACCESS_KEY=test-secret-key
          UPLOAD_SESSION_SECRET=ci-upload-session-secret-more-than-32-characters
          GAM_TEST_MODE=1
          GAM_PRODUCTION_ENABLED=0
          EOF
          chmod 600 "$tmpdir/web.env" "$tmpdir/api.env"
          node deploy/validate-production-env.cjs "$tmpdir/web.env" "$tmpdir/api.env"

      - name: Lint
        run: pnpm lint

      - name: Typecheck and generate Prisma client
        run: pnpm typecheck

      - name: Run unit and schema tests
        run: pnpm test

      - name: Install pinned FFmpeg integration runtime
        run: |
          set -euo pipefail
          export AYIN_BIN_DIR="$RUNNER_TEMP/ayin-media-bin"
          bash deploy/ensure-ffmpeg-runtime.sh
          echo "FFMPEG_PATH=$AYIN_BIN_DIR/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=$AYIN_BIN_DIR/ffprobe" >> "$GITHUB_ENV"

      - name: Apply clean migrations and integration tests
        run: pnpm test:integration

      - name: Build production packages and applications
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.ayin.stream
          NEXT_PUBLIC_MEDIA_BASE_URL: https://media.ayin.stream
        run: pnpm build

      - name: Verify compiled media import entry points
        run: node --test deploy/media/media-compiled-imports.test.mjs
      - name: Package and smoke-test the exact production Web build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.ayin.stream
          NEXT_PUBLIC_MEDIA_BASE_URL: https://media.ayin.stream
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ayin-web-build"
          install -d -m 700 "$artifact_dir"
          node deploy/web-build-artifact.mjs create "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$artifact_dir/ayin-web-build.tar.gz"
          node deploy/smoke-web-build-artifact.mjs "$GITHUB_SHA" "$artifact_dir/ayin-web-build.tar.gz"
          node deploy/release-gates.mjs manifest-create "$artifact_dir"

      - name: Retain the verified production Web build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ayin-web-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ayin-web-build/ayin-web-build.tar.gz
            ${{ runner.temp }}/ayin-web-build/release-provenance.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  connected-media:
    # Core upload/processing/publication acceptance uses real FFmpeg and PostgreSQL
    # with an independent bounded loopback store, never production/R2 credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_test
          POSTGRES_PASSWORD: ayin
          POSTGRES_USER: ayin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_test?schema=public
      AYIN_CONNECTED_MEDIA_ACCEPTANCE: "1"
      AYIN_CONNECTED_MEDIA_EVIDENCE_PATH: ${{ runner.temp }}/ayin-connected-media-evidence.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm packages:build
      - run: node scripts/with-test-database.mjs corepack pnpm db:migrate:deploy
      - run: node scripts/with-test-database.mjs corepack pnpm db:seed
      - name: Install pinned real processing tools
        run: |
          set -euo pipefail
          export AYIN_BIN_DIR="$RUNNER_TEMP/ayin-media-bin"
          bash deploy/ensure-ffmpeg-runtime.sh
          echo "FFMPEG_PATH=$AYIN_BIN_DIR/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=$AYIN_BIN_DIR/ffprobe" >> "$GITHUB_ENV"
      - name: Accept direct upload processing publication and playback bytes
        run: node scripts/with-test-database.mjs corepack pnpm --filter @ayin/api exec vitest run --fileParallelism=false test/connected-media.acceptance.test.ts test/helpers/connected-media-object-store.test.ts
      - name: Retain sanitized connected acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connected-media-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ayin-connected-media-evidence.json
          if-no-files-found: error
          retention-days: 30
