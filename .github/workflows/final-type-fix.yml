name: Final payout profile type fix

on:
  push:
    branches:
      - feature/brand-monetization-admin-control-center
    paths:
      - .github/workflows/final-type-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brand-monetization-admin-control-center
          fetch-depth: 0
      - name: Apply narrow type fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/api/src/revenue/creator-finance.service.ts")
          text = path.read_text()
          old = "    return this.serializeProfile(saved);\n"
          new = "    return this.serializeProfile(saved as CreatorPayoutProfileRow);\n"
          if old not in text:
              raise SystemExit("type-fix anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/revenue/creator-finance.service.ts
          git commit -m "fix(finance): narrow persisted payout profile type"
          git push origin HEAD:feature/brand-monetization-admin-control-center
