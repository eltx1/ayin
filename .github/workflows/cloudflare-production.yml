name: AYIN public edge verification

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Production deployment
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ayin-public-edge-verification
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      deployment: false
    env:
      AYIN_ORIGIN_IPV4: 13.52.116.200
      AYIN_R2_BUCKET_NAME: ayin-production-media
      DEPLOY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 'manual' }}
      DEPLOYMENT_WORKFLOW_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Validate isolated edge verification targets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AYIN_ORIGIN_IPV4" == '13.52.116.200' ]]
          [[ "$AYIN_R2_BUCKET_NAME" == 'ayin-production-media' ]]
          [[ "$DEPLOYMENT_WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      # Cloudflare rules/settings and existing DNS/R2 configuration are managed
      # separately. Releases verify delivery without reapplying security,
      # CORS, lifecycle, DNS, TLS or bot settings over operator changes.

      - name: Verify public production endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://ayin.stream/ >/dev/null
          curl --fail --silent --show-error --max-time 20 https://api.ayin.stream/health >/dev/null
          curl --fail --silent --show-error --max-time 20 https://api.ayin.stream/ready >/dev/null

          media_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://media.ayin.stream/__ayin_edge_verification_missing_object__ || true)"
          [[ "$media_status" =~ ^[1-5][0-9][0-9]$ ]]
          echo "AYIN public web, API, and media HTTPS endpoints are reachable."

      - name: Record public edge verification proof
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/ayin-public-edge-verification-proof"
          install -d -m 700 "$proof_dir"
          cat > "$proof_dir/public-edge-verification-proof.env" <<EOF
          schema_version=4
          verification_mode=read_only_public_endpoints
          zone=ayin.stream
          media_domain=media.ayin.stream
          r2_bucket=$AYIN_R2_BUCKET_NAME
          origin_ipv4=$AYIN_ORIGIN_IPV4
          deployment_workflow_sha=$DEPLOYMENT_WORKFLOW_SHA
          deploy_run_id=$DEPLOY_RUN_ID
          verification_run_id=$GITHUB_RUN_ID
          verification_run_attempt=$GITHUB_RUN_ATTEMPT
          EOF

      - name: Upload public edge verification proof
        uses: actions/upload-artifact@v7
        with:
          name: ayin-public-edge-verification-proof
          path: ${{ runner.temp }}/ayin-public-edge-verification-proof/public-edge-verification-proof.env
          retention-days: 90
          if-no-files-found: error
