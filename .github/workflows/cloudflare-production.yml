name: AYIN Cloudflare production sync

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Production deployment
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ayin-cloudflare-production-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      AYIN_CLOUDFLARE_API_TOKEN: ${{ secrets.AYIN_CLOUDFLARE_API_TOKEN }}
      AYIN_ORIGIN_IPV4: 13.52.116.200
      AYIN_R2_BUCKET_NAME: ayin-production-media
      DEPLOY_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 'manual' }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout AYIN production edge tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate isolated Cloudflare configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AYIN_CLOUDFLARE_API_TOKEN"
          [[ "$AYIN_ORIGIN_IPV4" == '13.52.116.200' ]]
          [[ "$AYIN_R2_BUCKET_NAME" == 'ayin-production-media' ]]
          bash -n deploy/cloudflare/sync-production-edge.sh
          bash -n deploy/cloudflare/bootstrap-r2-production.sh

      - name: Synchronize AYIN application edge
        shell: bash
        run: bash deploy/cloudflare/sync-production-edge.sh

      - name: Synchronize AYIN R2 media layer
        shell: bash
        run: bash deploy/cloudflare/bootstrap-r2-production.sh

      - name: Verify public production endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://ayin.stream/ >/dev/null
          curl --fail --silent --show-error --max-time 20 https://api.ayin.stream/health >/dev/null
          curl --fail --silent --show-error --max-time 20 https://api.ayin.stream/ready >/dev/null

          media_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://media.ayin.stream/__ayin_edge_verification_missing_object__ || true)"
          [[ "$media_status" =~ ^[1-5][0-9][0-9]$ ]]
          echo "AYIN public web, API, and media HTTPS endpoints are reachable."

      - name: Record Cloudflare production proof
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/ayin-cloudflare-sync-proof"
          install -d -m 700 "$proof_dir"
          cat > "$proof_dir/cloudflare-sync-proof.env" <<EOF
          schema_version=3
          zone=ayin.stream
          media_domain=media.ayin.stream
          r2_bucket=$AYIN_R2_BUCKET_NAME
          origin_ipv4=$AYIN_ORIGIN_IPV4
          release_sha=$RELEASE_SHA
          deploy_run_id=$DEPLOY_RUN_ID
          sync_run_id=$GITHUB_RUN_ID
          sync_run_attempt=$GITHUB_RUN_ATTEMPT
          EOF

      - name: Upload Cloudflare production proof
        uses: actions/upload-artifact@v7
        with:
          name: ayin-cloudflare-production-sync-proof
          path: ${{ runner.temp }}/ayin-cloudflare-sync-proof/cloudflare-sync-proof.env
          retention-days: 90
          if-no-files-found: error
