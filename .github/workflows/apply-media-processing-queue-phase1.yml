name: Apply media processing queue phase 1

on:
  push:
    paths:
      - ".github/workflows/apply-media-processing-queue-phase1.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ec2-ffmpeg-media-pipeline-20260904

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Apply queue patch
        run: node scripts/apply-media-processing-queue-phase1.mjs

      - name: Format generated files
        run: npx --yes prettier@3.9.6 --write packages/db/prisma/schema.prisma apps/api/src/platform-config/platform-settings.catalog.ts apps/api/src/media/media.module.ts apps/api/src/media/media-processing-queue.service.ts apps/api/test/media-processing-queue.integration.test.ts packages/db/prisma/migrations/20260904023000_media_processing_queue/migration.sql

      - name: Commit generated phase
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/prisma/schema.prisma \
            packages/db/prisma/migrations/20260904023000_media_processing_queue/migration.sql \
            apps/api/src/platform-config/platform-settings.catalog.ts \
            apps/api/src/media/media.module.ts \
            apps/api/src/media/media-processing-queue.service.ts \
            apps/api/test/media-processing-queue.integration.test.ts
          if git diff --cached --quiet; then
            echo "Queue phase already applied."
            exit 0
          fi
          git commit -m "feat: add scalable media processing queue foundation"
          git push origin HEAD:ec2-ffmpeg-media-pipeline-20260904
