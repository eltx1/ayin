name: Task 83 cohort format

on:
  push:
    branches:
      - task-83-cohort-analytics
    paths:
      - ".github/workflows/task-83-cohort-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-83-cohort-analytics
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format task 83 files
        run: |
          pnpm exec prettier --write             apps/api/src/analytics/analytics-rollup.service.ts             apps/api/src/analytics/analytics.service.ts             apps/web/src/components/admin/admin-dashboard.tsx             apps/web/src/components/studio/studio-creator-analytics.tsx
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/api/src/analytics/analytics-rollup.service.ts             apps/api/src/analytics/analytics.service.ts             apps/web/src/components/admin/admin-dashboard.tsx             apps/web/src/components/studio/studio-creator-analytics.tsx
          git commit -m "style(task-83): format cohort analytics"
          git push origin HEAD:task-83-cohort-analytics
