name: One-shot audit public media gates

on:
  push:
    paths:
      - ".github/workflows/one-shot-audit-public-media-gates.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out media pipeline branch
        uses: actions/checkout@v7
        with:
          ref: ec2-ffmpeg-media-pipeline-20260904
          fetch-depth: 0

      - name: Audit API UPLOADED references
        run: |
          echo '=== apps/api/src references to UPLOADED ==='
          grep -RIn --include='*.ts' 'UPLOADED' apps/api/src || true
          echo '=== public-ish services containing mediaAssets ==='
          grep -RIl --include='*.ts' 'mediaAssets' \
            apps/api/src/search \
            apps/api/src/recommendations \
            apps/api/src/discovery \
            apps/api/src/creator \
            apps/api/src/watch \
            2>/dev/null | sort

      - name: Audit web UPLOADED references
        run: |
          echo '=== apps/web/src references to UPLOADED ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'UPLOADED' apps/web/src || true
