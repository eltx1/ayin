name: One-shot AYIN account password repair prep

on:
  push:
    paths:
      - .github/workflows/one-shot-account-password-repair.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
      TARGET_EMAIL_SHA256: 4e31aa118ea6ee92b09e8047819b43710d24ecb62ca30004881f869277bf0e9a
    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          ssh-keyscan -T 7 -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate" 2>/dev/null
          test -s "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR==1{print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect account and create one-time encryption key
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=25 -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "TARGET_EMAIL_SHA256='$TARGET_EMAIL_SHA256' bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$(whoami)" == "ayin" && "$HOME" == "/home/ayin" ]] || exit 1
          cd /home/ayin/htdocs/current
          test "$(git rev-parse HEAD)" = "ecfc6d672b2d06f8f71786b094d861723f4fb0f3"

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { createPrismaClient } from './packages/db/dist/index.js';
          const values = new Map();
          for (const rawLine of readFileSync('/home/ayin/env/api.env','utf8').split(/\r?\n/u)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i > 0) values.set(line.slice(0,i).trim(), line.slice(i+1));
          }
          const prisma = createPrismaClient(values.get('DATABASE_URL'));
          try {
            const accounts = await prisma.account.findMany({ select: { id:true,email:true,displayName:true,status:true,passwordHash:true,authVersion:true } });
            const account = accounts.find(a => createHash('sha256').update(a.email.toLowerCase()).digest('hex') === process.env.TARGET_EMAIL_SHA256);
            if (!account) throw new Error('TARGET_ACCOUNT_NOT_FOUND');
            const role = await prisma.adminRoleAssignment.findFirst({ where:{accountId:account.id,role:'SUPERADMIN'}, select:{id:true} });
            console.log(`ACCOUNT=${account.displayName}|${account.status}|password_hash=${account.passwordHash ? 'present' : 'missing'}|hash_format=${account.passwordHash?.startsWith('scrypt$32768$8$1$') ? 'expected' : 'unexpected'}|auth_version=${account.authVersion}|superadmin=${role ? 'yes':'no'}`);
          } finally { await prisma.$disconnect(); }
          NODE

          key=/home/ayin/.ayin-password-repair-key.pem
          rm -f "$key"
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key" >/dev/null 2>&1
          chmod 600 "$key"
          echo 'PASSWORD_REPAIR_PUBLIC_KEY_BEGIN'
          openssl pkey -in "$key" -pubout
          echo 'PASSWORD_REPAIR_PUBLIC_KEY_END'
          REMOTE
