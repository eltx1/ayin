name: Task 10 export payload type

on:
  push:
    branches:
      - task-10-creator-tv-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-10-creator-tv-v1
      - name: Export Creator TV payload contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/creator/creator-tv.service.ts')
          text = path.read_text()
          old = 'interface TvVideoPayload {'
          new = 'export interface TvVideoPayload {'
          if old not in text:
              raise SystemExit('TvVideoPayload declaration not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/creator/creator-tv.service.ts
          git commit -m "Export Creator TV public payload contract"
          git push origin HEAD:task-10-creator-tv-v1
