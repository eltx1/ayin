name: Task 21 runtime fixes
on:
  push:
    branches: [task-21-ad-control-direct-campaigns]
    paths:
      - ".github/workflows/task21-runtimefix.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-21-ad-control-direct-campaigns
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/ads/advertising-control.service.ts')
          s=p.read_text()
          old='''    return campaigns.map((campaign) => ({\n      ...campaign,\n      direct: byCampaign.get(campaign.id) ?? null,\n    }));'''
          new='''    return campaigns.map((campaign) => {\n      const direct = byCampaign.get(campaign.id);\n      return {\n        ...campaign,\n        direct: direct\n          ? {\n              ...direct,\n              impressionGoal: direct.impressionGoal === null ? null : Number(direct.impressionGoal),\n            }\n          : null,\n      };\n    });'''
          if old in s:
              s=s.replace(old,new)
          marker='''    if (await this.isEmergencyKilled())\n      return { enabled: false as const, reason: "EMERGENCY_KILL_SWITCH" };\n'''
          insert=marker+'''    const placement = await this.database.client.adPlacement.findUnique({\n      where: { key: context.placementKey },\n      select: { enabled: true },\n    });\n    if (!placement?.enabled)\n      return { enabled: false as const, reason: "PLACEMENT_DISABLED" };\n'''
          if 'reason: "PLACEMENT_DISABLED"' not in s:
              s=s.replace(marker,insert)
          p.write_text(s)
          PY
      - run: pnpm exec prettier --write apps/api/src/ads/advertising-control.service.ts || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/ads/advertising-control.service.ts
          git commit -m "fix: harden direct ad runtime decisions"
          git push origin HEAD:task-21-ad-control-direct-campaigns
