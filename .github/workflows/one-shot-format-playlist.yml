name: One-shot format playlist test

on:
  push:
    paths:
      - ".github/workflows/one-shot-format-playlist.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out media pipeline branch
        uses: actions/checkout@v7
        with:
          ref: ec2-ffmpeg-media-pipeline-20260904
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format playlist integration test
        run: pnpm exec prettier --write apps/api/test/playlist-product.integration.test.ts

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/one-shot-format-playlist.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format public playlist canonical-media test"
          git push origin HEAD:ec2-ffmpeg-media-pipeline-20260904
