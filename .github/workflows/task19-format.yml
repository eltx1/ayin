name: Task 19 formatter
on:
  push:
    branches: [task-19-in-player-ads]
    paths:
      - ".github/workflows/task19-format.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-19-in-player-ads
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/ads apps/api/src/app.module.ts apps/web/src packages/db/prisma/video-ads.prisma docs/VIDEO_ADS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Task 19 video ads"
          git push origin HEAD:task-19-in-player-ads
