name: Task 13 formatter

on:
  push:
    branches: [task-13-search-content-details]
    paths: [.github/workflows/task13-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-13-search-content-details
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/api/src/search/search.controller.ts
          apps/api/src/search/search.service.test.ts
          apps/api/src/search/search.service.ts
          apps/api/test/search-content.integration.test.ts
          apps/web/src/app/'(viewer)'/watch/'[slug]'/page.tsx
          apps/web/src/components/search/search-experience.tsx
          apps/web/src/lib/content-detail.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "Format Task 13 search and content details"
            git push origin HEAD:task-13-search-content-details
          fi
