name: Task 11 lint fix

on:
  push:
    branches:
      - task-11-ayin-player-watch-progress

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-11-ayin-player-watch-progress
      - name: Avoid synchronous state reset in effect
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/player/ayin-player.tsx')
          s = p.read_text()
          s = s.replace(
            '  const [resumePositionMs, setResumePositionMs] = useState(initialPositionMs);',
            '  const [savedResume, setSavedResume] = useState<{ videoId: string; positionMs: number } | null>(null);'
          )
          s = s.replace('    setResumePositionMs(initialPositionMs);\n', '')
          s = s.replace(
            '      setResumePositionMs(resumablePositionMs(snapshot, declaredDurationMs));',
            '      setSavedResume({\n        videoId,\n        positionMs: resumablePositionMs(snapshot, declaredDurationMs),\n      });'
          )
          marker = '  const applyResume = useCallback(() => {'
          replacement = '''  const resumePositionMs =\n    savedResume?.videoId === videoId ? savedResume.positionMs : initialPositionMs;\n\n  const applyResume = useCallback(() => {'''
          if marker not in s:
            raise SystemExit('applyResume marker missing')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY
      - name: Format patched file
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/web/src/components/player/ayin-player.tsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/player/ayin-player.tsx
          git commit -m "Fix AYIN Player resume effect"
          git push origin HEAD:task-11-ayin-player-watch-progress
