name: Format upload UI

on:
  push:
    branches:
      - feat/modern-upload-experience

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/modern-upload-experience
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format upload UI
        run: pnpm exec prettier --write apps/web/src/components/upload/quick-upload.tsx apps/web/src/components/upload/quick-upload.module.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/upload/quick-upload.tsx apps/web/src/components/upload/quick-upload.module.css
          git commit -m "Format upload UI"
          git push origin HEAD:feat/modern-upload-experience
