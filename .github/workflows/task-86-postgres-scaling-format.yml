name: Task 86 postgres scaling format

on:
  push:
    branches:
      - task-86-postgres-scaling
    paths:
      - ".github/workflows/task-86-postgres-scaling-format.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-86-postgres-scaling
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format task 86 files
        run: |
          pnpm exec prettier --write \
            apps/api/src/admin/admin-control.service.ts \
            apps/api/src/admin/admin-observability.controller.ts \
            apps/api/src/database/database.service.ts \
            apps/api/src/discovery/discovery.service.ts \
            apps/api/src/media/media-processing-queue.service.ts \
            apps/api/src/platform-config/platform-settings.service.ts \
            apps/api/test/postgres-query-performance.integration.test.ts \
            deploy/README.md \
            deploy/ecosystem.config.cjs \
            deploy/postgres/README.md \
            docs/POSTGRES_SCALING.md \
            packages/db/prisma/schema.prisma \
            packages/db/src/index.test.ts \
            packages/db/src/index.ts
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api deploy docs packages/db
          git commit -m "style(task-86): format postgres scaling"
          git push origin HEAD:task-86-postgres-scaling
