name: Production deployment

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful Task quality gates run ID
        required: true
        type: string
      release_sha:
        description: Exact 40-character commit SHA validated by that run
        required: true
        type: string
  workflow_run:
    workflows:
      - Task quality gates
      - Security gates
      - V1 browser acceptance
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: ayin-production-deploy
  cancel-in-progress: false

jobs:
  release-evidence:
    # No production environment or secrets are accessible to this read-only gate.
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
      quality_run_id: ${{ steps.gates.outputs.quality_run_id }}
      quality_run_attempt: ${{ steps.gates.outputs.quality_run_attempt }}
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha }}
      AUTOMATIC_RELEASE: ${{ github.event_name == 'workflow_run' }}
      CHECK_DUPLICATE_RELEASE: "true"
      VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
    steps:
      - name: Checkout trusted main workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up pinned release policy runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Require exact-SHA quality, security and browser evidence
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/release-gates.mjs check

  deploy:
    needs: release-evidence
    if: needs.release-evidence.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      VALIDATION_RUN_ID: ${{ needs.release-evidence.outputs.quality_run_id }}
      VALIDATION_RUN_ATTEMPT: ${{ needs.release-evidence.outputs.quality_run_attempt }}
      AUTOMATIC_RELEASE: ${{ github.event_name == 'workflow_run' }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.release_sha }}
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      REMOTE_HOME: /home/ayin
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y

    steps:
      - name: Validate deployment identifiers
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VALIDATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$DEPLOY_USER" == 'ayin' ]]
          [[ "$REMOTE_HOME" == '/home/ayin' ]]
          [[ "$PINNED_SSH_HOST_FINGERPRINT" == SHA256:* ]]

      - name: Checkout trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Checkout current trusted release policy separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-policy
          persist-credentials: false

      - name: Set up current pinned release policy runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .release-policy/.nvmrc

      # Revalidate after any environment approval delay and before reading SSH secrets.
      - name: Revalidate release gates and reject superseded automatic releases
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .release-policy/deploy/release-gates.mjs check
          test "$(sed -n 's/^ready=//p' "$GITHUB_OUTPUT")" = true

      - name: Download the Web build from the exact successful quality run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ayin-web-build-${{ env.RELEASE_SHA }}-${{ env.VALIDATION_RUN_ID }}-${{ env.VALIDATION_RUN_ATTEMPT }}
          path: ${{ runner.temp }}/ayin-web-build
          github-token: ${{ github.token }}
          run-id: ${{ env.VALIDATION_RUN_ID }}
          digest-mismatch: error

      - name: Verify artifact SHA, trusted run, attempt and archive checksum
        shell: bash
        run: |
          set -euo pipefail
          node .release-policy/deploy/release-gates.mjs manifest-verify "$RUNNER_TEMP/ayin-web-build"
          echo "WEB_BUILD_REMOTE=$REMOTE_HOME/.deploy-bootstrap/web-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz" >> "$GITHUB_ENV"

      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          candidate="$HOME/.ssh/known_hosts.candidate"
          bash deploy/acquire-ssh-host-key.sh "$candidate"
          test -s "$candidate"

          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          if [[ "$actual_fingerprint" != "$PINNED_SSH_HOST_FINGERPRINT" ]]; then
            echo "SSH host fingerprint mismatch. Expected $PINNED_SSH_HOST_FINGERPRINT, got $actual_fingerprint" >&2
            rm -f "$candidate"
            exit 1
          fi

          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "Pinned AYIN SSH host fingerprint verified."

      - name: Verify isolated AYIN account
        id: verify_isolated_account
        shell: bash
        run: |
          set -euo pipefail
          remote_user="$(ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'whoami')"
          [[ "$remote_user" == 'ayin' ]]
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; test \"\$HOME\" = '/home/ayin'; test -w /home/ayin/htdocs/releases; test -w /home/ayin/env; test ! -w /home/horusapp"

      - name: Transfer trusted bootstrap deploy script
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 700 '$REMOTE_HOME/.deploy-bootstrap'"
          scp -P "$SSH_PORT" deploy/release.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_HOME/.deploy-bootstrap/release.sh"
          scp -P "$SSH_PORT" "$RUNNER_TEMP/ayin-web-build/ayin-web-build.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:$WEB_BUILD_REMOTE"
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 700 '$REMOTE_HOME/.deploy-bootstrap/release.sh'"

      - name: Deploy exact validated commit
        shell: bash
        run: |
          set -euo pipefail
          # Web was built and smoke-tested in the exact successful quality run.
          # Keep the existing SSH keepalives for target dependency/API preparation.
          ssh -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "'$REMOTE_HOME/.deploy-bootstrap/release.sh' '$RELEASE_SHA' '$WEB_BUILD_REMOTE' '$WEB_BUILD_SHA256'"

      - name: Verify direct-origin application health
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/ >/dev/null; curl --fail --silent --show-error --max-time 15 http://127.0.0.1:4000/health >/dev/null; curl --fail --silent --show-error --max-time 15 http://127.0.0.1:4000/ready >/dev/null"

      - name: Recover media jobs affected by the historical R2 upload bug
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd '$REMOTE_HOME/htdocs/current'; node deploy/run-with-env.cjs '$REMOTE_HOME/env/api.env' node deploy/media/requeue-missing-content-length.mjs"

      - name: Write immutable deployment proof
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/ayin-production-deploy-proof"
          install -d -m 700 "$proof_dir"
          cat > "$proof_dir/deploy-proof.env" <<EOF
          schema_version=2
          release_sha=$RELEASE_SHA
          validation_run_id=$VALIDATION_RUN_ID
          validation_run_attempt=$VALIDATION_RUN_ATTEMPT
          security_run_id=${{ steps.gates.outputs.security_run_id }}
          security_run_attempt=${{ steps.gates.outputs.security_run_attempt }}
          browser_run_id=${{ steps.gates.outputs.browser_run_id }}
          browser_run_attempt=${{ steps.gates.outputs.browser_run_attempt }}
          deploy_run_id=$GITHUB_RUN_ID
          deploy_run_attempt=$GITHUB_RUN_ATTEMPT
          deployed_as=ayin
          web_build_sha256=$WEB_BUILD_SHA256
          EOF

      - name: Upload deployment proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ayin-production-deploy-proof-${{ env.RELEASE_SHA }}
          path: ${{ runner.temp }}/ayin-production-deploy-proof/deploy-proof.env
          retention-days: 90
          if-no-files-found: error

      - name: Remove bootstrap copy
        if: ${{ always() && steps.verify_isolated_account.outcome == 'success' }}
        shell: bash
        run: |
          ssh -o BatchMode=yes -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -f '$REMOTE_HOME/.deploy-bootstrap/release.sh' '$WEB_BUILD_REMOTE'" || true
