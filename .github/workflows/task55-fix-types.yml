name: Task 55 temporary type fixer

on:
  push:
    branches:
      - task-55-movie-catalog

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-55-movie-catalog
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/task55-fix-types.py
      - run: pnpm exec prettier --write apps/api/src/movie-catalog/movie-catalog.service.ts
      - name: Verify API typecheck before commit
        run: |
          pnpm packages:build
          pnpm --filter @ayin/api run typecheck
      - name: Commit verified type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/movie-catalog/movie-catalog.service.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(api): tighten movie catalog types"
          git push origin HEAD:task-55-movie-catalog
