name: Task 55 temporary type fixer

on:
  push:
    branches:
      - task-55-movie-catalog

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-55-movie-catalog
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Apply strict Task 55 types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/movie-catalog/movie-catalog.service.ts')
          s = p.read_text()
          s = s.replace('import { HttpException, Inject, Injectable } from "@nestjs/common";', 'import type { Prisma } from "@ayin/db";\nimport { HttpException, Inject, Injectable } from "@nestjs/common";')
          replacements = {
            'altText?: string | null;': 'altText?: string | null | undefined;',
            'startsAt?: Date | null;': 'startsAt?: Date | null | undefined;',
            'endsAt?: Date | null;': 'endsAt?: Date | null | undefined;',
            'note?: string | null;': 'note?: string | null | undefined;',
            'title?: string | null;': 'title?: string | null | undefined;',
            'synopsis?: string | null;': 'synopsis?: string | null | undefined;',
            'slug?: string;': 'slug?: string | undefined;',
            'releaseDate?: Date | null;': 'releaseDate?: Date | null | undefined;',
            'primaryVideoId?: string | null;': 'primaryVideoId?: string | null | undefined;',
            'trailerVideoId?: string | null;': 'trailerVideoId?: string | null | undefined;',
            'localizations?: MovieLocalizationInput[];': 'localizations?: MovieLocalizationInput[] | undefined;',
            'genres?: string[];': 'genres?: string[] | undefined;',
            'artwork?: MovieArtworkInput[];': 'artwork?: MovieArtworkInput[] | undefined;',
            'availability?: MovieAvailabilityInput[];': 'availability?: MovieAvailabilityInput[] | undefined;',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          marker = '''export interface MovieCatalogPatch extends Partial<
            Omit<MovieCatalogInput, "genres" | "artwork" | "availability" | "localizations">
          > {
            genres?: string[] | undefined;
            artwork?: MovieArtworkInput[] | undefined;
            availability?: MovieAvailabilityInput[] | undefined;
            localizations?: MovieLocalizationInput[] | undefined;
          }
          '''
          types = marker + '''
          type MovieWithRelations = Prisma.MovieGetPayload<{
            include: {
              genres: { include: { genre: true } };
              artwork: true;
              availability: true;
              localizations: true;
            };
          }>;

          type HydratedVideo = {
            id: string;
            slug: string;
            title: string;
            status: string;
            visibility: string;
            durationMs: number | null;
          };

          type HydratedAsset = {
            id: string;
            r2ObjectKey: string;
            mimeType: string;
            status: string;
            width: number | null;
            height: number | null;
            removedAt: Date | null;
          };

          type HydratedMovie = Omit<MovieWithRelations, "genres" | "artwork"> & {
            genres: Array<MovieWithRelations["genres"][number]["genre"]>;
            artwork: Array<MovieWithRelations["artwork"][number] & { asset: HydratedAsset | null }>;
            primaryVideo: HydratedVideo | null;
            trailerVideo: HydratedVideo | null;
          };

          type MovieScalarPatch = {
            title?: string | undefined;
            slug?: string | undefined;
            synopsis?: string | undefined;
            releaseDate?: Date | null | undefined;
            releaseYear?: number | undefined;
            runtimeMinutes?: number | undefined;
            maturityRating?: string | undefined;
            originalLanguage?: string | undefined;
            primaryVideoId?: string | null | undefined;
            trailerVideoId?: string | null | undefined;
          };
          '''
          if marker not in s:
              raise SystemExit('MovieCatalogPatch marker not found')
          s = s.replace(marker, types, 1)
          old_hydrate = '''  private async hydrate<T extends Awaited<ReturnType<MovieCatalogService["getAdminRow"]>>>(
            row: NonNullable<T>,
          ) {'''
          if old_hydrate not in s:
              raise SystemExit('hydrate marker not found')
          s = s.replace(old_hydrate, '''  private async hydrate(row: MovieWithRelations): Promise<HydratedMovie> {''', 1)
          s = s.replace('movie: Awaited<ReturnType<MovieCatalogService["getAdminById"]>>', 'movie: HydratedMovie')
          s = s.replace('item: Awaited<ReturnType<MovieCatalogService["getAdminById"]>>["artwork"][number] | null,', 'item: HydratedMovie["artwork"][number] | null,')
          s = s.replace('const data: Record<string, unknown> = {};', 'const data: MovieScalarPatch = {};')
          p.write_text(s)
          PY
      - run: pnpm exec prettier --write apps/api/src/movie-catalog/movie-catalog.service.ts
      - name: Commit type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/movie-catalog/movie-catalog.service.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(api): tighten movie catalog types"
          git push origin HEAD:task-55-movie-catalog
