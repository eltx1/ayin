name: Phase5D checkpoint formatting apply

on:
  pull_request:
    paths:
      - ".github/workflows/phase5d-format-preview.yml"

permissions:
  contents: write

jobs:
  format-apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'web-pwa-phase-5d-public-creator-destinations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and commit checkpoint only
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md
          git diff --exit-code -- . ':(exclude)docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md'
          if git diff --quiet -- docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md; then
            echo "Checkpoint already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md
          test "$(git diff --cached --name-only)" = "docs/AYIN_WEB_PWA_MASTER_CHECKPOINT.md"
          git commit -m "docs(phase5d): format closing checkpoint"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
