name: Task 50 Prettier probe

on:
  push:
    branches:
      - task-50-security-scanning

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: task-50-security-scanning
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Print exact formatted file
        run: |
          pnpm exec prettier --write deploy/security/generate-sbom.mjs
          echo '---TASK50-FORMATTED-BEGIN---'
          cat deploy/security/generate-sbom.mjs
          echo '---TASK50-FORMATTED-END---'
