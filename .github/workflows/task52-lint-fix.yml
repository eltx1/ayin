name: Task 52 lint fix

on:
  push:
    branches:
      - task-52-captions-chapters
    paths:
      - .github/workflows/task52-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: task-52-captions-chapters

      - name: Apply deterministic lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/creator/caption.service.ts')
          text = service.read_text()
          type_names = '  captionPatchSchema,\n  captionReplacementSchema,\n  captionUploadSchema,\n'
          if type_names not in text:
              raise SystemExit('caption schema imports not found')
          text = text.replace(type_names, '', 1)
          anchor = '} from "./caption.validation.js";\nimport type { z } from "zod";'
          replacement = '''} from "./caption.validation.js";
          import type {
            captionPatchSchema,
            captionReplacementSchema,
            captionUploadSchema,
          } from "./caption.validation.js";
          import type { z } from "zod";'''
          if anchor not in text:
              raise SystemExit('caption import anchor not found')
          service.write_text(text.replace(anchor, replacement, 1))

          player = Path('apps/web/src/components/player/ayin-player.tsx')
          text = player.read_text()
          state = '  const [selectedCaptionId, setSelectedCaptionId] = useState<string | null>(defaultCaptionId);'
          state_replacement = '''  const [captionSelection, setCaptionSelection] = useState<{
            videoId: string;
            trackId: string | null;
          }>({ videoId, trackId: defaultCaptionId });
          const selectedCaptionId =
            captionSelection.videoId === videoId ? captionSelection.trackId : defaultCaptionId;'''
          if state not in text:
              raise SystemExit('caption state line not found')
          text = text.replace(state, state_replacement, 1)
          effect = '''  useEffect(() => {
            setSelectedCaptionId(defaultCaptionId);
          }, [defaultCaptionId, videoId]);

          '''
          if effect not in text:
              raise SystemExit('caption reset effect not found')
          text = text.replace(effect, '', 1)
          setter = '      setSelectedCaptionId(nextId);'
          if setter not in text:
              raise SystemExit('caption selection setter not found')
          text = text.replace(setter, '      setCaptionSelection({ videoId, trackId: nextId });', 1)
          player.write_text(text)
          PY

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm and install
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile

      - name: Format patched files
        run: pnpm exec prettier --write apps/api/src/creator/caption.service.ts apps/web/src/components/player/ayin-player.tsx

      - name: Persist fixes and remove temporary workflow
        run: |
          rm -f .github/workflows/task52-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(task-52): satisfy caption player lint invariants"
          git push origin HEAD:task-52-captions-chapters

      - name: Verify lint on persisted source
        run: pnpm lint
