name: Task 52 lint fix

on:
  push:
    branches:
      - task-52-captions-chapters
    paths:
      - .github/workflows/task52-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: task-52-captions-chapters

      - name: Apply line-safe lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('apps/api/src/creator/caption.service.ts')
          lines = service.read_text().splitlines()
          type_names = {'captionPatchSchema,', 'captionReplacementSchema,', 'captionUploadSchema,'}
          kept = [line for line in lines if line.strip() not in type_names]
          anchor_index = next(
              (i for i, line in enumerate(kept) if line == '} from "./caption.validation.js";'),
              None,
          )
          if anchor_index is None:
              raise SystemExit('caption validation import anchor not found')
          type_block = [
              'import type {',
              '  captionPatchSchema,',
              '  captionReplacementSchema,',
              '  captionUploadSchema,',
              '} from "./caption.validation.js";',
          ]
          if not any(line == 'import type {' for line in kept[anchor_index + 1:anchor_index + 7]):
              kept[anchor_index + 1:anchor_index + 1] = type_block
          service.write_text('\n'.join(kept) + '\n')

          player = Path('apps/web/src/components/player/ayin-player.tsx')
          lines = player.read_text().splitlines()
          state_index = next(
              (i for i, line in enumerate(lines) if 'const [selectedCaptionId, setSelectedCaptionId]' in line),
              None,
          )
          if state_index is None:
              raise SystemExit('caption state line not found')
          indent = lines[state_index][:len(lines[state_index]) - len(lines[state_index].lstrip())]
          lines[state_index:state_index + 1] = [
              f'{indent}const [captionSelection, setCaptionSelection] = useState<{{',
              f'{indent}  videoId: string;',
              f'{indent}  trackId: string | null;',
              f'{indent}}}>({{ videoId, trackId: defaultCaptionId }});',
              f'{indent}const selectedCaptionId =',
              f'{indent}  captionSelection.videoId === videoId ? captionSelection.trackId : defaultCaptionId;',
          ]

          reset_index = next(
              (i for i, line in enumerate(lines) if 'setSelectedCaptionId(defaultCaptionId);' in line),
              None,
          )
          if reset_index is None or reset_index < 1 or reset_index + 1 >= len(lines):
              raise SystemExit('caption reset effect not found')
          start = reset_index - 1
          end = reset_index + 2
          if end < len(lines) and lines[end].strip() == '':
              end += 1
          del lines[start:end]

          setter_index = next(
              (i for i, line in enumerate(lines) if 'setSelectedCaptionId(nextId);' in line),
              None,
          )
          if setter_index is None:
              raise SystemExit('caption selection setter not found')
          setter_indent = lines[setter_index][:len(lines[setter_index]) - len(lines[setter_index].lstrip())]
          lines[setter_index] = f'{setter_indent}setCaptionSelection({{ videoId, trackId: nextId }});'
          player.write_text('\n'.join(lines) + '\n')
          PY

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm and install
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile

      - name: Format patched files
        run: pnpm exec prettier --write apps/api/src/creator/caption.service.ts apps/web/src/components/player/ayin-player.tsx

      - name: Persist fixes and remove temporary workflow
        run: |
          rm -f .github/workflows/task52-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(task-52): satisfy caption player lint invariants"
          git push origin HEAD:task-52-captions-chapters

      - name: Verify lint on persisted source
        run: pnpm lint
