name: Task 52 lint fix

on:
  push:
    branches:
      - task-52-captions-chapters
    paths:
      - .github/workflows/task52-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: task-52-captions-chapters

      - name: Fix type-only schema imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/creator/caption.service.ts')
          text = path.read_text()
          old = '''import {
            CAPTION_FILE_MAX_BYTES,
            CAPTION_UPLOAD_MIME,
            captionPatchSchema,
            captionReplacementSchema,
            captionUploadSchema,
            validateWebVtt,
            WebVttValidationError,
          } from "./caption.validation.js";
          import type { z } from "zod";
          '''
          new = '''import {
            CAPTION_FILE_MAX_BYTES,
            CAPTION_UPLOAD_MIME,
            validateWebVtt,
            WebVttValidationError,
          } from "./caption.validation.js";
          import type {
            captionPatchSchema,
            captionReplacementSchema,
            captionUploadSchema,
          } from "./caption.validation.js";
          import type { z } from "zod";
          '''
          if old not in text:
              raise SystemExit('expected import block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm and install
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile

      - name: Verify formatting and lint
        run: |
          pnpm exec prettier --write apps/api/src/creator/caption.service.ts
          pnpm lint

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/task52-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(task-52): use type-only caption schema imports"
          git push origin HEAD:task-52-captions-chapters
