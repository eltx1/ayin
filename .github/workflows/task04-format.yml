name: Task 04 formatting pass

on:
  push:
    paths:
      - ".github/workflows/task04-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: task-04-platform-settings-admin-rbac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Task 04 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/admin/admin-settings.service.ts
          apps/api/src/admin/admin.controller.ts
          apps/api/src/admin/admin.guard.ts
          apps/api/src/auth/creator-provisioning.service.ts
          apps/api/src/platform-config/platform-settings.catalog.ts
          apps/api/src/platform-config/platform-settings.service.ts
          apps/api/test/admin-settings.integration.test.ts
          apps/web/src/app/admin/settings/admin-settings-panel.tsx
          apps/web/src/app/admin/settings/admin-settings.module.css
          packages/db/src/admin-rbac.test.mjs

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web packages/db/src/admin-rbac.test.mjs
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "Format Task 04 implementation"
            git push origin HEAD:task-04-platform-settings-admin-rbac
          fi
