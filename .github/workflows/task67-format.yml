name: Task 67 formatter

on:
  push:
    branches:
      - task-67-ayin-lens
    paths:
      - ".github/workflows/task67-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-67-ayin-lens
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier and remove temporary workflow
        run: |
          pnpm exec prettier --write \
            apps/api/src/search/lens-embedding-index.service.ts \
            apps/api/src/search/lens-search.service.test.ts \
            apps/api/src/search/lens-semantic-hydrator.service.ts \
            packages/db/src/lens-search.test.mjs
          rm .github/workflows/task67-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Task 67 sources"
          git push origin HEAD:task-67-ayin-lens
