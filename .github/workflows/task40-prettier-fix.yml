name: Task 40 prettier fix

on:
  push:
    branches:
      - task-40-hls-transcoding
    paths:
      - ".github/workflows/task40-prettier-fix.yml"
      - "apps/api/src/media/media-adaptive-processing.service.ts"
      - "apps/api/test/media-adaptive-lifecycle.integration.test.ts"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: task-40-hls-transcoding

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/api/src/media/media-adaptive-processing.service.ts \
            apps/api/test/media-adaptive-lifecycle.integration.test.ts

      - name: Commit exact formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/media/media-adaptive-processing.service.ts apps/api/test/media-adaptive-lifecycle.integration.test.ts
          git commit -m "Format Task 40 lease-safety fixes"
          git push origin HEAD:task-40-hls-transcoding
