name: Task 63 format probe

on:
  push:
    branches:
      - task-63-trending-engine

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 63 files and remove probe
        run: |
          pnpm exec prettier --write \
            apps/api/src/discovery/discovery.controller.ts \
            apps/api/src/discovery/discovery.module.ts \
            apps/api/src/discovery/trending-engine.test.ts \
            apps/api/src/discovery/trending-engine.ts \
            apps/api/src/discovery/trending.service.ts \
            packages/db/src/trending.test.mjs
          git rm .github/workflows/task63-format-probe.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/discovery/discovery.controller.ts \
            apps/api/src/discovery/discovery.module.ts \
            apps/api/src/discovery/trending-engine.test.ts \
            apps/api/src/discovery/trending-engine.ts \
            apps/api/src/discovery/trending.service.ts \
            packages/db/src/trending.test.mjs
          git commit -m "Format Task 63 sources"
          git push origin HEAD:task-63-trending-engine
