name: Task 63 format probe

on:
  push:
    branches: [task-63-trending-engine]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format integration test and remove probe
        run: |
          pnpm exec prettier --write apps/api/test/discovery.integration.test.ts
          rm .github/workflows/task63-format-probe.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/test/discovery.integration.test.ts .github/workflows/task63-format-probe.yml
          git diff --cached --quiet && exit 0
          git commit -m "Format Task 63 integration fallback test"
          git push
