name: Task 63 format probe

on:
  push:
    branches:
      - task-63-trending-engine

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 63 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/discovery/discovery.controller.ts
          apps/api/src/discovery/discovery.module.ts
          apps/api/src/discovery/trending-engine.test.ts
          apps/api/src/discovery/trending-engine.ts
          apps/api/src/discovery/trending.service.ts
          packages/db/src/trending.test.mjs
      - name: Stage formatted files
        run: |
          mkdir -p task63-format/apps/api/src/discovery
          mkdir -p task63-format/packages/db/src
          cp apps/api/src/discovery/discovery.controller.ts task63-format/apps/api/src/discovery/
          cp apps/api/src/discovery/discovery.module.ts task63-format/apps/api/src/discovery/
          cp apps/api/src/discovery/trending-engine.test.ts task63-format/apps/api/src/discovery/
          cp apps/api/src/discovery/trending-engine.ts task63-format/apps/api/src/discovery/
          cp apps/api/src/discovery/trending.service.ts task63-format/apps/api/src/discovery/
          cp packages/db/src/trending.test.mjs task63-format/packages/db/src/
      - uses: actions/upload-artifact@v4
        with:
          name: task63-formatted
          path: task63-format
          if-no-files-found: error
          retention-days: 1
