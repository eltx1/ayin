name: Upload stall production verification

on:
  push:
    branches:
      - diag-media-ffmpeg-20260905
    paths:
      - .github/workflows/media-runtime-diagnostics.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y

    steps:
      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate"
          test -s "$candidate"
          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$actual_fingerprint" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect incident evidence
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== production release ==='
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
          current_dir="$(readlink -f /home/ayin/htdocs/current)"
          echo "current_release=$current_dir"
          echo "current_sha=$(git -C "$current_dir" rev-parse HEAD)"

          echo '=== PM2 ==='
          pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const p of JSON.parse(s)){if(["ayin-web","ayin-api","ayin-media-worker"].includes(p.name))console.log(`${p.name} status=${p.pm2_env?.status} restarts=${p.pm2_env?.restart_time}`)}})'

          echo '=== database records in local 03:35-04:10 / UTC 00:35-01:10 ==='
          cd "$current_dir"
          cat >/tmp/ayin-upload-diag.sql <<'SQL'
          SELECT v.id, v.slug, v.title, v.status, v."createdAt", v."updatedAt",
                 a.id AS source_asset_id, a.status AS asset_status, a."sizeBytes", a."createdAt" AS asset_created,
                 j.id AS job_id, j.status AS job_status, j.stage, j.attempt, j."progressPercent", j."errorCode", j."createdAt" AS job_created, j."updatedAt" AS job_updated
          FROM "Video" v
          LEFT JOIN "MediaAsset" a ON a."videoId" = v.id AND a.kind = 'SOURCE_VIDEO'
          LEFT JOIN "MediaProcessingJob" j ON j."videoId" = v.id
          WHERE v."createdAt" BETWEEN TIMESTAMPTZ '2026-09-06 00:35:00+00' AND TIMESTAMPTZ '2026-09-06 01:10:00+00'
          ORDER BY v."createdAt" ASC, j.generation ASC;
          SQL
          node deploy/run-with-env.cjs /home/ayin/env/api.env bash -lc 'DB_URL="${DATABASE_URL%%\?*}"; psql "$DB_URL" -v ON_ERROR_STOP=1 -P pager=off -f /tmp/ayin-upload-diag.sql'
          rm -f /tmp/ayin-upload-diag.sql
          REMOTE
