name: Media recovery verification

on:
  push:
    branches:
      - diag-media-ffmpeg-20260905
    paths:
      - .github/workflows/media-runtime-diagnostics.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
      TARGET_JOB_ID: 59dd542e-04b0-462e-82c9-98f511b5a7c5
      EXPECTED_RELEASE_SHA: 26314f6770b8117af67b5de178a6513a6c229a61

    steps:
      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate"
          test -s "$candidate"
          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$actual_fingerprint" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify production release and recovered media job
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "TARGET_JOB_ID='$TARGET_JOB_ID' EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          echo '=== Current production release ==='
          current_dir="$(readlink -f /home/ayin/htdocs/current)"
          current_sha="$(git -C "$current_dir" rev-parse HEAD)"
          echo "current_release=$current_dir"
          echo "current_sha=$current_sha"
          echo "expected_sha=$EXPECTED_RELEASE_SHA"
          test "$current_sha" = "$EXPECTED_RELEASE_SHA"

          echo '=== PM2 media worker ==='
          pm2 jlist | node -e '
            let data="";
            process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              const app = JSON.parse(data).find(x => x.name === "ayin-media-worker");
              if (!app) { console.log("worker=missing"); process.exit(2); }
              console.log(JSON.stringify({
                name: app.name,
                status: app.pm2_env?.status,
                pid: app.pid,
                restarts: app.pm2_env?.restart_time,
                uptimeMs: app.pm2_env?.pm_uptime ? Date.now() - app.pm2_env.pm_uptime : null,
                memory: app.monit?.memory,
                cpu: app.monit?.cpu
              }));
              if (app.pm2_env?.status !== "online") process.exit(3);
            });
          '

          DATABASE_URL="$(node -e '
            const { loadEnvFile } = require("/home/ayin/htdocs/current/deploy/env-file.cjs");
            const value = loadEnvFile("/home/ayin/env/api.env").DATABASE_URL;
            if (!value) process.exit(2);
            process.stdout.write(value);
          ')"
          PSQL_URL="$(DATABASE_URL="$DATABASE_URL" node -e '
            const u = new URL(process.env.DATABASE_URL);
            u.searchParams.delete("schema");
            process.stdout.write(u.toString());
          ')"

          echo '=== Target media-processing job ==='
          psql "$PSQL_URL" -X -A -F $'\t' -P pager=off -c "
            SELECT
              \"id\",
              \"videoId\",
              \"status\",
              \"stage\",
              \"attempt\",
              \"progressPercent\",
              \"errorCode\",
              left(\"errorMessage\", 2000) AS \"errorMessage\",
              \"finalAssetId\",
              \"outputSizeBytes\",
              \"startedAt\",
              \"completedAt\",
              \"updatedAt\"
            FROM \"MediaProcessingJob\"
            WHERE \"id\" = '$TARGET_JOB_ID';
          "

          row_count="$(psql "$PSQL_URL" -X -A -t -P pager=off -c "SELECT count(*) FROM \"MediaProcessingJob\" WHERE \"id\" = '$TARGET_JOB_ID';" | tr -d '[:space:]')"
          test "$row_count" = "1"

          status="$(psql "$PSQL_URL" -X -A -t -P pager=off -c "SELECT \"status\" FROM \"MediaProcessingJob\" WHERE \"id\" = '$TARGET_JOB_ID';" | tr -d '[:space:]')"
          stage="$(psql "$PSQL_URL" -X -A -t -P pager=off -c "SELECT \"stage\" FROM \"MediaProcessingJob\" WHERE \"id\" = '$TARGET_JOB_ID';" | tr -d '\r')"
          echo "verified_status=$status"
          echo "verified_stage=$stage"

          echo '=== Worker log lines for target job ==='
          {
            tail -n 3000 "$HOME/.pm2/logs/ayin-media-worker-error.log" 2>/dev/null || true
            tail -n 3000 "$HOME/.pm2/logs/ayin-media-worker-out.log" 2>/dev/null || true
          } | grep -F "$TARGET_JOB_ID" | tail -n 100 || true

          unset DATABASE_URL PSQL_URL

          if [[ "$status" == "FAILED" ]]; then
            echo 'Target job is still FAILED after recovery.' >&2
            exit 20
          fi
          REMOTE
