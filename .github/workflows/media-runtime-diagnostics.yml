name: FFmpeg even-dimension production verification

on:
  push:
    branches:
      - diag-media-ffmpeg-20260905
    paths:
      - .github/workflows/media-runtime-diagnostics.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
      EXPECTED_RELEASE_SHA: d84bea79779c64b33a42afd7f7fe97129783fb98

    steps:
      - name: Configure pinned AYIN SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate"
          test -s "$candidate"
          actual_fingerprint="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR == 1 {print $2}')"
          test "$actual_fingerprint" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify deployed code and odd-dimension FFmpeg probe
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail

          current_dir="$(readlink -f /home/ayin/htdocs/current)"
          current_sha="$(git -C "$current_dir" rev-parse HEAD)"
          echo "current_release=$current_dir"
          echo "current_sha=$current_sha"
          echo "expected_sha=$EXPECTED_RELEASE_SHA"
          test "$current_sha" = "$EXPECTED_RELEASE_SHA"

          echo '=== Deployed FFmpeg scale expression ==='
          grep -F 'trunc(min(' "$current_dir/apps/api/src/media/media-processing-executor.service.ts"

          echo '=== PM2 media worker ==='
          worker_status="$(pm2 jlist | node -e '
            let data="";
            process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              const app = JSON.parse(data).find(x => x.name === "ayin-media-worker");
              if (!app) process.exit(2);
              console.log(app.pm2_env?.status || "unknown");
            });
          ')"
          echo "worker_status=$worker_status"
          test "$worker_status" = "online"

          echo '=== Synthetic 641x481 regression probe ==='
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          output="$probe_dir/odd-fixed.mp4"

          /home/ayin/bin/ffmpeg -hide_banner -nostdin -loglevel warning -y \
            -f lavfi -i 'testsrc=size=641x481:rate=1' -t 1 \
            -vf 'scale=-2:trunc(min(1080\,ih)/2)*2' \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -threads 1 \
            -an -movflags +faststart "$output"

          dimensions="$(/home/ayin/bin/ffprobe -v error -select_streams v:0 \
            -show_entries stream=width,height -of csv=p=0:s=x "$output")"
          echo "probe_dimensions=$dimensions"
          width="${dimensions%x*}"
          height="${dimensions#*x}"
          test "$width" -gt 0
          test "$height" -gt 0
          test $((width % 2)) -eq 0
          test $((height % 2)) -eq 0
          echo 'odd_dimension_probe=PASS'
          REMOTE
