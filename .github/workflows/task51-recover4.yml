name: Task 51 recovery 4

on:
  push:
    branches:
      - task-51-video-metadata-v2

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-51-video-metadata-v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Apply implementation and remaining strict-type fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/task51-recover3.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(code, '/tmp/task51-recover3.py', 'exec'))

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing web type-fix anchor in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          path = 'apps/web/src/components/upload/video-metadata-fields.tsx'
          replace(
              path,
              '  result.seasonNumber = optionalInteger(draft.seasonNumber, "Season number", includeEmpty);\n  result.episodeNumber = optionalInteger(draft.episodeNumber, "Episode number", includeEmpty);\n  if (result.seasonNumber === undefined) delete result.seasonNumber;\n  if (result.episodeNumber === undefined) delete result.episodeNumber;',
              '  const seasonNumber = optionalInteger(draft.seasonNumber, "Season number", includeEmpty);\n  const episodeNumber = optionalInteger(draft.episodeNumber, "Episode number", includeEmpty);\n  if (seasonNumber !== undefined) result.seasonNumber = seasonNumber;\n  if (episodeNumber !== undefined) result.episodeNumber = episodeNumber;',
          )
          replace(
              path,
              '  fullWidthClassName?: string;',
              '  fullWidthClassName?: string | undefined;',
          )
          PY
      - name: Install, format and validate
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ayin/db exec prisma format --schema prisma
          pnpm exec prettier --write --ignore-unknown \
            packages/db/prisma/video-metadata-v2.prisma \
            packages/db/prisma/migrations/20260910010000_video_metadata_v2/migration.sql \
            apps/api/src/creator/video-metadata.validation.ts \
            apps/api/src/creator/video-metadata.validation.test.ts \
            apps/api/src/creator/video-metadata.service.ts \
            apps/api/src/creator/quick-upload.controller.ts \
            apps/api/src/creator/creator.module.ts \
            apps/api/src/creator/studio.controller.ts \
            apps/api/src/creator/creator-tv-ad-break.hook.ts \
            apps/api/src/creator/creator-tv.service.ts \
            apps/api/src/search/search.service.ts \
            apps/api/src/discovery/discovery.service.ts \
            apps/api/src/admin/admin-video-metadata.controller.ts \
            apps/api/src/admin/admin.module.ts \
            apps/api/test/video-metadata-v2.integration.test.ts \
            apps/web/src/lib/quick-upload.ts \
            apps/web/src/lib/studio.ts \
            apps/web/src/components/upload/video-metadata-fields.tsx \
            apps/web/src/components/upload/quick-upload.tsx \
            apps/web/src/components/studio/studio-content-manager.tsx \
            docs/TASK51_VIDEO_METADATA_V2.md
          pnpm db:generate
          pnpm typecheck
          pnpm --filter @ayin/api test -- video-metadata.validation.test.ts
      - name: Commit implementation and remove temporary workflows
        run: |
          rm .github/workflows/task51-finalize.yml \
            .github/workflows/task51-recover.yml \
            .github/workflows/task51-recover2.yml \
            .github/workflows/task51-recover3.yml \
            .github/workflows/task51-recover4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(task-51): finalize creator video metadata v2"
          git push origin HEAD:task-51-video-metadata-v2
