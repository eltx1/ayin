name: Temporary Task 15 lint diagnostic

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/task15-lint-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture lint output
        run: pnpm lint > TASK15_LINT_DIAGNOSTIC.txt 2>&1 || true
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TASK15_LINT_DIAGNOSTIC.txt
          git commit -m "chore: capture Task 15 lint diagnostic"
          git push origin HEAD:main
