          .overlay { position: absolute; inset: auto 0 0; display: flex; justify-content: space-between; gap: 1rem; align-items: end; padding: 4rem 1rem 1rem; background: linear-gradient(transparent, rgba(0,0,0,.78)); color: white; pointer-events: none; }
          .overlay a, .overlay button { color: inherit; pointer-events: auto; }
