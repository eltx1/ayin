name: One-shot AYIN first SUPERADMIN authorized bootstrap

on:
  push:
    paths:
      - .github/workflows/one-shot-diagnose-runtime-instability-v2.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
      TARGET_EMAIL_SHA256: 4e31aa118ea6ee92b09e8047819b43710d24ecb62ca30004881f869277bf0e9a

    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          for attempt in 1 2 3; do
            if timeout 10s ssh-keyscan -T 7 -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate" 2>/dev/null && [[ -s "$candidate" ]]; then break; fi
            sleep 5
          done
          test -s "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR==1{print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Apply authorized one-time SUPERADMIN bootstrap
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=25 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "TARGET_EMAIL_SHA256='$TARGET_EMAIL_SHA256' bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$(whoami)" == "ayin" && "$HOME" == "/home/ayin" ]] || exit 1
          cd /home/ayin/htdocs/current
          test "$(git rev-parse HEAD)" = "ecfc6d672b2d06f8f71786b094d861723f4fb0f3"

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { userInfo } from 'node:os';
          import { createHash } from 'node:crypto';
          import { createPrismaClient } from './packages/db/dist/index.js';

          const expectedHome = '/home/ayin';
          const advisoryLockId = 86192026;
          if (userInfo().username !== 'ayin' || process.env.HOME !== expectedHome) {
            throw new Error("bootstrap must run as dedicated ayin user");
          }

          const values = new Map();
          for (const rawLine of readFileSync('/home/ayin/env/api.env','utf8').split(/\r?\n/u)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i > 0) values.set(line.slice(0,i).trim(), line.slice(i+1));
          }
          if (values.get('APP_ENV') !== 'production' || values.get('NODE_ENV') !== 'production') {
            throw new Error('AYIN api.env is not production');
          }
          const databaseUrl = values.get('DATABASE_URL');
          if (!databaseUrl) throw new Error('DATABASE_URL missing');
          const parsed = new URL(databaseUrl);
          if (parsed.protocol !== 'postgresql:' || parsed.hostname !== '127.0.0.1' || parsed.port !== '5432' || parsed.pathname !== '/ayin') {
            throw new Error('refusing database outside local AYIN production database');
          }

          const prisma = createPrismaClient(databaseUrl);
          try {
            const initialCount = await prisma.adminRoleAssignment.count({ where: { role: 'SUPERADMIN' } });
            if (initialCount !== 0) throw new Error('SUPERADMIN already exists; bootstrap disabled');

            const accounts = await prisma.account.findMany({
              select: {
                id: true,
                email: true,
                displayName: true,
                status: true,
                viewerProfiles: { select: { id: true }, take: 1 },
                channelMemberships: {
                  where: { role: 'OWNER' },
                  select: { channelId: true },
                  take: 1,
                },
              },
            });
            const account = accounts.find((a) =>
              createHash('sha256').update(a.email.toLowerCase()).digest('hex') === process.env.TARGET_EMAIL_SHA256,
            );
            if (!account) throw new Error('target AYIN account not found');
            if (account.status !== 'ACTIVE') throw new Error('target account is not ACTIVE');
            if (account.viewerProfiles.length !== 1 || account.channelMemberships.length !== 1) {
              throw new Error('target account lacks normal viewer/creator identity');
            }

            await prisma.$transaction(async (tx) => {
              const lockRows = await tx.$queryRawUnsafe(`SELECT pg_try_advisory_xact_lock(${advisoryLockId}) AS locked`);
              if (!Array.isArray(lockRows) || lockRows.length !== 1 || lockRows[0].locked !== true) {
                throw new Error('could not acquire SUPERADMIN bootstrap advisory lock');
              }

              const count = await tx.adminRoleAssignment.count({ where: { role: 'SUPERADMIN' } });
              if (count !== 0) throw new Error('another SUPERADMIN was created concurrently');

              await tx.adminRoleAssignment.create({
                data: { accountId: account.id, role: 'SUPERADMIN' },
              });
              await tx.adminAuditLog.create({
                data: {
                  actorAccountId: account.id,
                  action: 'ADMIN_ROLE_BOOTSTRAP',
                  entityType: 'Account',
                  entityId: account.id,
                  reason: 'Initial production SUPERADMIN bootstrap',
                  metadata: {
                    role: 'SUPERADMIN',
                    method: 'one-time-server-bootstrap',
                  },
                },
              });
            });

            const roles = await prisma.adminRoleAssignment.findMany({
              where: { role: 'SUPERADMIN' },
              select: { accountId: true },
            });
            if (roles.length !== 1 || roles[0].accountId !== account.id) {
              throw new Error('post-bootstrap verification failed');
            }
            const [local, domain] = account.email.split('@');
            const masked = local && domain ? `${local.slice(0,2)}***@${domain}` : '***';
            console.log('AYIN first production SUPERADMIN created successfully.');
            console.log(`SUPERADMIN_COUNT=${roles.length}`);
            console.log(`SUPERADMIN_ACCOUNT=${account.displayName}|${masked}|${account.status}`);
          } finally {
            await prisma.$disconnect();
          }
          NODE
          REMOTE
