name: One-shot AYIN first SUPERADMIN bootstrap via PTY

on:
  push:
    paths:
      - .github/workflows/one-shot-diagnose-runtime-instability-v2.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y
      TARGET_EMAIL_SHA256: 4e31aa118ea6ee92b09e8047819b43710d24ecb62ca30004881f869277bf0e9a

    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          for attempt in 1 2 3; do
            if timeout 10s ssh-keyscan -T 7 -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate" 2>/dev/null && [[ -s "$candidate" ]]; then break; fi
            sleep 5
          done
          test -s "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR==1{print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run official bootstrap interactively through PTY
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=25 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "TARGET_EMAIL_SHA256='$TARGET_EMAIL_SHA256' bash -s" <<'REMOTE'
          set -euo pipefail
          [[ "$(whoami)" == "ayin" && "$HOME" == "/home/ayin" ]] || exit 1
          cd /home/ayin/htdocs/current
          test "$(git rev-parse HEAD)" = "ecfc6d672b2d06f8f71786b094d861723f4fb0f3"

          TARGET_EMAIL="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { createPrismaClient } from './packages/db/dist/index.js';
          const values = new Map();
          for (const rawLine of readFileSync('/home/ayin/env/api.env','utf8').split(/\r?\n/u)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i > 0) values.set(line.slice(0,i).trim(), line.slice(i+1));
          }
          const databaseUrl = values.get('DATABASE_URL');
          if (!databaseUrl) throw new Error('DATABASE_URL missing');
          const prisma = createPrismaClient(databaseUrl);
          try {
            const accounts = await prisma.account.findMany({ select: { email: true } });
            const target = accounts.find((a) => createHash('sha256').update(a.email.toLowerCase()).digest('hex') === process.env.TARGET_EMAIL_SHA256);
            if (!target) throw new Error('target account not found');
            process.stdout.write(target.email.toLowerCase());
          } finally {
            await prisma.$disconnect();
          }
          NODE
          )"
          test -n "$TARGET_EMAIL"
          export TARGET_EMAIL

          python3 <<'PY'
          import os, pty, select, signal, sys, termios, time

          email = os.environ['TARGET_EMAIL']
          child_pid, master_fd = pty.fork()
          if child_pid == 0:
              os.execvp('node', ['node', 'deploy/admin/bootstrap-first-superadmin.mjs'])

          attrs = termios.tcgetattr(master_fd)
          attrs[3] &= ~termios.ECHO
          termios.tcsetattr(master_fd, termios.TCSANOW, attrs)

          email_prompt = 'Existing AYIN account email to promote: '
          promote_prompt = 'Type PROMOTE to create the first production SUPERADMIN: '
          buffer = ''
          sent_email = False
          sent_promote = False
          deadline = time.monotonic() + 45
          exit_code = None

          try:
              while time.monotonic() < deadline:
                  waited_pid, status = os.waitpid(child_pid, os.WNOHANG)
                  if waited_pid == child_pid:
                      exit_code = os.waitstatus_to_exitcode(status)
                      break

                  ready, _, _ = select.select([master_fd], [], [], 1)
                  if not ready:
                      continue
                  try:
                      data = os.read(master_fd, 4096)
                  except OSError:
                      data = b''
                  if not data:
                      continue

                  text = data.decode('utf-8', errors='replace')
                  sys.stdout.write(text.replace(email, '<redacted-email>'))
                  sys.stdout.flush()
                  buffer = (buffer + text)[-12000:]

                  if (not sent_email) and email_prompt in buffer:
                      os.write(master_fd, (email + '\n').encode())
                      sent_email = True
                      buffer = ''
                      continue

                  if sent_email and (not sent_promote) and promote_prompt in buffer:
                      os.write(master_fd, b'PROMOTE\n')
                      sent_promote = True
                      buffer = ''
                      continue

              if exit_code is None:
                  os.kill(child_pid, signal.SIGTERM)
                  try:
                      _, status = os.waitpid(child_pid, 0)
                      exit_code = os.waitstatus_to_exitcode(status)
                  except ChildProcessError:
                      exit_code = 1
                  print('\nBOOTSTRAP_PTY_TIMEOUT')

              if not sent_email or not sent_promote:
                  print(f'PROMPT_STATE sent_email={sent_email} sent_promote={sent_promote}')
                  sys.exit(2)
              sys.exit(exit_code)
          finally:
              try:
                  os.close(master_fd)
              except OSError:
                  pass
          PY
          unset TARGET_EMAIL
          REMOTE

      - name: Verify exactly one SUPERADMIN exists
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=25 -o ConnectionAttempts=3 -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ayin/htdocs/current
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createPrismaClient } from './packages/db/dist/index.js';
          const values = new Map();
          for (const rawLine of readFileSync('/home/ayin/env/api.env','utf8').split(/\r?\n/u)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i > 0) values.set(line.slice(0,i).trim(), line.slice(i+1));
          }
          const prisma = createPrismaClient(values.get('DATABASE_URL'));
          try {
            const roles = await prisma.adminRoleAssignment.findMany({ where: { role: 'SUPERADMIN' }, select: { accountId: true } });
            console.log(`SUPERADMIN_COUNT=${roles.length}`);
            if (roles.length !== 1) process.exit(1);
            const account = await prisma.account.findUnique({ where: { id: roles[0].accountId }, select: { email: true, displayName: true, status: true } });
            if (!account) process.exit(1);
            const [local, domain] = account.email.split('@');
            const masked = local && domain ? `${local.slice(0,2)}***@${domain}` : '***';
            console.log(`SUPERADMIN_ACCOUNT=${account.displayName}|${masked}|${account.status}`);
          } finally {
            await prisma.$disconnect();
          }
          NODE
          REMOTE
