name: One-shot AYIN runtime and PostgreSQL forensic snapshot

on:
  push:
    paths:
      - .github/workflows/one-shot-diagnose-runtime-instability-v2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y

    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          for attempt in 1 2 3; do
            if timeout 10s ssh-keyscan -T 7 -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate" 2>/dev/null && [[ -s "$candidate" ]]; then break; fi
            sleep 5
          done
          test -s "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR==1{print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          sleep 15

      - name: Inspect service limits and restart evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=25 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -u
          [[ "$(whoami)" == "ayin" && "$HOME" == "/home/ayin" ]] || exit 1
          echo '=== CURRENT LOAD ==='
          date -u '+utc_now=%Y-%m-%dT%H:%M:%SZ'
          uptime || true
          free -h || true

          echo '=== MARIADB SYSTEMD METADATA ==='
          systemctl show mariadb -p ActiveState -p SubState -p NRestarts -p Restart -p RestartUSec -p MemoryCurrent -p MemoryPeak -p MemorySwapCurrent -p OOMPolicy -p Result -p ExecMainCode -p ExecMainStatus -p ExecMainStartTimestamp --no-pager 2>/dev/null || true
          echo '--- mariadb status tail ---'
          systemctl status mariadb --no-pager -l 2>&1 | tail -35 || true
          echo '--- mariadb journal last 20m (if readable) ---'
          journalctl -u mariadb --since '20 minutes ago' --no-pager -n 120 2>&1 | tail -120 || true
          echo '--- mysql error log metadata/tail if readable ---'
          ls -l /var/log/mysql 2>&1 || true
          for f in /var/log/mysql/error.log /var/log/mysql/mariadb.log; do if [[ -r "$f" ]]; then echo "-- $f"; tail -80 "$f"; fi; done

          echo '=== PHP-FPM POOL LIMITS FOR VISIBLE SITE USERS ==='
          for f in /etc/php/*/fpm/pool.d/*.conf; do
            [[ -r "$f" ]] || continue
            if grep -Eq '(^|[[:space:]])(lordai|aleph1)([[:space:]]|$)|lordai\.net|aleph1\.online' "$f"; then
              echo "-- $f"
              grep -E '^\[|^user[[:space:]]*=|^group[[:space:]]*=|^listen[[:space:]]*=|^pm[[:space:]]*=|^pm\.max_children[[:space:]]*=|^pm\.start_servers[[:space:]]*=|^pm\.min_spare_servers[[:space:]]*=|^pm\.max_spare_servers[[:space:]]*=|^pm\.process_idle_timeout[[:space:]]*=|^pm\.max_requests[[:space:]]*=' "$f" || true
            fi
          done

          echo '=== PHP-FPM SERVICE MEMORY ==='
          for svc in $(systemctl list-units --type=service --all --no-legend 2>/dev/null | awk '/php.*fpm/{print $1}'); do
            printf '%s ' "$svc"
            systemctl show "$svc" -p MemoryCurrent -p MemoryPeak -p NRestarts --value --no-pager 2>/dev/null | paste -sd ' ' - || true
          done

          echo '=== VARNISH CONFIG ==='
          ps -eo pid,user,rss,args | grep '[v]arnishd' || true
          systemctl show varnish -p ActiveState -p NRestarts -p MemoryCurrent -p MemoryPeak -p ExecStart --no-pager 2>/dev/null || true

          echo '=== MYSQL/MARIADB MEMORY SETTINGS (NO CREDENTIALS) ==='
          grep -RhsE '^[[:space:]]*(innodb_buffer_pool_size|max_connections|table_open_cache|tmp_table_size|max_heap_table_size|performance_schema|key_buffer_size)[[:space:]]*=' /etc/mysql 2>/dev/null | sed -n '1,80p' || true

          echo '=== NGINX METADATA ==='
          systemctl show nginx -p ActiveState -p NRestarts -p MemoryCurrent -p MemoryPeak -p Result -p ExecMainStatus -p ExecMainStartTimestamp --no-pager 2>/dev/null || true
          echo '=== END ==='
          REMOTE
          # service-limit evidence trigger
