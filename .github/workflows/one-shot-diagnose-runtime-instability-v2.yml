name: One-shot AYIN runtime and PostgreSQL forensic snapshot

on:
  push:
    paths:
      - .github/workflows/one-shot-diagnose-runtime-instability-v2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y

    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          for attempt in 1 2 3; do
            if timeout 10s ssh-keyscan -T 7 -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate" 2>/dev/null && [[ -s "$candidate" ]]; then break; fi
            sleep 5
          done
          test -s "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR==1{print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          sleep 15

      - name: Capture focused shared-host pressure snapshot
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=25 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -u
          [[ "$(whoami)" == "ayin" && "$HOME" == "/home/ayin" ]] || exit 1
          echo '=== CAPACITY ==='
          date -u '+utc_now=%Y-%m-%dT%H:%M:%SZ'
          printf 'vcpus='; nproc || true
          uptime || true
          free -h || true
          cat /proc/loadavg || true

          echo '=== PSI PRESSURE ==='
          for f in /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io; do echo "-- $f"; cat "$f" 2>/dev/null || true; done

          echo '=== VMSTAT 1s x5 ==='
          vmstat 1 5 || true

          echo '=== TOP SNAPSHOT ==='
          COLUMNS=220 top -b -n 1 | head -35 || true

          echo '=== PROCESS STATES ==='
          echo '-- D state (uninterruptible I/O) --'
          ps -eo stat,pid,ppid,user,%cpu,%mem,rss,etime,args | awk '$1 ~ /^D/ {print}' | head -80 || true
          echo '-- R state --'
          ps -eo stat,pid,ppid,user,%cpu,%mem,rss,etime,args | awk '$1 ~ /^R/ {print}' | head -80 || true

          echo '=== PER-USER PROCESS/RSS AGGREGATE ==='
          ps -eo user=,rss= | awk '{c[$1]++; r[$1]+=$2} END {for (u in c) printf "%s processes=%d rss_mb=%.1f\n",u,c[u],r[u]/1024}' | sort -k3 -nr || true

          echo '=== PHP-FPM POOL COUNTS ==='
          ps -eo user=,args= | awk '/php-fpm: pool/ {key=$1" | "$0; sub(/^[^|]*\| /,"",key); c[key]++} END {for (k in c) print c[k],k}' | sort -nr | head -40 || true

          echo '=== TOP RSS PROCESSES ==='
          ps -eo pid,ppid,user,stat,%cpu,%mem,rss,etime,args --sort=-rss | head -35 || true

          echo '=== CONNECTION SUMMARY ==='
          ss -s 2>/dev/null || true
          printf 'established='; ss -Htan state established 2>/dev/null | wc -l || true
          printf 'syn_recv='; ss -Htan state syn-recv 2>/dev/null | wc -l || true

          echo '=== SERVICE START/RESTART METADATA ==='
          for svc in mariadb mysql nginx postgresql cron; do
            if systemctl status "$svc" >/dev/null 2>&1; then
              echo "-- $svc"
              systemctl show "$svc" -p ActiveState -p SubState -p NRestarts -p ExecMainStartTimestamp -p ActiveEnterTimestamp --no-pager 2>/dev/null || true
            fi
          done
          for svc in $(systemctl list-units --type=service --all --no-legend 2>/dev/null | awk '/php.*fpm/{print $1}'); do
            echo "-- $svc"
            systemctl show "$svc" -p ActiveState -p SubState -p NRestarts -p ExecMainStartTimestamp -p ActiveEnterTimestamp --no-pager 2>/dev/null || true
          done

          echo '=== AYIN CONTROL ==='
          pm2 ls 2>/dev/null || true
          pgrep -a -f 'stress-ng|(^|/)stress( |$)|autocannon|(^|/)k6( |$)|(^|/)wrk( |$)|(^|/)ab( |$)|siege|bootstrap-first-superadmin' || echo 'no known stress/bootstrap process'
          echo '=== END ==='
          REMOTE
          # focused pressure trigger
