name: One-shot AYIN SUPERADMIN status check

on:
  push:
    paths:
      - .github/workflows/one-shot-diagnose-runtime-instability-v2.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y

    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          for attempt in 1 2 3; do
            if timeout 10s ssh-keyscan -T 7 -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate" 2>/dev/null && [[ -s "$candidate" ]]; then break; fi
            sleep 5
          done
          test -s "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR==1{print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Read current SUPERADMIN assignments only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=25 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          [[ "$(whoami)" == "ayin" && "$HOME" == "/home/ayin" ]] || exit 1
          cd /home/ayin/htdocs/current
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createPrismaClient } from './packages/db/dist/index.js';

          const values = new Map();
          for (const rawLine of readFileSync('/home/ayin/env/api.env','utf8').split(/\r?\n/u)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i > 0) values.set(line.slice(0,i).trim(), line.slice(i+1));
          }
          const databaseUrl = values.get('DATABASE_URL');
          if (!databaseUrl) throw new Error('DATABASE_URL missing');
          const prisma = createPrismaClient(databaseUrl);
          try {
            const roles = await prisma.adminRoleAssignment.findMany({
              where: { role: 'SUPERADMIN' },
              select: { accountId: true, createdAt: true },
              orderBy: { createdAt: 'asc' },
            });
            console.log(`SUPERADMIN_COUNT=${roles.length}`);
            for (const role of roles) {
              const account = await prisma.account.findUnique({
                where: { id: role.accountId },
                select: { email: true, displayName: true, status: true },
              });
              if (!account) {
                console.log('SUPERADMIN_ACCOUNT=missing');
                continue;
              }
              const [local, domain] = account.email.split('@');
              const masked = local && domain ? `${local.slice(0,2)}***@${domain}` : '***';
              console.log(`SUPERADMIN_ACCOUNT=${account.displayName}|${masked}|${account.status}|${role.createdAt.toISOString()}`);
            }
          } finally {
            await prisma.$disconnect();
          }
          NODE
          REMOTE
