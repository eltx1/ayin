name: One-shot AYIN live bootstrap state check

on:
  push:
    paths:
      - .github/workflows/one-shot-diagnose-runtime-instability-v2.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      DEPLOY_HOST: 13.52.116.200
      DEPLOY_USER: ayin
      SSH_PORT: "22"
      PINNED_SSH_HOST_FINGERPRINT: SHA256:YoUNEx7Aizhzl99TReL4kGCyUY6KopzrPuPgRmhDC0Y

    steps:
      - name: Configure pinned SSH trust
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.AYIN_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          candidate="$HOME/.ssh/known_hosts.candidate"
          for attempt in 1 2 3; do
            if timeout 10s ssh-keyscan -T 7 -p "$SSH_PORT" -t ed25519 "$DEPLOY_HOST" > "$candidate" 2>/dev/null && [[ -s "$candidate" ]]; then break; fi
            sleep 5
          done
          test -s "$candidate"
          actual="$(ssh-keygen -lf "$candidate" -E sha256 | awk 'NR==1{print $2}')"
          test "$actual" = "$PINNED_SSH_HOST_FINGERPRINT"
          mv "$candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect live bootstrap state read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=25 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p "$SSH_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/ayin/htdocs/current
          echo '=== PROCESS ==='
          pgrep -a -f 'bootstrap-first-superadmin|deploy/admin/bootstrap' || echo 'NO_BOOTSTRAP_PROCESS'
          echo '=== LOAD ==='
          uptime || true
          free -h || true
          echo '=== DB STATE ==='
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createPrismaClient } from './packages/db/dist/index.js';
          const values = new Map();
          for (const rawLine of readFileSync('/home/ayin/env/api.env','utf8').split(/\r?\n/u)) {
            const line = rawLine.trim();
            if (!line || line.startsWith('#')) continue;
            const i = line.indexOf('=');
            if (i > 0) values.set(line.slice(0,i).trim(), line.slice(i+1));
          }
          const prisma = createPrismaClient(values.get('DATABASE_URL'));
          try {
            const roles = await prisma.adminRoleAssignment.findMany({ where: { role: 'SUPERADMIN' }, select: { accountId: true } });
            console.log(`SUPERADMIN_COUNT=${roles.length}`);
            if (roles.length === 1) {
              const account = await prisma.account.findUnique({ where: { id: roles[0].accountId }, select: { email: true, displayName: true, status: true } });
              if (account) {
                const [local,domain] = account.email.split('@');
                console.log(`SUPERADMIN_ACCOUNT=${account.displayName}|${local.slice(0,2)}***@${domain}|${account.status}`);
              }
            }
            const sessions = await prisma.$queryRawUnsafe(`SELECT pid,state,wait_event_type,wait_event,pg_blocking_pids(pid) AS blocked_by,left(regexp_replace(coalesce(query,''),E'[\\n\\r\\t ]+',' ','g'),180) AS query FROM pg_stat_activity WHERE datname=current_database() ORDER BY query_start NULLS LAST`);
            for (const s of sessions) console.log(JSON.stringify(s));
          } finally {
            await prisma.$disconnect();
          }
          NODE
          REMOTE
