name: Android shell validation

on:
  pull_request:
    paths:
      - "platforms/android/**"
      - "apps/web/src/lib/native-shell-bridge*"
      - "apps/web/src/lib/mobile-*.ts"
      - "apps/web/src/lib/tv-platform-runtime.ts"
      - "apps/web/src/components/player/ayin-player.tsx"
      - "apps/web/src/components/player/live-ayin-player.tsx"
      - "scripts/mobile-*"
      - ".github/workflows/android-shell.yml"
  workflow_dispatch:
    inputs:
      include_tv_emulators:
        description: "Also test existing Google TV / Fire TV flavors (additional runners)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AYIN_BUILD_ENVIRONMENT: development
  AYIN_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  android-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Validate mobile release security gates
        run: python3 scripts/mobile-validation-test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Expose runner Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          tools_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -printf '%h\n' | sort -V | tail -1)"
          test -n "$tools_bin"
          echo "$tools_bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Resolve locked dependencies
        run: |
          set -euo pipefail
          flags=()
          if [ ! -f platforms/android/app/gradle.lockfile ]; then flags+=(--write-locks); fi
          gradle -p platforms/android --no-daemon :app:dependencies "${flags[@]}"
      - name: Unit tests, lint and minified release compilation
        run: |
          set -euo pipefail
          gradle -p platforms/android --no-daemon --stacktrace \
            :app:testMobileDebugUnitTest :app:testTvDebugUnitTest :app:testFireTvDebugUnitTest \
            :app:lintMobileDebug :app:lintMobileRelease :app:lintTvDebug :app:lintFireTvDebug \
            :app:assembleMobileDebug :app:assembleTvDebug :app:assembleFireTvDebug \
            :app:assembleMobileRelease :app:bundleMobileRelease
      - name: Check release native library and APK alignment
        run: |
          set -euo pipefail
          python3 scripts/mobile-android-page-size.py platforms/android/app/build/outputs/bundle/mobileRelease/app-mobile-release.aab
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$sdk_root/build-tools/35.0.0/zipalign" -c -P 16 4 platforms/android/app/build/outputs/apk/mobile/release/app-mobile-release-unsigned.apk
      - name: Collect distributable files and provenance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ayin-android"
          cp platforms/android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "$RUNNER_TEMP/ayin-android/"
          cp platforms/android/app/build/outputs/bundle/mobileRelease/app-mobile-release.aab "$RUNNER_TEMP/ayin-android/ayin-mobile-release-unsigned.aab"
          cp platforms/android/app/build/outputs/mapping/mobileRelease/mapping.txt "$RUNNER_TEMP/ayin-android/"
          cp platforms/android/app/gradle.lockfile "$RUNNER_TEMP/ayin-android/gradle.lockfile"
          python3 scripts/mobile-build-metadata.py --platform android --signing unsigned \
            --output "$RUNNER_TEMP/ayin-android/build-metadata.json" \
            --artifact "$RUNNER_TEMP/ayin-android/app-mobile-debug.apk" \
            --artifact "$RUNNER_TEMP/ayin-android/ayin-mobile-release-unsigned.aab" \
            --artifact "$RUNNER_TEMP/ayin-android/mapping.txt"
          echo "Debug APK uses test ads. Release AAB is unsigned; external Firebase/Ads configuration is not injected in public PR jobs." > "$RUNNER_TEMP/ayin-android/READ-ME.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ayin-android-${{ github.sha }}
          path: ${{ runner.temp }}/ayin-android/
          if-no-files-found: error
          retention-days: 14
      - name: Upload resolved Gradle lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayin-android-dependency-locks-${{ github.sha }}
          path: platforms/android/**/gradle.lockfile
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload JVM and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayin-android-reports-${{ github.sha }}
          path: |
            platforms/android/app/build/reports/
            platforms/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  emulator-baseline:
    name: Emulator baseline (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_tv_emulators && '{"include":[{"name":"Android 16 mobile","api":"36","tag":"google_apis","device":"pixel_6","arch":"x86_64","flavor":"Mobile","package":"net.ayin.app.mobile","apk":"app-mobile-debug.apk","remoteSmoke":"false"},{"name":"Google TV Android 16","api":"36","tag":"google-tv","device":"tv_1080p","arch":"x86","flavor":"Tv","package":"net.ayin.app.tv","apk":"app-tv-debug.apk","remoteSmoke":"true"},{"name":"Fire flavor on Google TV Android 16","api":"36","tag":"google-tv","device":"tv_1080p","arch":"x86","flavor":"FireTv","package":"net.ayin.app.firetv","apk":"app-fireTv-debug.apk","remoteSmoke":"true"}]}' || '{"include":[{"name":"Android 16 mobile","api":"36","tag":"google_apis","device":"pixel_6","arch":"x86_64","flavor":"Mobile","package":"net.ayin.app.mobile","apk":"app-mobile-debug.apk","remoteSmoke":"false"}]}') }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate mobile release security gates
        run: python3 scripts/mobile-validation-test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Expose runner Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          tools_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -printf '%h\n' | sort -V | tail -1)"
          test -n "$tools_bin"
          echo "$tools_bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install emulator image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-${{ matrix.api }}" "system-images;android-${{ matrix.api }};${{ matrix.tag }};${{ matrix.arch }}"
      - name: Start emulator
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/ayin-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avd_name="ayin-task77-${{ matrix.flavor }}"
          echo "no" | avdmanager create avd             --force             --name "$avd_name"             --path "$ANDROID_AVD_HOME/$avd_name.avd"             --package "system-images;android-${{ matrix.api }};${{ matrix.tag }};${{ matrix.arch }}"             --device "${{ matrix.device }}"
          emulator -list-avds
          test -d "$ANDROID_AVD_HOME/$avd_name.avd"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/adbkey" ]; then
            adb keygen "$HOME/.android/adbkey"
          fi
          export ADB_VENDOR_KEYS="$HOME/.android"
          adb kill-server || true
          adb start-server
          sudo chmod 666 /dev/kvm || true
          nohup env ADB_VENDOR_KEYS="$ADB_VENDOR_KEYS" emulator -avd "$avd_name"             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -gpu swiftshader_indirect             -no-metrics >"$RUNNER_TEMP/ayin-emulator.log" 2>&1 &
          emulator_pid=$!
          if ! timeout 120 adb wait-for-device; then
            cat "$RUNNER_TEMP/ayin-emulator.log"
            kill "$emulator_pid" 2>/dev/null || true
            exit 1
          fi
          if ! timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'; then
            adb devices -l || true
            cat "$RUNNER_TEMP/ayin-emulator.log"
            kill "$emulator_pid" 2>/dev/null || true
            exit 1
          fi
          # Boot completion can precede a temporary ADB reconnect.
          # Retry only idempotent setup; application tests below still run once.
          if ! timeout 90 bash -c '
            until [ "$(adb get-state 2>/dev/null)" = "device" ] &&
                  [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ] &&
                  adb shell settings put global window_animation_scale 0 &&
                  adb shell settings put global transition_animation_scale 0 &&
                  adb shell settings put global animator_duration_scale 0 &&
                  adb shell getprop ro.build.version.release &&
                  adb shell getprop ro.build.version.sdk; do
              adb reconnect offline >/dev/null 2>&1 || true
              sleep 2
            done
          '; then
            adb devices -l || true
            cat "$RUNNER_TEMP/ayin-emulator.log"
            kill "$emulator_pid" 2>/dev/null || true
            exit 1
          fi
      - name: Run shell instrumentation baseline
        shell: bash
        run: |
          set -euo pipefail
          if ! timeout 360 gradle -p platforms/android --no-daemon --stacktrace :app:connected${{ matrix.flavor }}DebugAndroidTest; then
            adb devices -l || true
            adb logcat -d -t 400 || true
            exit 1
          fi
      - name: Preserve connected test diagnostics
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/ayin-android-test-diagnostics"
          # A lost emulator must not block upload of already completed test reports.
          timeout --kill-after=5s 20s adb logcat -d -s TestRunner:V AndroidJUnitRunner:V AndroidRuntime:E AyinShell:I '*:S' > "$RUNNER_TEMP/ayin-android-test-diagnostics/instrumentation-logcat.txt" 2>/dev/null || true
      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayin-android-connected-tests-${{ matrix.flavor }}-${{ github.sha }}
          path: |
            platforms/android/app/build/reports/androidTests/connected/
            platforms/android/app/build/outputs/androidTest-results/connected/
            ${{ runner.temp }}/ayin-android-test-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run ADB deep-link and TV remote smoke
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          package="${{ matrix.package }}"
          component="$package/net.ayin.shell.MainActivity"
          apk_path="$(find platforms/android/app/build/outputs/apk -type f -name "${{ matrix.apk }}" -print -quit)"
          test -n "$apk_path"
          timeout 120 adb install -r "$apk_path"
          adb shell pm path "$package"
          adb logcat -c
          adb shell am force-stop "$package"
          adb shell am start -W             -a android.intent.action.VIEW             -c android.intent.category.BROWSABLE             -d "ayin://watch/task-77-emulator?autoplay=1"             "$component"
          sleep 2
          if [ "${{ matrix.remoteSmoke }}" = "true" ]; then
            adb shell input keyevent 22
            adb shell input keyevent 20
            adb shell input keyevent 23
            adb shell input keyevent 85
            sleep 2
          fi
          logs="$(adb logcat -d -s AyinShell:I '*:S')"
          printf '%s\n' "$logs"
          grep -q "deep-link=https://ayin.stream/watch/task-77-emulator?autoplay=1" <<<"$logs"
          if [ "${{ matrix.remoteSmoke }}" = "true" ]; then
            grep -q "dpad=" <<<"$logs"
            grep -q "remote=PLAY_PAUSE" <<<"$logs"
          fi
      - name: Capture actual emulator startup diagnostic
        run: |
          set -euo pipefail
          package="${{ matrix.package }}"
          adb shell am force-stop "$package"
          adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n "$package/net.ayin.shell.MainActivity"
          sleep 10
          mkdir -p "$RUNNER_TEMP/ayin-android-diagnostic"
          adb exec-out screencap -p > "$RUNNER_TEMP/ayin-android-diagnostic/startup.png"
          python3 scripts/mobile-build-metadata.py --platform android --signing debug \
            --output "$RUNNER_TEMP/ayin-android-diagnostic/build-metadata.json" \
            --artifact "$RUNNER_TEMP/ayin-android-diagnostic/startup.png"
          echo "Actual Android emulator startup capture. Diagnostic only; not store-approved or a physical-device Ads/FCM test." > "$RUNNER_TEMP/ayin-android-diagnostic/READ-ME.txt"
      - name: Upload emulator startup diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ayin-android-diagnostic-${{ matrix.flavor }}-${{ github.sha }}
          path: ${{ runner.temp }}/ayin-android-diagnostic/
          if-no-files-found: error
          retention-days: 14
      - name: Upload emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task77-emulator-${{ matrix.flavor }}-${{ matrix.api }}
          path: ${{ runner.temp }}/ayin-emulator.log
          retention-days: 7
