name: Android shell validation

on:
  pull_request:
    paths:
      - "platforms/android/**"
      - "apps/web/src/lib/native-shell-bridge.ts"
      - "apps/web/src/lib/native-shell-bridge.test.ts"
      - ".github/workflows/android-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build mobile, Google TV and Fire TV debug shells
        run: >-
          gradle -p platforms/android
          :app:assembleMobileDebug
          :app:assembleTvDebug
          :app:assembleFireTvDebug
      - name: Run Android lint
        run: gradle -p platforms/android :app:lintMobileDebug :app:lintTvDebug :app:lintFireTvDebug
