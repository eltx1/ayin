name: Task34 fix
on:
  push:
    branches: [task-34-live-streaming]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-34-live-streaming
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/live/live.service.ts')
          s=p.read_text()
          s=s.replace('const { streamKeyHash: _streamKeyHash, ...safe } = stream;\n  return safe;', 'const { streamKeyHash, ...safe } = stream;\n  void streamKeyHash;\n  return safe;')
          p.write_text(s)
          PY
          pnpm exec prettier --write apps/api/src/live/live.controller.ts apps/api/src/live/live.service.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/live/live.controller.ts apps/api/src/live/live.service.ts
          git diff --cached --quiet || git commit -m "Fix Task 34 lint"
          git push origin HEAD:task-34-live-streaming
