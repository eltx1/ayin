name: Task 51 implementation

on:
  push:
    branches:
      - task-51-video-metadata-v2

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-51-video-metadata-v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Apply Task 51 backend patches
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              p = Path(path); text = p.read_text()
              if old not in text: raise SystemExit(f"missing anchor {path}: {old[:90]!r}")
              p.write_text(text.replace(old, new, count))

          replace('packages/db/prisma/schema.prisma',
            '  rightsDeclarations     ContentRightsDeclaration[]\n  reports                Report[]',
            '  rightsDeclarations     ContentRightsDeclaration[]\n  creatorMetadata        VideoCreatorMetadata?\n  reports                Report[]')

          path='apps/api/src/creator/quick-upload.service.ts'
          replace(path, 'import { PlatformSettingsService } from "../platform-config/platform-settings.service.js";\n',
            'import { PlatformSettingsService } from "../platform-config/platform-settings.service.js";\nimport {\n  hasCompanionMetadata,\n  metadataData,\n  type VideoMetadataInput,\n  validateChapterDuration,\n} from "./video-metadata.validation.js";\n')
          replace(path, '''export interface DraftDetailsInput {\n  title?: string;\n  description?: string | null;\n  visibility?: "PUBLIC" | "UNLISTED" | "PRIVATE";\n  commentsEnabled?: boolean;\n  scheduledPublishAt?: Date | null;\n  videoForm?: "LONG_FORM" | "CLIP";\n}\n''', '''export type DraftDetailsInput = VideoMetadataInput & {\n  title?: string;\n  description?: string | null;\n  visibility?: "PUBLIC" | "UNLISTED" | "PRIVATE";\n  commentsEnabled?: boolean;\n  scheduledPublishAt?: Date | null;\n  videoForm?: "LONG_FORM" | "CLIP";\n};\n''')
          replace(path, '''    const data = this.detailsData(input);\n    return this.database.client.video.update({\n      where: { id: videoId },\n      data,\n      select: {\n        id: true,\n        title: true,\n        description: true,\n        visibility: true,\n        commentsEnabled: true,\n        scheduledPublishAt: true,\n        status: true,\n      },\n    });''', '''    try {\n      validateChapterDuration(input, video.durationMs);\n    } catch {\n      throw new QuickUploadError("CHAPTER_OUTSIDE_VIDEO", "Chapter start times must fall within the video duration.");\n    }\n    return this.database.client.$transaction(async (tx) => {\n      if (hasCompanionMetadata(input)) {\n        const metadata = metadataData(input);\n        await tx.videoCreatorMetadata.upsert({ where: { videoId }, create: { videoId, ...metadata }, update: metadata });\n      }\n      return tx.video.update({\n        where: { id: videoId },\n        data: this.detailsData(input),\n        select: { id: true, title: true, description: true, contentType: true, visibility: true, commentsEnabled: true, scheduledPublishAt: true, status: true, creatorMetadata: true },\n      });\n    });''')
          replace(path, '''      await tx.contentRightsDeclaration.upsert({\n        where: { videoId_version: { videoId, version: RIGHTS_DECLARATION_VERSION } },\n        update: {},\n        create: {\n          videoId,\n          declaredByAccountId: accountId,\n          version: RIGHTS_DECLARATION_VERSION,\n          basis: "AUTHORIZED",\n          status: "CONFIRMED",\n          statement: RIGHTS_STATEMENT,\n          declaredAt: now,\n        },\n      });''', '''      try {\n        validateChapterDuration(input, video.durationMs);\n      } catch {\n        throw new QuickUploadError("CHAPTER_OUTSIDE_VIDEO", "Chapter start times must fall within the video duration.");\n      }\n      if (hasCompanionMetadata(input)) {\n        const metadata = metadataData(input);\n        await tx.videoCreatorMetadata.upsert({ where: { videoId }, create: { videoId, ...metadata }, update: metadata });\n      }\n      const rightsBasis = input.rightsBasis ?? "AUTHORIZED";\n      await tx.contentRightsDeclaration.upsert({\n        where: { videoId_version: { videoId, version: RIGHTS_DECLARATION_VERSION } },\n        update: { declaredByAccountId: accountId, basis: rightsBasis, status: "CONFIRMED", statement: RIGHTS_STATEMENT, declaredAt: now },\n        create: { videoId, declaredByAccountId: accountId, version: RIGHTS_DECLARATION_VERSION, basis: rightsBasis, status: "CONFIRMED", statement: RIGHTS_STATEMENT, declaredAt: now },\n      });''')
          replace(path, '      ...(input.videoForm !== undefined ? { videoForm: input.videoForm } : {}),\n', '      ...(input.videoForm !== undefined ? { videoForm: input.videoForm } : {}),\n      ...(input.contentType !== undefined ? { contentType: input.contentType } : {}),\n')
          replace(path, '      select: { id: true, channelId: true, status: true },\n', '      select: { id: true, channelId: true, status: true, durationMs: true },\n', 1)

          path='apps/api/src/creator/studio.service.ts'
          replace(path, 'import { DatabaseService } from "../database/database.service.js";\n', 'import { DatabaseService } from "../database/database.service.js";\nimport {\n  hasCompanionMetadata,\n  metadataData,\n  type VideoMetadataInput,\n  validateChapterDuration,\n} from "./video-metadata.validation.js";\n')
          replace(path, 'export interface StudioVideoPatch {\n', 'export type StudioVideoPatch = VideoMetadataInput & {\n')
          replace(path, '}\n\ninterface StudioContentQuery {', '};\n\ninterface StudioContentQuery {')
          replace(path, '''        videoForm: true,\n        commentsEnabled: true,\n        createdAt: true,''', '''        videoForm: true,\n        contentType: true,\n        durationMs: true,\n        commentsEnabled: true,\n        creatorMetadata: true,\n        rightsDeclarations: { where: { status: "CONFIRMED" }, orderBy: { version: "desc" }, take: 1, select: { basis: true } },\n        createdAt: true,''')
          replace(path, '''        tvIncluded: video.tvPreferences[0]?.included ?? true,\n        tvPreferences: undefined,''', '''        tvIncluded: video.tvPreferences[0]?.included ?? true,\n        rightsBasis: video.rightsDeclarations[0]?.basis ?? null,\n        tags: video.creatorMetadata?.tags ?? [],\n        category: video.creatorMetadata?.category ?? null,\n        primaryLanguage: video.creatorMetadata?.primaryLanguage ?? null,\n        recordingDate: video.creatorMetadata?.recordingDate ?? null,\n        seriesTitle: video.creatorMetadata?.seriesTitle ?? null,\n        seasonNumber: video.creatorMetadata?.seasonNumber ?? null,\n        episodeNumber: video.creatorMetadata?.episodeNumber ?? null,\n        maturityLevel: video.creatorMetadata?.maturityLevel ?? null,\n        geoAvailabilityMode: video.creatorMetadata?.geoAvailabilityMode ?? null,\n        geoCountries: video.creatorMetadata?.geoCountries ?? [],\n        chapters: video.creatorMetadata?.chapters ?? null,\n        adBreakPreference: video.creatorMetadata?.adBreakPreference ?? null,\n        creatorMetadata: undefined, rightsDeclarations: undefined, tvPreferences: undefined,''')
          replace(path, '''    await this.database.client.$transaction(async (tx) => {\n      await tx.video.update({''', '''    try { validateChapterDuration(patch, video.durationMs); } catch {\n      throw new StudioError("CHAPTER_OUTSIDE_VIDEO", "Chapter start times must fall within the video duration.");\n    }\n    await this.database.client.$transaction(async (tx) => {\n      await tx.video.update({''')
          replace(path, '''          ...(patch.commentsEnabled !== undefined\n            ? { commentsEnabled: patch.commentsEnabled }\n            : {}),\n        },''', '''          ...(patch.commentsEnabled !== undefined ? { commentsEnabled: patch.commentsEnabled } : {}),\n          ...(patch.contentType !== undefined ? { contentType: patch.contentType } : {}),\n        },''')
          replace(path, '      if (patch.tvIncluded !== undefined) {', '''      if (hasCompanionMetadata(patch)) {\n        const metadata = metadataData(patch);\n        await tx.videoCreatorMetadata.upsert({ where: { videoId: video.id }, create: { videoId: video.id, ...metadata }, update: metadata });\n      }\n      if (patch.rightsBasis !== undefined) {\n        const currentRights = await tx.contentRightsDeclaration.findFirst({ where: { videoId: video.id, status: "CONFIRMED" }, orderBy: { version: "desc" }, select: { videoId: true, version: true } });\n        if (!currentRights) throw new StudioError("RIGHTS_CONFIRMATION_REQUIRED", "Choose the rights basis during publishing before editing it in Studio.", 409);\n        await tx.contentRightsDeclaration.update({ where: { videoId_version: { videoId: currentRights.videoId, version: currentRights.version } }, data: { basis: patch.rightsBasis, declaredByAccountId: accountId, declaredAt: new Date() } });\n      }\n      if (patch.tvIncluded !== undefined) {''')
          replace(path, '      select: { id: true, channelId: true, status: true },\n', '      select: { id: true, channelId: true, status: true, durationMs: true },\n')

          path='apps/api/src/search/search.service.ts'
          replace(path, '{ channel: { handle: { contains: normalized, mode: "insensitive" } } },\n', '{ channel: { handle: { contains: normalized, mode: "insensitive" } } },\n                { creatorMetadata: { tags: { has: normalized.toLocaleLowerCase() } } },\n', 1)

          path='apps/api/src/admin/admin-control.service.ts'
          replace(path, '''          description: true,\n          status: true,\n          visibility: true,\n          videoForm: true,''', '''          description: true,\n          status: true,\n          visibility: true,\n          videoForm: true,\n          contentType: true,\n          creatorMetadata: true,\n          rightsDeclarations: { where: { status: "CONFIRMED" }, orderBy: { version: "desc" }, take: 1, select: { basis: true } },''', 1)

          path='apps/api/src/creator/creator-tv.service.ts'
          replace(path, '''    return this.adBreakHook.getBreaks({\n      tvChannelId,\n      channelId,\n      generatedAt,\n      programs: programs.map((program) => ({\n        occurrenceKey: program.occurrenceKey,\n        videoId: program.video.id,\n        startsAt: new Date(program.startsAtMs),\n        endsAt: new Date(program.endsAtMs),\n      })),\n    });''', '''    const disabledRows = await this.database.client.videoCreatorMetadata.findMany({\n      where: { videoId: { in: [...new Set(programs.map((program) => program.video.id))] }, adBreakPreference: "DISABLED" },\n      select: { videoId: true },\n    });\n    const disabledVideoIds = new Set(disabledRows.map((row) => row.videoId));\n    const disabledOccurrences = new Set(programs.filter((program) => disabledVideoIds.has(program.video.id)).map((program) => program.occurrenceKey));\n    const breaks = await this.adBreakHook.getBreaks({\n      tvChannelId, channelId, generatedAt,\n      programs: programs.map((program) => ({ occurrenceKey: program.occurrenceKey, videoId: program.video.id, startsAt: new Date(program.startsAtMs), endsAt: new Date(program.endsAtMs) })),\n    });\n    return breaks.filter((marker) => !disabledOccurrences.has(marker.occurrenceKey));''')
          PY
      - name: Install, format and validate backend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @ayin/db exec prisma format --schema prisma
          pnpm exec prettier --write apps/api/src/creator/quick-upload.service.ts apps/api/src/creator/studio.service.ts apps/api/src/search/search.service.ts apps/api/src/admin/admin-control.service.ts apps/api/src/creator/creator-tv.service.ts apps/api/src/creator/video-metadata.validation.ts apps/api/src/creator/quick-upload.controller.ts
          pnpm --filter @ayin/db prisma:generate
          pnpm --filter @ayin/api typecheck
      - name: Commit backend and remove runner
        run: |
          rm .github/workflows/task51-implementation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(task-51): integrate creator metadata across backend"
          git push origin HEAD:task-51-video-metadata-v2
