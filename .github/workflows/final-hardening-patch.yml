name: Final hardening patch

on:
  push:
    branches:
      - feature/brand-monetization-admin-control-center
    paths:
      - .github/workflows/final-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brand-monetization-admin-control-center
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/final_hardening_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/admin/admin-governance.service.ts apps/api/src/revenue/creator-finance.service.ts apps/api/test/admin-operations.integration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve finance audit and superadmin invariants"
          git push origin HEAD:feature/brand-monetization-admin-control-center
