name: Apply final upload and player UX patch
on:
  push:
    branches:
      - fix/upload-reliability-publish-player
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/upload-reliability-publish-player
      - name: Patch application UX
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing {label}")
              return text.replace(old, new, 1)

          # Upload screen.
          p = Path('apps/web/src/components/upload/quick-upload.tsx')
          s = p.read_text()
          s = replace_once(s, 'import { useEffect, useRef, useState, type DragEvent } from "react";\n', 'import { useEffect, useRef, useState, type DragEvent } from "react";\nimport { useRouter } from "next/navigation";\n', 'router import')
          s = replace_once(s, 'export function QuickUpload() {\n', 'export function QuickUpload() {\n  const router = useRouter();\n', 'router instance')
          s = s.replace('  const [rightsConfirmed, setRightsConfirmed] = useState(false);\n', '')
          s = s.replace('    setRightsConfirmed(false);\n', '')
          s = replace_once(s, '        onProgress: setProgress,\n      });', '        onProgress: setProgress,\n        onStatus: (status) => setMessage(status.message),\n      });', 'upload status')
          s = s.replace('Upload and processing complete. Confirm your publishing rights, then publish when you\'re ready.', 'Upload and processing complete. Your video is ready to publish.')

          start = s.index('  async function publish() {')
          end = s.index('\n  function detailsPayload()', start)
          publish = '''  async function publish() {
    if (!videoId || !uploadComplete || !processingReady || !title.trim()) return;
    setBusy(true);
    setMessage(null);
    try {
      const result = await publishQuickVideo(videoId, {
        ...detailsPayload(),
        rightsConfirmed: true,
      });
      trackAnalyticsEvent("PUBLISH", {
        ...(identity ? { channelId: identity.channel.id } : {}),
        videoId,
        metadata: { scheduled: result.video.status === "SCHEDULED" },
      });
      setPublished(true);
      if (result.video.status === "SCHEDULED") {
        setMessage("Video scheduled. Opening your Studio content…");
        router.push("/studio/content");
        return;
      }
      setMessage("Published. Opening your video…");
      router.push(`/watch/${encodeURIComponent(result.video.slug)}`);
    } catch (error) {
      setMessage(error instanceof Error ? error.message : "The video could not be published.");
    } finally {
      setBusy(false);
    }
  }
'''
          s = s[:start] + publish + s[end:]

          start = s.index('            <div className={styles.publishDock}>')
          end = s.index('            </div>\n          </section>', start) + len('            </div>')
          dock = '''            <div className={styles.publishDock}>
              <p className={styles.publishConsent}>
                By publishing, you confirm that you own this video or have all rights and
                permissions required to publish it on AYIN.
              </p>
              <button
                className={styles.publish}
                type="button"
                disabled={!uploadComplete || !processingReady || !title.trim() || busy || published}
                onClick={() => void publish()}
              >
                <span>{published ? "Published" : busy && uploadComplete ? "Publishing…" : "Publish video"}</span>
                {!published ? <span aria-hidden="true">→</span> : null}
              </button>
            </div>'''
          s = s[:start] + dock + s[end:]
          p.write_text(s)

          p = Path('apps/web/src/components/upload/quick-upload.module.css')
          s = p.read_text()
          if '.publishConsent {' not in s:
              s += '''\n.publishConsent { color:var(--muted); font-size:.78rem; line-height:1.55; margin:0; max-width:52rem; }\n@media (max-width:640px) { .publishConsent { font-size:.74rem; } }\n'''
          p.write_text(s)

          # Watch page autoplay and viewport-aware width.
          p = Path('apps/web/src/app/(viewer)/watch/[slug]/page.tsx')
          s = p.read_text()
          s = replace_once(s, '      <AnalyticsAyinPlayer\n        captions={captions}', '      <AnalyticsAyinPlayer\n        autoPlay\n        className={styles.playerFrame}\n        captions={captions}', 'watch player props')
          p.write_text(s)
          p = Path('apps/web/src/app/(viewer)/watch/[slug]/page.module.css')
          s = p.read_text()
          if '.playerFrame {' not in s:
              insert = s.index('\n.details {')
              s = s[:insert] + '''\n\n.playerFrame {\n  justify-self: center;\n  width: min(100%, calc((100dvh - 10rem) * 16 / 9));\n}\n''' + s[insert:]
              s += '''\n@media (max-width:760px) { .playerFrame { width:100%; } }\n'''
          p.write_text(s)

          # Ad wrapper: attempt playback automatically; retain one gesture fallback only when blocked.
          p = Path('apps/web/src/components/player/ad-enabled-ayin-player.tsx')
          s = p.read_text()
          s = s.replace('  const [decision, setDecision] = useState<VideoAdDecision | null>(null);\n', '  const [decision, setDecision] = useState<VideoAdDecision | null>(null);\n  const [decisionLoaded, setDecisionLoaded] = useState(false);\n')
          s = s.replace('  const [activated, setActivated] = useState(false);\n', '  const [activated, setActivated] = useState(false);\n  const [autoplayBlocked, setAutoplayBlocked] = useState(false);\n')
          fs = s.index('  useEffect(() => {\n    const controller = new AbortController();')
          fe = s.index('\n  const handleAdContainerReady', fs)
          fetch_block = '''  useEffect(() => {
    const controller = new AbortController();
    void fetchVideoAdDecision(props.videoId, controller.signal)
      .then((result) => {
        if (controller.signal.aborted) return;
        setDecision(result.enabled ? result : null);
        setDecisionLoaded(true);
      })
      .catch(() => {
        if (!controller.signal.aborted) setDecisionLoaded(true);
      });
    return () => controller.abort();
  }, [props.videoId]);
'''
          s = s[:fs] + fetch_block + s[fe:]
          marker = '  const playAd = useCallback(\n'
          at = s.index(marker)
          helper = '''  const attemptContentPlayback = useCallback(async () => {
    if (!contentVideo) return false;
    try {
      await contentVideo.play();
      setAutoplayBlocked(false);
      return true;
    } catch {
      contentVideo.muted = true;
      try {
        await contentVideo.play();
        setAutoplayBlocked(false);
        return true;
      } catch {
        setAutoplayBlocked(true);
        return false;
      }
    }
  }, [contentVideo]);

'''
          s = s[:at] + helper + s[at:]
          s = s.replace('if (slot !== "POST_ROLL") void contentVideo.play().catch(() => undefined);', 'if (slot !== "POST_ROLL") void attemptContentPlayback();')
          s = s.replace('[adContainer, contentVideo, decision, emit],', '[adContainer, attemptContentPlayback, contentVideo, decision, emit],')
          astart = s.index('  async function activatePlayback() {')
          aend = s.index('\n  useEffect(() => {\n    if (!decision || !contentVideo || !activated)', astart)
          activate = '''  const activatePlayback = useCallback(async () => {
    if (!contentVideo || !adContainer) return;
    setActivated(true);
    setAutoplayBlocked(false);
    if (decision?.preRollEnabled) {
      const served = await playAd("PRE_ROLL");
      if (served) return;
    }
    await attemptContentPlayback();
  }, [adContainer, attemptContentPlayback, contentVideo, decision, playAd]);

  useEffect(() => {
    if (!decisionLoaded || !contentVideo || !adContainer || activated || props.autoPlay !== true) return;
    void activatePlayback();
  }, [activatePlayback, activated, adContainer, contentVideo, decisionLoaded, props.autoPlay]);
'''
          s = s[:astart] + activate + s[aend:]
          s = s.replace('        {...props}\n        adMode=', '        {...props}\n        autoPlay={false}\n        adMode=')
          gstart = s.index('      {adEligible && !activated ? (')
          gend = s.index('      ) : null}', gstart) + len('      ) : null}')
          gate = '''      {autoplayBlocked || (adEligible && !activated && props.autoPlay !== true) ? (
        <button
          aria-label="Play video"
          className={styles.start}
          data-tv-focusable="true"
          onClick={() => void activatePlayback()}
          type="button"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" /></svg>
          <span>{autoplayBlocked ? "Tap to play" : "Play video"}</span>
        </button>
      ) : null}'''
          s = s[:gstart] + gate + s[gend:]
          p.write_text(s)

          Path('apps/web/src/components/player/ad-enabled-ayin-player.module.css').write_text('''.wrap { position:relative; min-width:0; }\n.start { align-items:center; backdrop-filter:blur(18px) saturate(150%); background:rgb(8 5 18 / 78%); border:1px solid rgb(255 255 255 / 18%); border-radius:999px; box-shadow:0 18px 60px rgb(0 0 0 / 38%),0 0 36px rgb(139 24 248 / 18%); color:#fff; cursor:pointer; display:flex; gap:.65rem; left:50%; min-height:3.4rem; padding:.7rem 1.15rem; position:absolute; top:50%; transform:translate(-50%,-50%); z-index:20; }\n.start:hover { border-color:rgb(220 25 232 / 55%); transform:translate(-50%,-50%) scale(1.03); }\n.start svg { fill:currentColor; height:1.25rem; width:1.25rem; }\n.start span { font-size:.86rem; font-weight:820; white-space:nowrap; }\n.start:focus-visible { outline:3px solid var(--focus-ring); outline-offset:4px; }\n''')

          # Player interactions + modern icon control bar.
          p = Path('apps/web/src/components/player/ayin-player.tsx')
          s = p.read_text()
          s = s.replace('      <section className={styles.player} ref={rootRef} aria-label={`${title} player`}>', '      <section className={styles.player} data-playing={playing} ref={rootRef} aria-label={`${title} player`}>')
          s = replace_once(s, '          onKeyDown={onStageKeyDown}\n          tabIndex={0}', '''          onClick={(event) => {
            if (event.target instanceof HTMLElement && event.target.closest("button,input,select")) return;
            void togglePlay();
          }}
          onDoubleClick={() => void toggleFullscreen()}
          onKeyDown={onStageKeyDown}
          tabIndex={0}''', 'stage interactions')
          s = s.replace('            onTimeUpdate={(event) => {', '            onVolumeChange={(event) => {\n              setMuted(event.currentTarget.muted);\n              setVolume(event.currentTarget.volume);\n            }}\n            onTimeUpdate={(event) => {')
          s = s.replace('            preload="metadata"', '            preload={autoPlay ? "auto" : "metadata"}')
          s = replace_once(s, '          {error ? <div className={styles.error}>{error}</div> : null}\n        </div>', '''          {error ? <div className={styles.error}>{error}</div> : null}
          {!playing && !locked && !error ? (
            <button aria-label="Play video" className={styles.centerPlay} onClick={(event) => { event.stopPropagation(); void togglePlay(); }} type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" /></svg>
            </button>
          ) : null}
          {playing && muted && !locked ? (
            <button className={styles.unmuteHint} onClick={(event) => { event.stopPropagation(); toggleMute(); }} type="button">Tap to unmute</button>
          ) : null}
        </div>''', 'player overlays')
          cs = s.index('        <div className={styles.controls} aria-label="Playback controls">')
          ce = s.index('        {upNext ? (', cs)
          controls = '''        <div className={styles.controls} aria-label="Playback controls">
          <input aria-label="Seek video" className={styles.scrubber} data-tv-focusable="true" data-tv-focus-id={`player-seek-${videoId}`} disabled={locked} max={Math.max(durationMs, 1)} min={0} onChange={(event) => seekTo(Number(event.currentTarget.value))} type="range" value={Math.min(positionMs, Math.max(durationMs, 1))} />
          <div className={styles.controlRow}>
            <button aria-label={playing ? "Pause" : "Play"} className={styles.iconButton} disabled={locked} onClick={() => void togglePlay()} title={playing ? "Pause (K)" : "Play (K)"} type="button"><svg aria-hidden="true" viewBox="0 0 24 24">{playing ? <path d="M7 5h4v14H7zm6 0h4v14h-4z" /> : <path d="M8 5.5v13l10-6.5z" />}</svg></button>
            <button aria-label="Back 10 seconds" className={styles.iconButton} disabled={locked} onClick={() => seekBy(-10)} title="Back 10 seconds (J)" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7.2 7.2A7 7 0 1 1 5 12H2.8A9.2 9.2 0 1 0 5.5 5.5L3 3v6h6z"/><text x="8.1" y="15.3">10</text></svg></button>
            <button aria-label="Forward 10 seconds" className={styles.iconButton} disabled={locked} onClick={() => seekBy(10)} title="Forward 10 seconds (L)" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16.8 7.2A7 7 0 1 0 19 12h2.2A9.2 9.2 0 1 1 18.5 5.5L21 3v6h-6z"/><text x="8.1" y="15.3">10</text></svg></button>
            <button aria-label={muted ? "Unmute" : "Mute"} className={styles.iconButton} onClick={toggleMute} title={muted ? "Unmute (M)" : "Mute (M)"} type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/>{muted ? <path d="m16 9 4 6m0-6-4 6" /> : <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />}</svg></button>
            <input aria-label="Volume" className={styles.volume} max={1} min={0} onChange={(event) => { const next = Number(event.currentTarget.value); setVolume(next); if (videoRef.current) { videoRef.current.volume = next; if (next > 0) videoRef.current.muted = false; setMuted(videoRef.current.muted); } }} step={0.05} type="range" value={volume} />
            <span className={styles.time}>{formatTime(positionMs)} <i>/</i> {formatTime(durationMs)}</span>
            <span className={styles.controlSpacer} />
            <select aria-label="Playback speed" className={styles.compactSelect} onChange={(event) => { const next = Number(event.currentTarget.value); setRate(next); if (videoRef.current) videoRef.current.playbackRate = next; }} title="Playback speed" value={rate}>{[0.5, 0.75, 1, 1.25, 1.5, 2].map((value) => <option key={value} value={value}>{value}×</option>)}</select>
            {captions.length > 0 ? <button aria-label={captionsEnabled ? "Turn captions off" : "Turn captions on"} aria-pressed={captionsEnabled} className={`${styles.iconButton} ${captionsEnabled ? styles.activeControl : ""}`} onClick={toggleCaptions} title="Captions" type="button"><span className={styles.ccGlyph}>CC</span></button> : null}
            {chapters.length > 0 ? <select aria-label="Chapters" className={`${styles.compactSelect} ${styles.chapterSelect}`} onChange={(event) => seekTo(Number(event.currentTarget.value))} value={activeChapter?.startMs ?? chapters[0]?.startMs ?? 0}>{[...chapters].sort((a,b) => a.startMs-b.startMs).map((chapter) => <option key={chapter.id} value={chapter.startMs}>{chapter.title}</option>)}</select> : null}
            <button aria-label="Picture in picture" className={styles.iconButton} onClick={() => void togglePip()} title="Picture in picture" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M12.5 12.5h5V16h-5z"/></svg></button>
            <button aria-label="Fullscreen" className={styles.iconButton} onClick={() => void toggleFullscreen()} title="Fullscreen (F)" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 9V5h4M15 5h4v4M19 15v4h-4M9 19H5v-4"/></svg></button>
            {onNext ? <button aria-label={upNext ? `Next: ${upNext.title}` : "Next video"} className={styles.iconButton} onClick={() => { analytics.emit({ type: "next", videoId }); onNext(); }} title={upNext ? `Next · ${upNext.title}` : "Next"} type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 5 10 7L6 19zM18 5v14"/></svg></button> : null}
          </div>
        </div>
'''
          s = s[:cs] + controls + s[ce:]
          p.write_text(s)

          # Player presentation.
          Path('apps/web/src/components/player/ayin-player.module.css').write_text('''.player { background:#000; border:1px solid rgb(255 255 255 / 9%); border-radius:clamp(14px,2vw,24px); box-shadow:0 30px 90px rgb(0 0 0 / 42%),0 0 70px rgb(88 8 248 / 9%); display:grid; gap:0; overflow:hidden; position:relative; width:100%; }\n.stage { aspect-ratio:16/9; background:#000; outline:none; overflow:hidden; position:relative; }\n.stage:focus-visible { box-shadow:inset 0 0 0 3px var(--focus-ring); }\n.video { background:#000; cursor:pointer; display:block; height:100%; object-fit:contain; width:100%; }\n.titleBar { align-items:flex-start; background:linear-gradient(180deg,rgb(0 0 0 / 68%),transparent); display:flex; gap:.75rem; justify-content:space-between; left:0; padding:1rem 1.15rem 2.6rem; pointer-events:none; position:absolute; right:0; text-shadow:0 2px 8px #000; top:0; transition:opacity .2s ease; z-index:3; }\n.titleBar span { color:#ddd4e9; opacity:.78; }\n.player[data-playing="true"]:not(:hover):not(:focus-within) .titleBar { opacity:0; }\n.controls { background:linear-gradient(180deg,transparent,rgb(0 0 0 / 82%) 45%,rgb(0 0 0 / 94%)); bottom:0; display:grid; gap:.5rem; left:0; padding:3rem clamp(.7rem,2vw,1.15rem) .75rem; position:absolute; right:0; transition:opacity .22s ease,transform .22s ease; z-index:6; }\n.player[data-playing="true"]:not(:hover):not(:focus-within) .controls { opacity:0; pointer-events:none; transform:translateY(8px); }\n.scrubber { accent-color:var(--brand-magenta); cursor:pointer; height:1rem; margin:0; width:100%; }\n.controlRow { align-items:center; display:flex; gap:.32rem; min-width:0; }\n.iconButton { align-items:center; background:transparent; border:0; border-radius:999px; color:#fff; cursor:pointer; display:inline-flex; flex:0 0 auto; height:42px; justify-content:center; padding:0; transition:background .15s ease,transform .15s ease; width:42px; }\n.iconButton:hover:not(:disabled),.activeControl { background:rgb(255 255 255 / 14%); transform:scale(1.06); }\n.iconButton:focus-visible,.compactSelect:focus-visible,.volume:focus-visible,.scrubber:focus-visible,.centerPlay:focus-visible,.unmuteHint:focus-visible { outline:3px solid var(--focus-ring); outline-offset:2px; }\n.iconButton:disabled { opacity:.38; }\n.iconButton svg { fill:none; height:22px; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.75; width:22px; }\n.iconButton svg path:first-child:not(:only-child),.iconButton[aria-label="Play"] svg,.iconButton[aria-label="Pause"] svg { fill:currentColor; stroke:none; }\n.iconButton text { fill:currentColor; font-size:6px; font-weight:900; stroke:none; }\n.ccGlyph { font-size:.68rem; font-weight:950; letter-spacing:-.04em; }\n.time { color:rgb(255 255 255 / 82%); font-size:.76rem; font-variant-numeric:tabular-nums; margin-left:.2rem; white-space:nowrap; }\n.time i { opacity:.45; font-style:normal; }\n.controlSpacer { flex:1 1 auto; }\n.volume { accent-color:#fff; width:82px; }\n.compactSelect { appearance:none; background:rgb(255 255 255 / 9%); border:1px solid rgb(255 255 255 / 10%); border-radius:999px; color:#fff; cursor:pointer; font-size:.74rem; font-weight:760; min-height:34px; padding:.35rem .65rem; }\n.chapterSelect { max-width:11rem; }\n.centerPlay { align-items:center; backdrop-filter:blur(18px); background:rgb(8 5 18 / 70%); border:1px solid rgb(255 255 255 / 18%); border-radius:999px; box-shadow:0 18px 60px rgb(0 0 0 / 38%),0 0 32px rgb(139 24 248 / 18%); color:#fff; cursor:pointer; display:flex; height:72px; justify-content:center; left:50%; position:absolute; top:50%; transform:translate(-50%,-50%); width:72px; z-index:5; }\n.centerPlay:hover { transform:translate(-50%,-50%) scale(1.06); }\n.centerPlay svg { fill:currentColor; height:32px; margin-left:3px; width:32px; }\n.unmuteHint { backdrop-filter:blur(12px); background:rgb(0 0 0 / 62%); border:1px solid rgb(255 255 255 / 16%); border-radius:999px; bottom:5.3rem; color:#fff; cursor:pointer; font-size:.76rem; font-weight:800; left:1rem; padding:.5rem .75rem; position:absolute; z-index:7; }\n.adContainer { background:#000; display:none; inset:0; place-items:center; position:absolute; z-index:10; }\n.adActive { display:grid; }\n.adActive span { backdrop-filter:blur(10px); background:rgb(6 4 12 / 76%); border:1px solid var(--border-strong); border-radius:999px; color:#fff; left:1rem; padding:.4rem .65rem; position:absolute; top:1rem; }\n.upNext { align-items:baseline; background:rgb(5 4 11 / 96%); color:var(--muted-strong); display:flex; gap:.6rem; padding:.75rem .9rem; }\n.upNext span { background:var(--brand-gradient); background-clip:text; color:transparent; font-size:.7rem; font-weight:850; letter-spacing:.08em; text-transform:uppercase; }\n.upNext small { color:var(--muted); }\n.error { background:rgb(70 14 27 / 92%); border:1px solid rgb(255 96 117 / 36%); border-radius:12px; bottom:5rem; color:#fff; left:1rem; padding:.65rem .8rem; position:absolute; right:1rem; z-index:8; }\n@media (hover:none) { .player[data-playing="true"] .controls { opacity:1; pointer-events:auto; transform:none; } .player[data-playing="true"] .titleBar { opacity:1; } }\n@media (max-width:720px) { .player { border-radius:14px; } .controls { padding:2.5rem .55rem .45rem; } .iconButton { height:38px; width:38px; } .volume { display:none; } .time { font-size:.7rem; } .chapterSelect { display:none; } .compactSelect { min-height:32px; padding-inline:.5rem; } .centerPlay { height:58px; width:58px; } .centerPlay svg { height:26px; width:26px; } .titleBar { font-size:.8rem; padding:.7rem .75rem 2.2rem; } .unmuteHint { bottom:4.4rem; left:.65rem; } }\n@media (max-width:430px) { .controlRow { gap:.12rem; } .iconButton { height:36px; width:36px; } .time { margin-left:0; } .compactSelect { font-size:.68rem; } }\n''')
      - name: Format touched files
        run: pnpm exec prettier --write apps/web/src/components/upload/quick-upload.tsx apps/web/src/components/upload/quick-upload.module.css apps/web/src/app/'(viewer)'/watch/'[slug]'/page.tsx apps/web/src/app/'(viewer)'/watch/'[slug]'/page.module.css apps/web/src/components/player/ad-enabled-ayin-player.tsx apps/web/src/components/player/ad-enabled-ayin-player.module.css apps/web/src/components/player/ayin-player.tsx apps/web/src/components/player/ayin-player.module.css
      - name: Commit application changes
        run: |
          rm -f .github/workflows/patch-ux-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve upload completion and player experience"
          git push origin HEAD:fix/upload-reliability-publish-player
