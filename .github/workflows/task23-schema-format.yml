name: Task 23 schema and formatter
on:
  push:
    branches: [task-23-revenue-ledger]
    paths:
      - ".github/workflows/task23-schema-format.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-23-revenue-ledger
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('packages/db/prisma/schema.prisma')
          s=p.read_text()
          if 'enum EarningsEntryState {' not in s:
              s=s.replace('''enum PayoutStatus {''','''enum EarningsEntryState {\n  ESTIMATED\n  FINAL\n  ADJUSTMENT\n}\n\nenum PayoutStatus {''')
          old='''  type        EarningsEntryType\n  amount      Decimal           @db.Decimal(20, 6)\n  currency    String            @db.Char(3)\n  memo        String?           @db.VarChar(500)\n  occurredAt  DateTime          @default(now())\n  finalizedAt DateTime?\n  createdAt   DateTime          @default(now())'''
          new='''  type             EarningsEntryType\n  state            EarningsEntryState @default(ESTIMATED)\n  grossAmount      Decimal?          @db.Decimal(20, 6)\n  amount           Decimal           @db.Decimal(20, 6)\n  currency         String            @db.Char(3)\n  revenueShareBps  Int?\n  idempotencyKey   String?           @unique @db.VarChar(200)\n  adSource         String?           @db.VarChar(80)\n  periodStart      DateTime?\n  periodEnd        DateTime?\n  memo             String?           @db.VarChar(500)\n  occurredAt       DateTime          @default(now())\n  finalizedAt      DateTime?\n  createdAt        DateTime          @default(now())'''
          if old not in s and 'idempotencyKey   String?' not in s:
              raise SystemExit('EarningsLedgerEntry field anchor not found')
          s=s.replace(old,new)
          old_indexes='''  @@index([channelId, occurredAt])\n  @@index([contractId, occurredAt])\n  @@index([payoutId])\n  @@index([type, occurredAt])'''
          new_indexes='''  @@index([channelId, occurredAt])\n  @@index([channelId, state, occurredAt])\n  @@index([contractId, occurredAt])\n  @@index([payoutId])\n  @@index([type, occurredAt])\n  @@index([videoId, periodStart])\n  @@index([campaignId, periodStart])'''
          s=s.replace(old_indexes,new_indexes)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: complete Task 23 revenue schema and formatting"
          git push origin HEAD:task-23-revenue-ledger
