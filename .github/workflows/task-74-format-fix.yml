name: Task 74 format repair

on:
  push:
    branches:
      - task-74-live-playback-hardening
    paths:
      - ".github/workflows/task-74-format-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-74-live-playback-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
          package-manager-cache: true
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 74 files
        run: |
          pnpm exec prettier --write \
            apps/web/src/lib/adaptive-playback.ts \
            apps/web/src/lib/adaptive-playback.test.ts \
            apps/web/src/lib/live-playback.ts \
            apps/web/src/lib/live-playback.test.ts \
            apps/web/src/components/player/live-ayin-player.tsx \
            apps/web/src/components/player/live-ayin-player.module.css \
            "apps/web/src/app/(viewer)/live/[slug]/live-watch-client.tsx" \
            apps/web/src/lib/analytics.ts \
            apps/api/src/analytics/analytics.schemas.ts \
            apps/api/src/analytics/analytics.schemas.test.ts \
            tests/e2e/live-playback.acceptance.spec.ts \
            docs/LIVE_STREAMING.md
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web apps/api/src/analytics tests/e2e docs/LIVE_STREAMING.md
          git commit -m "style(task-74): apply repository formatting"
          git push origin HEAD:task-74-live-playback-hardening
