name: Task 33 workflow fix
on:
  push:
    branches: [task-33-recommendations-lens]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-33-recommendations-lens
      - name: Fix formatter command
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/task33-finish.yml')
          s=p.read_text()
          old="pnpm exec prettier --write packages/db/prisma/schema.prisma apps/api/src/app.module.ts"
          new="pnpm --filter @ayin/db exec prisma format\n          pnpm exec prettier --write apps/api/src/app.module.ts"
          if old not in s:
            raise SystemExit('formatter anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/task33-finish.yml
          git commit -m "Task 33: use Prisma formatter for schema"
          git push origin HEAD:task-33-recommendations-lens
