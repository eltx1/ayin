name: Temporary Task 15 cycle fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/task15-cycle-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Break the CommentsService limiter import cycle
        run: |
          python - <<'PY'
          from pathlib import Path

          errors = Path('apps/api/src/comments/comments.errors.ts')
          errors.write_text('''export class CommentsError extends Error {\n  constructor(\n    readonly code: string,\n    message: string,\n    readonly statusCode = 400,\n  ) {\n    super(message);\n    this.name = "CommentsError";\n  }\n}\n''')

          service = Path('apps/api/src/comments/comments.service.ts')
          text = service.read_text()
          class_block = '''export class CommentsError extends Error {\n  constructor(\n    readonly code: string,\n    message: string,\n    readonly statusCode = 400,\n  ) {\n    super(message);\n    this.name = "CommentsError";\n  }\n}\n\n'''
          if class_block not in text:
              raise SystemExit('CommentsError block not found in service')
          text = text.replace(class_block, '', 1)
          anchor = 'import { CommentRateLimiter } from "./comment-rate-limiter.js";\n'
          if anchor not in text:
              raise SystemExit('service import anchor not found')
          text = text.replace(anchor, anchor + 'import { CommentsError } from "./comments.errors.js";\n', 1)
          service.write_text(text)

          limiter = Path('apps/api/src/comments/comment-rate-limiter.ts')
          text = limiter.read_text().replace(
              'import { CommentsError } from "./comments.service.js";',
              'import { CommentsError } from "./comments.errors.js";',
          )
          limiter.write_text(text)

          controller = Path('apps/api/src/comments/comments.controller.ts')
          text = controller.read_text()
          old = 'import { CommentsError, CommentsService } from "./comments.service.js";'
          new = 'import { CommentsError } from "./comments.errors.js";\nimport { CommentsService } from "./comments.service.js";'
          if old not in text:
              raise SystemExit('controller import anchor not found')
          controller.write_text(text.replace(old, new, 1))
          PY
          rm -f TASK15_INTEGRATION_DIAGNOSTIC.txt TASK15_INTEGRATION_DIAGNOSTIC_2.txt
          rm -f .github/workflows/task15-integration-diagnostic.yml .github/workflows/task15-cycle-fix.yml
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: break Task 15 comments dependency cycle"
          git push origin HEAD:main
