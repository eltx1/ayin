name: Diagnose AYIN Cloudflare security

on:
  push:
    paths:
      - .github/workflows/diagnose-cloudflare-security.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CF_TOKEN: ${{ secrets.AYIN_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect AYIN-only Cloudflare challenge sources
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CF_TOKEN"
          zone_resp="$(curl --fail --silent --show-error -H "$auth" "$api/zones?name=ayin.stream&status=active")"
          zone_id="$(jq -r '.result[] | select(.name=="ayin.stream") | .id' <<<"$zone_resp")"
          test -n "$zone_id"

          echo '=== zone security settings ==='
          for setting in security_level browser_check challenge_ttl; do
            resp="$(curl --fail --silent --show-error -H "$auth" "$api/zones/$zone_id/settings/$setting" || true)"
            if [[ -n "$resp" ]]; then
              jq -c --arg s "$setting" '{setting:$s,success:.success,value:(.result.value // null),errors:.errors}' <<<"$resp" || true
            fi
          done

          echo '=== bot management ==='
          bot_file="$(mktemp)"
          bot_http="$(curl --silent --show-error -H "$auth" -o "$bot_file" -w '%{http_code}' "$api/zones/$zone_id/bot_management" || true)"
          echo "bot_management_http=$bot_http"
          if jq -e . "$bot_file" >/dev/null 2>&1; then
            jq -c '{success,result,errors,messages}' "$bot_file"
          fi
          rm -f "$bot_file"

          echo '=== zone rulesets summary ==='
          rules_file="$(mktemp)"
          rules_http="$(curl --silent --show-error -H "$auth" -o "$rules_file" -w '%{http_code}' "$api/zones/$zone_id/rulesets" || true)"
          echo "rulesets_http=$rules_http"
          if [[ "$rules_http" == "200" ]] && jq -e . "$rules_file" >/dev/null 2>&1; then
            jq -c '.result[]? | {id,name,kind,phase}' "$rules_file" || true
          elif jq -e . "$rules_file" >/dev/null 2>&1; then
            jq -c '{success,errors,messages}' "$rules_file" || true
          fi
          rm -f "$rules_file"
