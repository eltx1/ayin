name: One-shot launch hardening React effect fixes

on:
  push:
    branches:
      - launch-hardening-20260902
    paths:
      - ".github/workflows/fix-launch-hardening-react-effects.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: launch-hardening-20260902
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix React effect synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} match(es), found {actual}")
              p.write_text(text.replace(old, new, count))

          replace(
              "apps/web/src/components/admin/admin-advertising-control.tsx",
              '''  useEffect(() => {\n    void load();\n  }, [load]);''',
              '''  useEffect(() => {\n    const timer = window.setTimeout(() => void load(), 0);\n    return () => window.clearTimeout(timer);\n  }, [load]);''',
          )
          replace(
              "apps/web/src/components/admin/admin-advertising-control.tsx",
              '''  useEffect(() => setDraft(draftFromCampaign(campaign)), [campaign]);''',
              '''  useEffect(() => {\n    const timer = window.setTimeout(() => setDraft(draftFromCampaign(campaign)), 0);\n    return () => window.clearTimeout(timer);\n  }, [campaign]);''',
          )
          replace(
              "apps/web/src/components/admin/admin-advertising-control.tsx",
              '''  useEffect(\n    () =>\n      setDraft({\n        name: creative.name,\n        type: creative.type,\n        status: creative.status,\n        destinationUrl: creative.destinationUrl,\n        vastTagUrl: creative.vastTagUrl,\n        headline: creative.headline,\n        body: creative.body,\n        direct: {\n          assetUrl: creative.direct?.assetUrl ?? null,\n          width: creative.direct?.width ?? null,\n          height: creative.direct?.height ?? null,\n          approvedReference: creative.direct?.approvedReference ?? null,\n        },\n      }),\n    [creative],\n  );''',
              '''  useEffect(() => {\n    const timer = window.setTimeout(\n      () =>\n        setDraft({\n          name: creative.name,\n          type: creative.type,\n          status: creative.status,\n          destinationUrl: creative.destinationUrl,\n          vastTagUrl: creative.vastTagUrl,\n          headline: creative.headline,\n          body: creative.body,\n          direct: {\n            assetUrl: creative.direct?.assetUrl ?? null,\n            width: creative.direct?.width ?? null,\n            height: creative.direct?.height ?? null,\n            approvedReference: creative.direct?.approvedReference ?? null,\n          },\n        }),\n      0,\n    );\n    return () => window.clearTimeout(timer);\n  }, [creative]);''',
          )

          replace(
              "apps/web/src/components/admin/admin-content-library.tsx",
              '''  useEffect(() => {\n    let active = true;\n    void load().catch((caught) => {\n      if (active)\n        setError(caught instanceof Error ? caught.message : "Content library could not be loaded.");\n    });\n    return () => {\n      active = false;\n    };\n  }, [load]);''',
              '''  useEffect(() => {\n    let active = true;\n    const timer = window.setTimeout(() => {\n      void load().catch((caught) => {\n        if (active)\n          setError(caught instanceof Error ? caught.message : "Content library could not be loaded.");\n      });\n    }, 0);\n    return () => {\n      active = false;\n      window.clearTimeout(timer);\n    };\n  }, [load]);''',
          )
          replace(
              "apps/web/src/components/admin/admin-content-library.tsx",
              '''  useEffect(() => {\n    if (requestedChannelId) setChannelId(requestedChannelId);\n  }, [requestedChannelId]);''',
              '''  useEffect(() => {\n    if (!requestedChannelId) return;\n    const timer = window.setTimeout(() => setChannelId(requestedChannelId), 0);\n    return () => window.clearTimeout(timer);\n  }, [requestedChannelId]);''',
          )

          replace(
              "apps/web/src/components/admin/admin-revenue-control-center.tsx",
              '''  useEffect(() => {\n    void load();\n  }, [load]);''',
              '''  useEffect(() => {\n    const timer = window.setTimeout(() => void load(), 0);\n    return () => window.clearTimeout(timer);\n  }, [load]);''',
          )

          replace(
              "apps/web/src/components/admin/admin-trust-safety.tsx",
              '''  useEffect(() => {\n    let active = true;\n    void load().catch((caught) => {\n      if (active)\n        setError(caught instanceof Error ? caught.message : "Trust & Safety could not be loaded.");\n    });\n    return () => {\n      active = false;\n    };\n  }, [load]);''',
              '''  useEffect(() => {\n    let active = true;\n    const timer = window.setTimeout(() => {\n      void load().catch((caught) => {\n        if (active)\n          setError(caught instanceof Error ? caught.message : "Trust & Safety could not be loaded.");\n      });\n    }, 0);\n    return () => {\n      active = false;\n      window.clearTimeout(timer);\n    };\n  }, [load]);''',
          )

          replace(
              "apps/web/src/components/admin/admin-video-ads.tsx",
              '''  useEffect(() => {\n    let active = true;\n    void load().catch((error) => {\n      if (active) {\n        setMessage(\n          error instanceof Error\n            ? error.message\n            : "Video advertising controls could not be loaded.",\n        );\n      }\n    });\n    return () => {\n      active = false;\n    };\n  }, [load]);''',
              '''  useEffect(() => {\n    let active = true;\n    const timer = window.setTimeout(() => {\n      void load().catch((error) => {\n        if (active) {\n          setMessage(\n            error instanceof Error\n              ? error.message\n              : "Video advertising controls could not be loaded.",\n          );\n        }\n      });\n    }, 0);\n    return () => {\n      active = false;\n      window.clearTimeout(timer);\n    };\n  }, [load]);''',
          )
          replace(
              "apps/web/src/components/admin/admin-video-ads.tsx",
              '''  useEffect(() => setDraft(draftFrom(row)), [row]);''',
              '''  useEffect(() => {\n    const timer = window.setTimeout(() => setDraft(draftFrom(row)), 0);\n    return () => window.clearTimeout(timer);\n  }, [row]);''',
          )
          PY

          pnpm exec prettier --write \
            apps/web/src/components/admin/admin-advertising-control.tsx \
            apps/web/src/components/admin/admin-content-library.tsx \
            apps/web/src/components/admin/admin-revenue-control-center.tsx \
            apps/web/src/components/admin/admin-trust-safety.tsx \
            apps/web/src/components/admin/admin-video-ads.tsx
          rm .github/workflows/fix-launch-hardening-react-effects.yml
      - name: Commit fixes and remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/components/admin/admin-advertising-control.tsx \
            apps/web/src/components/admin/admin-content-library.tsx \
            apps/web/src/components/admin/admin-revenue-control-center.tsx \
            apps/web/src/components/admin/admin-trust-safety.tsx \
            apps/web/src/components/admin/admin-video-ads.tsx \
            .github/workflows/fix-launch-hardening-react-effects.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix React effect lint violations in Admin"
          git push origin HEAD:launch-hardening-20260902
