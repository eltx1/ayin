name: Apply UX reliability fixes

on:
  push:
    branches:
      - fix/upload-reliability-publish-player

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ux-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/upload-reliability-publish-player
      - name: Apply upload, publish and player UX fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing expected block: {label}")
              return text.replace(old, new, 1)

          # Upload UX: status-aware retries, implicit rights confirmation and post-publish navigation.
          path = Path("apps/web/src/components/upload/quick-upload.tsx")
          text = path.read_text()
          text = replace_once(
              text,
              'import { useEffect, useRef, useState, type DragEvent } from "react";\n',
              'import { useEffect, useRef, useState, type DragEvent } from "react";\nimport { useRouter } from "next/navigation";\n',
              "quick upload router import",
          )
          text = replace_once(
              text,
              'export function QuickUpload() {\n  const [identity, setIdentity] = useState<AyinIdentity | null>(null);',
              'export function QuickUpload() {\n  const router = useRouter();\n  const [identity, setIdentity] = useState<AyinIdentity | null>(null);',
              "router instance",
          )
          text = text.replace('  const [rightsConfirmed, setRightsConfirmed] = useState(false);\n', '')
          text = text.replace('    setRightsConfirmed(false);\n', '')
          text = replace_once(
              text,
              '        onProgress: setProgress,\n      });',
              '        onProgress: setProgress,\n        onStatus: (status) => setMessage(status.message),\n      });',
              "upload status callback",
          )
          text = text.replace(
              '          ? "Upload and processing complete. Confirm your publishing rights, then publish when you\'re ready."',
              '          ? "Upload and processing complete. Your video is ready to publish."',
          )
          old_publish = '''  async function publish() {
    if (!videoId || !uploadComplete || !processingReady || !rightsConfirmed || !title.trim())
      return;
    setBusy(true);
    setMessage(null);
    try {
      const result = await publishQuickVideo(videoId, {
        ...detailsPayload(),
        rightsConfirmed,
      });
      trackAnalyticsEvent("PUBLISH", {
        ...(identity ? { channelId: identity.channel.id } : {}),
        videoId,
        metadata: { scheduled: result.video.status === "SCHEDULED" },
      });
      setPublished(true);
      setMessage(
        result.video.status === "SCHEDULED"
          ? "Video scheduled. You can edit its details later."
          : "Published. Your video is now available on your channel.",
      );
    } catch (error) {
      setMessage(error instanceof Error ? error.message : "The video could not be published.");
    } finally {
      setBusy(false);
    }
  }
'''
          new_publish = '''  async function publish() {
    if (!videoId || !uploadComplete || !processingReady || !title.trim()) return;
    setBusy(true);
    setMessage(null);
    try {
      const result = await publishQuickVideo(videoId, {
        ...detailsPayload(),
        rightsConfirmed: true,
      });
      trackAnalyticsEvent("PUBLISH", {
        ...(identity ? { channelId: identity.channel.id } : {}),
        videoId,
        metadata: { scheduled: result.video.status === "SCHEDULED" },
      });
      setPublished(true);
      if (result.video.status === "SCHEDULED") {
        setMessage("Video scheduled. Opening your Studio content…");
        router.push("/studio/content");
        return;
      }
      setMessage("Published. Opening your video…");
      router.push(`/watch/${encodeURIComponent(result.video.slug)}`);
    } catch (error) {
      setMessage(error instanceof Error ? error.message : "The video could not be published.");
    } finally {
      setBusy(false);
    }
  }
'''
          text = replace_once(text, old_publish, new_publish, "publish flow")
          rights_start = text.index('            <div className={styles.publishDock}>')
          rights_end = text.index('            </div>\n          </section>', rights_start)
          old_dock = text[rights_start:rights_end + len('            </div>')]
          new_dock = '''            <div className={styles.publishDock}>
              <p className={styles.publishConsent}>
                By publishing, you confirm that you own this video or have all rights and
                permissions required to publish it on AYIN.
              </p>

              <button
                className={styles.publish}
                type="button"
                disabled={
                  !uploadComplete || !processingReady || !title.trim() || busy || published
                }
                onClick={() => void publish()}
              >
                <span>
                  {published
                    ? "Published"
                    : busy && uploadComplete
                      ? "Publishing…"
                      : "Publish video"}
                </span>
                {!published ? <span aria-hidden="true">→</span> : null}
              </button>
            </div>'''
          text = text[:rights_start] + new_dock + text[rights_end + len('            </div>'):]
          path.write_text(text)

          css_path = Path("apps/web/src/components/upload/quick-upload.module.css")
          css = css_path.read_text()
          css += '''\n.publishConsent {\n  color: var(--muted);\n  font-size: 0.78rem;\n  line-height: 1.55;\n  margin: 0;\n  max-width: 52rem;\n}\n\n@media (max-width: 640px) {\n  .publishConsent {\n    font-size: 0.74rem;\n  }\n}\n'''
          css_path.write_text(css)

          # Watch page: request autoplay and constrain the stage to the viewport.
          watch = Path("apps/web/src/app/(viewer)/watch/[slug]/page.tsx")
          text = watch.read_text()
          text = replace_once(
              text,
              '      <AnalyticsAyinPlayer\n        captions={captions}',
              '      <AnalyticsAyinPlayer\n        autoPlay\n        className={styles.playerFrame}\n        captions={captions}',
              "watch autoplay",
          )
          watch.write_text(text)

          watch_css = Path("apps/web/src/app/(viewer)/watch/[slug]/page.module.css")
          text = watch_css.read_text()
          text = replace_once(
              text,
              '}\n\n.details {',
              '''}\n\n.playerFrame {\n  justify-self: center;\n  width: min(100%, calc((100dvh - 10rem) * 16 / 9));\n}\n\n.details {''',
              "watch player sizing",
          )
          text += '''\n@media (max-width: 760px) {\n  .playerFrame {\n    width: 100%;\n  }\n}\n'''
          watch_css.write_text(text)

          # Ad wrapper: autoplay when policy permits; only show a gesture fallback if the browser blocks it.
          ad = Path("apps/web/src/components/player/ad-enabled-ayin-player.tsx")
          text = ad.read_text()
          text = text.replace(
              '  const [decision, setDecision] = useState<VideoAdDecision | null>(null);\n',
              '  const [decision, setDecision] = useState<VideoAdDecision | null>(null);\n  const [decisionLoaded, setDecisionLoaded] = useState(false);\n',
          )
          text = text.replace(
              '  const [activated, setActivated] = useState(false);\n',
              '  const [activated, setActivated] = useState(false);\n  const [autoplayBlocked, setAutoplayBlocked] = useState(false);\n',
          )
          old_fetch = '''    void fetchVideoAdDecision(props.videoId, controller.signal).then((result) => {
      if (!controller.signal.aborted && result.enabled) setDecision(result);
    });'''
          new_fetch = '''    void fetchVideoAdDecision(props.videoId, controller.signal)
      .then((result) => {
        if (controller.signal.aborted) return;
        setDecision(result.enabled ? result : null);
        setDecisionLoaded(true);
      })
      .catch(() => {
        if (!controller.signal.aborted) setDecisionLoaded(true);
      });'''
          text = replace_once(text, old_fetch, new_fetch, "ad decision load")

          marker = '  const playAd = useCallback(\n'
          idx = text.index(marker)
          helper = '''  const attemptContentPlayback = useCallback(async () => {
    if (!contentVideo) return false;
    try {
      await contentVideo.play();
      setAutoplayBlocked(false);
      return true;
    } catch {
      contentVideo.muted = true;
      try {
        await contentVideo.play();
        setAutoplayBlocked(false);
        return true;
      } catch {
        setAutoplayBlocked(true);
        return false;
      }
    }
  }, [contentVideo]);

'''
          text = text[:idx] + helper + text[idx:]
          text = text.replace(
              '            if (slot !== "POST_ROLL") void contentVideo.play().catch(() => undefined);',
              '            if (slot !== "POST_ROLL") void attemptContentPlayback();',
          )
          text = text.replace(
              '        if (slot !== "POST_ROLL") void contentVideo.play().catch(() => undefined);',
              '        if (slot !== "POST_ROLL") void attemptContentPlayback();',
          )
          text = text.replace(
              '    [adContainer, contentVideo, decision, emit],',
              '    [adContainer, attemptContentPlayback, contentVideo, decision, emit],',
          )
          old_activate = '''  async function activatePlayback() {
    if (!contentVideo || !adContainer) return;
    setActivated(true);
    if (decision?.preRollEnabled) {
      const served = await playAd("PRE_ROLL");
      if (served) return;
    }
    void contentVideo.play().catch(() => undefined);
  }
'''
          new_activate = '''  const activatePlayback = useCallback(async () => {
    if (!contentVideo || !adContainer) return;
    setActivated(true);
    setAutoplayBlocked(false);
    if (decision?.preRollEnabled) {
      const served = await playAd("PRE_ROLL");
      if (served) return;
    }
    await attemptContentPlayback();
  }, [adContainer, attemptContentPlayback, contentVideo, decision, playAd]);

  useEffect(() => {
    if (!decisionLoaded || !contentVideo || !adContainer || activated || props.autoPlay !== true) return;
    void activatePlayback();
  }, [activatePlayback, activated, adContainer, contentVideo, decisionLoaded, props.autoPlay]);
'''
          text = replace_once(text, old_activate, new_activate, "autoplay activation")
          text = text.replace(
              '        {...props}\n        adMode=',
              '        {...props}\n        autoPlay={false}\n        adMode=',
          )
          old_gate = '''      {adEligible && !activated ? (
        <button
          className={styles.start}
          data-tv-focusable="true"
          onClick={() => void activatePlayback()}
        >
          Start playback
        </button>
      ) : null}'''
          new_gate = '''      {(autoplayBlocked || (adEligible && !activated && props.autoPlay !== true)) ? (
        <button
          aria-label="Play video"
          className={styles.start}
          data-tv-focusable="true"
          onClick={() => void activatePlayback()}
          type="button"
        >
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 5.5v13l10-6.5z" />
          </svg>
          <span>{autoplayBlocked ? "Tap to play" : "Play video"}</span>
        </button>
      ) : null}'''
          text = replace_once(text, old_gate, new_gate, "ad start gate")
          ad.write_text(text)

          # Player: click/double-click video controls and replace text buttons with compact icon controls.
          player = Path("apps/web/src/components/player/ayin-player.tsx")
          text = player.read_text()
          text = text.replace(
              '      <section className={styles.player} ref={rootRef} aria-label={`${title} player`}>',
              '      <section className={styles.player} data-playing={playing} ref={rootRef} aria-label={`${title} player`}>',
          )
          text = replace_once(
              text,
              '          onKeyDown={onStageKeyDown}\n          tabIndex={0}',
              '''          onClick={(event) => {
            if (event.target instanceof HTMLElement && event.target.closest("button,input,select")) return;
            void togglePlay();
          }}
          onDoubleClick={() => void toggleFullscreen()}
          onKeyDown={onStageKeyDown}
          tabIndex={0}''',
              "player stage interactions",
          )
          text = text.replace(
              '            onTimeUpdate={(event) => {',
              '            onVolumeChange={(event) => {\n              setMuted(event.currentTarget.muted);\n              setVolume(event.currentTarget.volume);\n            }}\n            onTimeUpdate={(event) => {',
          )
          text = text.replace('            preload="metadata"', '            preload={autoPlay ? "auto" : "metadata"}')
          text = replace_once(
              text,
              '          {error ? <div className={styles.error}>{error}</div> : null}\n        </div>',
              '''          {error ? <div className={styles.error}>{error}</div> : null}
          {!playing && !locked && !error ? (
            <button
              aria-label="Play video"
              className={styles.centerPlay}
              onClick={(event) => {
                event.stopPropagation();
                void togglePlay();
              }}
              type="button"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" /></svg>
            </button>
          ) : null}
          {playing && muted && !locked ? (
            <button
              className={styles.unmuteHint}
              onClick={(event) => {
                event.stopPropagation();
                toggleMute();
              }}
              type="button"
            >
              Tap to unmute
            </button>
          ) : null}
        </div>''',
              "player overlays",
          )

          start = text.index('        <div className={styles.controls} aria-label="Playback controls">')
          end = text.index('        {upNext ? (', start)
          new_controls = '''        <div className={styles.controls} aria-label="Playback controls">
          <input
            aria-label="Seek video"
            className={styles.scrubber}
            data-tv-focusable="true"
            data-tv-focus-id={`player-seek-${videoId}`}
            disabled={locked}
            max={Math.max(durationMs, 1)}
            min={0}
            onChange={(event) => seekTo(Number(event.currentTarget.value))}
            type="range"
            value={Math.min(positionMs, Math.max(durationMs, 1))}
          />
          <div className={styles.controlRow}>
            <button aria-label={playing ? "Pause" : "Play"} className={styles.iconButton} data-tv-focusable="true" data-tv-focus-id={`player-play-${videoId}`} disabled={locked} onClick={() => void togglePlay()} title={playing ? "Pause (K)" : "Play (K)"} type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24">{playing ? <path d="M7 5h4v14H7zm6 0h4v14h-4z" /> : <path d="M8 5.5v13l10-6.5z" />}</svg>
            </button>
            <button aria-label="Back 10 seconds" className={styles.iconButton} data-tv-focusable="true" data-tv-focus-id={`player-back-${videoId}`} disabled={locked} onClick={() => seekBy(-10)} title="Back 10 seconds (J)" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7.2 7.2A7 7 0 1 1 5 12H2.8A9.2 9.2 0 1 0 5.5 5.5L3 3v6h6z"/><text x="8.1" y="15.3">10</text></svg>
            </button>
            <button aria-label="Forward 10 seconds" className={styles.iconButton} data-tv-focusable="true" data-tv-focus-id={`player-forward-${videoId}`} disabled={locked} onClick={() => seekBy(10)} title="Forward 10 seconds (L)" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16.8 7.2A7 7 0 1 0 19 12h2.2A9.2 9.2 0 1 1 18.5 5.5L21 3v6h-6z"/><text x="8.1" y="15.3">10</text></svg>
            </button>
            <button aria-label={muted ? "Unmute" : "Mute"} className={styles.iconButton} data-tv-focusable="true" data-tv-focus-id={`player-mute-${videoId}`} onClick={toggleMute} title={muted ? "Unmute (M)" : "Mute (M)"} type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/>{muted ? <path d="m16 9 4 6m0-6-4 6" /> : <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />}</svg>
            </button>
            <input aria-label="Volume" className={styles.volume} data-tv-focusable="true" data-tv-focus-id={`player-volume-${videoId}`} max={1} min={0} onChange={(event) => { const next = Number(event.currentTarget.value); setVolume(next); if (videoRef.current) { videoRef.current.volume = next; if (next > 0) videoRef.current.muted = false; setMuted(videoRef.current.muted); } }} step={0.05} type="range" value={volume} />
            <span className={styles.time}>{formatTime(positionMs)} <i>/</i> {formatTime(durationMs)}</span>
            <span className={styles.controlSpacer} />
            <select aria-label="Playback speed" className={styles.compactSelect} data-tv-focusable="true" data-tv-focus-id={`player-speed-${videoId}`} onChange={(event) => { const next = Number(event.currentTarget.value); setRate(next); if (videoRef.current) videoRef.current.playbackRate = next; }} title="Playback speed" value={rate}>
              {[0.5, 0.75, 1, 1.25, 1.5, 2].map((value) => <option key={value} value={value}>{value}×</option>)}
            </select>
            {captions.length > 0 ? <button aria-label={captionsEnabled ? "Turn captions off" : "Turn captions on"} aria-pressed={captionsEnabled} className={`${styles.iconButton} ${captionsEnabled ? styles.activeControl : ""}`} data-tv-focusable="true" data-tv-focus-id={`player-cc-${videoId}`} onClick={toggleCaptions} title="Captions" type="button"><span className={styles.ccGlyph}>CC</span></button> : null}
            {chapters.length > 0 ? <select aria-label="Chapters" className={`${styles.compactSelect} ${styles.chapterSelect}`} data-tv-focusable="true" data-tv-focus-id={`player-chapters-${videoId}`} onChange={(event) => seekTo(Number(event.currentTarget.value))} value={activeChapter?.startMs ?? chapters[0]?.startMs ?? 0}>{[...chapters].sort((a,b) => a.startMs-b.startMs).map((chapter) => <option key={chapter.id} value={chapter.startMs}>{chapter.title}</option>)}</select> : null}
            <button aria-label="Picture in picture" className={styles.iconButton} data-tv-focusable="true" data-tv-focus-id={`player-pip-${videoId}`} onClick={() => void togglePip()} title="Picture in picture" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M12.5 12.5h5V16h-5z"/></svg></button>
            <button aria-label="Fullscreen" className={styles.iconButton} data-tv-focusable="true" data-tv-focus-id={`player-fullscreen-${videoId}`} onClick={() => void toggleFullscreen()} title="Fullscreen (F)" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 9V5h4M15 5h4v4M19 15v4h-4M9 19H5v-4"/></svg></button>
            {onNext ? <button aria-label={upNext ? `Next: ${upNext.title}` : "Next video"} className={styles.iconButton} data-tv-focusable="true" data-tv-focus-id={`player-next-${videoId}`} onClick={() => { analytics.emit({ type: "next", videoId }); onNext(); }} title={upNext ? `Next · ${upNext.title}` : "Next"} type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 5 10 7L6 19zM18 5v14"/></svg></button> : null}
          </div>
        </div>
'''
          text = text[:start] + new_controls + text[end:]
          player.write_text(text)

          # Ad fallback overlay becomes a compact modern play affordance.
          ad_css = Path("apps/web/src/components/player/ad-enabled-ayin-player.module.css")
          ad_css.write_text('''.wrap { position: relative; min-width: 0; }\n.start { align-items:center; backdrop-filter:blur(18px) saturate(150%); background:rgb(8 5 18 / 78%); border:1px solid rgb(255 255 255 / 18%); border-radius:999px; box-shadow:0 18px 60px rgb(0 0 0 / 38%),0 0 36px rgb(139 24 248 / 18%); color:#fff; cursor:pointer; display:flex; gap:.65rem; left:50%; min-height:3.4rem; padding:.7rem 1.15rem; position:absolute; top:50%; transform:translate(-50%,-50%); z-index:20; }\n.start:hover { border-color:rgb(220 25 232 / 55%); transform:translate(-50%,-50%) scale(1.03); }\n.start svg { fill:currentColor; height:1.25rem; width:1.25rem; }\n.start span { font-size:.86rem; font-weight:820; white-space:nowrap; }\n.start:focus-visible { outline:3px solid var(--focus-ring); outline-offset:4px; }\n''')

      - name: Format changed files
        run: pnpm exec prettier --write apps/web/src/components/upload/quick-upload.tsx apps/web/src/components/upload/quick-upload.module.css apps/web/src/app/'(viewer)'/watch/'[slug]'/page.tsx apps/web/src/app/'(viewer)'/watch/'[slug]'/page.module.css apps/web/src/components/player/ad-enabled-ayin-player.tsx apps/web/src/components/player/ad-enabled-ayin-player.module.css apps/web/src/components/player/ayin-player.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src
          git commit -m "[ux-patch] Improve upload completion and playback UX"
          git push origin HEAD:fix/upload-reliability-publish-player
