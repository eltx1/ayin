name: Bounded V2 upload acceptance
on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "tests/recovery/**"
      - "playwright.recovery.config.ts"
      - ".github/workflows/upload-recovery-v2.yml"
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ayin_e2e
          POSTGRES_USER: ayin
          POSTGRES_PASSWORD: ayin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ayin -d ayin_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_e2e?schema=public
      TEST_DATABASE_URL: postgresql://ayin:ayin@127.0.0.1:5432/ayin_e2e?schema=public
      AUTH_TOKEN_SECRET: v2-ci-synthetic-auth-secret-more-than-32-characters
      UPLOAD_SESSION_SECRET: v2-ci-synthetic-upload-secret-more-than-32-characters
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_MEDIA_BASE_URL: http://media.invalid
      WEB_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm --filter @ayin/api exec vitest run --testTimeout=30000 test/finite-media-cleanup-v2.integration.test.ts
      - name: Real browser offline and multipart transfer with synthetic provider
        env:
          AYIN_RECOVERY_TEST_V2: "1"
          AYIN_LAB_DIRECT_TRANSFER: "1"
        run: pnpm test:e2e:recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-v2-upload-evidence
          path: test-results-recovery
          if-no-files-found: ignore
          retention-days: 7
