name: Task 42 formatter

on:
  push:
    branches:
      - task-42-adaptive-rollout

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-42-adaptive-rollout
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Task 42 files
        run: pnpm exec prettier --write apps/api/src/admin/admin-media-processing.controller.ts apps/api/src/media/media-adaptive-rollout.service.ts apps/api/src/media/media-adaptive-rollout.ts apps/api/src/media/media-hls-settings.service.test.ts docs/TASK42_ADAPTIVE_ROLLOUT.md tests/e2e/adaptive-rollout.acceptance.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/admin/admin-media-processing.controller.ts apps/api/src/media/media-adaptive-rollout.service.ts apps/api/src/media/media-adaptive-rollout.ts apps/api/src/media/media-hls-settings.service.test.ts docs/TASK42_ADAPTIVE_ROLLOUT.md tests/e2e/adaptive-rollout.acceptance.spec.ts
          git commit -m "style: format Task 42 rollout changes"
          git push origin HEAD:task-42-adaptive-rollout
