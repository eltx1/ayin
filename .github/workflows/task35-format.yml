name: Task35 format
on:
  push:
    branches: [task-35-fast-linear]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-35-fast-linear
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/creator/creator-tv-linear.service.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/creator/creator-tv-linear.service.ts
          git diff --cached --quiet || git commit -m "Format Task 35 linear service"
          git push origin HEAD:task-35-fast-linear
