name: One-shot PR48 formatter

on:
  push:
    branches:
      - hardening/media-process-timeouts-20260905
    paths:
      - ".github/workflows/one-shot-format-pr48.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: hardening/media-process-timeouts-20260905

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files with repository Prettier
        run: |
          pnpm exec prettier --write \
            apps/api/src/media/media-processing-executor.service.ts \
            apps/api/src/media/media-processing-timeouts.ts \
            deploy/validate-production-env.cjs

      - name: Remove one-shot workflow and commit formatter output
        run: |
          rm .github/workflows/one-shot-format-pr48.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format media worker timeout hardening"
          git push origin HEAD:hardening/media-process-timeouts-20260905
