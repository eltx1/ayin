packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  deepmerge-ts: 8.0.0

minimumReleaseAgeExclude:
  - "@nestjs/common@12.0.1"
  - "@nestjs/core@12.0.1"
  - "@nestjs/platform-fastify@12.0.1"
  - "@nestjs/testing@12.0.1"
  - "@types/node@26.4.0"
