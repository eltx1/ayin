packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  # GHSA-wq5f-xc86-pv6w: patched librsvg in Next.js image processing.
  "next@16.3.6>sharp": 0.35.5
  fastify: 5.12.5
  deepmerge-ts: 8.0.0
  mysql2: 3.23.1
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  "fast-uri@>=4.0.0 <4.1.5": 4.1.5

minimumReleaseAgeExclude:
  - "@nestjs/common@12.0.1"
  - "@nestjs/core@12.0.1"
  - "@nestjs/platform-fastify@12.0.1"
  - "@nestjs/testing@12.0.1"
  - "@types/node@26.4.0"
