packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  # GHSA-wq5f-xc86-pv6w: patched librsvg in Next.js image processing.
  "next@16.3.8>sharp": 0.35.5
  fastify: 5.12.6
  deepmerge-ts: 8.0.0
  # GHSA-7589-6fvf-x4pw: retain Prisma 7.10.0 and patch only its Effect dependency.
  "@prisma/config@7.10.0>effect": 3.22.1
  mysql2: 3.23.1
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  "fast-uri@>=3.0.0 <3.1.9": 3.1.9
  "fast-uri@>=4.0.0 <4.2.3": 4.2.3

minimumReleaseAgeExclude:
  - "@nestjs/common@12.0.1"
  - "@nestjs/core@12.0.1"
  - "@nestjs/platform-fastify@12.0.1"
  - "@nestjs/testing@12.0.1"
  - "@types/node@26.4.0"
